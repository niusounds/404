<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a1525" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2a40" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Dark room outline - floor -->
  <rect x="0" y="340" width="800" height="110" fill="#080606"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#151313" stroke-width="0.5"/>

  <!-- Phone glow on the floor/wall -->
  <ellipse cx="400" cy="300" rx="200" ry="150" fill="url(#phoneGlow)"/>

  <!-- Phone in the center - held by invisible hands -->
  <g>
    <!-- Phone body -->
    <rect x="340" y="100" width="120" height="220" rx="12" fill="#0e0e0e" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Screen -->
    <rect x="346" y="106" width="108" height="208" rx="8" fill="url(#screenLight)"/>
    
    <!-- Notification panel on screen -->
    <!-- Bell icon -->
    <path d="M400,130 Q395,130 395,138 L393,145 L407,145 L405,138 Q405,130 400,130 Z" fill="#4a9eff" opacity="0.6"/>
    <circle cx="400" cy="148" r="2" fill="#4a9eff" opacity="0.6"/>
    
    <!-- Notification text -->
    <rect x="358" y="155" width="84" height="3" fill="#4a9eff" opacity="0.3"/>
    <rect x="358" y="163" width="60" height="3" fill="#4a9eff" opacity="0.2"/>
    <rect x="358" y="171" width="70" height="3" fill="#4a9eff" opacity="0.15"/>
    
    <!-- Camera thumbnail in notification -->
    <rect x="358" y="180" width="84" height="55" rx="3" fill="#080c14" stroke="#1a2a3a" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Thumbnail: post box with silhouette -->
    <rect x="385" y="205" width="30" height="25" rx="2" fill="#111111" stroke="#1a2a3a" stroke-width="0.5"/>
    <rect x="395" y="200" width="10" height="5" rx="1" fill="#111111" stroke="#1a2a3a" stroke-width="0.3"/>
    <!-- Silhouette figure near post box -->
    <ellipse cx="425" cy="210" rx="4" ry="5" fill="#0a0a0a" opacity="0.6"/>
    <rect x="422" y="215" width="6" height="12" rx="2" fill="#0a0a0a" opacity="0.6"/>
    <!-- Red recording dot -->
    <circle cx="363" cy="185" r="3" fill="#cc2222" opacity="0.5" filter="url(#glow)"/>
    
    <!-- Time stamp at bottom of screen -->
    <text x="400" y="295" font-family="monospace" font-size="10" fill="#4a9eff" opacity="0.3" text-anchor="middle">02:15</text>
    
    <!-- Phone screen glare -->
    <line x1="350" y1="110" x2="380" y2="110" stroke="#ffffff" stroke-width="0.3" opacity="0.1"/>
    <line x1="348" y1="115" x2="370" y2="115" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  </g>

  <!-- Wall clock on the left -->
  <g>
    <circle cx="140" cy="160" r="45" fill="#0e0e0e" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="140" cy="160" r="40" fill="#0c0c0c" stroke="#1a1a1a" stroke-width="0.5"/>
    <!-- Clock markings -->
    <line x1="140" y1="122" x2="140" y2="128" stroke="#2a2a2a" stroke-width="1"/>
    <line x1="140" y1="192" x2="140" y2="198" stroke="#2a2a2a" stroke-width="1"/>
    <line x1="102" y1="160" x2="108" y2="160" stroke="#2a2a2a" stroke-width="1"/>
    <line x1="172" y1="160" x2="178" y2="160" stroke="#2a2a2a" stroke-width="1"/>
    <!-- Clock hands pointing to ~2:15 -->
    <line x1="140" y1="160" x2="155" y2="150" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="140" y1="160" x2="148" y2="140" stroke="#3a3a3a" stroke-width="1" stroke-linecap="round"/>
    <circle cx="140" cy="160" r="2" fill="#4a4a4a"/>
  </g>

  <!-- Door frame on the right -->
  <rect x="640" y="40" width="100" height="300" fill="#0c0c0c" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="650" y="50" width="80" height="280" fill="#080808"/>
  <!-- Door handle -->
  <circle cx="710" cy="200" r="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
  
  <!-- Gap under door - light leaking -->
  <rect x="650" y="338" width="80" height="2" fill="#1a1a1a" opacity="0.3"/>

  <!-- Faint shadow figure near door - barely visible -->
  <g opacity="0.03" filter="url(#softBlur)">
    <ellipse cx="630" cy="220" rx="20" ry="25" fill="#1a1515"/>
    <rect x="618" y="243" width="24" height="55" rx="7" fill="#1a1515"/>
    <line x1="623" y1="295" x2="615" y2="340" stroke="#1a1515" stroke-width="7" stroke-linecap="round"/>
    <line x1="637" y1="295" x2="645" y2="340" stroke="#1a1515" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Post box silhouette on the wall (small detail) -->
  <g opacity="0.08">
    <rect x="200" y="180" width="30" height="40" rx="2" fill="#1a1a1a"/>
    <rect x="205" y="175" width="20" height="5" rx="1" fill="#1a1a1a"/>
    <line x1="215" y1="195" x2="215" y2="210" stroke="#2a2a2a" stroke-width="0.5"/>
  </g>

  <!-- Time display -->
  <text x="400" y="420" font-family="monospace" font-size="14" fill="#1a3a5c" opacity="0.3" text-anchor="middle">02:15 — 動体検知</text>

  <!-- Red recording indicator -->
  <circle cx="355" cy="112" r="2" fill="#cc2222" opacity="0.4" filter="url(#glow)"/>

  <!-- Subtle noise texture -->
  <g opacity="0.02" fill="#ffffff">
    <circle cx="80" cy="50" r="0.5"/>
    <circle cx="250" cy="30" r="0.3"/>
    <circle cx="500" cy="60" r="0.4"/>
    <circle cx="700" cy="45" r="0.5"/>
    <circle cx="150" cy="300" r="0.3"/>
    <circle cx="550" cy="350" r="0.4"/>
    <circle cx="750" cy="360" r="0.3"/>
    <circle cx="50" cy="380" r="0.5"/>
    <circle cx="300" cy="400" r="0.3"/>
    <circle cx="480" cy="390" r="0.4"/>
    <circle cx="620" cy="410" r="0.3"/>
    <circle cx="180" cy="80" r="0.4"/>
  </g>
</svg>
