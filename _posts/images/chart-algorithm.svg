<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="40%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="120" fill="url(#fade)"/>
  
  <!-- Grid lines -->
  <line x1="80" y1="30" x2="720" y2="30" stroke="#1a1515" stroke-width="1"/>
  <line x1="80" y1="60" x2="720" y2="60" stroke="#1a1515" stroke-width="1"/>
  <line x1="80" y1="90" x2="720" y2="90" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Y axis -->
  <line x1="100" y1="20" x2="100" y2="100" stroke="#333030" stroke-width="1.5"/>
  
  <!-- Data bars - tall green (patient exists) -->
  <rect x="140" y="35" width="28" height="55" fill="#1a3d2a" rx="2">
    <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="154" y="115" text-anchor="middle" fill="#4a8050" font-size="9">入院</text>
  
  <!-- Data bars - short green -->
  <rect x="230" y="65" width="28" height="25" fill="#1a3d2a" rx="2"/>
  <text x="244" y="115" text-anchor="middle" fill="#4a8050" font-size="9">退院</text>
  
  <!-- Data bar - disappears (fading) -->
  <rect x="320" y="40" width="28" height="50" fill="#1a3d2a" rx="2">
    <animate attributeName="opacity" values="1;0.6;0" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Erasure mark - red X over bar -->
  <line x1="530" y1="40" x2="580" y2="90" stroke="#8b0000" stroke-width="2.5">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="580" y1="40" x2="530" y2="90" stroke="#8b0000" stroke-width="2.5">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </line>
  
  <!-- Deleted row marker -->
  <rect x="610" y="45" width="80" height="28" fill="#0a0808" stroke="#8b000044" stroke-width="1" rx="3"/>
  <text x="675" y="63" text-anchor="middle" fill="#8b0000" font-size="9" opacity="0.7">削除済</text>

  <!-- Title subtitle -->
  <text x="400" y="10" text-anchor="middle" fill="#5a4040" font-size="12" font-family="serif">電子カルテ・削除履歴</text>

</svg>