<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#151218"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="160" fill="url(#bgDark)"/>

  <!-- Calendar/year markers on left -->
  <line x1="40" y1="10" x2="40" y2="150" stroke="#1f1a1e" stroke-width="1.5"/>

  <text x="60" y="38" fill="#7a5055" font-size="14" font-family="sans-serif">1987</text>
  <rect x="200" y="25" width="60" height="24" rx="3" fill="#1a1518" stroke="#4a2025" stroke-width="1"/>
  <text x="230" y="42" text-anchor="middle" fill="#6a3035" font-size="11">名取 孝夫</text>

  <line x1="100" y1="38" x2="195" y2="38" stroke="#2f2429" stroke-width="1"/>

  <!-- connecting line -->
  <path d="M75,60 C75,80 175,80 175,68" fill="none" stroke="#1a1420" stroke-width="1.5"/>

  
  <text x="60" y="93" fill="#7a5055" font-size="14" font-family="sans-serif">1992</text>
  <rect x="200" y="80" width="60" height="24" rx="3" fill="#1a1518" stroke="#4a2025" stroke-width="1"/>
  <text x="230" y="97" text-anchor="middle" fill="#6a3035" font-size="11">高橋 太郎</text>

  <!-- Same face silhouette overlay -->
  <circle cx="480" cy="92" r="20" fill="none" stroke="#3d2a30" stroke-width="1.5"/>
  
  <!-- Red diagonal arrow showing "same person" -->
  <line x1="462" y1="72" x2="512" y2="112" stroke="#8b0000" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
  </line>

  
  <text x="60" y="148" fill="#7a5055" font-size="14" font-family="sans-serif">2026</text>
  <rect x="200" y="135" width="60" height="24" rx="3" fill="#1a1518" stroke="#4a2025" stroke-width="1"/>
  <text x="230" y="152" text-anchor="middle" fill="#6a3035" font-size="11">匿名A</text>

  <!-- "同一人物" stamp -->
  <text x="480" y="145" text-anchor="middle" fill="#8b000044" font-size="11" font-family="sans-serif">※同定確認済</text>

  <line x1="320" y1="70" x2="450" y2="95" stroke="#8b000033" stroke-width="1"/>
  <line x1="320" y1="105" x2="450" y2="160" stroke="#8b000033" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="170" text-anchor="middle" fill="#5a4040" font-size="13" font-family="serif">解剖記録: 同じ顔を持つ死者たち</text>

</svg>