<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle ambient glow from printer -->
  <ellipse cx="400" cy="320" rx="120" ry="80" fill="#1a1025" filter="url(#blur3)" opacity="0.6"/>

  <!-- Floor -->
  <rect x="0" y="370" width="800" height="80" fill="#0d0a0a"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#151010" stroke-width="1"/>

  <!-- Office desk silhouette -->
  <rect x="280" y="280" width="240" height="12" fill="#12100f" rx="2"/>
  <rect x="300" y="292" width="8" height="80" fill="#100e0d"/>
  <rect x="492" y="292" width="8" height="80" fill="#100e0d"/>

  <!-- Printer body -->
  <rect x="340" y="220" width="120" height="60" fill="#1a1a1c" rx="3"/>
  <rect x="340" y="220" width="120" height="8" fill="#222224" rx="3"/>

  <!-- Printer paper output slot -->
  <rect x="370" y="216" width="60" height="6" fill="#2a2a2c" rx="1"/>

  <!-- Paper sheets coming out (floating, eerie) -->
  <rect x="360" y="180" width="80" height="38" fill="#1e1e20" rx="1" opacity="0.9"/>
  <rect x="365" y="140" width="70" height="38" fill="#1c1c1e" rx="1" opacity="0.7"/>
  <rect x="370" y="100" width="60" height="38" fill="#1a1a1c" rx="1" opacity="0.45"/>

  <!-- Paper lines (faint text lines) -->
  <line x1="375" y1="192" x2="425" y2="192" stroke="#2a2a2e" stroke-width="0.5" opacity="0.5"/>
  <line x1="375" y1="196" x2="420" y2="196" stroke="#2a2a2e" stroke-width="0.5" opacity="0.5"/>
  <line x1="375" y1="200" x2="415" y2="200" stroke="#2a2a2e" stroke-width="0.5" opacity="0.5"/>

  <!-- Printer LED light (red, eerie) -->
  <circle cx="445" cy="248" r="3" fill="#3a1010"/>
  <circle cx="445" cy="248" r="6" fill="#4a1515" opacity="0.3" filter="url(#blur1)"/>

  <!-- Ghostly figure emerging from printer (faint, translucent) -->
  <g filter="url(#blur2)" opacity="0.15">
    <!-- Head -->
    <ellipse cx="400" cy="155" rx="18" ry="22" fill="#2a1a30"/>
    <!-- Body -->
    <path d="M382,175 Q378,210 375,240 L425,240 Q422,210 418,175 Z" fill="#2a1a30"/>
    <!-- Arms reaching out -->
    <path d="M382,190 Q360,195 345,200" stroke="#2a1a30" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M418,190 Q440,195 455,200" stroke="#2a1a30" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Ghostly figure - clearer layer -->
  <g filter="url(#blur1)" opacity="0.08">
    <!-- Eyes (two faint points) -->
    <circle cx="393" cy="150" r="2" fill="#4a2a50"/>
    <circle cx="407" cy="150" r="2" fill="#4a2a50"/>
  </g>

  <!-- Floating paper particles -->
  <g opacity="0.3">
    <rect x="310" y="160" width="12" height="16" fill="#1a1a1c" rx="1" transform="rotate(-15, 316, 168)"/>
    <rect x="470" y="170" width="10" height="14" fill="#1a1a1c" rx="1" transform="rotate(10, 475, 177)"/>
    <rect x="330" y="120" width="8" height="12" fill="#18181a" rx="1" transform="rotate(-8, 334, 126)"/>
  </g>

  <!-- Dark office windows in background -->
  <rect x="50" y="60" width="100" height="140" fill="#080608" rx="2" stroke="#0f0d0d" stroke-width="1"/>
  <line x1="100" y1="60" x2="100" y2="200" stroke="#0f0d0d" stroke-width="1"/>
  <line x1="50" y1="130" x2="150" y2="130" stroke="#0f0d0d" stroke-width="1"/>

  <rect x="600" y="50" width="100" height="150" fill="#080608" rx="2" stroke="#0f0d0d" stroke-width="1"/>
  <line x1="650" y1="50" x2="650" y2="200" stroke="#0f0d0d" stroke-width="1"/>
  <line x1="600" y1="125" x2="700" y2="125" stroke="#0f0d0d" stroke-width="1"/>

  <!-- Faint moonlight through window -->
  <rect x="55" y="65" width="40" height="55" fill="#0e0c12" opacity="0.5"/>
  <rect x="605" y="55" width="35" height="50" fill="#0e0c12" opacity="0.4"/>

  <!-- Subtle text "たなか" barely visible on paper -->
  <text x="380" y="155" font-family="sans-serif" font-size="8" fill="#2a2030" opacity="0.4" transform="rotate(-5, 380, 155)">たなか</text>

  <!-- Vignette effect -->
  <rect width="800" height="450" fill="url(#glow)" opacity="0.3"/>

  <!-- Bottom shadow -->
  <rect x="0" y="400" width="800" height="50" fill="#060404" opacity="0.5"/>
</svg>
