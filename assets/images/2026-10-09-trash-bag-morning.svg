<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle moon glow -->
  <circle cx="650" cy="80" r="60" fill="#1a1510" opacity="0.3"/>
  <circle cx="650" cy="80" r="35" fill="#2a2218" opacity="0.4"/>
  
  <!-- Ground -->
  <rect x="0" y="320" width="800" height="130" fill="#0d0a0a"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1210" stroke-width="1"/>
  
  <!-- Collection area fence -->
  <rect x="200" y="200" width="400" height="140" fill="none" stroke="#1a1512" stroke-width="1.5"/>
  <!-- Fence posts -->
  <line x1="220" y1="200" x2="220" y2="340" stroke="#1a1512" stroke-width="2"/>
  <line x1="280" y1="200" x2="280" y2="340" stroke="#1a1512" stroke-width="2"/>
  <line x1="340" y1="200" x2="340" y2="340" stroke="#1a1512" stroke-width="2"/>
  <line x1="400" y1="200" x2="400" y2="340" stroke="#1a1512" stroke-width="2"/>
  <line x1="460" y1="200" x2="460" y2="340" stroke="#1a1512" stroke-width="2"/>
  <line x1="520" y1="200" x2="520" y2="340" stroke="#1a1512" stroke-width="2"/>
  <line x1="580" y1="200" x2="580" y2="340" stroke="#1a1512" stroke-width="2"/>
  <!-- Fence horizontal bars -->
  <line x1="200" y1="240" x2="600" y2="240" stroke="#1a1512" stroke-width="1"/>
  <line x1="200" y1="280" x2="600" y2="280" stroke="#1a1512" stroke-width="1"/>
  <line x1="200" y1="320" x2="600" y2="320" stroke="#1a1512" stroke-width="1"/>
  
  <!-- Trash bags inside collection area -->
  <!-- Bag 1 -->
  <ellipse cx="260" cy="310" rx="25" ry="18" fill="#1a1818" stroke="#2a2525" stroke-width="0.5"/>
  <!-- Bag 2 -->
  <ellipse cx="310" cy="312" rx="22" ry="16" fill="#1c1919" stroke="#2a2525" stroke-width="0.5"/>
  <!-- Bag 3 -->
  <ellipse cx="360" cy="308" rx="28" ry="20" fill="#181616" stroke="#2a2525" stroke-width="0.5"/>
  
  <!-- Mysterious trash can standing alone -->
  <rect x="470" y="280" width="35" height="45" rx="3" fill="#1a1616" stroke="#2a2220" stroke-width="1"/>
  <ellipse cx="487.5" cy="283" rx="15" ry="5" fill="#1e1a1a" stroke="#2a2220" stroke-width="0.5"/>
  
  <!-- Distant mysterious figure silhouette behind fence -->
  <g opacity="0.6">
    <!-- Head -->
    <ellipse cx="560" cy="230" rx="8" ry="10" fill="#0e0c0c"/>
    <!-- Body -->
    <path d="M552,240 L548,290 L572,290 L568,240 Z" fill="#0e0c0c"/>
    <!-- Legs -->
    <line x1="553" y1="290" x2="550" y2="330" stroke="#0e0c0c" stroke-width="3"/>
    <line x1="567" y1="290" x2="570" y2="330" stroke="#0e0c0c" stroke-width="3"/>
    <!-- Arms -->
    <line x1="552" y1="250" x2="540" y2="270" stroke="#0e0c0c" stroke-width="2.5"/>
    <line x1="568" y1="250" x2="580" y2="265" stroke="#0e0c0c" stroke-width="2.5"/>
  </g>
  
  <!-- Foreground path -->
  <path d="M0,380 Q200,370 400,380 Q600,390 800,375" fill="none" stroke="#121010" stroke-width="2"/>
  
  <!-- Sparse grass tufts -->
  <path d="M100,325 L105,310 L110,325" fill="none" stroke="#141210" stroke-width="1"/>
  <path d="M650,330 L655,315 L660,330" fill="none" stroke="#141210" stroke-width="1"/>
  <path d="M720,328 L723,316 L726,328" fill="none" stroke="#141210" stroke-width="1"/>
  
  <!-- Very subtle eerie light from collection area -->
  <ellipse cx="400" cy="320" rx="100" ry="30" fill="#1a1410" opacity="0.15"/>
  
  <!-- Stars -->
  <circle cx="100" cy="50" r="1" fill="#2a2520" opacity="0.5"/>
  <circle cx="180" cy="30" r="0.8" fill="#2a2520" opacity="0.4"/>
  <circle cx="300" cy="60" r="1" fill="#2a2520" opacity="0.3"/>
  <circle cx="450" cy="25" r="0.7" fill="#2a2520" opacity="0.4"/>
  <circle cx="720" cy="45" r="0.9" fill="#2a2520" opacity="0.3"/>
  
  <!-- Vignette effect -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.4"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
