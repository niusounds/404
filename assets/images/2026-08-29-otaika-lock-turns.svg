<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gapLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1a1510" stroke-width="1"/>

  <!-- Closet door frame -->
  <rect x="260" y="60" width="280" height="320" fill="none" stroke="#1a1510" stroke-width="2"/>

  <!-- Left door (closed) -->
  <rect x="262" y="62" width="138" height="316" fill="#110e0a" stroke="#1e1812" stroke-width="0.5"/>
  <!-- Right door (slightly open) -->
  <rect x="400" y="62" width="138" height="316" fill="#0c0a07" stroke="#1e1812" stroke-width="0.5"/>

  <!-- Gap between doors with faint light -->
  <rect x="398" y="62" width="4" height="316" fill="#2a2010" opacity="0.6"/>
  <rect x="398" y="62" width="2" height="316" fill="#3a2a15" opacity="0.4"/>

  <!-- Light bleeding from gap onto floor -->
  <polygon points="396,378 404,378 440,450 370,450" fill="#2a2010" opacity="0.15"/>

  <!-- Old cardboard box inside closet, slightly visible through gap -->
  <rect x="410" y="250" width="60" height="50" fill="#1a1510" stroke="#252015" stroke-width="0.5"/>

  <!-- Key lock plate on right door -->
  <rect x="388" y="180" width="18" height="24" fill="#1a1812" stroke="#2a2518" stroke-width="0.5"/>
  <circle cx="397" cy="192" r="4" fill="#2a2518" stroke="#3a3520" stroke-width="0.5"/>
  <!-- Keyhole -->
  <circle cx="397" cy="192" r="1.5" fill="#4a4020" filter="url(#glow)"/>
  <!-- Distorted keyhole - inner side pushed out -->
  <path d="M397,188 L399,192 L397,196 L395,192 Z" fill="#5a5030" opacity="0.7" filter="url(#glow)"/>

  <!-- Shadow figure inside closet, barely visible through gap -->
  <ellipse cx="430" cy="280" rx="18" ry="25" fill="#0a0808" opacity="0.9"/>
  <circle cx="430" cy="260" r="12" fill="#0a0808" opacity="0.9"/>
  <!-- Eyes - two faint points of light -->
  <circle cx="425" cy="257" r="1.5" fill="#3a3020" opacity="0.8"/>
  <circle cx="435" cy="257" r="1.5" fill="#3a3020" opacity="0.8"/>

  <!-- Photo falling from box - white rectangle sliding out -->
  <rect x="420" y="300" width="30" height="22" fill="#1a1810" stroke="#3a3525" stroke-width="0.5" transform="rotate(-8, 435, 311)"/>

  <!-- Subtle dust particles in the light -->
  <circle cx="400" cy="100" r="0.5" fill="#5a5030" opacity="0.3"/>
  <circle cx="405" cy="150" r="0.5" fill="#5a5030" opacity="0.2"/>
  <circle cx="398" cy="200" r="0.5" fill="#5a5030" opacity="0.25"/>
  <circle cx="402" cy="260" r="0.5" fill="#5a5030" opacity="0.2"/>
  <circle cx="404" cy="320" r="0.5" fill="#5a5030" opacity="0.15"/>

  <!-- Moonlight from top right -->
  <rect x="600" y="0" width="200" height="80" fill="#0e0c0a"/>
  <circle cx="720" cy="40" r="15" fill="#1a1810" opacity="0.3"/>
  <circle cx="720" cy="40" r="10" fill="#2a2518" opacity="0.2"/>
</svg>
