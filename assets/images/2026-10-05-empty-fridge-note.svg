<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Kitchen floor hint -->
  <rect x="0" y="380" width="800" height="70" fill="#0d0a0a"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Refrigerator body -->
  <rect x="280" y="40" width="240" height="340" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
  
  <!-- Fridge door (slightly ajar, left side) -->
  <rect x="260" y="40" width="20" height="340" rx="3" fill="#222222" stroke="#333" stroke-width="1"/>
  
  <!-- Fridge interior - warm eerie glow -->
  <rect x="280" y="40" width="240" height="340" rx="6" fill="#0f0e08" clip-path="url(#fridgeClip)"/>
  
  <!-- Interior glow -->
  <ellipse cx="400" cy="200" rx="120" ry="140" fill="#1a1810" opacity="0.6"/>
  <ellipse cx="400" cy="200" rx="60" ry="80" fill="#2a2518" opacity="0.4"/>
  
  <!-- Vegetable drawer -->
  <rect x="310" y="260" width="180" height="90" rx="4" fill="#1e1e16" stroke="#2a2a20" stroke-width="1"/>
  
  <!-- Drawer glass surface -->
  <rect x="315" y="265" width="170" height="80" rx="3" fill="#1a1a14" opacity="0.8"/>
  
  <!-- Eyes inside vegetable drawer -->
  <!-- Left eye -->
  <ellipse cx="370" cy="305" rx="12" ry="10" fill="#1a1a14"/>
  <ellipse cx="372" cy="305" rx="5" ry="6" fill="#c8c0b0" opacity="0.9"/>
  <ellipse cx="373" cy="305" rx="2.5" ry="3" fill="#0a0808"/>
  <!-- Right eye -->
  <ellipse cx="430" cy="305" rx="12" ry="10" fill="#1a1a14"/>
  <ellipse cx="428" cy="305" rx="5" ry="6" fill="#c8c0b0" opacity="0.9"/>
  <ellipse cx="427" cy="305" rx="2.5" ry="3" fill="#0a0808"/>
  
  <!-- Note (sticky note) sticking out from fridge -->
  <rect x="270" y="180" width="50" height="50" rx="1" fill="#f5f0d0" opacity="0.9" transform="rotate(-5, 295, 205)"/>
  <!-- Note text lines -->
  <line x1="278" y1="195" x2="310" y2="194" stroke="#8a8060" stroke-width="1.5" transform="rotate(-5, 295, 205)"/>
  <line x1="278" y1="203" x2="305" y2="202" stroke="#8a8060" stroke-width="1.5" transform="rotate(-5, 295, 205)"/>
  <line x1="278" y1="211" x2="315" y2="210" stroke="#8a8060" stroke-width="1.5" transform="rotate(-5, 295, 205)"/>
  
  <!-- Fridge shelves -->
  <line x1="282" y1="120" x2="518" y2="120" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="282" y1="200" x2="518" y2="200" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="282" y1="258" x2="518" y2="258" stroke="#2a2a2a" stroke-width="2"/>
  
  <!-- Fridge handle -->
  <rect x="510" y="100" width="8" height="160" rx="4" fill="#333" stroke="#444" stroke-width="1"/>
  
  <!-- Subtle cold mist from fridge -->
  <ellipse cx="350" cy="250" rx="40" ry="15" fill="#2a2a20" opacity="0.15"/>
  <ellipse cx="420" cy="260" rx="30" ry="10" fill="#2a2a20" opacity="0.1"/>
  
  <!-- Dark vignette edges -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" opacity="0.5"/>
  
  <!-- Subtle shadow under fridge -->
  <ellipse cx="400" cy="385" rx="140" ry="10" fill="#050404" opacity="0.8"/>
  
  <!-- Clip path for interior -->
  <clipPath id="fridgeClip">
    <rect x="280" y="40" width="240" height="340" rx="6"/>
  </clipPath>
  
  <!-- Vignette gradient -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
