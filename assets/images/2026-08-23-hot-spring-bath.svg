<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Moon -->
  <circle cx="650" cy="80" r="45" fill="#1a1510"/>
  <circle cx="650" cy="80" r="43" fill="#1e1a14"/>
  <circle cx="650" cy="80" r="41" fill="#221e16"/>
  <circle cx="650" cy="80" r="39" fill="#262018" opacity="0.5"/>
  
  <!-- Moon glow -->
  <circle cx="650" cy="80" r="70" fill="#2a2518" opacity="0.15"/>
  <circle cx="650" cy="80" r="100" fill="#2a2518" opacity="0.06"/>
  
  <!-- Mountains silhouette -->
  <path d="M0 250 L80 160 L160 200 L250 130 L340 190 L420 150 L500 200 L580 140 L660 180 L740 155 L800 200 L800 450 L0 450 Z" fill="#0d0b0b"/>
  
  <!-- Mid-ground hills -->
  <path d="M0 280 L100 240 L200 260 L320 220 L440 255 L560 230 L680 250 L800 235 L800 450 L0 450 Z" fill="#0c0a0a"/>
  
  <!-- Forest silhouette -->
  <path d="M0 310 L20 280 L35 295 L50 270 L65 290 L80 265 L95 285 L110 275 L130 290 L150 260 L165 280 L180 270 L200 290 L220 265 L240 285 L260 270 L280 290 L300 260 L320 280 L340 270 L360 290 L380 265 L400 285 L420 270 L440 290 L460 260 L480 280 L500 270 L520 290 L540 265 L560 285 L580 270 L600 290 L620 260 L640 280 L660 270 L680 290 L700 265 L720 285 L740 270 L760 290 L780 260 L800 280 L800 450 L0 450 Z" fill="#0b0909"/>
  
  <!-- Stone wall around bath -->
  <path d="M180 340 L180 400 L620 400 L620 340" fill="none" stroke="#141110" stroke-width="12" stroke-linecap="round"/>
  <path d="M180 340 L620 340" fill="none" stroke="#141110" stroke-width="8"/>
  
  <!-- Bath water surface -->
  <rect x="195" y="345" width="410" height="50" rx="3" fill="#0e1215" opacity="0.8"/>
  
  <!-- Water surface reflection -->
  <rect x="200" y="347" width="400" height="3" rx="1" fill="#1a2530" opacity="0.3"/>
  <rect x="250" y="352" width="120" height="2" rx="1" fill="#1a2530" opacity="0.2"/>
  <rect x="400" y="355" width="80" height="2" rx="1" fill="#1a2530" opacity="0.15"/>
  
  <!-- Steam wisps -->
  <g opacity="0.12" fill="#c8c0b8">
    <path d="M250 340 Q255 300 248 260 Q242 220 252 180 Q258 155 250 130"/>
    <path d="M350 340 Q358 305 348 265 Q338 225 350 185 Q358 160 348 130"/>
    <path d="M450 340 Q445 300 452 260 Q458 220 448 180 Q442 155 450 130"/>
    <path d="M530 340 Q538 310 528 270 Q518 230 530 190"/>
  </g>
  
  <!-- Steam wisps - thicker -->
  <g opacity="0.08" fill="#b8b0a8">
    <path d="M280 345 Q285 310 278 270 Q272 230 282 190 Q288 165 280 140"/>
    <path d="M400 345 Q405 315 398 275 Q392 235 402 195 Q408 170 400 145"/>
    <path d="M490 345 Q495 310 488 270 Q482 230 492 190"/>
  </g>
  
  <!-- Steam wisps - thin -->
  <g opacity="0.06" fill="#a8a098">
    <path d="M320 340 Q325 305 318 265 Q312 225 322 185"/>
    <path d="M560 340 Q565 310 558 270 Q552 230 562 190"/>
  </g>
  
  <!-- Steam glow over bath -->
  <ellipse cx="400" cy="300" rx="200" ry="60" fill="#1a1e22" opacity="0.08"/>
  
  <!-- Stone lantern silhouette -->
  <g fill="#11100f">
    <!-- Base -->
    <rect x="640" y="360" width="30" height="8" rx="1"/>
    <!-- Pillar -->
    <rect x="652" y="320" width="6" height="40"/>
    <!-- Light housing -->
    <path d="M640 320 L645 305 L665 305 L670 320 Z"/>
    <!-- Roof -->
    <path d="M635 305 L655 290 L675 305 Z"/>
    <!-- Light glow -->
    <circle cx="655" cy="312" r="8" fill="#2a2010" opacity="0.4"/>
    <circle cx="655" cy="312" r="15" fill="#2a2010" opacity="0.15"/>
    <circle cx="655" cy="312" r="25" fill="#2a2010" opacity="0.06"/>
  </g>
  
  <!-- Second stone lantern -->
  <g fill="#11100f" opacity="0.7">
    <rect x="115" y="365" width="25" height="7" rx="1"/>
    <rect x="125" y="330" width="5" height="35"/>
    <path d="M115 330 L119 318 L135 318 L139 330 Z"/>
    <path d="M112 318 L127 305 L142 318 Z"/>
    <circle cx="127" cy="324" r="6" fill="#2a2010" opacity="0.25"/>
    <circle cx="127" cy="324" r="12" fill="#2a2010" opacity="0.1"/>
  </g>
  
  <!-- Wooden bridge/railing -->
  <g fill="#0f0e0d">
    <rect x="170" y="330" width="4" height="75"/>
    <rect x="626" y="330" width="4" height="75"/>
    <rect x="168" y="335" width="464" height="3"/>
    <rect x="168" y="395" width="464" height="3"/>
    <!-- Railing posts -->
    <rect x="220" y="335" width="3" height="60"/>
    <rect x="280" y="335" width="3" height="60"/>
    <rect x="340" y="335" width="3" height="60"/>
    <rect x="400" y="335" width="3" height="60"/>
    <rect x="460" y="335" width="3" height="60"/>
    <rect x="520" y="335" width="3" height="60"/>
    <rect x="580" y="335" width="3" height="60"/>
  </g>
  
  <!-- Ground -->
  <path d="M0 410 Q200 400 400 408 Q600 416 800 405 L800 450 L0 450 Z" fill="#0d0b0b"/>
  
  <!-- Subtle fog at bottom -->
  <rect x="0" y="400" width="800" height="50" fill="#0e0c0c" opacity="0.5"/>
  
  <!-- Bare tree branch silhouette top-right -->
  <g stroke="#0e0c0c" stroke-width="2" fill="none">
    <path d="M780 0 Q775 30 760 50 Q745 70 750 90 Q755 110 740 130"/>
    <path d="M755 60 Q740 55 730 65"/>
    <path d="M748 95 Q735 90 725 100"/>
    <path d="M760 40 Q770 35 778 45"/>
  </g>
  
  <!-- Bare tree branch silhouette top-left -->
  <g stroke="#0e0c0c" stroke-width="1.5" fill="none">
    <path d="M0 0 Q10 20 25 40 Q35 55 30 75 Q28 85 35 100"/>
    <path d="M22 50 Q35 45 42 55"/>
    <path d="M28 70 Q40 65 48 75"/>
  </g>
</svg>
