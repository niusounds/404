<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: dark forest -->
  <rect x="0" y="0" width="800" height="450" fill="#0a0808"/>

  <!-- Ground fog -->
  <ellipse cx="100" cy="430" rx="200" ry="30" fill="#1a1a2e" opacity="0.4"/>
  <ellipse cx="700" cy="440" rx="250" ry="25" fill="#1a1a2e" opacity="0.3"/>

  <!-- Trees - left cluster -->
  <rect x="80" y="50" width="6" height="200" fill="#151515" rx="2"/>
  <line x1="89" y1="90" x2="45" y2="55" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

  <rect x="130" y="30" width="7" height="220" fill="#161616" rx="2"/>
  <line x1="129" y1="75" x2="60" y2="45" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
  <line x1="132" y1="100" x2="180" y2="70" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Trees - right cluster -->
  <rect x="600" y="40" width="8" height="210" fill="#161616" rx="3"/>
  <line x1="607" y1="85" x2="540" y2="50" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>

  <rect x="660" y="20" width="9" height="230" fill="#171717" rx="3"/>
  <line x1="650" y1="80" x2="580" y2="40" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round"/>
  <line x1="662" y1="110" x2="730" y2="75" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- Snow on ground -->
  <rect x="0" y="380" width="800" height="70" fill="#e8ecf1" opacity="0.95"/>

  <!-- Footprints in snow (large, sinking deep) -->
  <ellipse cx="250" cy="400" rx="18" ry="6" fill="none" stroke="#a0b0c0" stroke-width="1.5" opacity="0.6"/>
  <path d="M 235 395 L 240 392 M 240 392 L 245 389 L 250 390" stroke="#a0b0c0" stroke-width="1.5" fill="none" opacity="0.5"/>

  <ellipse cx="360" cy="398" rx="18" ry="6" fill="none" stroke="#a0b0c0" stroke-width="1.5" opacity="0.7"/>
  <path d="M 345 392 L 250 382" stroke="#a0b0c0" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Last footprint fading/shallow -->
  <ellipse cx="460" cy="396" rx="15" ry="4" fill="none" stroke="#c0d0e0" stroke-width="1" opacity="0.4"/>
  <line x1="470" y1="398" x2="550" y2="400" stroke="#b0c0d0" stroke-width="1" fill="none" opacity="0.2" stroke-dasharray="3,3"/>

  <!-- The WENDIGO - tall skeletal figure emerging from between trees -->
  <g opacity="0.95">
    <!-- Body/arms: emaciated, impossibly long limbs -->
    <line x1="385" y1="230" x2="250" y2="105" stroke="#c0b8a8" stroke-width="5" stroke-linecap="round"/>
    <!-- Right arm reaching up with hooked fingers -->
    <polyline points="260,90 245,75 238,68 232,72 226,63" stroke="#c0b8a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polyline points="252,90 240,76 233,69 228,74 222,66" stroke="#c0b8a8" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Back/left arm -->
    <line x1="385" y1="240" x2="540" y2="110" stroke="#ad9b8c" stroke-width="4" stroke-linecap="round"/>
    <polyline points="536,95 545,75 555,65 560,72 567,66" stroke="#ad9b8c" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Head: elongated skull -->
    <ellipse cx="470" cy="130" rx="12" ry="18" fill="#bfb0a0"/>
    <!-- Empty eye sockets with cold light -->
    <circle cx="465" cy="126" r="4" fill="#ffccaa" opacity="0.9"/>
    <circle cx="476" cy="126" r="4" fill="#ffccaa" opacity="0.9"/>
    <!-- Glow from eyes radiating outward -->
    <circle cx="465" cy="126" r="8" fill="none" stroke="#ffccaa" stroke-width="0.8" opacity="0.3"/>
    <circle cx="476" cy="126" r="8" fill="none" stroke="#ffccaa" stroke-width="0.8" opacity="0.3"/>

    <!-- Skull jaw/hollow mouth -->
    <path d="M 459 142 L 462 148 L 470 146 L 478 148 L 481 142" stroke="#a89585" stroke-width="1.5" fill="none"/>

    <!-- Thin torso/ribs visible -->
    <line x1="390" y1="245" x2="375" y2="160" stroke="#b0a595" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 380 170 Q 370 175 375 180 Q 368 182 372 188 Q 366 191 378 190" stroke="#b0a595" stroke-width="1.2" fill="none"/>
    <path d="M 387 170 Q 395 175 390 180 Q 396 182 394 188 Q 390 191 395 190" stroke="#b0a595" stroke-width="1.2" fill="none"/>

    <!-- Legs: thin, sinking into snow -->
    <line x1="370" y1="320" x2="380" y2="385" stroke="#ad9b8c" stroke-width="4" stroke-linecap="round"/>
    <line x1="360" y1="320" x2="355" y2="385" stroke="#9a8878" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Moon (barely visible through trees) -->
  <circle cx="470" cy="100" r="16" fill="#e8d8b8" opacity="0.9"/>
  <circle cx="475" cy="97" r="12" fill="#0a0808" opacity="0.3"/>

  <!-- Moon glow -->
  <circle cx="470" cy="100" r="25" fill="none" stroke="#ffccaa" stroke-width="0.8" opacity="0.15"/>
  <circle cx="470" cy="100" r="35" fill="none" stroke="#ffccaa" stroke-width="0.6" opacity="0.08"/>

  <!-- Gothic frame border -->
  <rect x="12" y="12" width="776" height="426" rx="6" ry="6" fill="none" stroke="#3d001a" stroke-width="2"/>
  <rect x="8" y="8" width="784" height="434" rx="6" ry="6" fill="none" stroke="#1a0a0e" stroke-width="1"/>

  <!-- Corner decorations -->
  <circle cx="20" cy="20" r="5" fill="#3d001a" opacity="0.8"/>
  <circle cx="780" cy="20" r="5" fill="#3d001a" opacity="0.8"/>
  <circle cx="20" cy="430" r="4" fill="#3d001a" opacity="0.6"/>
  <circle cx="780" cy="430" r="4" fill="#3d001a" opacity="0.6"/>

</svg>
