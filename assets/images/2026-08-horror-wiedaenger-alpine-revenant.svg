<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="50%" stop-color="#0c1a30"/>
      <stop offset="100%" stop-color="#16253b"/>
    </linearGradient>
    <!-- Mountain gradient -->
    <linearGradient id="mtnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5a78"/>
      <stop offset="60%" stop-color="#1e3450"/>
      <stop offset="100%" stop-color="#0f1c2d"/>
    </linearGradient>
    <!-- Snow ground gradient -->
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a8fae"/>
      <stop offset="40%" stop-color="#3d6a8e"/>
      <stop offset="100%" stop-color="#152940"/>
    </linearGradient>
    <!-- Window glow -->
    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#ffaa33" stop-opacity="1"/>
      <stop offset="40%" stop-color="#cc7a11" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#884400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: night sky -->
  <rect width="800" height="450" fill="#040810"/>
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle cx="85" cy="42" r="1.1" fill="#ffffff" opacity="0.7"/>
  <circle cx="230" cy="68" r="0.9" fill="#eef4ff" opacity="0.5"/>
  <circle cx="410" cy="35" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="570" cy="72" r="0.8" fill="#dde8f5" opacity="0.6"/>
  <circle cx="710" cy="48" r="1.0" fill="#fff" opacity="0.7"/>
  <circle cx="350" cy="92" r="0.7" fill="#eef" opacity="0.4"/>
  <circle cx="640" cy="108" r="1.0" fill="#ffffff" opacity="0.5"/>
  <circle cx="150" cy="112" r="0.8" fill="#fff" opacity="0.3"/>
  <circle cx="760" cy="82" r="0.9" fill="#eef4ff" opacity="0.6"/>

  <!-- Mountains silhouette -->
  <polygon points="50,180 180,85 310,160 460,70 600,145 750,95 800,120 800,250 0,250" fill="url(#mtnGrad)" opacity="0.9"/>
  <!-- Further distant peaks (lighter, behind) -->
  <polygon points="0,200 100,130 220,180 350,110 480,175 620,120 750,170 800,140 800,260 0,260" fill="#1a2e48" opacity="0.6"/>

  <!-- Snowy ground -->
  <ellipse cx="400" cy="395" rx="600" ry="70" fill="url(#snowGrad)" opacity="0.5"/>
  <rect x="0" y="280" width="800" height="170" fill="#2a4d6e" opacity="0.3"/>

  <!-- Mountain snow caps (white highlights near peaks) -->
  <polygon points="170,85 180,85 195,105 165,105" fill="#c8dde8" opacity="0.4"/>
  <polygon points="450,70 460,70 478,92 443,92" fill="#d4e6f0" opacity="0.35"/>
  <polygon points="742,95 750,95 763,112 738,112" fill="#c0d6e4" opacity="0.3"/>

  <!-- Fog/mist at mountain base -->
  <ellipse cx="200" cy="290" rx="180" ry="25" fill="#4a7a9e" opacity="0.15"/>
  <ellipse cx="650" cy="300" rx="200" ry="30" fill="#4a7a9e" opacity="0.12"/>

  <!-- Cabin -->
  <!-- Cabin body -->
  <rect x="385" y="245" width="55" height="40" fill="#2c1e16" stroke="#0d0a07" stroke-width="1"/>
  <!-- Roof -->
  <polygon points="378,245 413,220 447,245" fill="#3b2a20" stroke="#1a120c" stroke-width="1"/>
  <!-- Snow on roof -->
  <line x1="388" y1="226" x2="413" y2="220" stroke="#dde4ec" stroke-width="2.5" opacity="0.4"/>
  <line x1="413" y1="220" x2="438" y2="237" stroke="#dde4ec" stroke-width="2.5" opacity="0.4"/>
  <!-- Windows -->
  <rect x="396" y="254" width="10" height="12" fill="#ffaa33" rx="1"/>
  <rect x="423" y="254" width="10" height="12" fill="#ff8822" rx="1"/>
  <!-- Window glow effect -->
  <ellipse cx="401" cy="260" rx="25" ry="28" fill="url(#windowGlow)"/>
  <!-- Door -->
  <rect x="404" y="273" width="9" height="12" fill="#1a0f0b" stroke="#0d0606" rx="1.5"/>

  <!-- Trees (dark silhouettes) -->
  <line x1="448" y1="275" x2="448" y2="305" fill="#3a4a2d"/>
  <polygon points="448,240 440,290 448,285 448,265 447,285 458,290 448,240" fill="#1a3020"/>
  <line x1="426" y1="330" x2="426" y2="360"/>
  <polygon points="426,305 420,335 426,330 426,310 427,330 434,335 426,305" fill="#182c18"/>

  <!-- Eerie red eyes / ghostly presence above the mountains -->
  <circle cx="598" cy="130" r="4.5" fill="#ff0a0a" filter="" opacity="0.9"/>
  <circle cx="622" cy="130" r="4.5" fill="#ff0a0a" filter="" opacity="0.9"/>
  <!-- Glow around eyes -->
  <ellipse cx="610" cy="135" rx="55" ry="50" fill="#ff2a0a" opacity="0.08"/>

  <defs>
    <filter id="redGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge name="merge"><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Red eyes (redraw after filter definition) -->
  <circle cx="598" cy="130" r="4.5" fill="#ff1a1a"/>
  <circle cx="622" cy="130" r="4.5" fill="#ff1a1a"/>

  <!-- Thin wispy ghost shape above eyes -->
  <path d="M600,125 C605,80 630,75 640,95 C650,115 635,140 615,135" fill="#ffffff" opacity="0.05"/>

  <!-- Gothic border frame -->
  <rect x="12" y="12" width="776" height="426" rx="8" fill="none" stroke="#5a2040" stroke-width="1.5" opacity="0.8"/>
  <rect x="20" y="20" width="760" height="410" rx="5" fill="none" stroke="#3d0c20" stroke-width="0.8" opacity="0.6"/>

  <!-- Corner decorations -->
  <circle cx="18" cy="18" r="2.5" fill="#8a3070" opacity="0.7"/>
  <circle cx="784" cy="18" r="2.5" fill="#8a3070" opacity="0.7"/>
  <circle cx="18" cy="434" r="2.5" fill="#8a3070" opacity="0.7"/>
  <circle cx="784" cy="434" r="2.5" fill="#8a3070" opacity="0.7"/>

  <!-- Subtle red vignette at top -->
  <rect x="0" y="0" width="800" height="120" fill="#6a0000" opacity="0.05"/>
</svg>