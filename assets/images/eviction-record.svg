<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="600" height="300" fill="#0a0808"/>
  
  <!-- Document with redactions/crossouts -->
  <g transform="translate(150, 30)">
    <!-- White document -->
    <rect x="0" y="0" width="300" height="240" fill="#1a1816" stroke="#332d2c" stroke-width="1.5"/>
    
    <!-- Header line (lightened) -->
    <rect x="15" y="20" width="80" height="12" fill="#4a4544" rx="1"/>
    
    <!-- Body text lines - some struck through with red strokes indicating deletion/redaction -->
    <!-- Line 3: struck through -->
    <line x1="15" y1="45" x2="60" y2="45" stroke="#4a4544" stroke-width="8" opacity="0.7"/>
    <rect x="15" y="40" width="45" height="10" fill="#ff2e2e" rx="1"/>
    
    <!-- Line 5 -->
    <line x1="15" y1="75" x2="90" y2="75" stroke="#4a4544" stroke-width="8" opacity="0.7"/>
    <rect x="15" y="70" width="75" height="10" fill="#ff5a2e" rx="1"/>
    
    <!-- Line 7 -->
    <line x1="15" y1="105" x2="40" y2="105" stroke="#4a4544" stroke-width="8" opacity="0.7"/>
    <rect x="15" y="100" width="30" height="10" fill="#ff7a2e" rx="1"/>
    
    <!-- Line 9 - complete redaction -->
    <text x="15" y="135" font-family="sans-serif" font-weight="bold" font-size="8">[--- REDACTED ---]</text>
    
    <!-- Line 11 struck through -->
    <line x1="15" y1="165" x2="70" y2="165" stroke="#4a4544" stroke-width="8" opacity="0.7"/>
    <rect x="70" y="160" width="30" height="10" fill="#cc00ff" rx="1"/>
    
    <!-- Line 12 partial redaction -->
    <line x1="15" y1="195" x2="85" y2="195" stroke="#4a4544" stroke-width="8" opacity="0.7"/>
    <rect x="85" y="190" width="35" height="10" fill="#ffaa4e" rx="1"/>
  </g>
  
  <!-- Floating document fragments with red strokes indicating deletion -->
  <g>
    <!-- Top-right fragment -->
    <g transform="translate(420, 30)">
      <rect x="0" y="0" width="150" height="80" fill="#2a2622" stroke="#ff2e2d" rx="2"/>
      <text x="75" y="25" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff">退去</text>
      <!-- Strike-through lines indicating deletion -->
      <path d="M 9,5 Q 75,80 141,5" stroke="#cc2e3d" fill="none"/>
    </g>
    
    <!-- Middle-right fragment with red text indicating rejection -->
    <g transform="translate(420, 120)">
      <rect x="0" y="0" width="160" height="70" fill="#2a2622" stroke="#cc2e3d" rx="2"/>
      <!-- Red text indicating rejected/redacted -->
      <text x="15" y="35" font-family="sans-serif" font-weight="bold" fill="#cc3a3d">退却</text>
      <!-- X over the rejection word for invalidation -->
      
      <line x1="27.5" y1="20" stroke-width="9" opacity="7"/>
    </g>
    
    <!-- Bottom-right fragment with partial red action -->
    <g transform="translate(465, 190)">
      <rect x="0" y="0" width="80" height="90" fill="#2a2622" stroke-width="3.5"/>
      <!-- Partial strike-through (not complete) -->
    </g>
  </svg>
</svg>