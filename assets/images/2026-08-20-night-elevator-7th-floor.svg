<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080606"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="elevatorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="50%" stop-color="#222020"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141212"/>
      <stop offset="100%" stop-color="#0e0c0c"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a1010" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Elevator interior - back wall -->
  <rect x="200" y="40" width="400" height="370" fill="url(#elevatorGrad)" rx="3"/>
  <!-- Elevator floor -->
  <rect x="200" y="340" width="400" height="70" fill="url(#floorGrad)"/>
  <rect x="200" y="340" width="400" height="2" fill="#2a2525"/>
  <!-- Ceiling -->
  <rect x="200" y="35" width="400" height="8" fill="#1e1c1c"/>

  <!-- Elevator doors (closed, meeting in center) -->
  <rect x="280" y="80" width="120" height="260" fill="#1c1a1a" rx="1"/>
  <rect x="400" y="80" width="120" height="260" fill="#1c1a1a" rx="1"/>
  <!-- Door seam -->
  <line x1="400" y1="80" x2="400" y2="340" stroke="#2a2525" stroke-width="1"/>
  <!-- Door handles -->
  <rect x="375" y="200" width="8" height="40" fill="#2a2525" rx="4"/>
  <rect x="417" y="200" width="8" height="40" fill="#2a2525" rx="4"/>

  <!-- Floor indicator panel -->
  <rect x="340" y="55" width="120" height="160" fill="#0e0c0c" rx="4"/>
  <rect x="342" y="57" width="116" height="156" fill="#121010" rx="3"/>

  <!-- Floor buttons (8-12, 14-19) - dim -->
  <g opacity="0.3">
    <circle cx="370" cy="75" r="6" fill="#1a1818"/>
    <circle cx="430" cy="75" r="6" fill="#1a1818"/>
    <circle cx="370" cy="95" r="6" fill="#1a1818"/>
    <circle cx="430" cy="95" r="6" fill="#1a1818"/>
    <circle cx="370" cy="115" r="6" fill="#1a1818"/>
    <circle cx="430" cy="115" r="6" fill="#1a1818"/>
    <circle cx="370" cy="135" r="6" fill="#1a1818"/>
    <circle cx="430" cy="135" r="6" fill="#1a1818"/>
    <circle cx="370" cy="155" r="6" fill="#1a1818"/>
    <circle cx="430" cy="155" r="6" fill="#1a1818"/>
    <circle cx="370" cy="175" r="6" fill="#1a1818"/>
    <circle cx="430" cy="175" r="6" fill="#1a1818"/>
  </g>

  <!-- Button 7 (disabled, covered) -->
  <rect x="355" y="190" width="90" height="22" fill="#1e1c1c" rx="3"/>
  <text x="400" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3a3535">7</text>
  <!-- Tape over button -->
  <rect x="357" y="192" width="86" height="18" fill="#2a2828" opacity="0.5" rx="2"/>
  <text x="400" y="204" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#4a4545">無効</text>

  <!-- Floor display - 7 lit in red -->
  <rect x="365" y="230" width="70" height="30" fill="#0a0606" rx="3"/>
  <rect x="367" y="232" width="66" height="26" fill="#1a0808" rx="2"/>
  <!-- The number 7 in red LED -->
  <text x="400" y="252" text-anchor="middle" font-family="monospace" font-size="22" fill="#ff2020" filter="url(#blur2)">7</text>
  <text x="400" y="252" text-anchor="middle" font-family="monospace" font-size="22" fill="#ff2020">7</text>
  <!-- Red glow around 7 -->
  <circle cx="400" cy="245" r="25" fill="url(#redGlow)" filter="url(#blur4)"/>

  <!-- Subtle shadow under elevator -->
  <ellipse cx="400" cy="410" rx="180" ry="15" fill="#080606" opacity="0.6"/>

  <!-- Floor reflection/glow from 7 indicator -->
  <ellipse cx="400" cy="340" rx="80" ry="8" fill="#2a1010" opacity="0.3" filter="url(#blur2)"/>
  <ellipse cx="400" cy="345" rx="50" ry="5" fill="#3a1515" opacity="0.2" filter="url(#blur4)"/>

  <!-- Water droplet trail from door seam -->
  <ellipse cx="400" cy="342" rx="3" ry="1.5" fill="#1e1c1c" opacity="0.5"/>
  <ellipse cx="402" cy="346" rx="2" ry="1" fill="#222020" opacity="0.4"/>
  <ellipse cx="399" cy="350" rx="2.5" ry="1.2" fill="#1a1818" opacity="0.3"/>

  <!-- Faint ghostly figure visible through door crack (very subtle) -->
  <rect x="398" y="100" width="4" height="200" fill="#1a1515" opacity="0.15"/>
  <!-- Silhouette suggestion -->
  <ellipse cx="402" cy="120" rx="6" ry="8" fill="#1a1515" opacity="0.1"/>
  <rect x="396" y="128" width="12" height="80" fill="#1a1515" opacity="0.08"/>
  <!-- Hand reaching through crack -->
  <rect x="400" y="180" width="8" height="3" fill="#1a1515" opacity="0.12" rx="1"/>
  <rect x="400" y="185" width="6" height="2" fill="#1a1515" opacity="0.08" rx="1"/>

  <!-- Ambient darkness vignette -->
  <rect width="800" height="450" fill="#0a0808" opacity="0.3" pointer-events="none"/>
  <rect x="0" y="0" width="200" height="450" fill="#080606" opacity="0.4" pointer-events="none"/>
  <rect x="600" y="0" width="200" height="450" fill="#080606" opacity="0.4" pointer-events="none"/>
</svg>