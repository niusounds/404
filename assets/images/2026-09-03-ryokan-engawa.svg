<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="b3"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b5"><feGaussianBlur stdDeviation="50"/></filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="#0a0808"/>

  <!-- 障子の枠 -->
  <rect x="200" y="20" width="400" height="300" fill="none" stroke="#1a1510" stroke-width="8"/>
  <line x1="333" y1="20" x2="333" y2="320" stroke="#1a1510" stroke-width="3"/>
  <line x1="466" y1="20" x2="466" y2="320" stroke="#1a1510" stroke-width="3"/>
  <line x1="200" y1="120" x2="600" y2="120" stroke="#1a1510" stroke-width="3"/>
  <line x1="200" y1="220" x2="600" y2="220" stroke="#1a1510" stroke-width="3"/>

  <!-- 障子の紙 -->
  <rect x="200" y="20" width="400" height="300" fill="#1a1815" opacity="0.5"/>

  <!-- 霧 -->
  <ellipse cx="400" cy="170" rx="200" ry="120" fill="#2a2530" opacity="0.3" filter="url(#b5)"/>
  <ellipse cx="420" cy="150" rx="150" ry="80" fill="#3a3540" opacity="0.2" filter="url(#b3)"/>

  <!--  silhouette - 最小限 -->
  <g opacity="0.5">
    <ellipse cx="395" cy="120" rx="15" ry="20" fill="#0a0808"/>
    <path d="M380,140 L375,230 L385,225 L390,180 L398,180 L402,225 L412,230 L407,140 Z" fill="#0a0808"/>
  </g>

  <!-- 目の光 -->
  <circle cx="390" cy="117" r="2" fill="#d4c8b0" opacity="0.4"/>
  <circle cx="400" cy="117" r="2" fill="#d4c8b0" opacity="0.4"/>

  <!-- 縁側 -->
  <rect x="0" y="320" width="800" height="130" fill="#151210" opacity="0.8"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#2a2018" stroke-width="2"/>

  <!-- 余白 -->
  <rect width="800" height="450" fill="url(#vignette)"/>
</svg>
