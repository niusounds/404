<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: 'Courier New', monospace; }
  </style>
  <!-- Background -->
  <rect width="800" height="450" fill="#1a1a2e"/>
  
  <!-- Damp cobblestone street -->
  <defs>
    <linearGradient id="fogGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#457b9a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Rain/mist overlay on the left -->
  <rect x="0" y="80" width="250" height="300" fill="url(#fogGrad)" opacity="0.4"/>
  
  <!-- Old building facade - gothic/medieval style -->
  <rect x="140" y="70" width="160" height="280" fill="#2d2d44" stroke="#3a3a5c" stroke-width="2"/>
  <rect x="160" y="100" width="25" height="45" fill="#8fbcdb" opacity="0.5" rx="2"/>
  <rect x="235" y="100" width="25" height="45" fill="#8fbcdb" opacity="0.7" rx="2"/>
  <rect x="160" y="200" width="25" height="45" fill="#ffffff" opacity="0.35" rx="2"/>
  <rect x="235" y="200" width="25" height="45" fill="#8fbcdb" opacity="0.6" rx="2"/>
  
  <!-- Ground floor entrance (closed, slightly ajar) -->
  <rect x="190" y="270" width="40" height="80" fill="#3d2b1f" stroke="#5a4d42" stroke-width="1"/>
  <line x1="215" y1="295" x2="215" y2="335" stroke="#d4af37" stroke-width="2"/>

  <!-- Narrow side passage (main story element) -->
  <rect x="300" y="160" width="18" height="190" fill="#0a0a14" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Dark void at the end of the passage, barely visible -->
  <rect x="318" y="160" width="5" height="190" fill="#ffffff" opacity="0.08"/>

  <!-- Canal/water on right - reflects building lights -->
  <rect x="420" y="300" width="350" height="70" fill="#0d1e2f" stroke="#1a3d5c" stroke-width="1.5"/>
  
  <!-- Water reflections from windows (yellow-gold) -->
  <ellipse cx="460" cy="320" rx="8" ry="3" fill="#ffd166" opacity="0.3"/>
  <ellipse cx="500" cy="335" rx="12" ry="4" fill="#8fbcdb" opacity="0.15"/>
  <ellipse cx="570" cy="350" rx="50" ry="6" fill="#8fbcdb" opacity="0.12"/>
  
  <!-- Canal railing posts -->
  <rect x="440" y="290" width="3" height="15" fill="#5a5a7c"/>
  <rect x="470" y="285" width="3" height="15" fill="#5a5a7c"/>
  <rect x="510" y="290" width="3" height="15" fill="#5a5a7c"/>
  
  <!-- Rain drops -->
  <line x1="340" y1="60" x2="342" y2="75" stroke="#8fbcdb" stroke-width="1" opacity="0.4"/>
  <line x1="390" y1="50" x2="392" y2="68" stroke="#ffffff" stroke-width="0.7" opacity="0.3"/>
  <line x1="460" y1="55" x2="462" y2="72" stroke="#8fbcdb" stroke-width="1" opacity="0.35"/>
  <line x1="520" y1="60" x2="522" y2="75" stroke="#ffffff" stroke-width="0.7" opacity="0.25"/>
  
  <!-- Cobblestones in foreground -->
  <rect x="80" y="350" width="8" height="10" fill="#4a4a6c" rx="3" opacity="0.3"/>
  <rect x="100" y="370" width="9" height="12" fill="#3d3d5e" rx="4" opacity="0.25"/>
  <rect x="70" y="385" width="7" height="9" fill="#2a2a4c" rx="2" opacity="0.25"/>
  
  <!-- Title -->
  <text x="400" y="410" class="title" text-anchor="middle" font-size="18" fill="#c0d6e4">
    The Narrow Passage That Shouldn't Connect
  </text>

  <!-- Decorative frame -->
  <rect x="20" y="20" width="760" height="300" rx="5" fill="none" stroke="#7a798b" stroke-width="1.5"/>
  
</svg>