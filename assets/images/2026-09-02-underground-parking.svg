<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#121010"/>
    </linearGradient>
    <linearGradient id="camScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="100%" stop-color="#061206"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="flicker">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Parking lot floor lines -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1a1515" stroke-width="1"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#141010" stroke-width="1"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#100e0e" stroke-width="1"/>

  <!-- Ceiling pipes -->
  <rect x="50" y="0" width="4" height="120" fill="#151313" rx="1"/>
  <rect x="300" y="0" width="4" height="100" fill="#151313" rx="1"/>
  <rect x="550" y="0" width="4" height="130" fill="#151313" rx="1"/>
  <rect x="720" y="0" width="4" height="90" fill="#151313" rx="1"/>

  <!-- Fluorescent lights -->
  <rect x="180" y="30" width="80" height="3" fill="#2a2520" rx="1"/>
  <rect x="180" y="30" width="80" height="3" fill="#3a3530" rx="1" opacity="0.5"/>
  <rect x="430" y="25" width="90" height="3" fill="#2a2520" rx="1"/>
  <rect x="430" y="25" width="90" height="3" fill="#3a3530" rx="1" opacity="0.4"/>
  <rect x="660" y="35" width="70" height="3" fill="#2a2520" rx="1"/>

  <!-- Pillar -->
  <rect x="380" y="100" width="50" height="280" fill="#181616" rx="2"/>
  <rect x="380" y="100" width="50" height="280" fill="#1a1818" rx="2" opacity="0.5"/>
  <line x1="380" y1="150" x2="430" y2="150" stroke="#201e1e" stroke-width="1"/>
  <line x1="380" y1="200" x2="430" y2="200" stroke="#201e1e" stroke-width="1"/>
  <line x1="380" y1="250" x2="430" y2="250" stroke="#201e1e" stroke-width="1"/>

  <!-- Car silhouette 1 -->
  <ellipse cx="220" cy="340" rx="90" ry="40" fill="#141212"/>
  <ellipse cx="220" cy="330" rx="60" ry="30" fill="#181616"/>
  <rect x="170" y="310" width="100" height="25" rx="8" fill="#1a1818"/>
  <rect x="180" y="345" width="15" height="15" rx="3" fill="#1e1c1c"/>
  <rect x="260" y="345" width="15" height="15" rx="3" fill="#1e1c1c"/>
  <rect x="195" y="312" width="20" height="15" rx="3" fill="#252222" opacity="0.6"/>
  <rect x="225" y="312" width="20" height="15" rx="3" fill="#252222" opacity="0.6"/>

  <!-- Car silhouette 2 (partially visible) -->
  <ellipse cx="620" cy="350" rx="70" ry="35" fill="#141212"/>
  <rect x="580" y="320" width="80" height="22" rx="8" fill="#181616"/>
  <rect x="590" y="348" width="12" height="14" rx="3" fill="#1e1c1c"/>
  <rect x="640" y="348" width="12" height="14" rx="3" fill="#1e1c1c"/>

  <!-- Camera monitor screen overlay -->
  <rect x="560" y="50" width="200" height="140" rx="6" fill="#0a1a0a" stroke="#1a3a1a" stroke-width="1.5" opacity="0.95"/>
  
  <!-- Screen scanlines -->
  <line x1="562" y1="60" x2="758" y2="60" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="70" x2="758" y2="70" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="80" x2="758" y2="80" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="90" x2="758" y2="90" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="100" x2="758" y2="100" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="110" x2="758" y2="110" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="120" x2="758" y2="120" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="130" x2="758" y2="130" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="140" x2="758" y2="140" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="150" x2="758" y2="150" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="160" x2="758" y2="160" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="170" x2="758" y2="170" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>
  <line x1="562" y1="180" x2="758" y2="180" stroke="#0f2a0f" stroke-width="0.5" opacity="0.3"/>

  <!-- Screen recording timestamp -->
  <text x="570" y="72" fill="#2a6a2a" font-family="monospace" font-size="10" opacity="0.7">REC 18:47:23</text>
  <text x="570" y="85" fill="#1a5a1a" font-family="monospace" font-size="8" opacity="0.5">B-ZONE CAM-03</text>

  <!-- Small red REC dot -->
  <circle cx="572" cy="66" r="3" fill="#aa0000" filter="url(#glow)" opacity="0.8"/>

  <!-- Silhouette figure in screen -->
  <g transform="translate(640, 110)" opacity="0.8">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="10" ry="12" fill="#0a2a0a"/>
    <!-- Body -->
    <path d="M-8,12 L-12,50 L12,50 L8,12 Z" fill="#0a2a0a"/>
    <!-- Arms -->
    <line x1="-8" y1="20" x2="-20" y2="35" stroke="#0a2a0a" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="15" y2="5" stroke="#0a2a0a" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-4" y1="48" x2="-8" y2="70" stroke="#0a2a0a" stroke-width="4" stroke-linecap="round"/>
    <line x1="4" y1="48" x2="8" y2="70" stroke="#0a2a0a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Glitch line -->
  <rect x="560" y="130" width="200" height="1" fill="#1a4a1a" opacity="0.4"/>
  <rect x="600" y="155" width="120" height="1" fill="#1a4a1a" opacity="0.3"/>

  <!-- Floor parking lines -->
  <line x1="100" y1="350" x2="100" y2="450" stroke="#1a1818" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="350" x2="300" y2="450" stroke="#1a1818" stroke-width="1" opacity="0.5"/>
  <line x1="500" y1="350" x2="500" y2="450" stroke="#1a1818" stroke-width="1" opacity="0.5"/>
  <line x1="700" y1="350" x2="700" y2="450" stroke="#1a1818" stroke-width="1" opacity="0.5"/>

  <!-- Distant light glow -->
  <circle cx="120" cy="370" r="8" fill="#2a2518" opacity="0.3"/>
  <circle cx="120" cy="370" r="3" fill="#3a3528" opacity="0.4"/>

  <!-- Vignette -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.6"/>
</svg>
