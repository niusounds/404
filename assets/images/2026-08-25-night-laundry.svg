<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <radialGradient id="drumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2535" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Floor line -->
  <line x1="0" y1="340" x2="800" y2="340" stroke="#1a1520" stroke-width="1" opacity="0.5"/>

  <!-- Ceiling fluorescent light -->
  <rect x="300" y="10" width="200" height="4" rx="2" fill="#3a3545" opacity="0.4"/>
  <ellipse cx="400" cy="18" rx="120" ry="8" fill="#4a4555" opacity="0.15" filter="url(#blur3)"/>
  <rect x="380" y="14" width="40" height="2" fill="#5a5565" opacity="0.3"/>

  <!-- Left washing machine -->
  <rect x="80" y="120" width="160" height="220" rx="8" fill="#15121a" stroke="#2a2535" stroke-width="1"/>
  <rect x="90" y="130" width="140" height="12" rx="3" fill="#1a1520" stroke="#2a2535" stroke-width="0.5"/>
  <circle cx="110" cy="136" r="4" fill="#2a2535"/>
  <circle cx="130" cy="136" r="4" fill="#2a2535"/>
  <rect x="95" y="150" width="130" height="170" rx="60" fill="#0a0808" stroke="#2a2535" stroke-width="1.5"/>

  <!-- Center washing machine (main focus) -->
  <rect x="280" y="80" width="240" height="280" rx="10" fill="#15121a" stroke="#2a2535" stroke-width="1"/>
  <rect x="295" y="92" width="210" height="16" rx="4" fill="#1a1520" stroke="#2a2535" stroke-width="0.5"/>
  <circle cx="320" cy="100" r="5" fill="#2a2535"/>
  <circle cx="345" cy="100" r="5" fill="#2a2535"/>
  <circle cx="370" cy="100" r="5" fill="#2a2535"/>
  <rect x="300" y="118" width="200" height="222" rx="80" fill="#0a0808" stroke="#2a2535" stroke-width="1.5"/>
  
  <!-- Center drum inner glow -->
  <ellipse cx="400" cy="230" rx="70" ry="80" fill="url(#drumGlow)"/>
  
  <!-- Drum interior -->
  <ellipse cx="400" cy="230" rx="65" ry="75" fill="#0d0b10" stroke="#2a2535" stroke-width="0.5"/>
  
  <!-- Water droplets on glass -->
  <circle cx="370" cy="190" r="3" fill="#3a3545" opacity="0.4"/>
  <circle cx="385" cy="175" r="2" fill="#3a3545" opacity="0.3"/>
  <circle cx="410" cy="180" r="2.5" fill="#3a3545" opacity="0.35"/>
  <circle cx="430" cy="195" r="3" fill="#3a3545" opacity="0.4"/>
  <circle cx="365" cy="210" r="2" fill="#3a3545" opacity="0.3"/>
  <circle cx="390" cy="205" r="2.5" fill="#3a3545" opacity="0.35"/>
  <circle cx="420" cy="215" r="2" fill="#3a3545" opacity="0.3"/>
  <circle cx="440" cy="230" r="3" fill="#3a3545" opacity="0.4"/>
  <circle cx="375" cy="240" r="2.5" fill="#3a3545" opacity="0.35"/>
  <circle cx="405" cy="250" r="2" fill="#3a3545" opacity="0.3"/>
  <circle cx="435" cy="260" r="2.5" fill="#3a3545" opacity="0.35"/>
  <circle cx="360" cy="255" r="2" fill="#3a3545" opacity="0.3"/>
  <circle cx="380" cy="270" r="3" fill="#3a3545" opacity="0.4"/>
  <circle cx="415" cy="275" r="2" fill="#3a3545" opacity="0.3"/>
  <!-- Hand-press marks -->
  <ellipse cx="395" cy="220" rx="18" ry="25" fill="none" stroke="#3a3545" stroke-width="0.8" opacity="0.25"/>
  <ellipse cx="405" cy="215" rx="15" ry="22" fill="none" stroke="#3a3545" stroke-width="0.6" opacity="0.2"/>

  <!-- Right washing machine -->
  <rect x="560" y="120" width="160" height="220" rx="8" fill="#15121a" stroke="#2a2535" stroke-width="1"/>
  <rect x="570" y="130" width="140" height="12" rx="3" fill="#1a1520" stroke="#2a2535" stroke-width="0.5"/>
  <circle cx="590" cy="136" r="4" fill="#2a2535"/>
  <circle cx="610" cy="136" r="4" fill="#2a2535"/>
  <rect x="575" y="150" width="130" height="170" rx="60" fill="#0a0808" stroke="#2a2535" stroke-width="1.5"/>
  <ellipse cx="640" cy="235" rx="50" ry="60" fill="url(#drumGlow)" opacity="0.3"/>
  <ellipse cx="640" cy="235" rx="45" ry="55" fill="#0d0b10" stroke="#2a2535" stroke-width="0.5"/>

  <!-- Counter -->
  <rect x="0" y="340" width="800" height="3" fill="#1a1520" opacity="0.6"/>

  <!-- Light glow on center machine -->
  <ellipse cx="400" cy="350" rx="100" ry="40" fill="#2a2535" opacity="0.05" filter="url(#blur3)"/>

  <!-- Vignette -->
  <rect width="800" height="450" fill="url(#glow)" opacity="0.3"/>

  <!-- Fluorescent light beams -->
  <line x1="350" y1="18" x2="340" y2="340" stroke="#2a2535" stroke-width="0.3" opacity="0.08"/>
  <line x1="400" y1="18" x2="400" y2="340" stroke="#2a2535" stroke-width="0.3" opacity="0.06"/>
  <line x1="450" y1="18" x2="460" y2="340" stroke="#2a2535" stroke-width="0.3" opacity="0.08"/>
</svg>