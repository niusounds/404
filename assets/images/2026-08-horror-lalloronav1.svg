<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-center" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#080406"/>
    </radialGradient>
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a3a"/>
      <stop offset="50%" style="stop-color:#0c2840"/>
      <stop offset="100%" style="stop-color:#050f1e"/>
    </linearGradient>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="3" /><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  <use href="#glow-center"/>
  
  <!-- Gothic frame -->
  <rect x="12" y="12" width="776" height="426" rx="6" fill="none" stroke="#3d001a" stroke-width="2.5"/>
  <rect x="20" y="20" width="760" height="410" rx="4" fill="none" stroke="#260010" stroke-width="1"/>
  
  <!-- Corner ornaments -->
  <path d="M12,48 L12,352 M48,12 L352,12 M752,12 L448,12 M48,430 L12,438" stroke="#4d0025" stroke-width="1.5" fill="none"/>
  <circle cx="200" cy="20" r="3" fill="#6b0030"/>
  <circle cx="600" cy="20" r="3" fill="#6b0030"/>
  <circle cx="200" cy="430" r="3" fill="#6b0030"/>
  <circle cx="600" cy="430" r="3" fill="#6b0030"/>

  <!-- Moon -->
  <ellipse cx="650" cy="80" rx="35" ry="35" fill="#f0e8c8" opacity="0.12"/>
  <ellipse cx="658" cy="72" rx="30" ry="30" fill="#0a0808"/>

  <!-- Bridge silhouette -->
  <path d="M50,320 Q150,300 300,330 L400,360 L470,360 L550,330 Q600,310 750,320" fill="#1a0d1a" stroke="none"/>
  
  <!-- Arches under bridge -->
  <path d="M235,360 A40,40 0 0,1 315,360" fill="none" stroke="#0e0808" stroke-width="1.5"/>
  <path d="M370,360 A40,40 0 0,1 450,360" fill="none" stroke="#0e0808" stroke-width="1.5"/>

  <!-- River/water surface -->
  <rect x="0" y="370" width="800" height="80" fill="url(#water-grad)" opacity="0.9"/>
  
  <!-- Water ripples -->
  <path d="M100,410 Q200,405 350,410 Q500,415 600,410" stroke="#1a3a5f" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M200,395 Q350,390 500,395 Q650,400 750,395" stroke="#1a3a5f" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M50,390 Q250,385 400,390 Q550,395 700,390" stroke="#1a3a5f" stroke-width="0.6" fill="none" opacity="0.3"/>

  <!-- Ghostly white figure in water -->
  <g transform="translate(320,340)">
    <!-- Head silhouette -->
    <ellipse cx="60" cy="-180" rx="250" ry="160" fill="#e8dcd0" opacity="0.08"/>
    
    <!-- Flowing hair in water -->
    <g transform="translate(70, -30)">
      <ellipse cx="0" cy="0" rx="40" ry="25" fill="#f5eeea" opacity="0.15"/>
    </g>
    <g transform="translate(90, -5)">
      <ellipse cx="0" cy="0" rx="35" ry="20" fill="#f5eeea" opacity="0.12"/>
    </g>
    <!-- Face hint -->
    <ellipse cx="-8" cy="-65" rx="8" ry="40" fill="#fff" opacity="0.1"/>

    
    <!-- White dress silhouette in water -->
    <g transform="translate(30, 5)">
      <path d="M-70,-20 Q-80,50 -60,60 M-50,-10 Q-90,40 -70,60" stroke="#f0e8c8" stroke-width="1.5" fill="none" opacity="0.3"/>
      <ellipse cx="-25" cy="30" rx="28" ry="12" fill="#fff" opacity="0.04"/>
      <!-- Arms spread in water -->

      
    </g>

    
  </g>

  <!-- Moonlight reflection on water -->
  <path d="M625,385 L630,440" stroke="#f0e8c8" stroke-width="1.5" fill="none" opacity="0.15"/>
  <path d="M638,390 L642,440" stroke="#f0e8c8" stroke-width="1" fill="none" opacity="0.08"/>

  <!-- Text -->
  <text x="400" y="415" text-anchor="middle" font-family="serif" font-size="32" fill="#b8001f" letter-spacing="12" filter="url(#glow-red)">LÁ LORONA</text>

  <!-- Subtitle -->
  <text x="400" y="70" text-anchor="middle" font-family="serif" font-size="12" fill="#6a3a4a" letter-spacing="8">LA LLORONA — THE WEEPING WOMAN</text>

  
</svg>