<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background: dark corridor -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor -->
  <rect x="0" y="280" width="800" height="170" fill="#0d0b0b"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#1a1515" stroke-width="1"/>

  <!-- Wall -->
  <rect x="0" y="0" width="800" height="280" fill="#0e0c0c"/>

  <!-- Door (centered, slightly left of center) -->
  <rect x="310" y="30" width="180" height="250" fill="#1a1717" stroke="#2a2525" stroke-width="2"/>

  <!-- Door handle -->
  <circle cx="470" cy="160" r="5" fill="#3a3535"/>
  <rect x="465" y="150" width="10" height="20" rx="3" fill="#3a3535"/>

  <!-- Light leaking from under the door -->
  <rect x="310" y="270" width="180" height="10" fill="#2a2015" opacity="0.6"/>
  <!-- Light spreading on floor -->
  <ellipse cx="400" cy="310" rx="120" ry="30" fill="#2a2015" opacity="0.15"/>
  <ellipse cx="400" cy="300" rx="80" ry="15" fill="#2a2015" opacity="0.2"/>

  <!-- Room number plate -->
  <rect x="385" y="20" width="30" height="12" fill="#1e1c1c" stroke="#2a2828" stroke-width="0.5"/>
  <text x="400" y="30" font-family="sans-serif" font-size="9" fill="#4a4545" text-anchor="middle">C</text>

  <!-- Name tag on the floor -->
  <g transform="translate(390, 330) rotate(5)">
    <rect x="0" y="0" width="100" height="35" rx="2" fill="#f5f0e8" stroke="#d4cfc5" stroke-width="0.5"/>
    <rect x="5" y="-4" width="90" height="5" rx="1" fill="#333333"/>
    <text x="50" y="22" font-family="sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">山田 太郎</text>
    <text x="50" y="32" font-family="sans-serif" font-size="7" fill="#888888" text-anchor="middle">開発部</text>
  </g>

  <!-- Subtle shadows -->
  <rect x="310" y="280" width="180" height="30" fill="#080606" opacity="0.5"/>

  <!-- Ambient darkness vignette -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" opacity="0.4"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Very subtle fluorescent light glow at top -->
  <rect x="350" y="0" width="100" height="3" fill="#1a1815" opacity="0.3"/>
  <ellipse cx="400" cy="5" rx="60" ry="3" fill="#1a1815" opacity="0.1"/>
</svg>