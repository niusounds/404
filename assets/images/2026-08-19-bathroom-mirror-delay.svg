<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="mirrorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#2a2030" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle wall texture -->
  <rect x="0" y="0" width="800" height="450" fill="#0c0a0a" opacity="0.5"/>

  <!-- Bathroom tiles suggestion - faint lines -->
  <line x1="100" y1="0" x2="100" y2="450" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="450" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="500" y1="0" x2="500" y2="450" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="700" y1="0" x2="700" y2="450" stroke="#0f0d0d" stroke-width="0.5"/>

  <line x1="0" y1="75" x2="800" y2="75" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="0" y1="150" x2="800" y2="150" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#0f0d0d" stroke-width="0.5"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="#0f0d0d" stroke-width="0.5"/>

  <!-- Mirror frame -->
  <rect x="280" y="30" width="240" height="390" rx="8" fill="#1a1618" stroke="#2a2428" stroke-width="2"/>
  <rect x="285" y="35" width="230" height="380" rx="5" fill="url(#mirrorGlow)"/>

  <!-- Mirror surface subtle reflection -->
  <rect x="287" y="37" width="226" height="376" rx="4" fill="#121018" opacity="0.3"/>

  <!-- Real person silhouette (left side, slightly offset) -->
  <!-- Head -->
  <ellipse cx="340" cy="130" rx="28" ry="35" fill="#0e0c10" opacity="0.85"/>
  <!-- Body -->
  <path d="M310,165 L305,320 L370,320 L365,165 Q355,155 340,155 Q325,155 310,165Z" fill="#0e0c10" opacity="0.85"/>
  <!-- Arms -->
  <path d="M310,175 L290,230 L295,232 L315,180" fill="#0e0c10" opacity="0.85"/>
  <path d="M365,175 L385,230 L380,232 L360,180" fill="#0e0c10" opacity="0.85"/>

  <!-- Mirror reflection silhouette (right side, delayed) -->
  <!-- Slightly offset head to show delay -->
  <ellipse cx="460" cy="135" rx="28" ry="35" fill="#0e0c10" opacity="0.4" filter="url(#blur1)"/>
  <!-- Body -->
  <path d="M430,170 L425,320 L490,320 L485,170 Q475,160 460,160 Q445,160 430,170Z" fill="#0e0c10" opacity="0.4" filter="url(#blur1)"/>
  <!-- Arms - slightly different pose showing delay -->
  <path d="M430,180 L410,235 L415,237 L435,185" fill="#0e0c10" opacity="0.4" filter="url(#blur1)"/>
  <path d="M485,180 L505,225 L500,227 L480,175" fill="#0e0c10" opacity="0.4" filter="url(#blur1)"/>

  <!-- Face glow on real person -->
  <ellipse cx="340" cy="130" rx="18" ry="22" fill="url(#faceGlow)"/>

  <!-- Face glow on mirror person (offset, dimmer) -->
  <ellipse cx="460" cy="135" rx="18" ry="22" fill="#1a1520" opacity="0.3" filter="url(#blur2)"/>

  <!-- Subtle time delay indicator - faint line connecting the two -->
  <line x1="370" y1="132" x2="430" y2="132" stroke="#1a1520" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.4"/>

  <!-- Top light source - bathroom ceiling light -->
  <ellipse cx="400" cy="15" rx="30" ry="5" fill="#1a1820" opacity="0.6"/>
  <line x1="400" y1="20" x2="400" y2="450" stroke="#1a1520" stroke-width="0.3" opacity="0.15"/>

  <!-- Floor -->
  <rect x="0" y="420" width="800" height="30" fill="#080608"/>

  <!-- Water drops on mirror - subtle horror detail -->
  <circle cx="350" cy="200" r="1.5" fill="#1a1820" opacity="0.5"/>
  <circle cx="380" cy="250" r="1" fill="#1a1820" opacity="0.4"/>
  <circle cx="420" cy="180" r="2" fill="#1a1820" opacity="0.5"/>
  <circle cx="450" cy="300" r="1.5" fill="#1a1820" opacity="0.4"/>
  <circle cx="370" cy="340" r="1" fill="#1a1820" opacity="0.3"/>

  <!-- Bottom edge of mirror - shelf -->
  <rect x="270" y="418" width="260" height="6" rx="2" fill="#1a1618"/>

  <!-- Very subtle fog on mirror edges -->
  <rect x="287" y="37" width="226" height="376" rx="4" fill="none" stroke="#151218" stroke-width="15" opacity="0.2"/>

</svg>
