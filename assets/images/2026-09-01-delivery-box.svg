<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background - dark corridor -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Floor perspective lines -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#1a1515" stroke-width="1"/>
  <line x1="150" y1="380" x2="650" y2="380" stroke="#151010" stroke-width="0.5"/>
  
  <!-- Corridor walls -->
  <rect x="0" y="0" width="120" height="450" fill="#0d0b0b"/>
  <rect x="680" y="0" width="120" height="450" fill="#0d0b0b"/>
  
  <!-- Wall texture lines -->
  <line x1="60" y1="0" x2="60" y2="450" stroke="#111010" stroke-width="0.5"/>
  <line x1="740" y1="0" x2="740" y2="450" stroke="#111010" stroke-width="0.5"/>
  
  <!-- Ceiling light (flickering, dim) -->
  <ellipse cx="400" cy="30" rx="80" ry="15" fill="#1a1815"/>
  <ellipse cx="400" cy="32" rx="60" ry="10" fill="#2a2520" opacity="0.6"/>
  <!-- Light cone -->
  <polygon points="370,45 430,45 550,350 250,350" fill="#1a1510" opacity="0.15"/>
  
  <!-- Delivery box (center, floor level) -->
  <rect x="340" y="280" width="120" height="80" rx="3" fill="#1e1a18" stroke="#2a2520" stroke-width="1"/>
  <!-- Box opening line -->
  <line x1="340" y1="310" x2="460" y2="310" stroke="#2a2520" stroke-width="0.5"/>
  <!-- Box label area -->
  <rect x="370" y="330" width="60" height="20" fill="#252018" rx="1"/>
  <!-- Barcode lines -->
  <line x1="375" y1="335" x2="425" y2="335" stroke="#3a3530" stroke-width="1"/>
  <line x1="375" y1="340" x2="415" y2="340" stroke="#3a3530" stroke-width="0.5"/>
  
  <!-- Slightly open flap -->
  <polygon points="340,280 340,310 355,300 355,270" fill="#221e1a" stroke="#2a2520" stroke-width="0.5"/>
  
  <!-- Dark hand silhouette reaching from inside box -->
  <path d="M380,280 Q385,260 395,250 Q400,245 405,250 Q410,255 408,265 Q405,275 400,280 Z" fill="#0a0808" opacity="0.9"/>
  <path d="M390,280 Q395,258 402,248 Q408,242 412,248 Q416,254 414,264 Q410,274 406,280 Z" fill="#0a0808" opacity="0.85"/>
  
  <!-- Eerie red glow from inside box -->
  <ellipse cx="400" cy="290" rx="25" ry="15" fill="#3a0a0a" opacity="0.3"/>
  <ellipse cx="400" cy="290" rx="12" ry="8" fill="#4a0e0e" opacity="0.2"/>
  
  <!-- Door at end of corridor -->
  <rect x="350" y="180" width="100" height="170" fill="#121010" stroke="#1a1815" stroke-width="1"/>
  <line x1="400" y1="180" x2="400" y2="350" stroke="#1a1815" stroke-width="0.5"/>
  <!-- Door handle -->
  <circle cx="370" cy="270" r="4" fill="#2a2520"/>
  
  <!-- Numbers on door -->
  <text x="395" y="200" fill="#3a3530" font-size="14" font-family="monospace">302</text>
  
  <!-- Subtle blood-like drip from box area -->
  <path d="M420,360 Q422,370 421,380 Q420,390 423,400" stroke="#2a0a0a" stroke-width="1" fill="none" opacity="0.4"/>
  
  <!-- Floor shadow under box -->
  <ellipse cx="400" cy="365" rx="70" ry="8" fill="#080606" opacity="0.5"/>
  
  <!-- Ambient darkness gradient -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" opacity="0.6"/>
  
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050303" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
