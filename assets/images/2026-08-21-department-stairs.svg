<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#1a1210"/>
    </linearGradient>
    <linearGradient id="light" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2a2018" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Perspective: stairs going up from bottom-left to top-right -->
  <!-- Floor -->
  <polygon points="0,450 300,450 250,380 0,380" fill="#0d0a0a" opacity="0.8"/>

  <!-- Staircase structure - going up from bottom to top -->
  <!-- Each step -->
  <g opacity="0.9">
    <!-- Step 1 -->
    <rect x="20" y="395" width="180" height="8" fill="#1a1510"/>
    <rect x="20" y="387" width="180" height="8" fill="#15120d"/>
    <rect x="20" y="387" width="2" height="16" fill="#1a1510"/>
    
    <!-- Step 2 -->
    <rect x="60" y="355" width="160" height="8" fill="#1a1510"/>
    <rect x="60" y="347" width="160" height="8" fill="#15120d"/>
    <rect x="60" y="347" width="2" height="16" fill="#1a1510"/>
    
    <!-- Step 3 -->
    <rect x="100" y="315" width="140" height="8" fill="#1a1510"/>
    <rect x="100" y="307" width="140" height="8" fill="#15120d"/>
    <rect x="100" y="307" width="2" height="16" fill="#1a1510"/>
    
    <!-- Step 4 -->
    <rect x="140" y="275" width="120" height="8" fill="#1a1510"/>
    <rect x="140" y="267" width="120" height="8" fill="#15120d"/>
    <rect x="140" y="267" width="2" height="16" fill="#1a1510"/>
    
    <!-- Step 5 -->
    <rect x="180" y="235" width="100" height="8" fill="#1a1510"/>
    <rect x="180" y="227" width="100" height="8" fill="#15120d"/>
    <rect x="180" y="227" width="2" height="16" fill="#1a1510"/>
    
    <!-- Step 6 - landing -->
    <rect x="220" y="195" width="160" height="8" fill="#1a1510"/>
    <rect x="220" y="187" width="160" height="8" fill="#15120d"/>
    
    <!-- Step 7 -->
    <rect x="260" y="155" width="100" height="8" fill="#1a1510"/>
    <rect x="260" y="147" width="100" height="8" fill="#15120d"/>
    <rect x="260" y="147" width="2" height="16" fill="#1a1510"/>
    
    <!-- Step 8 -->
    <rect x="300" y="115" width="80" height="8" fill="#1a1510"/>
    <rect x="300" y="107" width="80" height="8" fill="#15120d"/>
    <rect x="300" y="107" width="2" height="16" fill="#1a1510"/>
    
    <!-- Step 9 - top landing -->
    <rect x="340" y="75" width="140" height="8" fill="#1a1510"/>
    <rect x="340" y="67" width="140" height="8" fill="#15120d"/>
  </g>

  <!-- Left wall -->
  <polygon points="0,450 0,0 20,0 20,395" fill="#0e0b0b" opacity="0.6"/>
  
  <!-- Right wall -->
  <polygon points="300,450 250,380 250,0 300,0" fill="#0e0b0b" opacity="0.6"/>

  <!-- Handrail on the right side -->
  <line x1="200" y1="395" x2="200" y2="355" stroke="#1a1510" stroke-width="3"/>
  <line x1="200" y1="355" x2="240" y2="315" stroke="#1a1510" stroke-width="3"/>
  <line x1="240" y1="315" x2="240" y2="275" stroke="#1a1510" stroke-width="3"/>
  <line x1="240" y1="275" x2="280" y2="235" stroke="#1a1510" stroke-width="3"/>
  <line x1="280" y1="235" x2="280" y2="195" stroke="#1a1510" stroke-width="3"/>
  <line x1="280" y1="195" x2="320" y2="155" stroke="#1a1510" stroke-width="3"/>
  <line x1="320" y1="155" x2="320" y2="115" stroke="#1a1510" stroke-width="3"/>
  <line x1="320" y1="115" x2="360" y2="75" stroke="#1a1510" stroke-width="3"/>

  <!-- Fluorescent light at the top -->
  <rect x="350" y="55" width="100" height="6" fill="#3a3020" rx="2" filter="url(#softGlow)"/>
  <rect x="350" y="55" width="100" height="6" fill="#4a3a25" rx="2"/>
  
  <!-- Light cone from the fluorescent -->
  <polygon points="350,61 450,61 550,450 250,450" fill="url(#light)" opacity="0.4"/>

  <!-- Door frame at the top -->
  <rect x="360" y="30" width="80" height="45" fill="#0d0a0a" stroke="#1a1510" stroke-width="1"/>
  <rect x="365" y="35" width="70" height="40" fill="#0a0808"/>

  <!-- Ghost figure at the bottom of the stairs (in the dark) -->
  <g transform="translate(30, 360)" filter="url(#glow)">
    <!-- Head -->
    <ellipse cx="40" cy="10" rx="12" ry="15" fill="#1a1515" opacity="0.9"/>
    <!-- Body -->
    <path d="M28,25 Q25,60 30,90 L50,90 Q55,60 52,25 Z" fill="#1a1515" opacity="0.9"/>
    <!-- Hair flowing down -->
    <path d="M28,10 Q20,30 22,70" stroke="#1a1515" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M52,10 Q60,30 58,70" stroke="#1a1515" stroke-width="4" fill="none" opacity="0.7"/>
    <!-- Eyes - two small points of light -->
    <circle cx="35" cy="8" r="1.5" fill="#4a3520" opacity="0.8"/>
    <circle cx="45" cy="8" r="1.5" fill="#4a3520" opacity="0.8"/>
  </g>

  <!-- Second figure - slightly more visible, mid-stairs -->
  <g transform="translate(120, 280)" opacity="0.4">
    <ellipse cx="15" cy="8" rx="8" ry="10" fill="#2a2020"/>
    <path d="M7,18 Q5,45 8,70 L22,70 Q25,45 23,18 Z" fill="#2a2020"/>
    <circle cx="12" cy="6" r="1" fill="#5a4530" opacity="0.5"/>
    <circle cx="18" cy="6" r="1" fill="#5a4530" opacity="0.5"/>
  </g>

  <!-- Faint footprints going up the stairs -->
  <g opacity="0.15">
    <ellipse cx="100" cy="390" rx="4" ry="2" fill="#3a3020"/>
    <ellipse cx="140" cy="350" rx="4" ry="2" fill="#3a3020"/>
    <ellipse cx="180" cy="310" rx="4" ry="2" fill="#3a3020"/>
    <ellipse cx="220" cy="270" rx="4" ry="2" fill="#3a3020"/>
    <ellipse cx="260" cy="230" rx="4" ry="2" fill="#3a3020"/>
    <ellipse cx="300" cy="190" rx="4" ry="2" fill="#3a3020"/>
    <ellipse cx="340" cy="150" rx="4" ry="2" fill="#3a3020"/>
  </g>

  <!-- Subtle fog/mist at the bottom -->
  <ellipse cx="100" cy="430" rx="120" ry="20" fill="#1a1515" opacity="0.3"/>
  <ellipse cx="200" cy="440" rx="150" ry="15" fill="#1a1515" opacity="0.2"/>

  <!-- Very subtle vertical lines suggesting depth -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="0" y2="200" stroke="#3a3020" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="0" y2="300" stroke="#3a3020" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="0" y2="400" stroke="#3a3020" stroke-width="0.5"/>
  </g>

  <!-- Tiny detail: a single shoe left behind on a step -->
  <g transform="translate(155, 300)" opacity="0.2">
    <ellipse cx="10" cy="5" rx="12" ry="4" fill="#2a2020"/>
    <rect x="2" y="2" width="16" height="3" rx="1" fill="#2a2020"/>
  </g>
</svg>