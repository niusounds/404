<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Door silhouette -->
  <rect x="300" y="40" width="200" height="370" rx="4" fill="#1a1515" stroke="#2a2222" stroke-width="1"/>
  
  <!-- Door frame -->
  <rect x="295" y="35" width="210" height="380" rx="6" fill="none" stroke="#1a1414" stroke-width="2"/>
  
  <!-- Door handle -->
  <circle cx="470" cy="240" r="8" fill="#2a2220"/>
  <circle cx="470" cy="240" r="3" fill="#3a3028"/>
  
  <!-- Smart lock panel -->
  <rect x="340" y="180" width="60" height="80" rx="6" fill="#151212" stroke="#2a2222" stroke-width="1"/>
  
  <!-- Lock indicator light (red, ominous) -->
  <circle cx="370" cy="195" r="4" fill="#3a0a0a"/>
  <circle cx="370" cy="195" r="2" fill="#5a1515" opacity="0.8"/>
  
  <!-- Number pad lines -->
  <line x1="350" y1="210" x2="390" y2="210" stroke="#1a1515" stroke-width="1"/>
  <line x1="350" y1="220" x2="390" y2="220" stroke="#1a1515" stroke-width="1"/>
  <line x1="350" y1="230" x2="390" y2="230" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Phone silhouette on the left -->
  <rect x="80" y="150" width="120" height="200" rx="12" fill="#121010" stroke="#1e1a1a" stroke-width="1"/>
  
  <!-- Phone screen glow -->
  <rect x="90" y="170" width="100" height="160" rx="6" fill="#0e1a0e" opacity="0.4"/>
  
  <!-- Screen content - lock notification -->
  <text x="140" y="210" text-anchor="middle" fill="#2a4a2a" font-family="monospace" font-size="14">&#x1f513;</text>
  <text x="140" y="235" text-anchor="middle" fill="#3a5a3a" font-family="sans-serif" font-size="10">解錠されました</text>
  <text x="140" y="255" text-anchor="middle" fill="#3a5a3a" font-family="sans-serif" font-size="9">場所：室内</text>
  <text x="140" y="280" text-anchor="middle" fill="#4a3a3a" font-family="sans-serif" font-size="11">02:33:17</text>
  
  <!-- Dark hallway floor -->
  <line x1="0" y1="410" x2="800" y2="410" stroke="#151212" stroke-width="1"/>
  
  <!-- Subtle eerie light from under door -->
  <ellipse cx="400" cy="415" rx="80" ry="5" fill="#1a1210" opacity="0.3"/>
  
  <!-- Shadow figure hint - very subtle, just a suggestion -->
  <ellipse cx="400" cy="350" rx="15" ry="40" fill="#0d0a0a" opacity="0.5"/>
  
  <!-- Time stamp at bottom right -->
  <text x="720" y="430" text-anchor="middle" fill="#1a1515" font-family="monospace" font-size="10">02:33 AM</text>
</svg>
