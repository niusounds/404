<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="moonGlow" cx="72%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2px" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#moonGlow)"/>

  <!-- Moon (subtle) -->
  <circle cx="680" cy="90" r="38" fill="#fdf2e7" opacity="0.08"/>
  <circle cx="675" cy="88" r="35" fill="#0a0808"/>

  <!-- Stars -->
  <circle cx="120" cy="45" r="0.8" fill="#fff" opacity="0.3"/>
  <circle cx="290" cy="35" r="0.7" fill="#fff" opacity="0.2"/>
  <circle cx="180" cy="110" r="0.5" fill="#fff" opacity="0.18"/>

  <!-- Town silhouette on hill -->
  <path d="M360,215 L390,180 M400,185 l5,-15 L420,190 M410,175 v15" stroke="#2a2a1e" fill="none" stroke-width="1.5" opacity="0.4"/>

  <!-- Hill silhouette -->
  <path d="M0,260 Q200,190 400,230 S700,200 800,250 L800,450 L0,450 Z" fill="#0e0b0b" opacity="0.7"/>
  <path d="M0,280 Q150,230 300,260 S600,220 800,270 L800,450 L0,450 Z" fill="#120e0e"/>

  <!-- Dead vine -->
  <g transform="translate(390, 180)">
    <path d="M0,80 Q-3,60 -5,40 Q-8,20 -6,-10" stroke="#1a1a12" fill="none" stroke-width="2.5"/>
    <path d="M0,80 Q1,55 3,35 Q7,15 5,-15" stroke="#14140e" fill="none" stroke-width="2"/>
    <line x1="-6" y1="-10" x2="-30" y2="-40" stroke="#1a1a12" stroke-width="1.5"/>
    <line x1="-30" y1="-40" x2="-28" y2="-60" stroke="#1a1a12" stroke-width="0.8"/>
    <line x1="5" y1="-15" x2="25" y2="-38" stroke="#14140e" stroke-width="1.2"/>
  </g>

  <!-- Small hands emerging from ground -->
  <g transform="translate(370, 200)">
    <path d="M0,-5 L-5,10 Q-8,8 -6,0 Z" fill="#c4bfbf" opacity="0.15"/>
    <line x1="-6" y1="-6" x2="-14" y2="-20" stroke="#c4bfbf" stroke-width="1.2" opacity="0.3" filter="url(#glow)"/>
  </g>

  <!-- Crack in ground -->
  <path d="M380,220 Q400,250 460,280 M410,230 L450,270" stroke="#1e1a1a" fill="none" stroke-width="1" opacity="0.6"/>

  <!-- Gothic frame -->
  <rect x="12" y="12" width="776" height="426" rx="4" fill="none" stroke="#3d0c08" stroke-width="2" opacity="0.9"/>
  <rect x="20" y="20" width="760" height="410" rx="3" fill="none" stroke="#1e0a06" stroke-width="1" opacity="0.5"/>

  <!-- Corner decorations -->
  <circle cx="30" cy="30" r="8" fill="#3d0c08" opacity="0.7"/><circle cx="30" cy="30" r="3" fill="#5a1a12"/>
  <circle cx="770" cy="30" r="8" fill="#3d0c08" opacity="0.7"/><circle cx="770" cy="30" r="3" fill="#5a1a12"/>
  <circle cx="30" cy="420" r="8" fill="#3d0c08" opacity="0.7"/><circle cx="30" cy="420" r="3" fill="#5a1a12"/>
  <circle cx="770" cy="420" r="8" fill="#3d0c08" opacity="0.7"/><circle cx="770" cy="420" r="3" fill="#5a1a12"/>

  <!-- Text -->
  <text x="400" y="360" text-anchor="middle" fill="#5a1a18" font-size="22" font-family="serif">Pienza の葡萄畑は、もう夜に枯れる。</text>
</svg>