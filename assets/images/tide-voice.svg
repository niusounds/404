

<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/TR/SVG/">
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280">

    <!-- Dark ocean background -->
    <defs>
        <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0a0808" />
            <stop offset="50%" stop-color="#0d0a14" />
            <stop offset="100%" stop-color="#05050a"/>
        </linearGradient>
        <filter id="blur1">
            <feGaussianBlur stdDeviation="2.5"/>
        </filter>
    </defs>

    <rect width="640" height="280" fill="url(#oceanGrad)" />
    
    <!-- Stylized waves -->
    <path d="M 0,195 Q 110,175 160,195 T 320,195 T 480,195 T 640,205 L 640,280 L 0,280 Z" fill="#0f0d1a"/>
    <path d="M 80,205 Q 170,185 230,205 T 390,205 T 540,205 L 640,215 L 640,280 L 0,280 Z" fill="#120f1e"/>
    
    <!-- Three eyes just visible under water - subtle glow -->
    <circle cx="270" cy="230" r="4.5" fill="#c9a2a8" filter="url(#blur1)" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8"/>
        <animate dur="3s" attributeName="r" values="4.5;5.5;4.5"/>
    </circle>
    <circle cx="290" cy="226" r="4.5" fill="#c9a2a8" filter="url(#blur1)" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7"/>
        <animate dur="3s" begin="0.4s" attributeName="r" values="4.5;5.8;4.5"/>
    </circle>

    <!-- Subtitle line -->
    <text x="320" y="268" text-anchor="middle" font-family="monospace" font-size="9" fill="#1a1520">潮の向こうから来る声</text>

</svg>
