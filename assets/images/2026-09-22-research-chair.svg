<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle gradient for depth -->
  <defs>
    <radialGradient id="monitorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2040" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1510" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Floor line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1a1510" stroke-width="1" opacity="0.3"/>
  <rect x="0" y="380" width="800" height="70" fill="url(#floorGlow)"/>
  
  <!-- Desk silhouette -->
  <rect x="120" y="260" width="280" height="12" fill="#151210" rx="1"/>
  <rect x="130" y="272" width="8" height="108" fill="#12100d"/>
  <rect x="382" y="272" width="8" height="108" fill="#12100d"/>
  
  <!-- Monitor on desk -->
  <rect x="200" y="180" width="120" height="78" fill="#0d0d12" rx="2"/>
  <rect x="205" y="185" width="110" height="65" fill="#1a2540" opacity="0.6"/>
  <!-- Monitor stand -->
  <rect x="250" y="258" width="20" height="4" fill="#151210"/>
  <rect x="255" y="260" width="10" height="12" fill="#151210"/>
  
  <!-- Monitor glow effect -->
  <ellipse cx="260" cy="220" rx="80" ry="60" fill="url(#monitorGlow)" opacity="0.5"/>
  
  <!-- Screen content - faint data lines -->
  <line x1="215" y1="195" x2="280" y2="195" stroke="#2a3a5a" stroke-width="1" opacity="0.4"/>
  <line x1="215" y1="202" x2="300" y2="202" stroke="#2a3a5a" stroke-width="1" opacity="0.3"/>
  <line x1="215" y1="209" x2="270" y2="209" stroke="#2a3a5a" stroke-width="1" opacity="0.35"/>
  <line x1="215" y1="216" x2="290" y2="216" stroke="#2a3a5a" stroke-width="1" opacity="0.25"/>
  <line x1="215" y1="223" x2="260" y2="223" stroke="#2a3a5a" stroke-width="1" opacity="0.3"/>
  <line x1="215" y1="230" x2="285" y2="230" stroke="#2a3a5a" stroke-width="1" opacity="0.2"/>
  <line x1="215" y1="237" x2="245" y2="237" stroke="#2a3a5a" stroke-width="1" opacity="0.25"/>
  
  <!-- Keyboard -->
  <rect x="220" y="262" width="80" height="6" fill="#1a1815" rx="1"/>
  
  <!-- Chair - the centerpiece -->
  <!-- Chair back (tilted slightly) -->
  <path d="M540,200 L560,200 L555,310 L545,310 Z" fill="#1a1815" opacity="0.8"/>
  <!-- Chair seat - depressed (eerie detail: cushion sunk) -->
  <path d="M530,310 Q545,318 560,310 L565,315 Q550,322 535,315 Z" fill="#1e1a15"/>
  <!-- Chair base -->
  <line x1="545" y1="315" x2="545" y2="370" stroke="#1a1815" stroke-width="3"/>
  <line x1="520" y1="370" x2="570" y2="370" stroke="#1a1815" stroke-width="2"/>
  <!-- Chair wheels -->
  <circle cx="520" cy="373" r="3" fill="#151210"/>
  <circle cx="570" cy="373" r="3" fill="#151210"/>
  
  <!-- Hallway light from right side -->
  <rect x="700" y="100" width="100" height="280" fill="#1a1510" opacity="0.08"/>
  <rect x="710" y="110" width="80" height="260" fill="#1a1510" opacity="0.06"/>
  
  <!-- Door frame on right -->
  <rect x="720" y="80" width="6" height="300" fill="#151210" opacity="0.5"/>
  <rect x="720" y="80" width="80" height="6" fill="#151210" opacity="0.5"/>
  
  <!-- Faint emergency light glow near door -->
  <circle cx="760" cy="90" r="20" fill="#2a1010" opacity="0.15" filter="url(#softGlow)"/>
  
  <!-- Hanging ceiling light (faint) -->
  <line x1="300" y1="0" x2="300" y2="30" stroke="#151210" stroke-width="1"/>
  <rect x="285" y="30" width="30" height="4" fill="#1a1815" rx="2"/>
  <ellipse cx="300" cy="35" rx="25" ry="8" fill="#2a2520" opacity="0.15"/>
  
  <!-- Eerie detail: the chair slightly pulled out from desk -->
  <ellipse cx="548" cy="325" rx="40" ry="3" fill="#0a0808" opacity="0.3"/>
  
  <!-- Subtle shadow under desk -->
  <rect x="130" y="360" width="260" height="20" fill="#080606" opacity="0.5"/>
  
  <!-- Floating dust particles (tiny) -->
  <circle cx="400" cy="150" r="0.8" fill="#3a3530" opacity="0.3"/>
  <circle cx="450" cy="200" r="0.5" fill="#3a3530" opacity="0.2"/>
  <circle cx="350" cy="180" r="0.6" fill="#3a3530" opacity="0.25"/>
  <circle cx="500" cy="130" r="0.7" fill="#3a3530" opacity="0.15"/>
  <circle cx="420" cy="250" r="0.5" fill="#3a3530" opacity="0.2"/>
  
  <!-- Very subtle vignette -->
  <rect width="800" height="450" fill="url(#monitorGlow)" opacity="0.3"/>
</svg>