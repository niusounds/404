<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="atm-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="screen-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#1a3a5c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1a2e" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor reflection -->
  <rect x="0" y="350" width="800" height="100" fill="#0c0a0a" opacity="0.5"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#1a1515" stroke-width="0.5" opacity="0.6"/>

  <!-- ATM machine body -->
  <rect x="300" y="80" width="200" height="270" rx="6" fill="url(#atm-glow)" stroke="#1a1a2e" stroke-width="1"/>

  <!-- ATM screen -->
  <rect x="320" y="100" width="160" height="100" rx="3" fill="#0a1520"/>
  <rect x="320" y="100" width="160" height="100" rx="3" fill="url(#screen-glow)"/>

  <!-- ATM screen text lines -->
  <rect x="340" y="120" width="80" height="3" rx="1" fill="#2a5a8a" opacity="0.7"/>
  <rect x="340" y="132" width="120" height="3" rx="1" fill="#2a5a8a" opacity="0.5"/>
  <rect x="340" y="144" width="60" height="3" rx="1" fill="#2a5a8a" opacity="0.6"/>
  <rect x="340" y="156" width="100" height="3" rx="1" fill="#2a5a8a" opacity="0.4"/>

  <!-- Screen glow effect -->
  <rect x="320" y="100" width="160" height="100" rx="3" fill="#1a3a5c" opacity="0.05" filter="url(#blur-lg)"/>

  <!-- Card slot -->
  <rect x="380" y="220" width="40" height="4" rx="1" fill="#1a1a2e"/>
  <circle cx="400" cy="222" r="2" fill="#2a2a3e"/>

  <!-- Cash outlet -->
  <rect x="350" y="280" width="100" height="8" rx="2" fill="#1a1a2e"/>

  <!-- Paper sticking out of cash outlet -->
  <rect x="355" y="260" width="90" height="22" rx="1" fill="#e8e4dc" opacity="0.85"/>
  <line x1="365" y1="267" x2="435" y2="267" stroke="#aaa" stroke-width="0.5" opacity="0.5"/>
  <line x1="365" y1="272" x2="420" y2="272" stroke="#aaa" stroke-width="0.5" opacity="0.4"/>
  <line x1="365" y1="277" x2="410" y2="277" stroke="#aaa" stroke-width="0.5" opacity="0.3"/>

  <!-- ATM keyboard area -->
  <rect x="340" y="300" width="120" height="35" rx="2" fill="#0d0d1a" stroke="#1a1a2e" stroke-width="0.5"/>
  <!-- Keypad buttons -->
  <rect x="350" y="308" width="14" height="8" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="368" y="308" width="14" height="8" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="386" y="308" width="14" height="8" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="350" y="320" width="14" height="8" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="368" y="320" width="14" height="8" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="386" y="320" width="14" height="8" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="350" y="332" width="14" height="8" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="368" y="332" width="14" height="8" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="386" y="332" width="14" height="8" rx="1" fill="#1a1a2e" opacity="0.8"/>

  <!-- ATM side panels -->
  <rect x="298" y="82" width="4" height="266" rx="1" fill="#15152a" opacity="0.6"/>
  <rect x="500" y="82" width="4" height="266" rx="1" fill="#15152a" opacity="0.6"/>

  <!-- ATM top indicator light -->
  <circle cx="400" cy="86" r="3" fill="#2a4a3a" opacity="0.6"/>
  <circle cx="400" cy="86" r="1.5" fill="#3a6a4a" opacity="0.8"/>

  <!-- Glass door reflection on left -->
  <rect x="40" y="60" width="220" height="300" rx="2" fill="#0d0d15" opacity="0.3"/>
  <line x1="40" y1="60" x2="260" y2="360" stroke="#1a1a2e" stroke-width="0.3" opacity="0.2"/>

  <!-- Reflection: figure silhouette in glass -->
  <g opacity="0.15" filter="url(#blur-sm)">
    <!-- Head -->
    <ellipse cx="150" cy="120" rx="18" ry="22" fill="#1a1a2e"/>
    <!-- Body -->
    <path d="M132,140 Q125,200 120,280 L180,280 Q175,200 168,140 Z" fill="#1a1a2e"/>
    <!-- Long hair -->
    <path d="M132,100 Q128,110 125,160 L130,160 Q133,110 138,100 Z" fill="#1a1a2e"/>
    <path d="M168,100 Q172,110 175,160 L170,160 Q167,110 162,100 Z" fill="#1a1a2e"/>
  </g>

  <!-- Glass door reflection on right -->
  <rect x="540" y="60" width="220" height="300" rx="2" fill="#0d0d15" opacity="0.3"/>
  <line x1="540" y1="360" x2="760" y2="60" stroke="#1a1a2e" stroke-width="0.3" opacity="0.2"/>

  <!-- Subtle ATM ambient light on floor -->
  <ellipse cx="400" cy="380" rx="80" ry="15" fill="#1a3a5c" opacity="0.04" filter="url(#blur-lg)"/>

  <!-- Faint date/time stamp -->
  <text x="680" y="420" font-family="monospace" font-size="11" fill="#2a2a3e" opacity="0.4">2026/08/16 03:17:00</text>

  <!-- ATM brand placeholder -->
  <rect x="370" y="155" width="60" height="2" rx="1" fill="#2a4a6a" opacity="0.3"/>
</svg>