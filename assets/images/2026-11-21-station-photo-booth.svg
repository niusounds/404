<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="30%" stop-color="#1a1515"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <radialGradient id="mirrorGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a2520" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirrorSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1a18"/>
      <stop offset="50%" stop-color="#252018"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
  </defs>

  <!-- Background: dark photo booth interior -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor -->
  <rect x="0" y="340" width="800" height="110" fill="#0d0a0a"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#151210" stroke-width="1"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#12100e" stroke-width="0.5"/>
  <line x1="0" y1="395" x2="800" y2="395" stroke="#100e0c" stroke-width="0.5"/>

  <!-- Back wall -->
  <rect x="100" y="30" width="600" height="310" fill="#12100e" rx="2"/>

  <!-- Mirror frame -->
  <rect x="260" y="50" width="280" height="300" fill="#1a1815" stroke="#2a2520" stroke-width="3" rx="2"/>
  <rect x="268" y="58" width="264" height="284" fill="url(#mirrorSurface)"/>

  <!-- Mirror glow -->
  <rect x="268" y="58" width="264" height="284" fill="url(#mirrorGlow)"/>

  <!-- Person in mirror - facing forward (the protagonist) -->
  <ellipse cx="400" cy="200" rx="22" ry="28" fill="#0e0c0c"/>
  <path d="M380,228 Q380,260 375,320 L425,320 Q420,260 420,228 Z" fill="#0e0c0c"/>
  <ellipse cx="395" cy="265" rx="8" ry="5" fill="#121010"/>

  <!-- Shadow figure behind the person in mirror - facing forward (toward viewer) -->
  <ellipse cx="400" cy="165" rx="18" ry="24" fill="#080606"/>
  <path d="M382,189 Q382,215 378,270 L422,270 Q418,215 418,189 Z" fill="#080606"/>

  <!-- Subtle shadow on mirror floor -->
  <ellipse cx="400" cy="335" rx="30" ry="5" fill="#060404" opacity="0.5"/>

  <!-- Left wall -->
  <rect x="0" y="0" width="100" height="450" fill="#0c0a0a"/>
  <line x1="95" y1="0" x2="95" y2="450" stroke="#141210" stroke-width="1"/>

  <!-- Right wall -->
  <rect x="700" y="0" width="100" height="450" fill="#0c0a0a"/>
  <line x1="705" y1="0" x2="705" y2="450" stroke="#141210" stroke-width="1"/>

  <!-- Ceiling light - dim -->
  <ellipse cx="400" cy="15" rx="60" ry="8" fill="#1a1815"/>
  <ellipse cx="400" cy="25" rx="40" ry="3" fill="#2a2520" opacity="0.4"/>

  <!-- Vignette overlay -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.3"/>

  <!-- Subtle noise texture lines -->
  <line x1="200" y1="200" x2="205" y2="200" stroke="#1a1614" stroke-width="0.5" opacity="0.3"/>
  <line x1="580" y1="280" x2="585" y2="280" stroke="#1a1614" stroke-width="0.5" opacity="0.3"/>
  <line x1="350" y1="310" x2="355" y2="310" stroke="#1a1614" stroke-width="0.5" opacity="0.3"/>
</svg>
