<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e8e0d0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8e0d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#d0c8b8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d0c8b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#c0b8a8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c0b8a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor perspective lines -->
  <line x1="100" y1="450" x2="380" y2="200" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="200" y1="450" x2="400" y2="200" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="300" y1="450" x2="420" y2="200" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="400" y1="450" x2="440" y2="200" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="500" y1="450" x2="460" y2="200" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="600" y1="450" x2="480" y2="200" stroke="#1a1515" stroke-width="1.5"/>

  <!-- Ceiling -->
  <rect x="0" y="0" width="800" height="120" fill="#080606"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#1a1515" stroke-width="2"/>

  <!-- Ceiling pipes -->
  <line x1="50" y1="30" x2="750" y2="30" stroke="#121010" stroke-width="3"/>
  <line x1="80" y1="80" x2="720" y2="80" stroke="#121010" stroke-width="2"/>

  <!-- Support columns -->
  <rect x="160" y="120" width="20" height="330" fill="#111010" stroke="#1a1818" stroke-width="0.5"/>
  <rect x="380" y="120" width="20" height="330" fill="#111010" stroke="#1a1818" stroke-width="0.5"/>
  <rect x="600" y="120" width="20" height="330" fill="#111010" stroke="#1a1818" stroke-width="0.5"/>

  <!-- Sensor light 1 - bright (closest) -->
  <circle cx="200" cy="130" r="6" fill="#ffffff" filter="url(#blur1)"/>
  <circle cx="200" cy="130" r="12" fill="url(#glow1)"/>
  <rect x="196" y="126" width="8" height="8" fill="#2a2520" stroke="#3a3530" stroke-width="0.5"/>

  <!-- Sensor light 2 - medium (middle) -->
  <circle cx="400" cy="130" r="5" fill="#ffffff" filter="url(#blur1)"/>
  <circle cx="400" cy="130" r="10" fill="url(#glow2)"/>
  <rect x="396" y="126" width="8" height="8" fill="#2a2520" stroke="#3a3530" stroke-width="0.5"/>

  <!-- Sensor light 3 - dim (far) -->
  <circle cx="560" cy="130" r="4" fill="#ffffff" filter="url(#blur1)"/>
  <circle cx="560" cy="130" r="8" fill="url(#glow3)"/>
  <rect x="556" y="126" width="8" height="8" fill="#2a2520" stroke="#3a3530" stroke-width="0.5"/>

  <!-- Light cone from sensor 1 -->
  <polygon points="196,134 204,134 260,400 140,400" fill="#ffffff" opacity="0.03"/>

  <!-- Light cone from sensor 2 -->
  <polygon points="396,134 404,134 470,400 330,400" fill="#ffffff" opacity="0.02"/>

  <!-- Parked cars in shadows -->
  <rect x="80" y="340" width="100" height="50" rx="8" fill="#0e0c0c" stroke="#1a1818" stroke-width="0.5"/>
  <rect x="85" y="345" width="30" height="20" rx="3" fill="#151313" stroke="#1e1c1c" stroke-width="0.5"/>
  <rect x="155" y="345" width="20" height="15" rx="2" fill="#151313" stroke="#1e1c1c" stroke-width="0.5"/>

  <rect x="620" y="350" width="90" height="45" rx="8" fill="#0e0c0c" stroke="#1a1818" stroke-width="0.5"/>
  <rect x="625" y="355" width="25" height="18" rx="3" fill="#151313" stroke="#1e1c1c" stroke-width="0.5"/>
  <rect x="695" y="355" width="18" height="12" rx="2" fill="#151313" stroke="#1e1c1c" stroke-width="0.5"/>

  <!-- Faint human silhouette standing under light 1 -->
  <ellipse cx="200" cy="370" rx="12" ry="14" fill="#0c0a0a" opacity="0.8"/>
  <rect x="193" y="380" width="14" height="35" rx="5" fill="#0c0a0a" opacity="0.8"/>
  <line x1="197" y1="415" x2="193" y2="440" stroke="#0c0a0a" stroke-width="4" opacity="0.8"/>
  <line x1="203" y1="415" x2="207" y2="440" stroke="#0c0a0a" stroke-width="4" opacity="0.8"/>

  <!-- Darker area where lights haven't reached yet -->
  <rect x="430" y="200" width="170" height="250" fill="#060505" opacity="0.6"/>

  <!-- Direction arrow (subtle) -->
  <text x="500" y="300" font-family="sans-serif" font-size="11" fill="#1a1818" text-anchor="middle" letter-spacing="3">→ 出口 →</text>

</svg>
