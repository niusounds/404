<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="100%" height="auto">
  <defs>
    <filter id="waterDrip">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- wall base -->
  <rect width="560" height="240" fill="#121318"/>
  
  <!-- concrete texture lines -->
  <g opacity="0.15">
    <line x1="0" y1="60" x2="560" y2="65" stroke="#ffffff" stroke-width="0.3"/>
    <line x1="0" y1="120" x2="560" y2="118" stroke="#ffffff" stroke-width="0.3"/>
    <line x1="0" y1="180" x2="560" y2="182" stroke="#ffffff" stroke-width="0.3"/>
  </g>

  <!-- gap in the wall - dark void -->
  <path d="M180,40 L380,35 Q400,120 380,195 L180,190 Z" fill="#0a0c14"/>

  <!-- water seeping from gap - multiple droplet trails -->
  <g filter="url(#waterDrip)" opacity="0.7">
    <circle cx="220" cy="80" r="1.5" fill="#e0f0ff">
      <animate attributeName="cy" values="60;90;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="55" r="2" fill="#d0e8ff">
      <animate attributeName="cy" values="40;75;110" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values("0;0.7;0") dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="70" r="1.8" fill="#c8e0ff">
      <animate attributeName="cy" values="50;90;130" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values("0;0.6;0") dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- seeping moisture streak on surface -->
  <path d="M218,100 Q220,140 225,160 M298,75 Q300,120 295,145 M348,95 Q350,130 355,155" stroke="#60a0c0" 
        stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- label -->
  <text x="280" y="225" font-family="sans-serif" font-size="12" fill="#7090a0" text-anchor="middle">地下六メートルの壁面</text>

  <!-- depth measurement line -->
  <line x1="460" y1="38" x2="500" y2="190" stroke="#4a6070" stroke-width="0.7" marker-start="url(#arrowTop)" marker-end="url(#arrowBot)"/>
</svg>
