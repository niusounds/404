<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Silver gradient for the lock -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8f0"/>
      <stop offset="30%" stop-color="#c4c4d0"/>
      <stop offset="60%" stop-color="#a0a0b0"/>
      <stop offset="100%" stop-color="#7a7a8a"/>
    </linearGradient>
    <!-- Lock body gradient -->
    <radialGradient id="lockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#a0b8d0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <!-- Lock body gradient -->
    <linearGradient id="lockBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c8d4"/>
      <stop offset="50%" stop-color="#a8a8b8"/>
      <stop offset="100%" stop-color="#888898"/>
    </linearGradient>
    <!-- Keyhole glow -->
    <radialGradient id="keyGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffeedd" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffb380" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <!-- Frame pattern -->
    <pattern id="cobblePattern" x="0" y="0" width="40" height="25" patternUnits="userSpaceOnUse">
      <rect width="35" height="18" rx="2" fill="none" stroke="#1a1510" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Main background - dark tunnel -->
  <rect width="800" height="450" fill="#060308"/>
  
  <!-- Subtle radial vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#12101a" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#040204" stop-opacity="1"/>
  </radialGradient>

  <!-- Tunnel perspective walls -->
  <path d="M 0, 90 L 800, 70 850 60 850, 320 800, 330 L 0, 310" fill="#0b0a10"/>
  
  <!-- Wall texture overlay -->
  <rect x="0" y="90" width="200" height="270" fill="url(#cobblePattern)" opacity="0.4"/>
  <rect x="600" y="70" width="250" height="310" fill="url(#cobblePattern)" opacity="0.3"/>
  
  <!-- Damp stone texture - scattered small patches -->
  <ellipse cx="80" cy="200" rx="30" ry="40" fill="#1a1518" opacity="0.6"/>
  <ellipse cx="720" cy="250" rx="35" ry="50" fill="#181518" opacity="0.5"/>
  
  <!-- Dripping water hints -->
  <rect x="95" y="240" width="2" height="8" fill="#3d5a7a" opacity="0.4" rx="1"/>
  <rect x="110" y="260" width="2" height="4" fill="#3d5a7a" opacity="0.3" rx="1"/>
  <ellipse cx="98" cy="250" rx="4" ry="2" fill="#2540a0" opacity="0.3"/>

  <!-- Central tunnel opening -->
  <path d="M 300, 60 Q 400, 110 400, 380 L 500, 380 Q 500, 110 500, 60" 
        fill="#030205" stroke="none"/>
  
  <!-- Lock glow in the center - ethereal silver aura -->
  <ellipse cx="400" cy="195" rx="140" ry="180" fill="url(#lockGlow)"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)"/>

  <!-- The silver lock centerpiece - large, ornate -->
  <g transform="translate(375, 150)">
    <!-- Lock body - rounded box -->
    <rect x="-25" y="-60" width="50" height="80" rx="8" fill="url(#lockBodyGrad)" 
          stroke="#e0e0ee" stroke-width="1.2"/>
    
    <!-- Decorative border on lock body -->
    <rect x="-22" y="-57" width="44" height="74" rx="6" fill="none" 
          stroke="#d8d8e4" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Inner panel with subtle texture -->
    <rect x="-18" y="-52" width="36" height="66" rx="4" fill="#b8b8c4" opacity="0.15"/>

    <!-- Ornamental top - gothic arch -->
    <path d="M 0, -62 C -12,-76 -16,-80 0,-92 C 16,-80 12,-76 0,-62" 
          fill="#a0a0b4" stroke="#d0d0da" stroke-width="0.8"/>
    <circle cx="0" cy="-80" r="3" fill="#e0e0ee"/>

    <!-- Shackle - silver shackle is slightly askew (story element: partially opened) -->
    <!-- Left vertical leg -->
    <path d="M -15,-62 L -25,-95 Q -27,-110 0,-108" 
          fill="#c4c4d0" stroke="#e8e8f0" stroke-width="0.8"/>
    <!-- Right vertical leg (tilted slightly open) -->
    <path d="M 15,-62 L 30,-97 Q 34,-112 12,-108" 
          fill="#b0b0c4" stroke="#e8e8f0" stroke-width="0.8"/>
    
    <!-- Shackle top curve connecting them - visibly displaced -->
    <path d="M -27,-95 C -30,-120 50,-130 28,-95" 
          fill="none" stroke="#c4c4d0" stroke-width="2.5"/>

    <!-- Keyhole: classic rounded keyhole shape -->
    <circle cx="0" cy="-30" r="7" fill="#1a0e0f"/>
    <rect x="-3" y="-30" width="6" height="14" rx="2" fill="#060308"/>
    
    <!-- Keyhole glow from within -->
    <circle cx="0" cy="-29" r="5" fill="url(#keyGlow)"/>

    <!-- Rivet/decoration -->
    <circle cx="0" cy="10" r="4" fill="#e8e8f0" opacity="0.6"/>
  </g>

  <!-- Silver glow effect radiating from the lock -->
  <ellipse cx="400" cy="205" rx="95" ry="65" fill="none" stroke="#d0daf0" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Floor/wet ground - reflection hints -->
  <path d="M 0, 348 Q 800, 348 800, 360 L 800, 450 L 0, 450 Z" fill="#0a0c12"/>
  
  <!-- Reflection of the lock on wet ground -->
  <ellipse cx="400" cy="400" rx="70" ry="30" fill="none" stroke="#9aa4b8" stroke-width="1.5" opacity="0.15" 
           transform="rotate(3, 400, 400)"/>
  
  <!-- Water puddle ripples -->
  <ellipse cx="375" cy="420" rx="20" ry="6" fill="none" stroke="#6a7890" stroke-width="0.4" opacity="0.1"/>
  <ellipse cx="420" cy="430" rx="18" ry="5" fill="none" stroke="#6a7890" stroke-width="0.3" opacity="0.08"/>

  <!-- Text - Japanese and Portuguese warning -->
  <text x="400" y="320" text-anchor="middle" font-family="'Georgia', serif" font-size="14" fill="#a0a0b0">
    Cadeado de Prata — Never Open It
  </text>

  <!-- Top text - ominous -->
  <path d="M 20, 45 Q 45,-20 85 35" fill="none" stroke="#1a0810" stroke-width="8"></path>
  
  <!-- Bottom border with gothic flourish -->
  <rect x="30" y="420" width="740" height="1.5" fill="#3d001a" opacity="0.6"/>

  <!-- Corner decorations - gothic flourishes -->
  <!-- Top-left corner -->
  <path d="M 12,30 L 12,50 M 12,30 Q 40,30 35,45" fill="none" stroke="#7a6a39" stroke-width="1.2"/>
  <!-- Top-right corner -->
  <path d="M 788,30 L 788,50 M 788,30 Q 760,30 765,45" fill="none" stroke="#7a6a39" stroke-width="1.2"/>
  <!-- Bottom-left corner -->
  <path d="M 12,420 L 12,400 M 12,420 Q 40,420 35,405" fill="none" stroke="#7a6a39" stroke-width="1.2"/>
  <!-- Bottom-right corner -->
  <path d="M 788,420 L 788,400 M 788,420 Q 760,420 765,405" fill="none" stroke="#7a6a39" stroke-width="1.2"/>

  
</svg>