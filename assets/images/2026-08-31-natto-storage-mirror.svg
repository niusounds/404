<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="mirrorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1510" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0d0b08" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirrorSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1815" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#252018" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#2a241c" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#1e1a14" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#14110e" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Dust particles in the air -->
  <circle cx="200" cy="120" r="1" fill="#3a3530" opacity="0.15" filter="url(#blur1)"/>
  <circle cx="350" cy="80" r="0.8" fill="#4a4035" opacity="0.12" filter="url(#blur1)"/>
  <circle cx="500" cy="150" r="1.2" fill="#35302a" opacity="0.1" filter="url(#blur1)"/>
  <circle cx="620" cy="90" r="0.6" fill="#4a4035" opacity="0.14" filter="url(#blur1)"/>
  <circle cx="280" cy="200" r="1" fill="#3a3530" opacity="0.08" filter="url(#blur1)"/>
  <circle cx="450" cy="250" r="0.7" fill="#4a4035" opacity="0.1" filter="url(#blur1)"/>
  <circle cx="580" cy="280" r="1.1" fill="#35302a" opacity="0.08" filter="url(#blur1)"/>
  <circle cx="150" cy="300" r="0.9" fill="#4a4035" opacity="0.07" filter="url(#blur1)"/>

  <!-- Wall silhouette behind -->
  <rect x="250" y="30" width="300" height="390" fill="#0e0b08" rx="2"/>

  <!-- Floor shadow -->
  <ellipse cx="400" cy="420" rx="180" ry="15" fill="#080606" opacity="0.8" filter="url(#blur3)"/>

  <!-- Old boxes silhouettes on the left -->
  <rect x="100" y="250" width="80" height="100" fill="#0c0a07" rx="3"/>
  <rect x="105" y="245" width="70" height="8" fill="#0e0b08" rx="1"/>
  <rect x="110" y="235" width="60" height="6" fill="#0e0b08" rx="1"/>
  <rect x="108" y="350" width="64" height="80" fill="#0b0907" rx="2"/>

  <!-- Old furniture silhouette on the right -->
  <rect x="580" y="180" width="100" height="240" fill="#0c0a07" rx="4"/>
  <rect x="590" y="175" width="80" height="10" fill="#0e0b08" rx="2"/>
  <rect x="595" y="260" width="70" height="4" fill="#100d0a" rx="1"/>
  <rect x="595" y="300" width="70" height="4" fill="#100d0a" rx="1"/>

  <!-- The mirror frame -->
  <rect x="320" y="50" width="160" height="340" fill="#1a1510" rx="4"/>
  <rect x="325" y="55" width="150" height="330" fill="#14110e" rx="2"/>

  <!-- Mirror surface -->
  <rect x="330" y="60" width="140" height="320" fill="url(#mirrorSurface)" rx="1"/>

  <!-- Faint reflection in the mirror - a shadowy figure -->
  <ellipse cx="400" cy="200" rx="25" ry="30" fill="#1a1815" opacity="0.3" filter="url(#blur1)"/>
  <rect x="388" y="225" width="24" height="60" fill="#181613" opacity="0.25" filter="url(#blur1)"/>
  <!-- Slightly darker eyes -->
  <circle cx="393" cy="195" r="3" fill="#0e0b08" opacity="0.5"/>
  <circle cx="407" cy="195" r="3" fill="#0e0b08" opacity="0.5"/>

  <!-- Crack in the mirror (subtle) -->
  <line x1="390" y1="60" x2="395" y2="100" stroke="#2a241c" stroke-width="0.5" opacity="0.4"/>
  <line x1="395" y1="100" x2="405" y2="130" stroke="#2a241c" stroke-width="0.3" opacity="0.3"/>
  <line x1="405" y1="130" x2="400" y2="160" stroke="#2a241c" stroke-width="0.2" opacity="0.2"/>

  <!-- Light streak on the mirror surface -->
  <rect x="330" y="60" width="3" height="320" fill="#3a3530" opacity="0.06" filter="url(#blur1)"/>
  <rect x="335" y="60" width="1" height="320" fill="#4a4035" opacity="0.04" filter="url(#blur1)"/>

  <!-- Subtle radial glow around mirror area -->
  <circle cx="400" cy="220" r="120" fill="url(#mirrorGlow)" opacity="0.3"/>

  <!-- Dust on mirror surface -->
  <circle cx="360" cy="100" r="0.5" fill="#2a241c" opacity="0.2"/>
  <circle cx="440" cy="280" r="0.4" fill="#2a241c" opacity="0.15"/>
  <circle cx="370" cy="350" r="0.6" fill="#2a241c" opacity="0.12"/>
  <circle cx="430" cy="150" r="0.3" fill="#2a241c" opacity="0.18"/>
</svg>
