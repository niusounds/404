<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Ground -->
  <rect x="0" y="350" width="800" height="100" fill="#0d0a0a"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Road markings -->
  <line x1="50" y1="380" x2="120" y2="380" stroke="#2a2520" stroke-width="2" stroke-dasharray="20,15"/>
  <line x1="160" y1="380" x2="230" y2="380" stroke="#2a2520" stroke-width="2" stroke-dasharray="20,15"/>
  <line x1="270" y1="380" x2="340" y2="380" stroke="#2a2520" stroke-width="2" stroke-dasharray="20,15"/>
  <line x1="380" y1="380" x2="450" y2="380" stroke="#2a2520" stroke-width="2" stroke-dasharray="20,15"/>
  <line x1="490" y1="380" x2="560" y2="380" stroke="#2a2520" stroke-width="2" stroke-dasharray="20,15"/>
  <line x1="600" y1="380" x2="670" y2="380" stroke="#2a2520" stroke-width="2" stroke-dasharray="20,15"/>
  <line x1="710" y1="380" x2="780" y2="380" stroke="#2a2520" stroke-width="2" stroke-dasharray="20,15"/>
  
  <!-- Bus stop pole -->
  <rect x="185" y="180" width="6" height="170" fill="#1a1818"/>
  <rect x="165" y="175" width="46" height="8" fill="#1a1818" rx="2"/>
  
  <!-- Bus stop sign -->
  <rect x="168" y="140" width="40" height="35" fill="#1c1a1a" stroke="#2a2525" stroke-width="1" rx="3"/>
  <text x="188" y="162" text-anchor="middle" fill="#3a3535" font-size="10" font-family="sans-serif">バス</text>
  
  <!-- Street lamp -->
  <rect x="620" y="120" width="4" height="230" fill="#151313"/>
  <ellipse cx="622" cy="118" rx="18" ry="8" fill="#1a1818"/>
  <ellipse cx="622" cy="118" rx="12" ry="5" fill="#2a2520"/>
  
  <!-- Street lamp glow -->
  <circle cx="622" cy="130" r="40" fill="none" stroke="#1a1510" stroke-width="0.5" opacity="0.5"/>
  <circle cx="622" cy="130" r="60" fill="none" stroke="#1a1510" stroke-width="0.3" opacity="0.3"/>
  <circle cx="622" cy="130" r="80" fill="none" stroke="#1a1510" stroke-width="0.2" opacity="0.2"/>
  
  <!-- Light cone from lamp -->
  <polygon points="622,120 580,350 664,350" fill="#1a1510" opacity="0.08"/>
  
  <!-- Mysterious woman silhouette -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="10" ry="12" fill="#0a0808" stroke="#1a1818" stroke-width="0.5"/>
    <!-- Hat brim -->
    <ellipse cx="0" cy="-10" rx="14" ry="3" fill="#0d0b0b"/>
    <!-- Coat body -->
    <path d="M-12,-5 Q-15,40 -18,100 L18,100 Q15,40 12,-5 Z" fill="#0d0b0b" stroke="#1a1818" stroke-width="0.5"/>
    <!-- Coat collar detail -->
    <path d="M-8,-5 L-5,5 L5,5 L8,-5" fill="none" stroke="#1a1818" stroke-width="0.5"/>
    <!-- Legs -->
    <line x1="-6" y1="100" x2="-8" y2="145" stroke="#0d0b0b" stroke-width="4"/>
    <line x1="6" y1="100" x2="8" y2="145" stroke="#0d0b0b" stroke-width="4"/>
    <!-- Bag -->
    <rect x="14" y="30" width="18" height="22" fill="#0d0b0b" stroke="#1a1818" stroke-width="0.5" rx="2"/>
    <path d="M18,30 Q23,25 28,30" fill="none" stroke="#1a1818" stroke-width="0.5"/>
  </g>
  
  <!-- Woman's faint glow (eerie effect) -->
  <circle cx="200" cy="270" r="35" fill="none" stroke="#1a1820" stroke-width="0.3" opacity="0.4"/>
  <circle cx="200" cy="270" r="50" fill="none" stroke="#1a1820" stroke-width="0.2" opacity="0.2"/>
  
  <!-- Bus in the distance (right side) -->
  <g transform="translate(520, 250)">
    <!-- Bus body -->
    <rect x="0" y="0" width="100" height="70" fill="#0d0b0b" stroke="#1a1818" stroke-width="1" rx="5"/>
    <!-- Bus windows -->
    <rect x="8" y="8" width="16" height="14" fill="#1a1510" opacity="0.6"/>
    <rect x="30" y="8" width="16" height="14" fill="#1a1510" opacity="0.6"/>
    <rect x="52" y="8" width="16" height="14" fill="#1a1510" opacity="0.6"/>
    <rect x="74" y="8" width="16" height="14" fill="#1a1510" opacity="0.6"/>
    <!-- Rear window (larger) -->
    <rect x="8" y="28" width="84" height="20" fill="#0a0808" stroke="#1a1818" stroke-width="0.5"/>
    <!-- Rear window silhouette (woman inside) -->
    <ellipse cx="50" cy="38" rx="6" ry="8" fill="#0d0b0b"/>
    <path d="M44,46 L44,58 L56,58 L56,46" fill="#0d0b0b"/>
    <!-- Bus wheels -->
    <circle cx="20" cy="72" r="8" fill="#0d0b0b" stroke="#1a1818" stroke-width="0.5"/>
    <circle cx="80" cy="72" r="8" fill="#0d0b0b" stroke="#1a1818" stroke-width="0.5"/>
    <!-- Bus headlights (facing left, toward viewer) -->
    <circle cx="2" cy="50" r="4" fill="#2a2520" opacity="0.8"/>
    <circle cx="2" cy="50" r="8" fill="#2a2520" opacity="0.3"/>
    <!-- Headlight beam -->
    <polygon points="2,50 -60,30 -60,70" fill="#2a2520" opacity="0.06"/>
  </g>
  
  <!-- Fog/mist effect -->
  <ellipse cx="300" cy="340" rx="200" ry="15" fill="#0f0d0d" opacity="0.4"/>
  <ellipse cx="500" cy="345" rx="150" ry="10" fill="#0f0d0d" opacity="0.3"/>
  
  <!-- Distant buildings silhouette -->
  <rect x="0" y="280" width="80" height="70" fill="#0d0b0b"/>
  <rect x="15" y="260" width="30" height="90" fill="#0d0b0b"/>
  <rect x="50" y="290" width="25" height="60" fill="#0d0b0b"/>
  
  <rect x="700" y="260" width="100" height="90" fill="#0d0b0b"/>
  <rect x="720" y="240" width="40" height="110" fill="#0d0b0b"/>
  <rect x="760" y="270" width="35" height="80" fill="#0d0b0b"/>
  
  <!-- Tiny windows in buildings -->
  <rect x="22" y="270" width="4" height="4" fill="#1a1510" opacity="0.4"/>
  <rect x="30" y="280" width="4" height="4" fill="#1a1510" opacity="0.3"/>
  <rect x="730" y="250" width="4" height="4" fill="#1a1510" opacity="0.4"/>
  <rect x="740" y="270" width="4" height="4" fill="#1a1510" opacity="0.3"/>
  
  <!-- Vignette effect -->
  <rect width="800" height="450" fill="none"/>
  
  <!-- Subtle text hint -->
  <text x="400" y="430" text-anchor="middle" fill="#1a1515" font-size="11" font-family="sans-serif" letter-spacing="4">終電後のバス</text>
</svg>
