<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/2000/svg">
<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Forest silhouettes on left and right -->
  <polygon points="0,450 20,300 40,150 60,300 80,450" fill="#1a0f0f"/>
  <polygon points="70,450 90,250 110,100 130,450" fill="#150505"/>
  <polygon points="800,450 780,280 760,120 740,280 720,450" fill="#1a0f0f"/>
  
  <!-- Ground -->
  <ellipse cx="400" cy="430" rx="300" ry="50" fill="#0d0505"/>
  
  <!-- Chickens legs (one pair visible) -->
  <rect x="280" y="360" width="8" height="70" fill="#d4af8e"/>
  <ellipse cx="284" cy="420" rx="12" ry="6" fill="#ffaa5a"/>
  <rect x="320" y="350" width="8" height="70" fill="#d4af8e"/>
  <ellipse cx="324" cy="410" rx="12" ry="6" fill="#ffaa5a"/>
  
  <!-- Hut body -->
  <path d="M230,200 L230,370 Q240,380 260,390 Q390,395 520,380 Q540,370 550,360 L550,180 Z" fill="#2a1f0f"/>
  
  <!-- Roof -->
  <path d="M180,180 C200,150 350,80 570,160 L550,180 Q400,120 240,180 Z" fill="#3a2520"/>
  
  <!-- Window (glowing orange) -->
  <rect x="360" y="270" width="12" height="15" rx="2" fill="#ffaa5a" filter="url(#glow)"/>
  <rect x="400" y="290" width="12" height="15" rx="2" fill="#ff8a3a" filter="url(#glow)"/>
  
  <!-- Door -->
  <rect x="370" y="330" width="30" height="40" rx="5" fill="#1a0a05"/>
  
  <!-- Text in Russian style -->
  <text x="620" y="80" font-family="serif" font-size="36" fill="#ff0033" weight="bold">Бaba Яга</text>
  <text x="400" y="15" font-size="10" fill="#ffffff99">Russian Horror</text>

  <!-- Decorative border -->
  <rect x="15" y="15" width="768" height="420" rx="6" fill="none" stroke="#3d001a" stroke-width="1.5"/>
  
</svg></content>