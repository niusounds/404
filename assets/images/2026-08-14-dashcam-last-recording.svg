<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0a0808"/>
  <!-- Road perspective -->
  <polygon points="350,0 450,0 650,300 150,300" fill="#1a1515"/>
  <line x1="400" y1="0" x2="400" y2="300" stroke="#2a2222" stroke-width="1" stroke-dasharray="8,12"/>
  <!-- Street lights -->
  <line x1="200" y1="0" x2="200" y2="180" stroke="#1a1515" stroke-width="3"/>
  <circle cx="200" cy="180" r="12" fill="#1a1208" stroke="#2a2015" stroke-width="0.5"/>
  <circle cx="200" cy="180" r="30" fill="#1a1508" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="180" stroke="#1a1515" stroke-width="3"/>
  <circle cx="600" cy="180" r="12" fill="#1a1208" stroke="#2a2015" stroke-width="0.5"/>
  <circle cx="600" cy="180" r="30" fill="#1a1508" opacity="0.3"/>
  <!-- Ghostly figure on road -->
  <g opacity="0.6">
    <ellipse cx="400" cy="230" rx="8" ry="10" fill="#d8d0c8"/>
    <path d="M392,240 Q390,270 385,300 L415,300 Q410,270 408,240 Z" fill="#d8d0c8"/>
    <line x1="390" y1="250" x2="370" y2="290" stroke="#d8d0c8" stroke-width="3" opacity="0.8"/>
    <line x1="410" y1="250" x2="435" y2="285" stroke="#d8d0c8" stroke-width="3" opacity="0.8"/>
    <line x1="395" y1="298" x2="393" y2="320" stroke="#d8d0c8" stroke-width="3" opacity="0.8"/>
    <line x1="405" y1="298" x2="407" y2="320" stroke="#d8d0c8" stroke-width="3" opacity="0.8"/>
  </g>
  <!-- Dashboard silhouette -->
  <rect x="0" y="340" width="800" height="110" fill="#0d0a0a"/>
  <rect x="0" y="340" width="800" height="5" fill="#1a1515"/>
  <path d="M0,340 Q200,330 400,335 Q600,340 800,330 L800,340 Z" fill="#111010"/>
  <!-- Dashcam with red LED -->
  <rect x="340" y="345" width="120" height="55" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="400" cy="365" r="12" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/>
  <circle cx="400" cy="365" r="5" fill="#1a1a2a"/>
  <circle cx="355" cy="375" r="3" fill="#ff2020"/>
  <circle cx="355" cy="375" r="8" fill="#ff2020" opacity="0.15"/>
  <circle cx="355" cy="375" r="15" fill="#ff2020" opacity="0.05"/>
  <!-- Steering wheel hint -->
  <ellipse cx="400" cy="410" rx="140" ry="50" fill="none" stroke="#1a1515" stroke-width="3"/>
  <!-- Fog/mist -->
  <rect x="0" y="200" width="800" height="150" fill="#0e0a0a" opacity="0.4"/>
  <!-- Vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vignette)"/>
</svg>
