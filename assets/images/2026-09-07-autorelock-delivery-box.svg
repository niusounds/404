<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1515"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <linearGradient id="boxInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1212"/>
      <stop offset="100%" stop-color="#0d0a0a"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Wall texture - subtle vertical lines -->
  <g opacity="0.03">
    <line x1="100" y1="0" x2="100" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="450" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Delivery box recessed in wall -->
  <rect x="280" y="120" width="240" height="200" rx="4" fill="url(#boxInner)" stroke="#1a1414" stroke-width="2"/>
  
  <!-- Inner shadow -->
  <rect x="285" y="125" width="230" height="190" rx="3" fill="none" stroke="#0d0a0a" stroke-width="4" filter="url(#blur1)"/>

  <!-- Delivery slot opening -->
  <rect x="340" y="140" width="120" height="12" rx="2" fill="#080606"/>
  <line x1="340" y1="140" x2="460" y2="140" stroke="#1a1414" stroke-width="1"/>

  <!-- Small black origami crane inside the box -->
  <g transform="translate(400, 240)" filter="url(#blur1)" opacity="0.7">
    <!-- Body -->
    <polygon points="0,-18 -12,5 0,12 12,5" fill="#0a0a0a"/>
    <!-- Head/neck -->
    <polygon points="0,-18 -6,-30 3,-22" fill="#0d0d0d"/>
    <!-- Tail -->
    <polygon points="0,12 8,22 14,16" fill="#0d0d0d"/>
    <!-- Left wing -->
    <polygon points="-12,5 -30,-8 -22,2 -12,5" fill="#0c0c0c"/>
    <!-- Right wing -->
    <polygon points="12,5 30,-8 22,2 12,5" fill="#0c0c0c"/>
    <!-- Eye - tiny red dot -->
    <circle cx="-4" cy="-20" r="1.2" fill="#3a0a0a"/>
  </g>

  <!-- Red glow around the crane (ominous) -->
  <circle cx="400" cy="240" r="35" fill="none" stroke="#2a0505" stroke-width="0.5" opacity="0.4" filter="url(#blur2)"/>
  <circle cx="400" cy="240" r="55" fill="none" stroke="#1a0303" stroke-width="0.3" opacity="0.2" filter="url(#blur2)"/>

  <!-- Subtle light from above (hallway light leaking through slot) -->
  <ellipse cx="400" cy="140" rx="60" ry="3" fill="#2a2018" opacity="0.3" filter="url(#blur2)"/>
  <ellipse cx="400" cy="145" rx="40" ry="8" fill="#2a2018" opacity="0.15" filter="url(#blur2)"/>

  <!-- Paper scraps around the crane -->
  <g opacity="0.5">
    <rect x="370" y="260" width="15" height="8" rx="1" fill="#1a1515" transform="rotate(-15, 377, 264)"/>
    <rect x="420" y="255" width="10" height="6" rx="1" fill="#181212" transform="rotate(10, 425, 258)"/>
  </g>

  <!-- Bottom of box shadow -->
  <rect x="280" y="300" width="240" height="20" fill="#060404"/>

  <!-- Floor reflection -->
  <rect x="250" y="330" width="300" height="2" fill="#0d0a0a" opacity="0.5"/>
  <ellipse cx="400" cy="340" rx="120" ry="3" fill="#0d0a0a" opacity="0.3" filter="url(#blur2)"/>

  <!-- Vignette edges -->
  <rect x="0" y="0" width="800" height="450" fill="url(#glow)" opacity="0.5"/>

  <!-- Tiny text hint - barely visible -->
  <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1a1414" opacity="0.6">もうすぐ入ります</text>
</svg>
