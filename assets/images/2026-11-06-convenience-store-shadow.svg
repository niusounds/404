<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0b0b"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="shelf-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1510" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2a2015" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1510" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Store interior perspective - back wall -->
  <rect x="200" y="80" width="400" height="290" fill="#0d0a0a" opacity="0.9"/>

  <!-- Shelving unit on the back wall -->
  <rect x="220" y="100" width="360" height="250" fill="none" stroke="#1a1510" stroke-width="1"/>
  <line x1="220" y1="160" x2="580" y2="160" stroke="#151210" stroke-width="0.5"/>
  <line x1="220" y1="220" x2="580" y2="220" stroke="#151210" stroke-width="0.5"/>
  <line x1="220" y1="280" x2="580" y2="280" stroke="#151210" stroke-width="0.5"/>

  <!-- Products on shelves - subtle colored rectangles -->
  <rect x="240" y="120" width="15" height="30" fill="#1a2015" opacity="0.6"/>
  <rect x="260" y="115" width="12" height="35" fill="#1a1a20" opacity="0.5"/>
  <rect x="280" y="125" width="18" height="25" fill="#1a1a15" opacity="0.5"/>
  <rect x="305" y="118" width="14" height="32" fill="#151a15" opacity="0.4"/>
  <rect x="325" y="122" width="16" height="28" fill="#1a1515" opacity="0.5"/>
  <rect x="345" y="116" width="13" height="34" fill="#1a1a10" opacity="0.4"/>
  <rect x="362" y="120" width="15" height="30" fill="#15151a" opacity="0.5"/>

  <rect x="400" y="118" width="14" height="32" fill="#1a1a15" opacity="0.4"/>
  <rect x="420" y="112" width="16" height="38" fill="#151a15" opacity="0.5"/>
  <rect x="440" y="120" width="12" height="30" fill="#1a1515" opacity="0.4"/>
  <rect x="456" y="115" width="18" height="35" fill="#1a1a10" opacity="0.5"/>

  <rect x="490" y="125" width="15" height="25" fill="#151510" opacity="0.4"/>
  <rect x="510" y="118" width="14" height="32" fill="#1a1a15" opacity="0.5"/>
  <rect x="530" y="122" width="16" height="28" fill="#1a1515" opacity="0.4"/>
  <rect x="552" y="120" width="12" height="30" fill="#151a10" opacity="0.5"/>

  <!-- Second shelf items -->
  <rect x="250" y="180" width="20" height="30" fill="#1a1a10" opacity="0.5"/>
  <rect x="275" y="175" width="15" height="35" fill="#15151a" opacity="0.4"/>
  <rect x="295" y="182" width="18" height="28" fill="#1a1515" opacity="0.5"/>
  <rect x="320" y="178" width="14" height="32" fill="#1a1a15" opacity="0.4"/>

  <rect x="420" y="176" width="16" height="34" fill="#151a10" opacity="0.5"/>
  <rect x="445" y="180" width="14" height="30" fill="#1a1515" opacity="0.4"/>
  <rect x="465" y="174" width="18" height="36" fill="#1a1a10" opacity="0.5"/>

  <rect x="510" y="185" width="15" height="25" fill="#151510" opacity="0.4"/>
  <rect x="535" y="178" width="16" height="32" fill="#1a1a15" opacity="0.5"/>

  <!-- Third shelf items -->
  <rect x="260" y="240" width="22" height="30" fill="#1a1515" opacity="0.5"/>
  <rect x="288" y="235" width="16" height="35" fill="#15151a" opacity="0.4"/>
  <rect x="310" y="242" width="14" height="28" fill="#1a1a10" opacity="0.5"/>

  <rect x="450" y="238" width="18" height="32" fill="#151a10" opacity="0.4"/>
  <rect x="475" y="234" width="15" height="36" fill="#1a1515" opacity="0.5"/>
  <rect x="495" y="240" width="20" height="30" fill="#1a1a15" opacity="0.4"/>
  <rect x="520" y="236" width="14" height="34" fill="#151510" opacity="0.5"/>

  <!-- Warm food case on the right -->
  <rect x="600" y="160" width="140" height="170" fill="#151008" opacity="0.7"/>
  <rect x="605" y="165" width="130" height="160" fill="#1a1508" opacity="0.5"/>
  <!-- Warm food glow -->
  <rect x="610" y="170" width="120" height="150" fill="#2a1a08" opacity="0.15" filter="url(#blur-lg)"/>

  <!-- Counter / register -->
  <rect x="100" y="310" width="500" height="140" fill="#1a1510"/>
  <rect x="100" y="310" width="500" height="8" fill="#2a2015"/>

  <!-- Register screen glow -->
  <rect x="300" y="320" width="80" height="50" fill="#0a1a0a" opacity="0.8"/>
  <rect x="305" y="325" width="70" height="40" fill="#0a200a" opacity="0.3" filter="url(#blur-sm)"/>
  <!-- Green screen light spill on counter -->
  <ellipse cx="340" cy="340" rx="50" ry="20" fill="#0a200a" opacity="0.15" filter="url(#blur-lg)"/>

  <!-- Receipt -->
  <rect x="390" y="320" width="35" height="80" fill="#e8e0d0" opacity="0.9"/>
  <line x1="395" y1="330" x2="420" y2="330" stroke="#888" stroke-width="0.5" opacity="0.5"/>
  <line x1="395" y1="338" x2="418" y2="338" stroke="#888" stroke-width="0.5" opacity="0.5"/>
  <line x1="395" y1="346" x2="422" y2="346" stroke="#888" stroke-width="0.5" opacity="0.5"/>
  <line x1="395" y1="354" x2="415" y2="354" stroke="#888" stroke-width="0.5" opacity="0.5"/>
  <line x1="395" y1="362" x2="419" y2="362" stroke="#888" stroke-width="0.5" opacity="0.5"/>
  <line x1="395" y1="370" x2="420" y2="370" stroke="#888" stroke-width="0.5" opacity="0.5"/>
  <line x1="395" y1="378" x2="417" y2="378" stroke="#888" stroke-width="0.5" opacity="0.5"/>

  <!-- Three shadowy figures standing in front of counter -->
  <!-- Figure 1 (left) -->
  <g opacity="0.7">
    <ellipse cx="200" cy="290" rx="22" ry="28" fill="#0a0808"/>
    <rect x="178" y="310" width="44" height="100" rx="5" fill="#0a0808"/>
    <!-- Coat collar hint -->
    <path d="M185 310 L200 300 L215 310" fill="none" stroke="#151010" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Figure 2 (center) -->
  <g opacity="0.65">
    <ellipse cx="340" cy="285" rx="24" ry="30" fill="#0a0808"/>
    <rect x="316" y="310" width="48" height="105" rx="5" fill="#0a0808"/>
    <path d="M323 310 L340 298 L357 310" fill="none" stroke="#151010" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Figure 3 (right) - the one with no items, most prominent -->
  <g opacity="0.55">
    <ellipse cx="480" cy="280" rx="26" ry="32" fill="#0a0808"/>
    <rect x="454" y="310" width="52" height="110" rx="5" fill="#0a0808"/>
    <path d="M461 310 L480 296 L499 310" fill="none" stroke="#151010" stroke-width="1" opacity="0.5"/>
    <!-- Eyes - the unsettling clear eyes -->
    <ellipse cx="473" cy="275" rx="3" ry="2" fill="#2a2520" opacity="0.8"/>
    <ellipse cx="487" cy="275" rx="3" ry="2" fill="#2a2520" opacity="0.8"/>
    <!-- Pupil reflection -->
    <circle cx="474" cy="274" r="0.8" fill="#4a4030" opacity="0.6"/>
    <circle cx="488" cy="274" r="0.8" fill="#4a4030" opacity="0.6"/>
  </g>

  <!-- Fluorescent light overhead -->
  <rect x="250" y="75" width="300" height="4" fill="#2a2520" opacity="0.6"/>
  <ellipse cx="400" cy="80" rx="120" ry="20" fill="#3a3020" opacity="0.08" filter="url(#blur-lg)"/>

  <!-- Floor reflection / darkness -->
  <rect x="0" y="420" width="800" height="30" fill="#060505"/>

  <!-- Subtle noise texture overlay hint -->
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="none"/>

  <!-- Vignette effect -->
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="none"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="50%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)"/>
</svg>
