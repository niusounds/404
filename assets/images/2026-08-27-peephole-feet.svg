<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="corridor" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1515"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a1a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Corridor perspective -->
  <path d="M0,0 L800,0 L800,450 L0,450 Z" fill="url(#corridor)" opacity="0.3"/>
  
  <!-- Floor -->
  <rect x="0" y="300" width="800" height="150" fill="#0d0a0a"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1a1212" stroke-width="1"/>
  
  <!-- Corridor walls - perspective lines -->
  <line x1="0" y1="0" x2="350" y2="80" stroke="#151010" stroke-width="0.5"/>
  <line x1="800" y1="0" x2="450" y2="80" stroke="#151010" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="350" y2="300" stroke="#151010" stroke-width="0.5"/>
  <line x1="800" y1="450" x2="450" y2="300" stroke="#151010" stroke-width="0.5"/>
  
  <!-- Door frame -->
  <rect x="280" y="60" width="240" height="340" fill="#1a1414" stroke="#251e1e" stroke-width="2"/>
  <rect x="290" y="70" width="220" height="320" fill="#120e0e"/>
  
  <!-- Door surface -->
  <rect x="295" y="75" width="210" height="310" fill="#181212"/>
  
  <!-- Peephole -->
  <circle cx="400" cy="200" r="35" fill="#0a0808"/>
  <circle cx="400" cy="200" r="35" fill="none" stroke="#2a2020" stroke-width="3"/>
  <circle cx="400" cy="200" r="30" fill="#0d0a0a"/>
  
  <!-- Eye glow behind peephole -->
  <circle cx="400" cy="200" r="25" fill="url(#eyeGlow)"/>
  
  <!-- The eye - iris -->
  <circle cx="400" cy="200" r="18" fill="#1a0f0f"/>
  <circle cx="400" cy="200" r="15" fill="#2a1515"/>
  
  <!-- Pupil -->
  <circle cx="400" cy="200" r="8" fill="#0a0808"/>
  
  <!-- Eye reflection/glint -->
  <circle cx="405" cy="195" r="3" fill="#3a2020" opacity="0.6"/>
  
  <!-- Eye rays - subtle -->
  <ellipse cx="400" cy="200" rx="22" ry="18" fill="none" stroke="#3a1a1a" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Feet at bottom of peephole view -->
  <!-- Left foot -->
  <path d="M370,260 Q375,240 385,235 Q390,233 388,245 Q386,255 380,260 Z" fill="#1a1515" opacity="0.7"/>
  <!-- Right foot -->
  <path d="M420,260 Q425,240 415,235 Q410,233 412,245 Q414,255 420,260 Z" fill="#1a1515" opacity="0.7"/>
  
  <!-- Feet on floor in corridor -->
  <!-- Bare feet standing on the floor -->
  <ellipse cx="385" cy="310" rx="12" ry="5" fill="#1a1515" opacity="0.5"/>
  <ellipse cx="415" cy="310" rx="12" ry="5" fill="#1a1515" opacity="0.5"/>
  
  <!-- Legs going up into darkness -->
  <path d="M380,310 Q378,280 382,250" stroke="#1a1515" stroke-width="8" fill="none" opacity="0.3"/>
  <path d="M420,310 Q422,280 418,250" stroke="#1a1515" stroke-width="8" fill="none" opacity="0.3"/>
  
  <!-- Legs fade into darkness above peephole -->
  <path d="M382,250 Q380,220 390,180" stroke="#1a1515" stroke-width="6" fill="none" opacity="0.15"/>
  <path d="M418,250 Q420,220 410,180" stroke="#1a1515" stroke-width="6" fill="none" opacity="0.15"/>
  
  <!-- Corridor light - dim overhead -->
  <ellipse cx="400" cy="80" rx="40" ry="8" fill="#2a2218" opacity="0.4"/>
  <ellipse cx="400" cy="80" rx="25" ry="5" fill="#3a3020" opacity="0.3"/>
  
  <!-- Light cone from ceiling -->
  <polygon points="380,80 420,80 460,300 340,300" fill="#2a2218" opacity="0.03"/>
  
  <!-- Shadows and atmosphere -->
  <rect x="0" y="0" width="800" height="450" fill="#0a0808" opacity="0.1" filter="url(#blur4)"/>
  
  <!-- Subtle vignette -->
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="#0a0808" stroke-width="40" opacity="0.5"/>
  
  <!-- Peephole lens reflection -->
  <circle cx="395" cy="195" r="5" fill="#2a1a1a" opacity="0.3"/>
  
  <!-- Door handle -->
  <rect x="480" y="230" width="15" height="40" rx="3" fill="#2a2222" stroke="#3a3030" stroke-width="1"/>
  
  <!-- Small details - door texture -->
  <line x1="310" y1="100" x2="310" y2="360" stroke="#1e1818" stroke-width="0.3" opacity="0.5"/>
  <line x1="330" y1="100" x2="330" y2="360" stroke="#1e1818" stroke-width="0.3" opacity="0.3"/>
  <line x1="470" y1="100" x2="470" y2="360" stroke="#1e1818" stroke-width="0.3" opacity="0.3"/>
  <line x1="490" y1="100" x2="490" y2="360" stroke="#1e1818" stroke-width="0.3" opacity="0.5"/>
  
  <!-- Floor reflection under door -->
  <rect x="300" y="405" width="200" height="3" fill="#1a1212" opacity="0.3" filter="url(#blur1)"/>
  
  <!-- Tiny detail: the eye seems to be pressing against the lens -->
  <circle cx="400" cy="200" r="12" fill="none" stroke="#4a2a2a" stroke-width="0.5" opacity="0.3"/>
</svg>
