<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" height="auto">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a080b"/>
      <stop offset="100%" stop-color="#0f0d15"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="40" fill="url(#sky)"/>
  
  <!-- stars -->
  <circle cx="87" cy="17" r="1.2" fill="#ffeedd" opacity="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s"/></circle>
  <circle cx="423" cy="28" r="0.9" fill="#ffeedd" opacity="0.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s" begin="2s"/></circle>
  <circle cx="310" cy="8" r="1.1" fill="#ffeedd" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" begin="1s"/></circle>
  
  <!-- water -->
  <rect y="130" width="600" height="50" fill="#0a0d14"/>
  
  <!-- waves with subtle animation -->
  <path d="M0,140 Q75,132 150,140 T300,140 T450,140 T600,140" fill="none" stroke="#1a2840" stroke-width="2.5"><animate attributeName="d" values="M0,140 Q75,132 150,140 T300,140 T450,140 T600,140;M0,140 Q75,148 150,140 T300,140 T450,140 T600,140;M0,140 Q75,132 150,140 T300,140 T450,140 T600,140" dur="9s" repeatCount="indefinite"/></path>
  <path d="M0,155 Q75,147 150,155 T300,155 T450,155 T600,155" fill="none" stroke="#2a1818" stroke-width="3.5"><animate attributeName="d" values="M0,155 Q75,147 150,155 T300,155 T450,155 T600,155;M0,155 Q75,163 150,155 T300,155 T450,155 T600,155;M0,155 Q75,147 150,155 T300,155 T450,155 T600,155" dur="12s" repeatCount="indefinite"/></path>
  
  <!-- station structure -->
  <rect x="250" y="70" width="80" height="55" fill="#1a1626" rx="2"/>
  <line x1="290" y1="70" x2="310" y2="48" stroke="#c83030" stroke-width="1.5"/>
  
  <!-- blinking light -->
  <circle cx="290" cy="46" r="3" fill="#ff2a2a"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></circle>
  <rect x="365" y="78" width="8" height="47" fill="#1e1c28"/>
  
  <!-- small tower -->
  <path d="M369,30 L369,78 M365,78 L373,78" stroke="#1e1c28" stroke-width="4" fill="none"/>
  
  <!-- tide markers (water line crossed) -->
  <rect x="220" y="118" width="28" height="8" fill="#2a2536" rx="1"/>
  <text x="224" y="125.5" font-family="monospace" font-size="7" fill="#c83030">---</text>
  
  <!-- tide line label -->
  <line x1="220" y1="116" x2="430" y2="116" stroke="#ffeedd" stroke-width="0.7" stroke-dasharray="6,8" opacity="0.4"/>
  <text x="350" y="114" font-family="monospace" font-size="8" fill="#ffeedd" opacity="0.4">満潮線(2031)</text>
  
  <!-- anomalous lower line -->
  <line x1="220" y1="157" x2="430" y2="157" stroke="#c83030" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" repeatCount="indefinite"/>
  </line>
  <text x="355" y="152" font-family="monospace" font-size="7" fill="#c83030">??? 12:07(不明日)</text>
</svg>
