<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="roomLight" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background - dark room -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle wall texture lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#151210" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#151210" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#151210" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#151210" stroke-width="0.5" opacity="0.3"/>

  <!-- The wall - prominent in the center -->
  <rect x="300" y="30" width="200" height="390" fill="#1a1612" stroke="#2a2218" stroke-width="1"/>
  <!-- Wall crack -->
  <polyline points="380,30 385,80 382,130 388,180 384,230 390,280 386,330 389,380 387,420" stroke="#25201a" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Floor -->
  <rect x="0" y="420" width="800" height="30" fill="#0d0b0a"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#1a1612" stroke-width="1"/>

  <!-- Person silhouette - leaning toward the wall -->
  <!-- Head -->
  <ellipse cx="250" cy="180" rx="28" ry="32" fill="#0e0c0b"/>
  <!-- Body -->
  <path d="M230,210 Q225,260 220,320 L260,320 Q255,260 250,210 Z" fill="#0e0c0b"/>
  <!-- Legs -->
  <path d="M225,320 L220,420 L235,420 L240,340 L255,340 L260,420 L275,420 L270,320 Z" fill="#0e0c0b"/>
  <!-- Arms reaching toward wall -->
  <path d="M245,230 Q280,225 310,218 L315,222 Q285,230 250,240 Z" fill="#0e0c0b"/>
  <path d="M248,235 Q285,235 315,228 L318,232 Q288,240 252,245 Z" fill="#0e0c0b"/>

  <!-- Moonlight from window (left side) -->
  <rect x="30" y="60" width="80" height="120" fill="#1a1820" stroke="#2a2530" stroke-width="1" opacity="0.5"/>
  <rect x="35" y="65" width="30" height="50" fill="#1e1a25" opacity="0.3"/>
  <rect x="35" y="120" width="30" height="50" fill="#1e1a25" opacity="0.3"/>
  <rect x="75" y="65" width="30" height="50" fill="#1e1a25" opacity="0.3"/>
  <rect x="75" y="120" width="30" height="50" fill="#1e1a25" opacity="0.3"/>

  <!-- Moonlight beam on floor -->
  <polygon points="30,180 110,180 180,420 60,420" fill="#15121a" opacity="0.15"/>

  <!-- Footprint marks appearing on the wall -->
  <g filter="url(#glow)" opacity="0.15">
    <ellipse cx="420" cy="380" rx="8" ry="12" fill="#2a2520"/>
    <ellipse cx="445" cy="350" rx="8" ry="12" fill="#2a2520"/>
    <ellipse cx="470" cy="320" rx="8" ry="12" fill="#2a2520"/>
    <ellipse cx="495" cy="290" rx="8" ry="12" fill="#2a2520"/>
    <ellipse cx="520" cy="260" rx="8" ry="12" fill="#2a2520"/>
    <ellipse cx="545" cy="230" rx="8" ry="12" fill="#2a2520"/>
  </g>

  <!-- Subtle ambient glow from the wall area -->
  <circle cx="400" cy="250" r="120" fill="#1a1510" opacity="0.08"/>

  <!-- Dust particles -->
  <circle cx="150" cy="200" r="1" fill="#3a3530" opacity="0.2"/>
  <circle cx="180" cy="250" r="0.8" fill="#3a3530" opacity="0.15"/>
  <circle cx="200" cy="180" r="1.2" fill="#3a3530" opacity="0.1"/>
  <circle cx="120" cy="300" r="0.7" fill="#3a3530" opacity="0.18"/>
  <circle cx="600" cy="200" r="1" fill="#3a3530" opacity="0.12"/>
  <circle cx="650" cy="280" r="0.8" fill="#3a3530" opacity="0.15"/>
</svg>
