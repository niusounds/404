<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#040305"/>
    </linearGradient>
  </defs>

  <rect width="600" height="420" fill="url(#bg)"/>

  <!-- staircase steps recede -->
  <g stroke="#2a2121" stroke-width="1" fill="none">
    <ellipse cx="300" cy="85" rx="90" ry="8"/>
    <line x1="210" y1="85" x2="275" y2="140"/>
    <line x1="390" y1="85" x2="325" y2="140"/>

    <ellipse cx="300" cy="160" rx="70" ry="6"/>
    <line x1="230" y1="160" x2="280" y2="210"/>
    <line x1="370" y1="160" x2="320" y2="210"/>

    <ellipse cx="300" cy="240" rx="50" ry="5"/>
    <line x1="250" y1="240" x2="290" y2="285"/>
    <line x1="350" y1="240" x2="310" y2="285"/>

    <!-- final dark void -->
    <ellipse cx="300" cy="330" rx="30" ry="4">
      <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- tiny hand silhouetted at bottom, reaching up -->
  <path d="M297 385 l-6 -20 l4 -5 l2 10 l2 -12 l4 5" fill="#3a2d2d">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- faint number label, almost hidden in dark -->
  <text x="495" y="72" font-family="monospace" font-size="18" fill="#1f1610" stroke="none">15F</text>
</svg>
