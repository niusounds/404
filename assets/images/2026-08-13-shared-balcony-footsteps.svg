<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Moon -->
  <circle cx="650" cy="80" r="35" fill="#1a1510" opacity="0.6"/>
  <circle cx="660" cy="75" r="30" fill="#0a0808"/>
  
  <!-- Night sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a0a"/>
      <stop offset="100%" stop-color="#1a0f0f"/>
    </linearGradient>
    <linearGradient id="balconyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1210"/>
      <stop offset="100%" stop-color="#0f0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Distant city lights (tiny dots) -->
  <circle cx="120" cy="280" r="1.5" fill="#2a1a0a" opacity="0.4"/>
  <circle cx="180" cy="260" r="1" fill="#2a1a0a" opacity="0.3"/>
  <circle cx="700" cy="250" r="1.5" fill="#2a1a0a" opacity="0.35"/>
  <circle cx="750" cy="270" r="1" fill="#2a1a0a" opacity="0.3"/>
  
  <!-- Building silhouette - left (our apartment) -->
  <rect x="50" y="100" width="300" height="350" fill="#0f0a0a" stroke="none"/>
  
  <!-- Windows on left building -->
  <rect x="100" y="150" width="50" height="60" fill="#1a1208" rx="1"/>
  <rect x="200" y="150" width="50" height="60" fill="#1a1208" rx="1"/>
  <rect x="100" y="250" width="50" height="60" fill="#1a1208" rx="1"/>
  <rect x="200" y="250" width="50" height="60" fill="#1a1208" rx="1"/>
  <rect x="100" y="350" width="50" height="60" fill="#1a1208" rx="1"/>
  <rect x="200" y="350" width="50" height="60" fill="#1a1208" rx="1"/>
  
  <!-- Lit window (our room) - warm dim light -->
  <rect x="100" y="150" width="50" height="60" fill="#2a1a08" rx="1"/>
  <rect x="102" y="152" width="46" height="56" fill="#3a2510" rx="1"/>
  
  <!-- Building silhouette - right (empty apartment) -->
  <rect x="350" y="80" width="400" height="370" fill="#0d0909" stroke="none"/>
  
  <!-- Windows on right building -->
  <rect x="400" y="130" width="55" height="65" fill="#080606" rx="1"/>
  <rect x="500" y="130" width="55" height="65" fill="#080606" rx="1"/>
  <rect x="600" y="130" width="55" height="65" fill="#080606" rx="1"/>
  <rect x="400" y="230" width="55" height="65" fill="#080606" rx="1"/>
  <rect x="500" y="230" width="55" height="65" fill="#080606" rx="1"/>
  <rect x="600" y="230" width="55" height="65" fill="#080606" rx="1"/>
  <rect x="400" y="330" width="55" height="65" fill="#080606" rx="1"/>
  <rect x="500" y="330" width="55" height="65" fill="#080606" rx="1"/>
  <rect x="600" y="330" width="55" height="65" fill="#080606" rx="1"/>
  
  <!-- Shared balcony floor -->
  <rect x="340" y="340" width="120" height="8" fill="#151010"/>
  
  <!-- Balcony railing (low fence) -->
  <rect x="340" y="290" width="120" height="3" fill="#1a1515"/>
  <rect x="340" y="290" width="2" height="55" fill="#1a1515"/>
  <rect x="370" y="290" width="2" height="55" fill="#1a1515"/>
  <rect x="400" y="290" width="2" height="55" fill="#1a1515"/>
  <rect x="430" y="290" width="2" height="55" fill="#1a1515"/>
  <rect x="460" y="290" width="2" height="55" fill="#1a1515"/>
  <rect x="490" y="290" width="2" height="55" fill="#1a1515"/>
  <rect x="498" y="290" width="2" height="55" fill="#1a1515"/>
  
  <!-- Glass door of empty apartment - slightly translucent -->
  <rect x="380" y="180" width="40" height="160" fill="#0e0a0a" opacity="0.7" rx="1"/>
  <rect x="382" y="182" width="36" height="156" fill="#0c0808" opacity="0.5" rx="1"/>
  
  <!-- Water drops on balcony floor -->
  <ellipse cx="360" cy="340" rx="3" ry="1.5" fill="#1a1520" opacity="0.8"/>
  <ellipse cx="372" cy="340" rx="3" ry="1.5" fill="#1a1520" opacity="0.8"/>
  <ellipse cx="384" cy="340" rx="3" ry="1.5" fill="#1a1520" opacity="0.8"/>
  <ellipse cx="396" cy="340" rx="3" ry="1.5" fill="#1a1520" opacity="0.8"/>
  <ellipse cx="408" cy="340" rx="3" ry="1.5" fill="#1a1520" opacity="0.8"/>
  <ellipse cx="420" cy="340" rx="3" ry="1.5" fill="#1a1520" opacity="0.8"/>
  
  <!-- Water drops facing inward (toward empty apartment) - subtle arrow-like -->
  <path d="M360,338 L360,342 M358,339 L362,341" stroke="#1a1520" stroke-width="0.5" opacity="0.5"/>
  <path d="M372,338 L372,342 M370,339 L374,341" stroke="#1a1520" stroke-width="0.5" opacity="0.5"/>
  <path d="M384,338 L384,342 M382,339 L386,341" stroke="#1a1520" stroke-width="0.5" opacity="0.5"/>
  <path d="M396,338 L396,342 M394,339 L398,341" stroke="#1a1520" stroke-width="0.5" opacity="0.5"/>
  <path d="M408,338 L408,342 M406,339 L410,341" stroke="#1a1520" stroke-width="0.5" opacity="0.5"/>
  <path d="M420,338 L420,342 M418,339 L422,341" stroke="#1a1520" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Shadowy figure silhouette inside the empty apartment window -->
  <g opacity="0.15" filter="url(#glow)">
    <!-- Head -->
    <ellipse cx="400" cy="220" rx="8" ry="10" fill="#000"/>
    <!-- Body -->
    <path d="M392,230 L390,270 L398,270 L400,250 L402,270 L410,270 L408,230 Z" fill="#000"/>
  </g>
  
  <!-- Fog/mist at ground level -->
  <ellipse cx="200" cy="430" rx="250" ry="20" fill="#0e0a0a" opacity="0.4"/>
  <ellipse cx="600" cy="430" rx="200" ry="15" fill="#0e0a0a" opacity="0.3"/>
  
  <!-- Subtle text overlay - title -->
  <text x="400" y="425" font-family="sans-serif" font-size="11" fill="#2a1a1a" text-anchor="middle" letter-spacing="3">共有ベランダの足音</text>
</svg>