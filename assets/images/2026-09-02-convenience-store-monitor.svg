<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle ambient glow from monitor -->
  <ellipse cx="400" cy="225" rx="280" ry="180" fill="#0d0a18" filter="url(#blur)" opacity="0.6"/>

  <!-- Monitor frame -->
  <rect x="180" y="50" width="440" height="310" rx="8" ry="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="185" y="55" width="430" height="300" rx="6" ry="6" fill="#0e0c14"/>

  <!-- Monitor screen glow -->
  <rect x="185" y="55" width="430" height="300" rx="6" ry="6" fill="#12101e" opacity="0.8"/>

  <!-- Four quadrant CCTV split -->
  <!-- Top-left -->
  <rect x="185" y="55" width="215" height="150" fill="#0c0a16" stroke="#1e1a28" stroke-width="1"/>
  <!-- Top-right -->
  <rect x="400" y="55" width="215" height="150" fill="#0c0a16" stroke="#1e1a28" stroke-width="1"/>
  <!-- Bottom-left -->
  <rect x="185" y="205" width="215" height="150" fill="#0c0a16" stroke="#1e1a28" stroke-width="1"/>
  <!-- Bottom-right -->
  <rect x="400" y="205" width="215" height="150" fill="#0c0a16" stroke="#1e1a28" stroke-width="1"/>

  <!-- Top-left: empty aisle scene - shelves silhouette -->
  <rect x="210" y="100" width="8" height="80" fill="#1a1828" rx="1"/>
  <rect x="225" y="95" width="8" height="85" fill="#1a1828" rx="1"/>
  <rect x="240" y="105" width="8" height="75" fill="#1a1828" rx="1"/>
  <rect x="255" y="98" width="8" height="82" fill="#1a1828" rx="1"/>
  <!-- shelf items -->
  <rect x="212" y="110" width="6" height="12" fill="#1e1c30"/>
  <rect x="227" y="105" width="6" height="15" fill="#1e1c30"/>
  <rect x="242" y="115" width="6" height="10" fill="#1e1c30"/>
  <rect x="257" y="108" width="6" height="14" fill="#1e1c30"/>
  <!-- timestamp -->
  <text x="195" y="72" fill="#2a2840" font-family="monospace" font-size="9">CAM 1 - 03:04:17</text>

  <!-- Top-right: beverage section - bottles silhouette -->
  <rect x="430" y="140" width="6" height="50" fill="#1a1828" rx="1"/>
  <rect x="442" y="135" width="6" height="55" fill="#1a1828" rx="1"/>
  <rect x="454" y="145" width="6" height="45" fill="#1a1828" rx="1"/>
  <rect x="466" y="138" width="6" height="52" fill="#1a1828" rx="1"/>
  <rect x="478" y="142" width="6" height="48" fill="#1a1828" rx="1"/>
  <!-- bottle shapes -->
  <ellipse cx="433" cy="138" rx="3" ry="8" fill="#1e1c30"/>
  <ellipse cx="445" cy="133" rx="3" ry="8" fill="#1e1c30"/>
  <ellipse cx="457" cy="143" rx="3" ry="8" fill="#1e1c30"/>
  <ellipse cx="469" cy="136" rx="3" ry="8" fill="#1e1c30"/>
  <ellipse cx="481" cy="140" rx="3" ry="8" fill="#1e1c30"/>
  <text x="410" y="72" fill="#2a2840" font-family="monospace" font-size="9">CAM 2 - 03:04:17</text>

  <!-- Bottom-left: counter area - empty -->
  <rect x="230" y="290" width="120" height="8" fill="#1a1828"/>
  <rect x="240" y="298" width="5" height="40" fill="#1a1828"/>
  <rect x="335" y="298" width="5" height="40" fill="#1a1828"/>
  <text x="195" y="222" fill="#2a2840" font-family="monospace" font-size="9">CAM 3 - 03:04:17</text>

  <!-- Bottom-right: THE WHITE WOMAN - focal horror element -->
  <!-- Woman silhouette in white -->
  <!-- Head -->
  <ellipse cx="520" cy="260" rx="14" ry="16" fill="#d8d4e0" opacity="0.9"/>
  <!-- Hair -->
  <ellipse cx="520" cy="248" rx="16" ry="10" fill="#2a2840" opacity="0.5"/>
  <!-- Body - white sweater -->
  <path d="M500,276 Q498,300 495,330 L545,330 Q542,300 540,276 Z" fill="#d8d4e0" opacity="0.85"/>
  <!-- Arms reaching toward shelf -->
  <path d="M500,285 L470,295 L468,300" stroke="#d8d4e0" stroke-width="4" opacity="0.7" fill="none"/>
  <path d="M540,285 L555,290 L558,295" stroke="#d8d4e0" stroke-width="4" opacity="0.7" fill="none"/>
  <!-- Legs -->
  <rect x="505" y="328" width="8" height="22" fill="#d8d4e0" opacity="0.85"/>
  <rect x="527" y="328" width="8" height="22" fill="#d8d4e0" opacity="0.85"/>
  <!-- Eyes - staring directly forward (toward viewer/monitor) -->
  <ellipse cx="514" cy="258" rx="2" ry="2.5" fill="#0a0808"/>
  <ellipse cx="526" cy="258" rx="2" ry="2.5" fill="#0a0808"/>
  <!-- Subtle eerie glow around figure -->
  <ellipse cx="520" cy="295" rx="30" ry="50" fill="#d8d4e0" opacity="0.04" filter="url(#softBlur)"/>
  <text x="410" y="222" fill="#2a2840" font-family="monospace" font-size="9">CAM 4 - 03:04:17</text>

  <!-- Monitor base stand -->
  <rect x="370" y="360" width="60" height="8" fill="#1a1a1a" rx="2"/>
  <rect x="390" y="368" width="20" height="20" fill="#151515"/>

  <!-- Subtle scan lines on monitor -->
  <line x1="185" y1="80" x2="615" y2="80" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="100" x2="615" y2="100" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="120" x2="615" y2="120" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="140" x2="615" y2="140" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="160" x2="615" y2="160" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="180" x2="615" y2="180" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="200" x2="615" y2="200" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="220" x2="615" y2="220" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="240" x2="615" y2="240" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="260" x2="615" y2="260" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="280" x2="615" y2="280" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="300" x2="615" y2="300" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="320" x2="615" y2="320" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="340" x2="615" y2="340" stroke="#151320" stroke-width="0.5" opacity="0.5"/>
  <line x1="185" y1="360" x2="615" y2="360" stroke="#151320" stroke-width="0.5" opacity="0.5"/>

  <!-- Red recording indicator -->
  <circle cx="200" cy="65" r="3" fill="#8b0000" opacity="0.8"/>
  <circle cx="200" cy="65" r="1.5" fill="#cc0000" opacity="0.9"/>

  <!-- Dark vignette edges -->
  <rect x="0" y="0" width="800" height="450" fill="url(#glow)" opacity="0.3"/>
</svg>
