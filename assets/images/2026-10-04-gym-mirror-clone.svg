<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#0f0a0a"/>
    </linearGradient>
    <linearGradient id="mirrorGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1520" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2a2030" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1520" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Floor line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1a1515" stroke-width="1"/>

  <!-- Gym equipment silhouettes - left side -->
  <g opacity="0.4">
    <!-- Bench press bench -->
    <rect x="80" y="340" width="120" height="8" rx="2" fill="#151010"/>
    <rect x="90" y="348" width="6" height="32" fill="#151010"/>
    <rect x="184" y="348" width="6" height="32" fill="#151010"/>
    <!-- Weight rack -->
    <rect x="200" y="260" width="4" height="120" fill="#151010"/>
    <rect x="210" y="280" width="4" height="100" fill="#151010"/>
    <rect x="220" y="300" width="4" height="80" fill="#151010"/>
    <!-- Weight plates -->
    <ellipse cx="195" cy="290" rx="12" ry="20" fill="#1a1515"/>
    <ellipse cx="215" cy="310" rx="12" ry="20" fill="#1a1515"/>
    <ellipse cx="225" cy="330" rx="12" ry="20" fill="#1a1515"/>
  </g>

  <!-- Large mirror wall (center-right) -->
  <g>
    <rect x="350" y="30" width="420" height="350" fill="#0c0a10" stroke="#1a1520" stroke-width="1.5"/>
    <!-- Mirror reflection glow -->
    <rect x="350" y="30" width="420" height="350" fill="url(#mirrorGlow)"/>
    <!-- Mirror frame subtle lines -->
    <line x1="350" y1="30" x2="350" y2="380" stroke="#1f1a25" stroke-width="2"/>
    <line x1="770" y1="30" x2="770" y2="380" stroke="#1f1a25" stroke-width="2"/>
    <line x1="350" y1="30" x2="770" y2="30" stroke="#1f1a25" stroke-width="2"/>
    <line x1="350" y1="380" x2="770" y2="380" stroke="#1f1a25" stroke-width="2"/>
  </g>

  <!-- Person silhouette (real person) - left side, facing mirror -->
  <g opacity="0.7">
    <!-- Head -->
    <circle cx="300" cy="210" r="18" fill="#0e0c0c"/>
    <!-- Body -->
    <path d="M300,228 L300,310" stroke="#0e0c0c" stroke-width="16" stroke-linecap="round"/>
    <!-- Arms extended toward mirror -->
    <path d="M308,250 L340,260 L360,255" stroke="#0e0c0c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M292,250 L320,258 L345,252" stroke="#0e0c0c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <path d="M296,310 L285,375" stroke="#0e0c0c" stroke-width="12" stroke-linecap="round"/>
    <path d="M304,310 L315,375" stroke="#0e0c0c" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Mirror reflection - the clone (wrong movement) -->
  <g opacity="0.35">
    <!-- Head - slightly different position -->
    <circle cx="500" cy="218" r="18" fill="#0e0c0c"/>
    <!-- Body -->
    <path d="M500,236 L500,310" stroke="#0e0c0c" stroke-width="16" stroke-linecap="round"/>
    <!-- Arms NOT extended - hanging down (the wrong movement) -->
    <path d="M492,250 L488,300" stroke="#0e0c0c" stroke-width="10" stroke-linecap="round"/>
    <path d="M508,250 L512,300" stroke="#0e0c0c" stroke-width="10" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M496,310 L485,375" stroke="#0e0c0c" stroke-width="12" stroke-linecap="round"/>
    <path d="M504,310 L515,375" stroke="#0e0c0c" stroke-width="12" stroke-linecap="round"/>
    <!-- The smile - subtle but wrong -->
    <path d="M492,220 Q500,228 508,220" stroke="#1a1520" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Faint reflection glow from mirror -->
  <ellipse cx="560" cy="200" rx="180" ry="120" fill="#1a1520" opacity="0.08" filter="url(#blur2)"/>

  <!-- Cold fluorescent light overhead -->
  <rect x="370" y="15" width="380" height="3" fill="#1a1a25" opacity="0.6"/>
  <rect x="370" y="18" width="380" height="1" fill="#2a2a35" opacity="0.3"/>
  <!-- Light cone -->
  <polygon points="380,19 720,19 680,380 420,380" fill="#1a1a28" opacity="0.05"/>

  <!-- Subtle vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.3"/>

  <!-- Small detail: water bottle on floor -->
  <g opacity="0.3">
    <rect x="340" y="365" width="10" height="15" rx="3" fill="#121015"/>
    <rect x="342" y="362" width="6" height="4" rx="1" fill="#151318"/>
  </g>

  <!-- Subtle noise grain overlay -->
  <g opacity="0.02" filter="url(#blur1)">
    <circle cx="100" cy="50" r="0.5" fill="#fff"/>
    <circle cx="250" cy="120" r="0.3" fill="#fff"/>
    <circle cx="400" cy="80" r="0.4" fill="#fff"/>
    <circle cx="550" cy="150" r="0.3" fill="#fff"/>
    <circle cx="700" cy="60" r="0.5" fill="#fff"/>
    <circle cx="150" cy="200" r="0.4" fill="#fff"/>
    <circle cx="300" cy="280" r="0.3" fill="#fff"/>
    <circle cx="450" cy="320" r="0.5" fill="#fff"/>
    <circle cx="600" cy="250" r="0.4" fill="#fff"/>
    <circle cx="750" cy="300" r="0.3" fill="#fff"/>
    <circle cx="50" cy="350" r="0.4" fill="#fff"/>
    <circle cx="650" cy="370" r="0.5" fill="#fff"/>
    <circle cx="200" cy="400" r="0.3" fill="#fff"/>
    <circle cx="500" cy="410" r="0.4" fill="#fff"/>
    <circle cx="780" cy="180" r="0.3" fill="#fff"/>
  </g>
</svg>
