<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60">
  <defs>
    <filter id="blur1"><feGaussianBlur stdDeviation="0.5"/></filter>
  </defs>
  <!-- Wall -->
  <rect x="0" y="0" width="80" height="60" fill="#121314"/>
  
  <!-- Building outlines (dark) -->
  <rect x="12" y="8" width="56" height="48" fill="#1a1b1d" rx="0.5"/>
  
  <!-- Grid lines suggesting floor plan -->
  <line x1="34" y1="8" x2="34" y2="56" stroke="#222" stroke-width="0.3"/>
  <line x1="56" y1="8" x2="56" y2="56" stroke="#222" stroke-width="0.3"/>
  <line x1="12" y1="24" x2="68" y2="24" stroke="#222" stroke-width="0.3"/>
  
  <!-- Room with dashed fill indicating "not a room" -->
  <rect x="35" y="25" width="20" height="18" fill="none" 
        stroke="#444" stroke-width="0.6" stroke-dasharray="1,1"/>
  
  <!-- The mailbox area (just a flat dark patch) -->
  <rect x="40" y="35" width="12" height="8" fill="#1a1b1d"/>

  <!-- Tape on mailbox -->
  <path d="M 42,36 L 49,37.5 M 42,42 L 49,40.5" stroke="#aaa" 
        stroke-width="0.8" opacity="0.5"/>

  <!-- Room label with strikethrough -->
  <text x="41" y="31.5" font-size="2.8" fill="#555" text-anchor="middle">7</text>
  
  <!-- Subtle red "X" indicating non-existent / invalid -->
  <path d="M 50,50 L 62,56 M 62,50 L 50,56" stroke="#8b1a1a" 
        stroke-width="0.9" opacity="0.4"/>

  <!-- Small flicker animation on the room number -->
  <rect x="34" y="47" width="4" height="2" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.5s" repeatCount="indefinite"/>
  </rect>

</svg>