<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a0a"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1515"/>
      <stop offset="100%" stop-color="#121010"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a0a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Floor -->
  <rect x="0" y="320" width="800" height="130" fill="#0e0c0c"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1515" stroke-width="1"/>

  <!-- Perspective floor lines -->
  <line x1="400" y1="320" x2="100" y2="450" stroke="#151212" stroke-width="0.5"/>
  <line x1="400" y1="320" x2="300" y2="450" stroke="#151212" stroke-width="0.5"/>
  <line x1="400" y1="320" x2="500" y2="450" stroke="#151212" stroke-width="0.5"/>
  <line x1="400" y1="320" x2="700" y2="450" stroke="#151212" stroke-width="0.5"/>
  <line x1="400" y1="320" x2="400" y2="450" stroke="#151212" stroke-width="0.5"/>

  <!-- Back wall -->
  <rect x="150" y="50" width="500" height="270" fill="url(#wallGrad)"/>

  <!-- Wall texture lines -->
  <line x1="150" y1="100" x2="650" y2="100" stroke="#1e1919" stroke-width="0.5"/>
  <line x1="150" y1="150" x2="650" y2="150" stroke="#1e1919" stroke-width="0.5"/>
  <line x1="150" y1="200" x2="650" y2="200" stroke="#1e1919" stroke-width="0.5"/>
  <line x1="150" y1="250" x2="650" y2="250" stroke="#1e1919" stroke-width="0.5"/>

  <!-- Left wall (perspective) -->
  <polygon points="0,80 150,50 150,320 0,200" fill="#111010"/>

  <!-- Right wall (perspective) -->
  <polygon points="800,80 650,50 650,320 800,200" fill="#111010"/>

  <!-- Ceiling -->
  <polygon points="0,80 150,50 650,50 800,80" fill="#0c0a0a"/>

  <!-- Cinema poster frame (center of back wall) -->
  <rect x="340" y="80" width="120" height="160" fill="#0a0808" stroke="#1e1919" stroke-width="1"/>
  <!-- Poster silhouette inside -->
  <rect x="350" y="90" width="100" height="60" fill="#151212"/>
  <!-- Red curtain top -->
  <path d="M340,80 Q360,70 380,80 Q400,70 420,80 Q440,70 460,80 Q480,70 500,80 L500,90 L340,90 Z" fill="#1a0a0a"/>

  <!-- Ticket counter (left side) -->
  <rect x="180" y="240" width="100" height="80" fill="#0f0d0d" stroke="#1a1818" stroke-width="0.5"/>
  <rect x="190" y="230" width="80" height="10" fill="#151212"/>
  <!-- Counter lamp -->
  <circle cx="230" cy="225" r="8" fill="#1a140a" filter="url(#glow)"/>
  <line x1="230" y1="217" x2="230" y2="230" stroke="#1a140a" stroke-width="1"/>

  <!-- PA Speaker (right side wall, prominent) -->
  <rect x="620" y="100" width="40" height="60" rx="3" fill="#0e0c0c" stroke="#1e1919" stroke-width="0.5"/>
  <!-- Speaker cone -->
  <circle cx="640" cy="125" r="15" fill="#0a0808" stroke="#1a1818" stroke-width="0.5"/>
  <circle cx="640" cy="125" r="8" fill="#0e0c0c"/>
  <!-- Sound waves emanating -->
  <path d="M662,120 Q675,115 685,120" fill="none" stroke="#1a1515" stroke-width="0.8" opacity="0.5"/>
  <path d="M668,112 Q688,105 700,112" fill="none" stroke="#1a1515" stroke-width="0.6" opacity="0.3"/>
  <path d="M668,138 Q688,145 700,138" fill="none" stroke="#1a1515" stroke-width="0.6" opacity="0.3"/>

  <!-- Exit sign (dim) -->
  <rect x="580" y="260" width="50" height="20" rx="2" fill="#1a0a0a" stroke="#2a1515" stroke-width="0.5"/>
  <text x="605" y="274" text-anchor="middle" font-size="10" fill="#3a1a1a" font-family="monospace">EXIT</text>

  <!-- Ambient light from ceiling -->
  <circle cx="400" cy="60" r="30" fill="url(#light)" filter="url(#softGlow)"/>

  <!-- Faint ghostly figure in the distance (center, behind poster area) -->
  <ellipse cx="400" cy="280" rx="15" ry="40" fill="#0a0808" opacity="0.3"/>
  <circle cx="400" cy="240" r="10" fill="#0a0808" opacity="0.25"/>

  <!-- Vignette effect -->
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="none"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#bg)" opacity="0.3"/>

  <!-- Subtle text - cinema name -->
  <text x="400" y="310" text-anchor="middle" font-size="11" fill="#1a1515" font-family="serif" letter-spacing="4">梅 田 座</text>

  <!-- Very subtle red glow near speaker (PA system alive) -->
  <circle cx="640" cy="125" r="25" fill="#1a0505" opacity="0.15" filter="url(#softGlow)"/>
</svg>