<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Floor -->
  <rect x="0" y="320" width="800" height="130" fill="#0f0c0c"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Left wall (kitchen counter area) -->
  <rect x="0" y="0" width="180" height="320" fill="#121010"/>
  <rect x="10" y="120" width="160" height="200" fill="#1a1717" stroke="#1f1a1a" stroke-width="1"/>
  <!-- Counter top -->
  <rect x="5" y="115" width="170" height="8" fill="#2a2525"/>
  <!-- Cup on counter -->
  <rect x="60" y="85" width="25" height="30" fill="#2a2525" rx="2"/>
  <rect x="62" y="87" width="21" height="26" fill="#3a3535" rx="1"/>
  
  <!-- Door frame (205) -->
  <rect x="170" y="0" width="12" height="320" fill="#1a1515"/>
  <!-- Door -->
  <rect x="182" y="0" width="80" height="320" fill="#151212" stroke="#1e1a1a" stroke-width="1"/>
  <!-- Door handle -->
  <circle cx="250" cy="170" r="4" fill="#2a2525"/>
  <!-- Door gap - light leaking from under -->
  <rect x="182" y="315" width="80" height="5" fill="#2a2210" opacity="0.6"/>
  <!-- Light beam from under door -->
  <polygon points="182,320 262,320 280,350 165,350" fill="#2a2210" opacity="0.15"/>
  <!-- Light from door crack -->
  <rect x="260" y="0" width="2" height="320" fill="#2a2210" opacity="0.08"/>
  
  <!-- Right wall -->
  <rect x="720" y="0" width="80" height="320" fill="#121010"/>
  
  <!-- Kitchen cabinet silhouettes -->
  <rect x="20" y="130" width="50" height="60" fill="#1e1a1a" stroke="#252020" stroke-width="0.5"/>
  <rect x="80" y="130" width="50" height="60" fill="#1e1a1a" stroke="#252020" stroke-width="0.5"/>
  
  <!-- Refrigerator silhouette -->
  <rect x="280" y="80" width="70" height="240" fill="#161313" stroke="#1e1a1a" stroke-width="1"/>
  <line x1="280" y1="160" x2="350" y2="160" stroke="#1e1a1a" stroke-width="0.5"/>
  
  <!-- Table in center -->
  <rect x="400" y="250" width="200" height="10" fill="#1a1717"/>
  <rect x="420" y="260" width="5" height="60" fill="#1a1717"/>
  <rect x="575" y="260" width="5" height="60" fill="#1a1717"/>
  
  <!-- Chair silhouettes -->
  <rect x="430" y="260" width="40" height="5" fill="#1a1717"/>
  <rect x="435" y="265" width="3" height="40" fill="#1a1717"/>
  <rect x="462" y="265" width="3" height="40" fill="#1a1717"/>
  <rect x="530" y="260" width="40" height="5" fill="#1a1717"/>
  <rect x="535" y="265" width="3" height="40" fill="#1a1717"/>
  <rect x="562" y="265" width="3" height="40" fill="#1a1717"/>
  
  <!-- Shadows / atmosphere -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" opacity="0.3"/>
  
  <!-- Subtle dark figure silhouette near door -->
  <ellipse cx="220" cy="240" rx="15" ry="35" fill="#0e0b0b" opacity="0.4"/>
  <ellipse cx="220" cy="200" rx="10" ry="12" fill="#0e0b0b" opacity="0.3"/>
  
  <!-- Light glow from door gap -->
  <ellipse cx="222" cy="320" rx="40" ry="8" fill="#3a2a10" opacity="0.15"/>
  
  <!-- Small text label -->
  <text x="400" y="430" text-anchor="middle" fill="#2a2525" font-family="sans-serif" font-size="11" letter-spacing="3">205</text>
  
  <!-- Faint door number -->
  <text x="222" y="160" text-anchor="middle" fill="#1e1a1a" font-family="sans-serif" font-size="14" font-weight="bold">205</text>
  
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="60%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="doorGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#3a2a10" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3a2a10" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
