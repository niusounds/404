<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="hallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#1a1010"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1010"/>
      <stop offset="100%" stop-color="#0d0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor -->
  <polygon points="0,300 800,300 800,450 0,450" fill="url(#floorGrad)"/>

  <!-- Perspective hallway lines on floor -->
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1212" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#1a1212" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#1a1212" stroke-width="0.5" opacity="0.3"/>

  <!-- Left wall -->
  <polygon points="0,0 200,150 200,300 0,300" fill="#0e0a0a"/>

  <!-- Right wall -->
  <polygon points="800,0 600,150 600,300 800,300" fill="#0e0a0a"/>

  <!-- Ceiling -->
  <polygon points="0,0 800,0 600,150 200,150" fill="#080606"/>

  <!-- Door on the right side -->
  <rect x="540" y="140" width="80" height="160" fill="#1a1210" stroke="#2a1a15" stroke-width="1"/>
  <!-- Door slightly ajar - light coming through -->
  <rect x="618" y="142" width="4" height="156" fill="#3a2a1a" opacity="0.6" filter="url(#softGlow)"/>
  <!-- Door handle -->
  <circle cx="555" cy="230" r="4" fill="#3a2a1a"/>

  <!-- Keyhole on the door -->
  <circle cx="560" cy="210" r="3" fill="#0a0808"/>
  <line x1="560" y1="210" x2="557" y2="218" stroke="#0a0808" stroke-width="2"/>

  <!-- Small child-like footprints on the floor leading from outside to the door -->
  <!-- Footprint 1 - bottom right, coming in -->
  <ellipse cx="720" cy="400" rx="8" ry="14" fill="#2a1a15" opacity="0.7"/>
  <ellipse cx="716" cy="386" rx="5" ry="5" fill="#2a1a15" opacity="0.5"/>

  <!-- Footprint 2 -->
  <ellipse cx="670" cy="370" rx="8" ry="14" fill="#2a1a15" opacity="0.7"/>
  <ellipse cx="666" cy="356" rx="5" ry="5" fill="#2a1a15" opacity="0.5"/>

  <!-- Footprint 3 -->
  <ellipse cx="630" cy="340" rx="7" ry="12" fill="#2a1a15" opacity="0.7"/>
  <ellipse cx="626" cy="328" rx="4.5" ry="4.5" fill="#2a1a15" opacity="0.5"/>

  <!-- Footprint 4 -->
  <ellipse cx="600" cy="315" rx="7" ry="12" fill="#2a1a15" opacity="0.7"/>
  <ellipse cx="596" cy="303" rx="4.5" ry="4.5" fill="#2a1a15" opacity="0.5"/>

  <!-- Footprint 5 - near the door -->
  <ellipse cx="585" cy="305" rx="6" ry="10" fill="#2a1a15" opacity="0.7"/>
  <ellipse cx="581" cy="295" rx="4" ry="4" fill="#2a1a15" opacity="0.5"/>

  <!-- Erased footprint痕迹 - smudged -->
  <ellipse cx="570" cy="290" rx="10" ry="8" fill="#1a1210" opacity="0.8"/>
  <ellipse cx="565" cy="285" rx="6" ry="5" fill="#1a1210" opacity="0.6"/>

  <!-- Dim light from under the door -->
  <polygon points="620,300 625,300 635,450 615,450" fill="#3a2a1a" opacity="0.15" filter="url(#glow)"/>

  <!-- Eerie ambient light from the keyhole -->
  <circle cx="560" cy="210" r="8" fill="#4a3a2a" opacity="0.2" filter="url(#softGlow)"/>

  <!-- Subtle shadow figure silhouette near the door -->
  <ellipse cx="610" cy="280" rx="15" ry="35" fill="#0a0808" opacity="0.3"/>
  <ellipse cx="610" cy="240" rx="10" ry="12" fill="#0a0808" opacity="0.25"/>

  <!-- Very subtle fog/mist effect -->
  <ellipse cx="400" cy="280" rx="300" ry="60" fill="#1a1010" opacity="0.15"/>
  <ellipse cx="300" cy="300" rx="200" ry="40" fill="#1a1010" opacity="0.1"/>

  <!-- Tiny faint key hanging from somewhere - barely visible -->
  <line x1="380" y1="150" x2="380" y2="170" stroke="#2a1a15" stroke-width="0.5" opacity="0.3"/>
  <circle cx="380" cy="172" r="3" fill="none" stroke="#2a1a15" stroke-width="0.5" opacity="0.3"/>
  <line x1="382" y1="174" x2="386" y2="176" stroke="#2a1a15" stroke-width="0.5" opacity="0.3"/>

  <!-- Subtle vignette -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.5"/>
</svg>
