<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0a0808"/>
  
  <!-- Notice board frame -->
  <rect x="100" y="50" width="400" height="300" rx="2" fill="#2a2a1e" stroke="#1a1a12" stroke-width="2"/>
  <rect x="105" y="55" width="390" height="290" rx="1" fill="#0f0f0d"/>
  
  <!-- Board texture (thin vertical lines) -->
  <line x1="150" y1="60" x2="150" y2="340" stroke="#181815" stroke-width="0.5"/>
  <line x1="200" y1="60" x2="200" y2="340" stroke="#181815" stroke-width="0.5"/>
  <line x1="260" y1="60" x2="260" y2="340" stroke="#181815" stroke-width="0.5"/>
  <line x1="320" y1="60" x2="320" y2="340" stroke="#181815" stroke-width="0.5"/>
  <line x1="370" y1="60" x2="370" y2="340" stroke="#181815" stroke-width="0.5"/>
  
  <!-- Notice papers taped to board -->
  <!-- Paper 1 - normal notice (top left) -->
  <rect x="120" y="75" width="90" height="65" fill="#f5e6d4" rx="1" stroke="#ccc" stroke-width="0.5">
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <line x1="128" y1="90" x2="198" y2="90" stroke="#aaa" stroke-width="0.5"/>
  <line x1="128" y1="100" x2="198" y2="100" stroke="#ccc" stroke-width="0.3"/>
  <line x1="128" y1="108" x2="185" y2="108" stroke="#ccc" stroke-width="0.3"/>
  
  <!-- Paper 2 - normal notice (top right) -->
  <rect x="360" y="70" width="80" height="55" fill="#e8dcc8" rx="1">
    <animate attributeName="transform" values="" dur="4s">
      <animateTransform attributeName="transform" type="translate" values="0,0;-1,-2;0,0" dur="6s" repeatCount="indefinite"/>
    </animate>
  </rect>
  <line x1="368" y1="85" x2="430" y2="85" stroke="#bbb" stroke-width="0.5"/>
  <line x1="368" y1="92" x2="425" y2="92" stroke="#ccc" stroke-width="0.3"/>
  
  <!-- Paper 3 - the disturbing one (bottom-right, larger, slight red stain) -->
  <rect x="390" y="265" width="110" height="60" fill="#f0e8d8" rx="1" stroke="#a0a090" stroke-width="1">
    <animate attributeName="opacity" values="1;0.7;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <!-- red stain -->
  <ellipse cx="485" cy="310" rx="8" ry="6" fill="#6b1a1a" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Paper 4 (center, slightly tilted/creased) -->
  <g transform="translate(215,180) rotate(-3)">
    <rect x="0" y="0" width="75" height="90" fill="#faf3e6" rx="1">
      <animate attributeName="transform" values="" dur="3.5s">
        <animateTransform attributeName="transform" type="translate" values="0,0;-2,-1;0,0" dur="7s" repeatCount="indefinite"/>
      </animate>
    </rect>
  </g>
  
  <!-- Scrawled text on the disturbing notice - looks like handwriting -->
  <line x1="410" y1="285" x2="485" y2="283" stroke="#333" stroke-width="0.8"/>
  <line x1="412" y1="295" x2="480" y2="294" stroke="#444" stroke-width="0.6"/>
  
  <!-- Pin/thumbtack shadows -->
  <circle cx="160" cy="72" r="3" fill="#cc6644" opacity="0.8"/>
  <circle cx="405" cy="68" r="3" fill="#cc6644" opacity="0.8"/>
  <circle cx="440" cy="262" r="3" fill="#66aa66" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Dark figure/eye barely visible reflection in the bottom-left corner -->
  <ellipse cx="120" cy="360" rx="15" ry="25" fill="#0a0808" opacity="0.4">
    <animate attributeName="transform" values="" duration="8s">
      <animateTransform attributeName="transform" type="translate" values="0,0;-5,-2;3,-6;0,0" dur="12s" repeatCount="indefinite"/>
    </animate>
  </ellipse>

  <!-- Title text at top -->
</svg>
