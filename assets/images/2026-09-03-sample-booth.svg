<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="light" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#light)"/>
  
  <!-- Floor perspective lines -->
  <g opacity="0.15">
    <line x1="400" y1="280" x2="100" y2="450" stroke="#3a3020" stroke-width="1"/>
    <line x1="400" y1="280" x2="300" y2="450" stroke="#3a3020" stroke-width="1"/>
    <line x1="400" y1="280" x2="500" y2="450" stroke="#3a3020" stroke-width="1"/>
    <line x1="400" y1="280" x2="700" y2="450" stroke="#3a3020" stroke-width="1"/>
    <line x1="100" y1="350" x2="700" y2="350" stroke="#3a3020" stroke-width="0.5"/>
    <line x1="200" y1="400" x2="600" y2="400" stroke="#3a3020" stroke-width="0.5"/>
  </g>
  
  <!-- Ceiling / upper darkness -->
  <rect x="0" y="0" width="800" height="80" fill="#050404" opacity="0.9"/>
  
  <!-- Fluorescent light strips (cold, sterile) -->
  <g filter="url(#glow)" opacity="0.6">
    <rect x="250" y="5" width="120" height="4" fill="#4a4530" rx="2"/>
    <rect x="430" y="5" width="120" height="4" fill="#4a4530" rx="2"/>
    <rect x="250" y="3" width="120" height="1" fill="#6a6040" rx="0.5"/>
    <rect x="430" y="3" width="120" height="1" fill="#6a6040" rx="0.5"/>
  </g>
  
  <!-- Light cones from ceiling -->
  <polygon points="310,9 180,280 440,280" fill="#1a1508" opacity="0.08"/>
  <polygon points="490,9 360,280 620,280" fill="#1a1508" opacity="0.08"/>
  
  <!-- Sampling booth counter -->
  <g>
    <!-- Counter top -->
    <rect x="320" y="200" width="160" height="12" fill="#2a2520" rx="1"/>
    <!-- Counter front -->
    <rect x="325" y="212" width="150" height="100" fill="#1e1a15"/>
    <!-- Counter edge highlight -->
    <line x1="325" y1="212" x2="475" y2="212" stroke="#3a3528" stroke-width="1"/>
    <!-- Sign board -->
    <rect x="345" y="155" width="110" height="40" fill="#2a2520" rx="2" opacity="0.9"/>
    <text x="400" y="170" text-anchor="middle" fill="#8a7a5a" font-size="8" font-family="sans-serif">試食</text>
    <text x="400" y="185" text-anchor="middle" fill="#8a7a5a" font-size="8" font-family="sans-serif">ブース</text>
  </g>
  
  <!-- The woman figure (silhouette) -->
  <g>
    <!-- Head -->
    <ellipse cx="400" cy="120" rx="14" ry="17" fill="#0a0a08"/>
    <!-- Hair (white/blonde bun) -->
    <circle cx="400" cy="108" r="12" fill="#1a1a18"/>
    <ellipse cx="400" cy="100" rx="8" ry="5" fill="#1a1a18"/>
    <!-- Body (apron silhouette) -->
    <path d="M385,135 L380,195 L420,195 L415,135 Z" fill="#0e0e0c"/>
    <!-- Apron detail -->
    <rect x="388" y="140" width="24" height="45" fill="#121210" rx="1"/>
    <!-- Arm reaching out with plate -->
    <line x1="395" y1="150" x2="350" y2="170" stroke="#0e0e0c" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="348" cy="171" r="5" fill="#0e0e0c"/>
    <!-- Plate -->
    <ellipse cx="340" cy="175" rx="15" ry="4" fill="#1a1a18" stroke="#2a2a25" stroke-width="0.5"/>
    <!-- Cucumber on plate (dark, moldy) -->
    <ellipse cx="340" cy="174" rx="8" ry="2" fill="#1a2a1a" opacity="0.6"/>
    <circle cx="337" cy="173" r="1" fill="#3a4a3a" opacity="0.4"/>
    <circle cx="343" cy="174" r="0.8" fill="#3a4a3a" opacity="0.4"/>
  </g>
  
  <!-- The second figure (reflection in the background) -->
  <g opacity="0.3" filter="url(#blur)">
    <!-- Head -->
    <ellipse cx="580" cy="140" rx="10" ry="13" fill="#0a0a08"/>
    <!-- Body -->
    <path d="M568,150 L565,190 L595,190 L592,150 Z" fill="#0e0e0c"/>
    <!-- Arm reaching -->
    <line x1="575" y1="158" x2="560" y2="170" stroke="#0e0e0c" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Empty escalator / stairs in background -->
  <g opacity="0.2">
    <rect x="600" y="180" width="60" height="200" fill="#0e0e0c"/>
    <line x1="600" y1="200" x2="660" y2="200" stroke="#1a1a18" stroke-width="1"/>
    <line x1="600" y1="220" x2="660" y2="220" stroke="#1a1a18" stroke-width="1"/>
    <line x1="600" y1="240" x2="660" y2="240" stroke="#1a1a18" stroke-width="1"/>
    <line x1="600" y1="260" x2="660" y2="260" stroke="#1a1a18" stroke-width="1"/>
    <line x1="600" y1="280" x2="660" y2="280" stroke="#1a1a18" stroke-width="1"/>
    <line x1="600" y1="300" x2="660" y2="300" stroke="#1a1a18" stroke-width="1"/>
    <line x1="600" y1="320" x2="660" y2="320" stroke="#1a1a18" stroke-width="1"/>
    <line x1="600" y1="340" x2="660" y2="340" stroke="#1a1a18" stroke-width="1"/>
  </g>
  
  <!-- Dark shelves on the left side -->
  <g opacity="0.15">
    <rect x="30" y="120" width="100" height="250" fill="#0a0a08"/>
    <line x1="30" y1="160" x2="130" y2="160" stroke="#1a1a18" stroke-width="1"/>
    <line x1="30" y1="200" x2="130" y2="200" stroke="#1a1a18" stroke-width="1"/>
    <line x1="30" y1="240" x2="130" y2="240" stroke="#1a1a18" stroke-width="1"/>
    <line x1="30" y1="280" x2="130" y2="280" stroke="#1a1a18" stroke-width="1"/>
    <line x1="30" y1="320" x2="130" y2="320" stroke="#1a1a18" stroke-width="1"/>
  </g>
  
  <!-- Cold light pool on the floor -->
  <ellipse cx="400" cy="360" rx="200" ry="30" fill="#1a1508" opacity="0.1"/>
  
  <!-- Vignette overlay -->
  <rect width="800" height="450" fill="url(#light)" opacity="0.3" style="mix-blend-mode: multiply;"/>
  
  <!-- Subtle mold spores / dust particles -->
  <g opacity="0.15">
    <circle cx="350" cy="200" r="0.5" fill="#4a4a30"/>
    <circle cx="360" cy="210" r="0.3" fill="#4a4a30"/>
    <circle cx="340" cy="220" r="0.4" fill="#4a4a30"/>
    <circle cx="370" cy="195" r="0.6" fill="#4a4a30"/>
    <circle cx="355" cy="230" r="0.3" fill="#4a4a30"/>
    <circle cx="420" cy="205" r="0.5" fill="#4a4a30"/>
    <circle cx="430" cy="215" r="0.4" fill="#4a4a30"/>
  </g>
</svg>
