<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140">

  <!-- Dark hallway background -->
  <rect width="560" height="140" fill="#07071a"/>

  <!-- Ceiling fluorescent light - soft glow with flicker animation -->
  <g>
    <rect x="230" y="8" width="100" height="7" rx="3" fill="#5a6aa0"><animate attributeName="opacity" values="0.8;1;0.7;0.9;0.95"/></rect>
  </g>

  <!-- Floor/ceiling lines giving perspective -->
  <line x1="0" y1="132" x2="140" y2="65"/>
  <line x1="560" y1="132" x2="420" y2="65"/>

  <!-- Closed door frame -->
  <rect x="280" y="30" width="80" height="98" rx="2" fill="#1a1824"/>
  <rect x="284" y="34" width="72" height="90" rx="1" fill="#241f2e"/>

  <!-- Door handle -->
  <circle cx="365" cy="82" r="4" fill="#8a7f6f"/><line x1="369" y1="82" x2="380" y2="76"/>

</svg>
