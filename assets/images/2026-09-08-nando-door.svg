<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="glow" cx="0.7" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <linearGradient id="doorLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2015" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor perspective -->
  <polygon points="0,350 800,350 800,450 0,450" fill="#0d0a07"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#15100a" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#15100a" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#15100a" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#15100a" stroke-width="0.5" opacity="0.2"/>

  <!-- Wall -->
  <rect x="0" y="0" width="800" height="350" fill="#0e0b08"/>

  <!-- Dust on floor -->
  <ellipse cx="400" cy="400" rx="300" ry="30" fill="#1a1510" opacity="0.15" filter="url(#blur3)"/>
  <ellipse cx="350" cy="380" rx="150" ry="15" fill="#1a1510" opacity="0.1" filter="url(#blur3)"/>

  <!-- Door frame -->
  <rect x="520" y="30" width="260" height="320" fill="#1a1410" stroke="#2a2015" stroke-width="1"/>

  <!-- Door (slightly ajar, opening inward to the right) -->
  <rect x="525" y="35" width="250" height="315" fill="#1e1812" stroke="#2a2018" stroke-width="0.5"/>

  <!-- Door gap - showing dark room inside -->
  <rect x="770" y="35" width="10" height="315" fill="#080606"/>

  <!-- Dark interior visible through gap -->
  <rect x="775" y="40" width="4" height="305" fill="#060404" opacity="0.9"/>

  <!-- Faint light leaking from door crack -->
  <rect x="760" y="35" width="15" height="315" fill="url(#doorLight)" opacity="0.4"/>

  <!-- Dust particles in light beam -->
  <circle cx="768" cy="100" r="1" fill="#3a3020" opacity="0.3" filter="url(#blur1)"/>
  <circle cx="772" cy="150" r="0.8" fill="#3a3020" opacity="0.25" filter="url(#blur1)"/>
  <circle cx="765" cy="200" r="1.2" fill="#3a3020" opacity="0.2" filter="url(#blur1)"/>
  <circle cx="770" cy="250" r="0.7" fill="#3a3020" opacity="0.3" filter="url(#blur1)"/>
  <circle cx="767" cy="300" r="1" fill="#3a3020" opacity="0.15" filter="url(#blur1)"/>

  <!-- Footprint trail on dust -->
  <ellipse cx="680" cy="365" rx="12" ry="4" fill="#15100a" opacity="0.4"/>
  <ellipse cx="640" cy="370" rx="11" ry="3.5" fill="#15100a" opacity="0.35"/>
  <ellipse cx="595" cy="375" rx="10" ry="3" fill="#15100a" opacity="0.3"/>
  <ellipse cx="545" cy="378" rx="9" ry="3" fill="#15100a" opacity="0.25"/>
  <ellipse cx="490" cy="380" rx="8" ry="2.5" fill="#15100a" opacity="0.2"/>
  <ellipse cx="430" cy="382" rx="7" ry="2.5" fill="#15100a" opacity="0.15"/>
  <ellipse cx="370" cy="384" rx="6" ry="2" fill="#15100a" opacity="0.1"/>

  <!-- Door handle -->
  <circle cx="545" cy="195" r="5" fill="#2a2015" stroke="#3a3020" stroke-width="0.5"/>
  <circle cx="545" cy="195" r="2" fill="#1a1410"/>

  <!-- Door panel lines -->
  <rect x="540" y="50" width="220" height="120" fill="none" stroke="#252015" stroke-width="0.5" opacity="0.5"/>
  <rect x="540" y="190" width="220" height="140" fill="none" stroke="#252015" stroke-width="0.5" opacity="0.5"/>

  <!-- Keyhole -->
  <circle cx="545" cy="210" r="3" fill="#0a0806" stroke="#2a2015" stroke-width="0.5"/>

  <!-- Dark silhouette suggestion in the doorway crack -->
  <ellipse cx="778" cy="180" rx="3" ry="30" fill="#050303" opacity="0.6"/>
  <ellipse cx="779" cy="140" rx="2" ry="15" fill="#050303" opacity="0.4"/>

  <!-- Top shadow -->
  <rect x="0" y="0" width="800" height="30" fill="#080605"/>

  <!-- Vignette -->
  <rect x="0" y="0" width="800" height="450" fill="url(#glow)" opacity="0.5"/>
</svg>
