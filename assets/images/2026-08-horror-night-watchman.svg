<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 500 800 450">
  <!-- Dark night scene with hospital silhouette and moon -->
  
  <rect width="800" height="450" fill="#1a0607"/>  <!-- Night sky background -->

  <!-- Hospital building silhouette -->
  <path d="M 320,70 L 450,70 L 450,320 L 355,320 L 380,240 L 400,240 L 400,360 L 340,380 Z" 
         fill="#4a1e0b"/>
  
 <!-- Window details (empty floors) -->
  <rect x="375" y="90" width="55" height="40" fill="#3c2529"/>   <!-- Empty window 1-->

<line x1="610" y1="280" width="60" rx="2" stroke="#cfaa63ff"/>  <!-- Moon reflection -->
  
 <!-- Foreground: street or road hinting the scene is at night on a city street -->
   <path d="M 0,358 Q 1678 40Q 335,420 L 500,440" 
         fill="#6a552b"/>  <!-- Dark road surface  
         
 <!-- Moon/illuminated window area -->
   <circle cx="720" cy="126" r="48" fill="#fffbe8"/>';  <!-- Full bright moon-->

<line x1="345" y1="392" width="318" rx="4" stroke="#8b7a2a"/>   <!-- Road line marker
</svg>
