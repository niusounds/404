<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <filter id="faintBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  
  <!-- dark background -->
  <rect width="350" height="240" fill="#0a0808"/>
  
  <!-- a hand holding a notebook, barely visible in shadow -->
  <g opacity="0.6">
    <rect x="90" y="30" width="120" height="160" rx="4" ry="4" fill="#151010"/>
    <!-- page text lines, only some visible -->
    <line x1="110" y1="60" x2="195" y2="60" stroke="#3a1a1a" stroke-width="2">
      <animate attributeName="opacity" values="0.8;0.15;0.7" dur="3s" repeatCount="indefinite"/>
    </line>
    <!-- faint "第六段階" -->
    <text x="145" y="95" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="20" fill="#ff2a2a" text-anchor="middle" filter="url(#faintBlur)">
      第六段階
    </text>
    
    <!-- broken line -- as if pen ran out -->
    <line x1="110" y1="130" x2="165" y2="130" stroke="#4a2020" stroke-width="1.5"/>
    <line x1="175" y1="130" x2="195" y2="130" stroke="#4a2020" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </line>

    <!-- hand silhouette (faint, bottom right of notebook) -->
    <path d="M 160,170 C 155,185 145,195 130,198 L 130,200 L 110,200 L 110,198 C 85,195 60,185 55,175" 
          fill="none" stroke="#2a1b1b" stroke-width="1.5"/>
    
    <!-- single red dot fading like a heartbeat -->
    <circle cx="240" cy="190" r="3" fill="#cc0000">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>

  </g>
  
  <!-- thin red border on right as if door frame -->
  <line x1="75" y1="30" x2="75" y2="190" stroke="#1a0808" stroke-width="3"/>

</svg>
