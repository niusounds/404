<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>歪んだ懐中時計</tile>
  <desc>新宿路地裏の古時計店を象徴する、止まった時刻03:47を示す壊れた懐中時計。背景に明滅するネオン。</desc>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0808"/>
  
  <!-- Alley silhouette walls (subtle) -->
  <g opacity="0.15">
    <polygon points="20,60 80,60 60,300 0,300" fill="#1a1a1a"/>
    <polygon points="340,40 400,40 400,300 320,300" fill="#1a1a1a"/>
  </g>

  <!-- Clock body -->
  <rect x="95" y="75" width="210" height="85" rx="12" ry="12" fill="none" stroke="#c8a34b" stroke-width="2.5"/>
  
  <!-- Inner ring - clock face border -->
  <rect x="108" y="88" width="184" height="59" rx="6" ry="6" fill="none" stroke="#c8a34b" stroke-width="1.2"/>
  
  <!-- Clock number indicators at top (tiny gold rectangles) -->
  <rect x="170" y="90" width="60" height="3" fill="#e8d4a0"/>
  <!-- Date window -->
  <rect x="195" y="128" width="14" height="10" fill="#f0e0c0" stroke="#c8a34b"/>
  
  <!-- Hand pivot dot -->
  <circle cx="217" cy="117" r="3" fill="#e8d4a0"/>

  <!-- Hour hand (hour pointing to ~3-4 o'clock) -->
  <line x1="217" y1="117" x2="281" y2="95" stroke="#e8d4a0" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Minute hand (stopped at 47 min = just before top, slightly left of vertical) -->
  <line x1="217" y1="117" x2="198" y2="68" stroke="#c8a34b" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0.3;1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Second hand: frozen, dead red -->
  <line x1="217" y1="117" x2="265" y2="128" stroke="#ff2a2a" stroke-width="0.8">
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Time display below -->
  <text x="217" y="96" font-family="'Courier New', monospace, sans-serif" font-size="8" fill="#c8a34b" text-anchor="middle">03:47:00</text>

  <!-- Flickering neon - left wall (Shinjuku vibe) -->
  <rect x="28" y="116" width="2" height="18" fill="#ff3060" opacity="0.9">
    <animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Clock number tick marks (subtle) -->
  <circle cx="123" cy="56" r="8" fill="none" stroke="#4a3020" stroke-width="0.8"/>
  <circle cx="149" cy="48" r="7" fill="none" stroke="#4a3020" stroke-width="0.8"/>
  <circle cx="175" cy="46" r="7" fill="none" stroke="#4a3020" stroke-width="0.8"/>
  <circle cx="201" cy="47" r="6" fill="none" stroke="#4a3020" stroke-width="0.8"/>
  <circle cx="227" cy="51" r="7" fill="none" stroke="#4a3020" stroke-width="0.8"/>
  <circle cx="253" cy="58" r="7" fill="none" stroke="#4a3020" stroke-width="0.8"/>


  <!-- Crack on case (small red line) -->
  <path d="M140,85 L160,95 L155,110" fill="none" stroke="#ff3a3a" stroke-width="1.2" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- "Dead hands" reaching from edges - dark abstract shapes -->
  <g stroke="#5a3a3a" fill="none" stroke-width="1.2" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="9s" repeatCount="indefinite"/>
    
    <!-- Left side reaching shadow -->
    <path d="M8,240 Q28,200 18,170"/>
    <circle cx="22" cy="165" r="3.5"/>
    <circle cx="14" cy="225" r="2.5"/>

    <!-- Right side reaching shadow -->
    <path d="M392,230 Q378,195 385,168"/>
    <circle cx="378" cy="163" r="4.5"/>
  </g>

  <!-- Floor line (subtle alley floor) -->
  <line x1="0" y1="280" x2="400" y2="280" stroke="#1e1a1c" stroke-width="3"/>


</svg>