<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background: dark apartment corridor -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Corridor perspective lines -->
  <line x1="0" y1="0" x2="300" y2="225" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="800" y1="0" x2="500" y2="225" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="0" y1="450" x2="300" y2="225" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="800" y1="450" x2="500" y2="225" stroke="#1a1515" stroke-width="1.5"/>
  
  <!-- Floor -->
  <rect x="250" y="225" width="300" height="225" fill="#0d0b0b" opacity="0.8"/>
  <line x1="250" y1="300" x2="550" y2="300" stroke="#151212" stroke-width="0.5"/>
  <line x1="250" y1="350" x2="550" y2="350" stroke="#151212" stroke-width="0.5"/>
  <line x1="250" y1="400" x2="550" y2="400" stroke="#151212" stroke-width="0.5"/>
  
  <!-- Drying rack in foreground -->
  <rect x="80" y="100" width="120" height="5" fill="#2a2525" rx="2"/>
  <line x1="100" y1="105" x2="100" y2="280" stroke="#2a2525" stroke-width="2"/>
  <line x1="180" y1="105" x2="180" y2="280" stroke="#2a2525" stroke-width="2"/>
  <line x1="100" y1="280" x2="180" y2="280" stroke="#2a2525" stroke-width="2"/>
  
  <!-- Hanging clothes on rack -->
  <path d="M100,105 L100,180 L115,175 L130,180 L130,105" fill="#1e1a1a" stroke="#2a2525" stroke-width="0.5"/>
  <path d="M130,105 L130,160 L145,155 L160,160 L160,105" fill="#1e1a1a" stroke="#2a2525" stroke-width="0.5"/>
  <path d="M160,105 L160,190 L175,185 L180,190 L180,105" fill="#1e1a1a" stroke="#2a2525" stroke-width="0.5"/>
  
  <!-- Water drops from clothes -->
  <ellipse cx="130" cy="200" rx="1" ry="3" fill="#1a1820" opacity="0.6"/>
  <ellipse cx="160" cy="210" rx="1" ry="2" fill="#1a1820" opacity="0.4"/>
  
  <!-- Dim corridor light -->
  <circle cx="400" cy="60" r="25" fill="#1a1510" opacity="0.3"/>
  <circle cx="400" cy="60" r="15" fill="#2a2015" opacity="0.4"/>
  <ellipse cx="400" cy="85" rx="40" ry="120" fill="#1a1510" opacity="0.08"/>
  
  <!-- Long corridor stretching into darkness -->
  <rect x="300" y="180" width="200" height="100" fill="#0a0808"/>
  
  <!-- Shadowy figure at far end of corridor -->
  <!-- Body -->
  <path d="M460,200 L465,260 L470,260 L475,200" fill="#0f0d0d" stroke="none"/>
  <!-- Long neck -->
  <line x1="467" y1="200" x2="468" y2="170" stroke="#0f0d0d" stroke-width="6"/>
  <!-- Head -->
  <ellipse cx="468" cy="168" rx="8" ry="10" fill="#0f0d0d"/>
  <!-- Long arms reaching forward -->
  <path d="M465,210 Q440,220 420,230" stroke="#0f0d0d" stroke-width="3" fill="none"/>
  <path d="M470,210 Q490,220 510,225" stroke="#0f0d0d" stroke-width="3" fill="none"/>
  <!-- Legs -->
  <line x1="467" y1="260" x2="460" y2="300" stroke="#0f0d0d" stroke-width="4"/>
  <line x1="473" y1="260" x2="480" y2="300" stroke="#0f0d0d" stroke-width="4"/>
  
  <!-- Dropping clothes on the floor -->
  <path d="M430,290 L435,285 L440,290 L438,295 L432,295 Z" fill="#1a1818" opacity="0.5"/>
  
  <!-- Water trail from clothes to stairs -->
  <path d="M435,295 Q440,310 445,330 Q450,350 455,370" stroke="#151318" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M445,370 Q450,390 455,410" stroke="#151318" stroke-width="0.5" fill="none" opacity="0.2"/>
  
  <!-- Staircase hint at far end -->
  <rect x="480" y="280" width="40" height="5" fill="#121010"/>
  <rect x="480" y="290" width="35" height="5" fill="#121010"/>
  <rect x="480" y="300" width="30" height="5" fill="#121010"/>
  
  <!-- Apartment door silhouettes -->
  <rect x="200" y="150" width="40" height="80" fill="#0f0d0d" rx="1"/>
  <rect x="560" y="150" width="40" height="80" fill="#0f0d0d" rx="1"/>
  
  <!-- Door numbers -->
  <text x="218" y="165" font-size="8" fill="#1a1818" text-anchor="middle">3</text>
  <text x="578" y="165" font-size="8" fill="#1a1818" text-anchor="middle">4</text>
  
  <!-- Vignette effect - darker edges -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" opacity="0.5"/>
  
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  
  <!-- Subtle atmospheric haze -->
  <rect x="350" y="150" width="100" height="150" fill="#0f0d0d" opacity="0.15"/>
</svg>