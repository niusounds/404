<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background: dark corridor -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Corridor perspective lines -->
  <line x1="0" y1="0" x2="350" y2="150" stroke="#1a1515" stroke-width="1"/>
  <line x1="800" y1="0" x2="450" y2="150" stroke="#1a1515" stroke-width="1"/>
  <line x1="0" y1="450" x2="350" y2="300" stroke="#1a1515" stroke-width="1"/>
  <line x1="800" y1="450" x2="450" y2="300" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Corridor walls -->
  <polygon points="0,0 350,150 350,300 0,450" fill="#0d0a0a" stroke="#1a1515" stroke-width="0.5"/>
  <polygon points="800,0 450,150 450,300 800,450" fill="#0d0a0a" stroke="#1a1515" stroke-width="0.5"/>
  <polygon points="0,450 350,300 450,300 800,450" fill="#0f0c0c" stroke="#1a1515" stroke-width="0.5"/>
  
  <!-- Door frame at the end of corridor -->
  <rect x="340" y="80" width="120" height="220" rx="2" fill="#151111" stroke="#2a2222" stroke-width="2"/>
  <!-- Door -->
  <rect x="345" y="85" width="110" height="215" rx="1" fill="#1a1515" stroke="#252020" stroke-width="1"/>
  
  <!-- Door gap light -->
  <rect x="452" y="85" width="3" height="215" fill="#2a2525"/>
  
  <!-- Green LED glow from inside (through the gap) -->
  <ellipse cx="460" cy="195" rx="30" ry="80" fill="#00ff66" opacity="0.04"/>
  <ellipse cx="455" cy="195" rx="15" ry="60" fill="#00ff66" opacity="0.06"/>
  
  <!-- Green blink indicator light -->
  <circle cx="425" cy="120" r="3" fill="#00ff66" opacity="0.8"/>
  <circle cx="425" cy="120" r="8" fill="#00ff66" opacity="0.15"/>
  
  <!-- Washing machine silhouette visible through door window -->
  <rect x="365" y="140" width="70" height="100" rx="8" fill="#1e1a1a" stroke="#2a2525" stroke-width="1"/>
  <!-- Washing machine glass window -->
  <circle cx="400" cy="190" r="28" fill="#1a1818" stroke="#2a2525" stroke-width="1"/>
  <!-- Steam/fog inside the glass -->
  <ellipse cx="395" cy="185" rx="22" ry="20" fill="#3a3535" opacity="0.3"/>
  <ellipse cx="405" cy="195" rx="18" ry="15" fill="#4a4545" opacity="0.2"/>
  
  <!-- Floor reflection of green light -->
  <ellipse cx="400" cy="340" rx="50" ry="8" fill="#00ff66" opacity="0.03"/>
  
  <!-- Flickering light effect lines -->
  <line x1="390" y1="100" x2="410" y2="100" stroke="#00ff66" stroke-width="0.5" opacity="0.1"/>
  <line x1="385" y1="105" x2="415" y2="105" stroke="#00ff66" stroke-width="0.3" opacity="0.05"/>
  
  <!-- Subtle dust particles -->
  <circle cx="370" cy="250" r="0.8" fill="#3a3535" opacity="0.4"/>
  <circle cx="430" cy="270" r="0.6" fill="#3a3535" opacity="0.3"/>
  <circle cx="390" cy="290" r="0.7" fill="#3a3535" opacity="0.35"/>
  <circle cx="420" cy="310" r="0.5" fill="#3a3535" opacity="0.25"/>
  <circle cx="360" cy="300" r="0.6" fill="#3a3535" opacity="0.3"/>
  
  <!-- Vignette: darker edges -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.5"/>
  
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
