<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="1.5"/></filter>
    <pattern id="lines" width="40" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(3)">
      <line x1="0" y1="10" x2="40" y2="10"/>
      <circle cx="5" cy="10" r="1.2" fill="#0a0808"/>
    </pattern>
  </defs>

  <!-- Background: dark hospital room -->
  <rect width="200" height="160" rx="4"/>
  <rect x="35" y="55" width="90" height="50" fill="#080606" rx="1"/>

  <!-- Bed frame -->
  <g stroke="#0a0808" stroke-opacity=".4">
    <line x1="20" y1="30" x2="20" y2="28"/>
    <line x1="165" y1="28" x2="170" y2="28"/>
  </g>

  <!-- Patient silhouette (barely visible) -->
  <ellipse cx="80" cy="72" rx="14" ry="9" fill="#0a0808">
    <animate attributeName="fill" values="#0a0808;#0c0a0a" keyTimes="0;.5;1"
             durations="3s 3s 6s" calcMode="discrete"/>
  </ellipse>

  <!-- The "something else in the room" (faint figure, barely) -->
  <rect y="48" width="2.5" height="22" fill="#0c0a0a" rx=".8">
    <animate attributeName="opacity" values="1;.3" keyTimes="0;.7;1"
             durations=".6s .9s 1.5s" calcMode="discrete"/>
    <animate attributeName="x" values="23.5;24;25;24;24.25" keyTimes="0;.08;1"
             durations=".6s 1.5s" calcMode="discrete"/>
  </rect>

  <!-- Blanket with subtle pattern -->
  <rect x="93" y="73" width="13" height="22" fill="url(#lines)" opacity=".5"/>

  <!-- Monitoring line (faint flatline) -->
  <polyline points="40,82 65,82 70,82 75,32 80,68 85,55 90,61 95,64 100,25 105,25"
            fill="none" stroke="#0c0606" stroke-width=".5"></polyline>

  <!-- Empty space on right (the "gap") -->
  <rect x="135" y="78" width="40" height="9" fill="url(#lines)" opacity=".2"/>
</svg>
