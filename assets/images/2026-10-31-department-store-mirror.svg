<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1414"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Floor -->
  <rect x="0" y="340" width="800" height="110" fill="#080606" opacity="0.8"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#1a1515" stroke-width="1"/>

  <!-- Three mirror frames -->
  <!-- Left mirror -->
  <rect x="80" y="40" width="180" height="300" fill="none" stroke="#2a2525" stroke-width="3" rx="4"/>
  <rect x="82" y="42" width="176" height="296" fill="#141111" opacity="0.9"/>

  <!-- Center mirror (main) -->
  <rect x="290" y="30" width="220" height="320" fill="none" stroke="#3a3530" stroke-width="4" rx="4"/>
  <rect x="292" y="32" width="216" height="316" fill="#1a1717" opacity="0.9"/>

  <!-- Right mirror -->
  <rect x="520" y="40" width="180" height="300" fill="none" stroke="#2a2525" stroke-width="3" rx="4"/>
  <rect x="522" y="42" width="176" height="296" fill="#141111" opacity="0.9"/>

  <!-- Center mirror reflection - person silhouette (slightly offset to create unease) -->
  <!-- Main person in center mirror -->
  <g transform="translate(400, 200)">
    <!-- Head -->
    <ellipse cx="0" cy="-100" rx="22" ry="26" fill="#1e1a1a"/>
    <!-- Body -->
    <path d="M-25,-75 L-30,20 L-15,20 L-10,-75 Z" fill="#1e1a1a"/>
    <path d="M25,-75 L30,20 L15,20 L10,-75 Z" fill="#1e1a1a"/>
    <path d="M-20,-75 L20,-75 L25,30 L-25,30 Z" fill="#1e1a1a"/>
    <!-- Arms slightly out -->
    <path d="M-25,-65 L-45,-30 L-40,-25 L-22,-58 Z" fill="#1e1a1a"/>
    <path d="M25,-65 L45,-30 L40,-25 L22,-58 Z" fill="#1e1a1a"/>
    <!-- Legs -->
    <path d="M-15,30 L-20,100 L-8,100 L-5,30 Z" fill="#1e1a1a"/>
    <path d="M5,30 L8,100 L20,100 L15,30 Z" fill="#1e1a1a"/>
  </g>

  <!-- Left mirror reflection - person silhouette (slightly delayed/offset) -->
  <g transform="translate(170, 203)" opacity="0.7">
    <ellipse cx="0" cy="-100" rx="22" ry="26" fill="#2a2525"/>
    <path d="M-25,-75 L-30,20 L-15,20 L-10,-75 Z" fill="#2a2525"/>
    <path d="M25,-75 L30,20 L15,20 L10,-75 Z" fill="#2a2525"/>
    <path d="M-20,-75 L20,-75 L25,30 L-25,30 Z" fill="#2a2525"/>
    <path d="M-25,-65 L-45,-30 L-40,-25 L-22,-58 Z" fill="#2a2525"/>
    <path d="M25,-65 L45,-30 L40,-25 L22,-58 Z" fill="#2a2525"/>
    <path d="M-15,30 L-20,100 L-8,100 L-5,30 Z" fill="#2a2525"/>
    <path d="M5,30 L8,100 L20,100 L15,30 Z" fill="#2a2525"/>
  </g>

  <!-- Right mirror reflection - person silhouette (also offset) -->
  <g transform="translate(610, 203)" opacity="0.7">
    <ellipse cx="0" cy="-100" rx="22" ry="26" fill="#2a2525"/>
    <path d="M-25,-75 L-30,20 L-15,20 L-10,-75 Z" fill="#2a2525"/>
    <path d="M25,-75 L30,20 L15,20 L10,-75 Z" fill="#2a2525"/>
    <path d="M-20,-75 L20,-75 L25,30 L-25,30 Z" fill="#2a2525"/>
    <path d="M-25,-65 L-45,-30 L-40,-25 L-22,-58 Z" fill="#2a2525"/>
    <path d="M25,-65 L45,-30 L40,-25 L22,-58 Z" fill="#2a2525"/>
    <path d="M-15,30 L-20,100 L-8,100 L-5,30 Z" fill="#2a2525"/>
    <path d="M5,30 L8,100 L20,100 L15,30 Z" fill="#2a2525"/>
  </g>

  <!-- Center mirror subtle eerie glow -->
  <rect x="292" y="32" width="216" height="316" fill="#2a2222" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Subtle vertical delay indicator - faint line in center mirror -->
  <line x1="400" y1="30" x2="400" y2="350" stroke="#3a2a2a" stroke-width="0.5" opacity="0.4" filter="url(#glow)"/>

  <!-- Hanging clothes rack hint at bottom -->
  <line x1="300" y1="330" x2="500" y2="330" stroke="#1a1515" stroke-width="2"/>
  <line x1="330" y1="330" x2="330" y2="360" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="400" y1="330" x2="400" y2="355" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="470" y1="330" x2="470" y2="360" stroke="#1a1515" stroke-width="1.5"/>

  <!-- Small garment silhouettes on hangers -->
  <path d="M325,360 L325,380 L335,380 L335,360 Z" fill="#151212" opacity="0.6"/>
  <path d="M395,355 L395,375 L405,375 L405,355 Z" fill="#151212" opacity="0.6"/>
  <path d="M465,360 L465,380 L475,380 L475,360 Z" fill="#151212" opacity="0.6"/>

  <!-- Ambient dim overhead light -->
  <ellipse cx="400" cy="10" rx="60" ry="8" fill="#2a2520" opacity="0.6"/>
  <line x1="400" y1="2" x2="400" y2="10" stroke="#2a2520" stroke-width="1"/>

  <!-- Subtle red tint in center mirror - hint of wrongness -->
  <rect x="292" y="32" width="216" height="316" fill="#2a1010" opacity="0.05"/>
</svg>
