<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff483818"/>
      <stop offset="100%" stop-color="#0a0808aa"/>
    </radialGradient>
    <filter id="ghostGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050308"/>
      <stop offset="40%" stop-color="#0a0810"/>
      <stop offset="70%" stop-color="#1a0e1a30"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Subtle mist layer -->
  <ellipse cx="400" cy="320" rx="350" ry="60" fill="#ff001a08" filter="url(#ghostGlow)" opacity="0.3"/>
  <ellipse cx="200" y="350" rx="150" cy="350" ry="45" fill="#ffffff06" filter="url(#ghostGlow)" opacity="0.25"/>

  <!-- Dead ground -->
  <rect x="0" y="340" width="800" height="110" fill="#0d090b"/>
  <line x1="0" y1="340" x2="800" y2="352" stroke="#1a1216" stroke-width="1.5"/>

  <!-- Ghostly tree trunk - left center -->
  <g>
    <!-- Main vertical body - looks like an upraised arm/body emerging from ground -->
    <rect x="340" y="280" width="65" height="70" rx="8" fill="#120d10"/>
    <rect x="340" y="280" width="65" height="70" rx="8" fill="none" stroke="#2a20288" stroke-width="0.8"/>

    <!-- Carved name markings on bark -->
    <text x="365" y="304" text-anchor="middle" font-size="11" fill="#8b79a04" font-family="serif">MARIA</text>
    <text x="365" y="320" text-anchor="middle" font-size="11" fill="#8b79a03" font-family="serif">JOSÉ</text>

    <!-- Branching arms/limbs -->
    <path d="M 405 300 Q 460 280, 490 235" fill="none" stroke="#1a5d6d28" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 440 275 Q 475 240, 505 210" fill="none" stroke="#1a5d6d18" stroke-width="3" stroke-linecap="round"/>

    <!-- White ghostly flowers at branch tips -->
    <ellipse cx="490" cy="237" rx="12" ry="15" fill="#ffffffaa" filter="url(#ghostGlow)" opacity="0.7"/>
    <ellipse cx="505" cy="215" rx="9" ry="12" fill="#ffffffaa" filter="url(#ghostGlow)" opacity="0.5"/>
    <ellipse cx="485" cy="260" rx="8" ry="10" fill="#ffffffaa" filter="url(#ghostGlow)" opacity="0.6"/>

    <!-- Subtle red glow inside flowers -->
    <circle cx="490" cy="237" r="4" fill="#ff1a44ff">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Dead tree - left -->
  <g opacity="0.95">
    <rect x="170" y="220" width="30" height="80" rx="4" fill="#0c1620"/>
    <path d="M 185 240 Q 130 210, 95 185" fill="none" stroke="#13455d18" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 200 260 Q 230 230, 260 195" fill="none" stroke="#13455d10" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Pale flowers on dead tree -->
    <ellipse cx="105" cy="190" rx="6" ry="7" fill="#ffffffcc" filter="url(#ghostGlow)" opacity="0.65"/>
    <ellipse cx="268" cy="198" rx="5" ry="6" fill="#ffffffbb" filter="url(#ghostGlow)" opacity="0.55"/>

    <!-- Small red dot - fruit -->
    <circle cx="267" cy="195" r="4" fill="#ff3a5dff">
      <animate attributeName="r" values="3;4.5;3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Dead tree - right -->
  <g opacity="0.8">
    <rect x="575" y="250" width="24" height="60" rx="3" fill="#0c1620"/>
    <path d="M 590 265 Q 620 240, 650 210" fill="none" stroke="#13455d15" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 575 290 Q 548 265, 520 238" fill="none" stroke="#13455d10" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Pale flowers -->
    <ellipse cx="655" cy="214" rx="7" ry="9" fill="#ffffffaa" filter="url(#ghostGlow)" opacity="0.5"/>
    <ellipse cx="530" cy="243" rx="5" ry="6" fill="#ffffffaa" filter="url(#ghostGlow)" opacity="0.45"/>

    <!-- Fruit -->
    <circle cx="555" cy="272" r="3" fill="#ff1a2add">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Far background trees silhouettes -->
  <rect x="62" y="310" width="12" height="45" rx="2" fill="#081216" opacity="0.7"/>
  <path d="M 68 315 Q 52 295, 40 280" fill="none" stroke="#080c0eaa" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="710" y="305" width="10" height="48" rx="2" fill="#081216" opacity="0.6"/>
  <path d="M 715 310 Q 732 292, 745 274" fill="none" stroke="#080c0eaa" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Ghostly moon - partial -->
  <circle cx="300" cy="80" r="42" fill="#f5f2ed30">
    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="316" cy="75" r="38" fill="#0a0810aa"/>

  <!-- Fainter moon glow -->
  <circle cx="300" cy="80" r="55" fill="none" stroke="#c4b4ff2" stroke-width="1.5"/>

  <!-- Mist particles on ground -->
  <ellipse cx="150" cy="365" rx="25" ry="4" fill="#eef8ff6" opacity="0.5"/>
  <ellipse cx="650" y="370" rx="30" ry="5" fill="#eef8ff4" opacity="0.4"/>

  <!-- Small red fruit dots on ground - scattered -->
  <circle cx="290" cy="355" r="2.5" fill="#cc1a2abb">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" y="360" r="2" fill="#cc1a4abb">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Decorative gothic border -->
  <rect x="14" y="14" width="772" height="422" rx="6" fill="none" stroke="#3d001a" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="410" rx="4" fill="none" stroke="#5a004b8" stroke-width="0.8"/>

  <!-- Corner ornaments -->
  <path d="M 30 30 L 50 30 Q 59 30 59 39 L 59 50 M 40 40 H 25 V 6" fill="none" stroke="#8b2f5c1" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 746 30 L 730 30 Q 721 30 721 39 L 721 50 M 740 40 H 755 V 6" fill="none" stroke="#8b2f5ca6" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 30 404 L 50 404 Q 745 420 5 9 M 40 420 H 25 V" fill="none" stroke="#8b2f5c7" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Title text at bottom -->
  <text transform="translate(400 420)" x="0" y="425">Huerto de los Muertos</text>
  <tspan x="400" font-size="13" fill="#a0b4ff8" font-family="'Courier New', monospace" letter-spacing="8">死園〜ヒュエルタ・デ・ロス・ムエルトス〜</tspan>

  <!-- Small decorative dots along border -->
  <circle cx="40" cy="380" r="1.5" fill="#ff2a5b6">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- More ghostly mist wisps -->
  <ellipse cx="320" ry="6" cy="335" rx="18" fill="#ffffffaa" opacity="0.08">
    <animate attributeName="cx" values="320;340;320" dur="12s" repeatCount="indefinite"/>
  </ellipse>

</svg>
