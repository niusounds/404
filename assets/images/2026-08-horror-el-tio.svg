<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- cave opening silhouette -->
  <ellipse cx="400" cy="195" rx="310" ry="170" fill="#080505" opacity="0.7"/>

  <!-- El Tio throne figure (stylized demonic entity from Bolivian miners) -->
  <g transform="translate(400,290)">
    <!-- throne backrest -->
    <rect x="-65" y="-185" width="130" height="185" rx="8" fill="#1e1010" stroke="#444" stroke-width="1.5"/>

    <!-- face mask - pale, skull-like -->
    <ellipse cx="2" cy="-145" ry="65" rx="42" fill="#d9cfc1"/>
    <rect x="-38" y="0" width="80" height="70" rx="22" fill="#e5dccf"/>

    <!-- eyes: hollow black sockets -->
    <ellipse cx="-18" cy="-160" ry="14" rx="12" fill="#111"/>
    <ellipse cx="22" cy="-160" ry="13" rx="11" fill="#222"/>

    <!-- small horn pair from crown -->
    <path d="M-15,-195 Q-40,-275 -5,-260" stroke="#b8a0c0" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M26,-190 Q56,-275 35,-260" stroke="#bb9fc4" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- crown/ornamental dots on throne headpiece -->
    <rect x="-38" y="-130" width="6" height="4" rx="2" fill="#f0d060"/>
    <rect x="-26" y="-134" width="5" height="3" rx="1.5" fill="#e0a030"/>
    <rect x="-14" y="-137" width="5" height="3" rx="1.5" fill="#f5d870"/>

    <!-- open mouth with visible teeth fangs -->
    <path d="M-20,-95 L-30,-75 Q-16,-72 -4,-96" stroke="#aaa" fill="#886a6a" stroke-linejoin="round"/>
    <circle cx="-31" cy="-72" r="3.5" fill="#eee"/>

    <!-- protruding red tongue -->
    <ellipse cx="8" cy="-77" rx="14" ry="9" fill="#c00a0a" opacity="0.85"/>

    <!-- belly hole - miners say this is where offerings go -->
    <circle cx="0" cy="-25" r="22" fill="#735e3b" stroke="#4a2f1f" stroke-width="2.5"/>

    <!-- cigarette in mouth -->
    <line x1="-15" y1="-82" x2="-48" y2="-65" stroke="#ddd" width="2.5" stroke-linecap="round"/>
    <ellipse cx="-50" cy="-63" rx="6.5" ry="9.5" fill="#ccf0ff">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- rough legs base -->
    <path d="M-22,75 L-38,160 L-6,-85" stroke="#d9cfc1" fill="none" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- offering bowl glow under throne -->
  <circle cx="0" cy="-25" r="45" fill="none" stroke="#e8a030" stroke-width="1.2" opacity="0.2">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- candles flickering at edges -->
  <g transform="translate(175,395)">
    <rect x="-8" y="20" width="16" height="65" rx="4" fill="#d8a840"/>
    <ellipse cx="0" cy="15" ry="11" rx="8" fill="#ffaa30">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </ellipse>

  </g>
  <!-- candle on right side -->
  <line x1="648" y1="370" x2="680" y2="415" stroke="#ccc" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="643" cy="368" rx="5" ry="3.5" fill="#a0d0ff">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- scattered offerings on cave floor -->
  <rect x="318" y="445" width="7.5" height="6" rx="1.5" fill="#eee"/>
  <ellipse cx="462" cy="449" rx="9" ry="4" fill="#eab04f"/>

  <!-- gothic frame border -->
  <rect x="18" y="18" width="764" height="415" rx="8" fill="none" stroke="#2d0a4b" stroke-width="2.5"/>
  <line x1="400" y1="-3" x2="400" y2="30" stroke="#781ba6" stroke-width="1.5"/>
  <circle cx="25" cy="25" r="8.5" fill="none" stroke="#ff3a7e" stroke-width="1.2"/>
  <line x1="400" y1="-3" x2="400" y2="30" stroke="#7b2aa6" stroke-width="1.8"/>

</svg>
