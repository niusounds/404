<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e16"/>
      <stop offset="70%;" style="stop-color:#0d1a28"/>
      <stop offset="100%" style="stop-color:#141f30"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%;" style="stop-color:#c8dbe6;stop-opacity:0.9"/>
      <stop offset="100%;" style="stop-color:#7a8b91;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Sky gradient -->
  <rect x="0" y="0" width="800" height="280" fill="#0d1117"/>
  
  <!-- Moon glow -->
  <circle cx="650" cy="100" r="80" fill="url(#moon)"/>
  <circle cx="650" cy="100" r="32" fill="#b4c4d0" opacity="0.7"/>
  <circle cx="658" cy="95" r="30" fill="#0d1117"/>
  
  <!-- Clouds -->
  <path d="M 150,80 Q 200,60 260,75 Q 310,50 360,70 L 400,90 Q 340,75 280,95 Q 220,85 150,80Z" fill="#1a2130" opacity="0.5"/>
  <path d="M 500,60 Q 540,40 600,55 Q 650,45 700,60 L 730,80 Q 670,65 610,80 Q 550,70 500,60Z" fill="#1a2130" opacity="0.4"/>
  
  <!-- Sea -->
  <rect x="0" y="270" width="800" height="180" fill="url(#water)"/>
  
  <!-- Waves - back layer -->
  <path d="M 0,290 Q 50,270 100,290 T 200,290 T 300,290 T 400,290 T 500,290 T 600,290 T 700,290 T 800,310" stroke="#1a2d45" fill="none" stroke-width="1.5"/>
  <path d="M -50,320 Q 25,300 100,320 T 250,320 T 400,320 T 550,320 T 700,320 T 850,340" stroke="#1e3350" fill="none" stroke-width="1.5"/>
  
  <!-- Wave highlights -->
  <path d="M 100,320 Q 150,305 200,320 T 300,320" stroke="#2a4a6b" fill="none" stroke-width="1" opacity="0.6"/>
  <path d="M 450,340 Q 500,328 550,340 T 650,340" stroke="#2a4a6b" fill="none" stroke-width="1" opacity="0.5"/>
  
  <!-- Lighthouse silhouette -->
  <rect x="370" y="120" width="60" height="150" fill="#1a1e28" rx="2"/>
  <path d="M 360,120 L 400,90 L 440,120Z" fill="#222830"/>
  <rect x="385" y="90" width="30" height="30" rx="3" fill="#d4c5a0" opacity="0.6"/>
  <!-- Lighthouse beam -->
  <path d="M 415,105 Q 520,85 650,100 L 670,105 Q 530,90 415,105Z" fill="#f0e8d0" opacity="0.15"/>
  <path d="M 415,105 Q 310,95 200,110 L 180,115 Q 270,95 400,105Z" fill="#f0e8d0" opacity="0.08"/>
  
  <!-- Ghostly figure in water - one arm reaching up -->
  <ellipse cx="310" cy="310" rx="25" ry="6" fill="#b4c4d0" opacity="0.15"/>
  <path d="M 295,308 L 325,308 Q 330,270 315,255 Q 310,250 305,260 L 295,270" fill="#c4d0dd" opacity="0.5"/>
  <!-- Hair flowing -->
  <path d="M 300,258 Q 285,248 290,235 L 293,240 Q 310,230 315,250" fill="#1a2a3a" opacity="0.5"/>
  <path d="M 305,260 Q 320,250 325,240 L 328,245 Q 310,235 310,255" fill="#1a2a3a" opacity="0.4"/>
  
  <!-- Bubbles -->
  <circle cx="325" cy="295" r="2.5" fill="#c4d0dd" opacity="0.3"/>
  <circle cx="318" cy="288" r="1.8" fill="#c4d0dd" opacity="0.25"/>
  <circle cx="331" cy="282" r="1.2" fill="#c4d0dd" opacity="0.2"/>
  
  <!-- More ghostly hands in water -->
  <path d="M 520,330 Q 540,305 560,310 L 558,300 Q 540,290 530,310 Z" fill="#a0b0c0" opacity="0.3"/>
  
  <!-- Title text -->
  <text x="400" y="400" text-anchor="middle" fill="#8aa1c0" font-size="48">JYLLANDS KVÄV</text>

  <!-- Border frame with gothic corners -->
  <rect x="12" y="12" width="776" height="426" rx="4" fill="none" stroke="#3d001a" stroke-width="2.5"/>
  <polygon points="12,8 18,12 12,16" fill="#ff0033"/>
  <polygon points="792,12 788,8 784,3" fill="#ff0033"/>
  <polygon points="12,435 12,442 6,435" fill="#ff0033"/>
  <polygon points="792,435 786,435 788,442" fill="#ff0033"/>
</svg>
