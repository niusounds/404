<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0c0c"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="adGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#141212"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121010"/>
      <stop offset="100%" stop-color="#0c0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Ceiling -->
  <rect x="0" y="0" width="800" height="80" fill="#080606"/>

  <!-- Fluorescent lights on ceiling -->
  <rect x="120" y="10" width="160" height="4" fill="#3a3535" rx="1"/>
  <rect x="120" y="10" width="160" height="4" fill="#5a5555" rx="1" opacity="0.6" filter="url(#softGlow)"/>
  <rect x="520" y="10" width="160" height="4" fill="#3a3535" rx="1"/>
  <rect x="520" y="10" width="160" height="4" fill="#5a5555" rx="1" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Light glow from fluorescent -->
  <ellipse cx="200" cy="90" rx="100" ry="60" fill="#1a1515" opacity="0.3"/>
  <ellipse cx="600" cy="90" rx="100" ry="60" fill="#1a1515" opacity="0.3"/>

  <!-- Wall -->
  <rect x="0" y="80" width="800" height="250" fill="#0d0b0b"/>

  <!-- Advertisement panels on wall -->
  <!-- Panel 1 (left) -->
  <rect x="60" y="100" width="200" height="200" fill="url(#adGrad)" stroke="#1a1818" stroke-width="1" rx="2"/>
  <rect x="70" y="110" width="180" height="180" fill="#161414" rx="1"/>
  <!-- Panel 2 (center-right) -->
  <rect x="300" y="100" width="200" height="200" fill="url(#adGrad)" stroke="#1a1818" stroke-width="1" rx="2"/>
  <rect x="310" y="110" width="180" height="180" fill="#161414" rx="1"/>
  <!-- Panel 3 (right) -->
  <rect x="540" y="100" width="200" height="200" fill="url(#adGrad)" stroke="#1a1818" stroke-width="1" rx="2"/>
  <rect x="550" y="110" width="180" height="180" fill="#161414" rx="1"/>

  <!-- Glossy reflection on panels -->
  <rect x="310" y="110" width="180" height="180" fill="#1e1c1c" opacity="0.4" rx="1"/>

  <!-- Platform edge line -->
  <rect x="0" y="330" width="800" height="3" fill="#2a2520" opacity="0.8"/>
  <rect x="0" y="333" width="800" height="1" fill="#3a3530" opacity="0.3"/>

  <!-- Floor -->
  <rect x="0" y="335" width="800" height="115" fill="url(#floorGrad)"/>

  <!-- Floor tiles -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#141212" stroke-width="0.5"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#141212" stroke-width="0.5"/>

  <!-- Person silhouette (protagonist) - standing in front of center panel -->
  <g transform="translate(380, 180)">
    <!-- Head -->
    <circle cx="30" cy="0" r="12" fill="#060505"/>
    <!-- Body -->
    <path d="M18,15 Q15,50 10,120 L50,120 Q45,50 42,15 Z" fill="#060505"/>
    <!-- Legs -->
    <rect x="15" y="118" width="10" height="50" fill="#060505" rx="2"/>
    <rect x="35" y="118" width="10" height="50" fill="#060505" rx="2"/>
  </g>

  <!-- Reflection in the glossy panel (center panel) -->
  <!-- The reflection shows the person PLUS an extra shadow figure -->
  <g transform="translate(330, 140)" opacity="0.25">
    <!-- Reflection of protagonist (slightly distorted) -->
    <circle cx="60" cy="10" r="10" fill="#1a1818"/>
    <path d="M48,25 Q45,60 40,130 L80,130 Q75,60 72,25 Z" fill="#1a1818"/>
    <rect x="50" y="128" width="8" height="45" fill="#1a1818" rx="1"/>
    <rect x="68" y="128" width="8" height="45" fill="#1a1818" rx="1"/>
  </g>

  <!-- THE EXTRA SHADOW - standing beside the reflection, barely visible -->
  <!-- This is the horror element: a shadow figure next to the protagonist's reflection -->
  <g transform="translate(430, 155)" opacity="0.18">
    <!-- Head - slightly tilted -->
    <ellipse cx="15" cy="-5" rx="11" ry="13" fill="#050404"/>
    <!-- Body - leaning slightly toward the reflection -->
    <path d="M5,10 Q2,55 -2,110 L30,110 Q28,55 25,10 Z" fill="#050404"/>
    <!-- Legs -->
    <rect x="2" y="108" width="8" height="48" fill="#050404" rx="2"/>
    <rect x="20" y="108" width="8" height="48" fill="#050404" rx="2"/>
    <!-- Arms - one slightly raised -->
    <path d="M5,20 Q-8,35 -5,60" stroke="#050404" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M25,20 Q35,35 33,55" stroke="#050404" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Eyes of the shadow figure - barely visible, just two tiny points -->
  <circle cx="447" cy="153" r="1" fill="#0a0a0a" opacity="0.6"/>
  <circle cx="453" cy="153" r="1" fill="#0a0a0a" opacity="0.6"/>

  <!-- Subtle eerie glow around the shadow figure -->
  <ellipse cx="445" cy="200" rx="30" ry="80" fill="#0a0808" opacity="0.15"/>

  <!-- Platform edge glow -->
  <rect x="0" y="330" width="800" height="2" fill="#2a2520" opacity="0.5" filter="url(#glow)"/>

  <!-- Distant station elements - pillars -->
  <rect x="250" y="80" width="15" height="250" fill="#0b0909"/>
  <rect x="550" y="80" width="15" height="250" fill="#0b0909"/>

  <!-- Emergency call button box -->
  <rect x="255" y="280" width="8" height="12" fill="#1a1515" rx="1"/>
  <circle cx="259" cy="286" r="2" fill="#2a1515" opacity="0.5"/>

  <!-- Train tracks hint at the very bottom -->
  <rect x="0" y="448" width="800" height="2" fill="#0a0808"/>
  <line x1="0" y1="447" x2="800" y2="447" stroke="#0e0c0c" stroke-width="0.5"/>

  <!-- Overall dark vignette -->
  <rect width="800" height="450" fill="none"/>
  <rect width="800" height="450" fill="#000" opacity="0.15" style="mix-blend-mode: multiply;"/>

  <!-- Very subtle text on ad panel (just lines to suggest text) -->
  <rect x="330" y="130" width="140" height="2" fill="#1e1c1c" opacity="0.5"/>
  <rect x="330" y="138" width="100" height="2" fill="#1e1c1c" opacity="0.3"/>
  <rect x="330" y="146" width="120" height="2" fill="#1e1c1c" opacity="0.3"/>
  <rect x="330" y="160" width="80" height="30" fill="#1a1818" opacity="0.4" rx="2"/>
</svg>
