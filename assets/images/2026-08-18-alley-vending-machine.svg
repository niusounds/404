<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background: dark alley -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Alley walls -->
  <rect x="0" y="0" width="120" height="450" fill="#0d0a0a"/>
  <rect x="680" y="0" width="120" height="450" fill="#0d0a0a"/>
  
  <!-- Alley floor -->
  <rect x="120" y="320" width="560" height="130" fill="#111010"/>
  
  <!-- Floor perspective lines -->
  <line x1="180" y1="320" x2="140" y2="450" stroke="#1a1515" stroke-width="1"/>
  <line x1="250" y1="320" x2="200" y2="450" stroke="#1a1515" stroke-width="1"/>
  <line x1="550" y1="320" x2="600" y2="450" stroke="#1a1515" stroke-width="1"/>
  <line x1="620" y1="320" x2="660" y2="450" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Vending machine body -->
  <rect x="300" y="80" width="200" height="240" fill="#1a1a1e" stroke="#2a2a2e" stroke-width="2" rx="4"/>
  
  <!-- Vending machine top light strip -->
  <rect x="310" y="85" width="180" height="8" fill="#2a2a30" rx="2"/>
  
  <!-- Glass front glow -->
  <rect x="315" y="100" width="170" height="160" fill="#1a1a2e" rx="2"/>
  
  <!-- Internal glow -->
  <rect x="315" y="100" width="170" height="160" fill="none" stroke="#4a4a6a" stroke-width="1" rx="2" opacity="0.5"/>
  
  <!-- Drinks on shelves inside -->
  <!-- Top shelf drinks -->
  <rect x="330" y="115" width="18" height="45" fill="#2a4a2a" rx="2"/>
  <rect x="355" y="115" width="18" height="45" fill="#3a3a5a" rx="2"/>
  <rect x="380" y="115" width="18" height="45" fill="#2a4a2a" rx="2"/>
  <rect x="405" y="115" width="18" height="45" fill="#4a3a1a" rx="2"/>
  <rect x="430" y="115" width="18" height="45" fill="#2a4a2a" rx="2"/>
  <rect x="455" y="115" width="18" height="45" fill="#3a3a5a" rx="2"/>
  
  <!-- Middle shelf drinks -->
  <rect x="330" y="175" width="18" height="45" fill="#3a3a5a" rx="2"/>
  <rect x="355" y="175" width="18" height="45" fill="#2a4a2a" rx="2"/>
  <rect x="380" y="175" width="18" height="45" fill="#4a3a1a" rx="2"/>
  <rect x="405" y="175" width="18" height="45" fill="#2a4a2a" rx="2"/>
  <rect x="430" y="175" width="18" height="45" fill="#3a3a5a" rx="2"/>
  <rect x="455" y="175" width="18" height="45" fill="#4a3a1a" rx="2"/>
  
  <!-- Bottom shelf - the mysterious bottles -->
  <rect x="340" y="235" width="14" height="20" fill="#5a4a2a" rx="1"/>
  <rect x="365" y="235" width="14" height="20" fill="#5a4a2a" rx="1"/>
  <rect x="390" y="235" width="14" height="20" fill="#5a4a2a" rx="1"/>
  <rect x="415" y="235" width="14" height="20" fill="#5a4a2a" rx="1"/>
  
  <!-- Mysterious bottles with eerie glow -->
  <ellipse cx="347" cy="255" rx="8" ry="3" fill="#6a5a3a" opacity="0.6"/>
  <ellipse cx="372" cy="255" rx="8" ry="3" fill="#6a5a3a" opacity="0.6"/>
  <ellipse cx="397" cy="255" rx="8" ry="3" fill="#6a5a3a" opacity="0.6"/>
  <ellipse cx="422" cy="255" rx="8" ry="3" fill="#6a5a3a" opacity="0.6"/>
  
  <!-- Mysterious bottle glow -->
  <circle cx="347" cy="245" r="12" fill="#8a7a4a" opacity="0.15"/>
  <circle cx="372" cy="245" r="12" fill="#8a7a4a" opacity="0.15"/>
  <circle cx="397" cy="245" r="12" fill="#8a7a4a" opacity="0.15"/>
  <circle cx="422" cy="245" r="12" fill="#8a7a4a" opacity="0.15"/>
  
  <!-- Change tray area (empty/dark) -->
  <rect x="330" y="270" width="140" height="30" fill="#0a0a0a" rx="2"/>
  
  <!-- Coin slot -->
  <rect x="440" y="280" width="15" height="8" fill="#3a3a3a" rx="1"/>
  
  <!-- Selection buttons row -->
  <rect x="320" y="315" width="25" height="3" fill="#3a3a4a" rx="1"/>
  <rect x="350" y="315" width="25" height="3" fill="#3a3a4a" rx="1"/>
  <rect x="380" y="315" width="25" height="3" fill="#3a3a4a" rx="1"/>
  <rect x="410" y="315" width="25" height="3" fill="#3a3a4a" rx="1"/>
  <rect x="440" y="315" width="25" height="3" fill="#3a3a4a" rx="1"/>
  
  <!-- Button lights (mostly off, one flickering) -->
  <circle cx="332" cy="323" r="3" fill="#2a2a3a" opacity="0.3"/>
  <circle cx="362" cy="323" r="3" fill="#2a2a3a" opacity="0.3"/>
  <circle cx="392" cy="323" r="3" fill="#3a3a5a" opacity="0.5"/>
  <circle cx="422" cy="323" r="3" fill="#2a2a3a" opacity="0.3"/>
  <circle cx="452" cy="323" r="3" fill="#2a2a3a" opacity="0.3"/>
  
  <!-- Vending machine bottom -->
  <rect x="305" y="320" width="190" height="5" fill="#2a2a2e" rx="1"/>
  
  <!-- Light from vending machine on floor -->
  <polygon points="315,325 485,325 530,450 270,450" fill="#2a2a4a" opacity="0.08"/>
  
  <!-- Dripping melted coins - horror element -->
  <path d="M360,325 Q362,340 360,355" stroke="#6a5a2a" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M380,325 Q378,345 382,360" stroke="#6a5a2a" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M400,325 Q402,338 398,350" stroke="#6a5a2a" stroke-width="2" fill="none" opacity="0.35"/>
  
  <!-- Small puddle of melted coins at base -->
  <ellipse cx="380" cy="370" rx="30" ry="5" fill="#5a4a2a" opacity="0.2"/>
  
  <!-- Wall texture lines -->
  <line x1="120" y1="50" x2="120" y2="400" stroke="#151212" stroke-width="1"/>
  <line x1="680" y1="30" x2="680" y2="420" stroke="#151212" stroke-width="1"/>
  
  <!-- Small details: pipe on left wall -->
  <rect x="105" y="60" width="8" height="200" fill="#151515" rx="2"/>
  <rect x="103" y="60" width="12" height="5" fill="#1a1a1a" rx="1"/>
  <rect x="103" y="255" width="12" height="5" fill="#1a1a1a" rx="1"/>
  
  <!-- Distant light at end of alley -->
  <circle cx="400" cy="310" r="3" fill="#2a2a3a" opacity="0.3"/>
  
  <!-- Subtle vignette -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.4"/>
  
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
