<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Ceiling stain - large dark blotch near top center -->
  <ellipse cx="400" cy="120" rx="180" ry="90" fill="#0d0612" filter="url(#blur2)" opacity="0.8"/>
  <ellipse cx="380" cy="110" rx="120" ry="60" fill="#12081a" filter="url(#blur)" opacity="0.9"/>
  <ellipse cx="420" cy="130" rx="90" ry="45" fill="#160a1e" filter="url(#blur)" opacity="0.7"/>

  <!-- Dripping lines from stain -->
  <line x1="370" y1="160" x2="368" y2="220" stroke="#1a0e22" stroke-width="2" opacity="0.5"/>
  <line x1="400" y1="170" x2="402" y2="250" stroke="#1a0e22" stroke-width="2.5" opacity="0.4"/>
  <line x1="430" y1="165" x2="428" y2="200" stroke="#1a0e22" stroke-width="1.5" opacity="0.3"/>

  <!-- Door silhouette on right -->
  <rect x="580" y="100" width="120" height="350" fill="#080608" rx="2"/>
  <rect x="585" y="105" width="110" height="340" fill="#0c090c" rx="1"/>
  <!-- Door handle -->
  <circle cx="675" cy="280" r="5" fill="#1a1418"/>
  <circle cx="675" cy="280" r="3" fill="#2a1e28"/>

  <!-- Crack in wall from stain down to door -->
  <polyline points="400,170 395,200 405,230 398,260 402,290 395,320 400,350" 
            stroke="#1a0e22" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Footprint shadows on the floor area -->
  <ellipse cx="350" cy="380" rx="25" ry="12" fill="#0e0810" opacity="0.6" filter="url(#blur)"/>
  <ellipse cx="420" cy="390" rx="25" ry="12" fill="#0e0810" opacity="0.5" filter="url(#blur)"/>
  <ellipse cx="380" cy="410" rx="25" ry="12" fill="#0e0810" opacity="0.3" filter="url(#blur)"/>

  <!-- Subtle keyhole glow -->
  <ellipse cx="675" cy="280" rx="12" ry="18" fill="#1e0e2a" opacity="0.5" filter="url(#blur)"/>
  <ellipse cx="675" cy="280" rx="4" ry="6" fill="#2a1438" opacity="0.8"/>

  <!-- Thin vertical lines suggesting floorboards -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#0e0a0e" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="435" x2="800" y2="435" stroke="#0e0a0e" stroke-width="0.5" opacity="0.2"/>

  <!-- Dust particles -->
  <circle cx="300" cy="300" r="1" fill="#2a1a30" opacity="0.4"/>
  <circle cx="450" cy="250" r="0.8" fill="#2a1a30" opacity="0.3"/>
  <circle cx="350" cy="280" r="1.2" fill="#2a1a30" opacity="0.35"/>
  <circle cx="480" cy="310" r="0.7" fill="#2a1a30" opacity="0.25"/>
  <circle cx="250" cy="350" r="1" fill="#2a1a30" opacity="0.3"/>
  <circle cx="520" cy="270" r="0.9" fill="#2a1a30" opacity="0.2"/>
</svg>
