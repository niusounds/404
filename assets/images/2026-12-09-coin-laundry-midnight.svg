<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle floor gradient -->
  <rect x="0" y="320" width="800" height="130" fill="#0d0a0a"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1515" stroke-width="1"/>

  <!-- Ceiling light glow - cold fluorescent -->
  <ellipse cx="400" cy="0" rx="350" ry="80" fill="#1a1a2e" opacity="0.3"/>
  <ellipse cx="400" cy="0" rx="200" ry="50" fill="#1e1e3a" opacity="0.2"/>

  <!-- Row of coin laundry machines (6 machines) -->
  <!-- Machine 1 -->
  <rect x="30" y="100" width="100" height="220" rx="4" fill="#12121a" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="45" y="115" width="70" height="70" rx="35" fill="#0a0a12" stroke="#1a1a2a" stroke-width="1.5"/>
  <circle cx="80" cy="150" r="8" fill="#1a1a2a" stroke="#252535" stroke-width="0.5"/>
  <rect x="55" y="200" width="50" height="15" rx="2" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>
  <rect x="55" y="225" width="50" height="8" rx="1" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>

  <!-- Machine 2 -->
  <rect x="140" y="100" width="100" height="220" rx="4" fill="#12121a" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="155" y="115" width="70" height="70" rx="35" fill="#0a0a12" stroke="#1a1a2a" stroke-width="1.5"/>
  <circle cx="190" cy="150" r="8" fill="#1a1a2a" stroke="#252535" stroke-width="0.5"/>
  <rect x="165" y="200" width="50" height="15" rx="2" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>
  <rect x="165" y="225" width="50" height="8" rx="1" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>

  <!-- Machine 3 - THE HORROR MACHINE (faint eerie glow) -->
  <rect x="250" y="100" width="100" height="220" rx="4" fill="#12121a" stroke="#1e1e2a" stroke-width="1"/>
  <!-- Eerie inner glow -->
  <ellipse cx="290" cy="150" rx="38" ry="38" fill="#1a0a2e" opacity="0.4"/>
  <ellipse cx="290" cy="150" rx="25" ry="25" fill="#200a35" opacity="0.3"/>
  <rect x="265" y="115" width="70" height="70" rx="35" fill="#0a0a12" stroke="#2a1a3a" stroke-width="1.5"/>
  <circle cx="300" cy="150" r="8" fill="#1a1a2a" stroke="#252535" stroke-width="0.5"/>
  <!-- Spinning blur inside -->
  <ellipse cx="290" cy="150" rx="20" ry="20" fill="none" stroke="#2a1545" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="290" cy="150" rx="15" ry="15" fill="none" stroke="#2a1545" stroke-width="0.5" opacity="0.4"/>
  <rect x="275" y="200" width="50" height="15" rx="2" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>
  <rect x="275" y="225" width="50" height="8" rx="1" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>

  <!-- Machine 4 -->
  <rect x="360" y="100" width="100" height="220" rx="4" fill="#12121a" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="375" y="115" width="70" height="70" rx="35" fill="#0a0a12" stroke="#1a1a2a" stroke-width="1.5"/>
  <circle cx="410" cy="150" r="8" fill="#1a1a2a" stroke="#252535" stroke-width="0.5"/>
  <rect x="385" y="200" width="50" height="15" rx="2" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>
  <rect x="385" y="225" width="50" height="8" rx="1" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>

  <!-- Machine 5 -->
  <rect x="470" y="100" width="100" height="220" rx="4" fill="#12121a" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="485" y="115" width="70" height="70" rx="35" fill="#0a0a12" stroke="#1a1a2a" stroke-width="1.5"/>
  <circle cx="520" cy="150" r="8" fill="#1a1a2a" stroke="#252535" stroke-width="0.5"/>
  <rect x="495" y="200" width="50" height="15" rx="2" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>
  <rect x="495" y="225" width="50" height="8" rx="1" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>

  <!-- Machine 6 -->
  <rect x="580" y="100" width="100" height="220" rx="4" fill="#12121a" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="595" y="115" width="70" height="70" rx="35" fill="#0a0a12" stroke="#1a1a2a" stroke-width="1.5"/>
  <circle cx="630" cy="150" r="8" fill="#1a1a2a" stroke="#252535" stroke-width="0.5"/>
  <rect x="605" y="200" width="50" height="15" rx="2" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>
  <rect x="605" y="225" width="50" height="8" rx="1" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>

  <!-- Machine 7 (drier) -->
  <rect x="690" y="100" width="80" height="220" rx="4" fill="#12121a" stroke="#1e1e2a" stroke-width="1"/>
  <rect x="702" y="115" width="56" height="70" rx="28" fill="#0a0a12" stroke="#1a1a2a" stroke-width="1.5"/>
  <circle cx="730" cy="150" r="8" fill="#1a1a2a" stroke="#252535" stroke-width="0.5"/>
  <rect x="710" y="200" width="40" height="15" rx="2" fill="#151520" stroke="#1e1e2a" stroke-width="0.5"/>

  <!-- THE WATER DROPLET - key horror element -->
  <!-- Droplet trail -->
  <line x1="290" y1="188" x2="290" y2="210" stroke="#2a1a4a" stroke-width="0.5" opacity="0.3"/>
  <!-- Droplet itself - glowing -->
  <ellipse cx="290" cy="225" rx="3" ry="4.5" fill="#3a1a5a" opacity="0.8"/>
  <ellipse cx="290" cy="225" rx="2" ry="3" fill="#4a2a6a" opacity="0.6"/>
  <!-- Droplet reflection on floor -->
  <ellipse cx="290" cy="322" rx="6" ry="2" fill="#2a1a4a" opacity="0.15"/>
  <!-- Small splash -->
  <ellipse cx="290" cy="320" rx="4" ry="1" fill="#3a2a5a" opacity="0.1"/>

  <!-- Cold fluorescent light beam from ceiling -->
  <polygon points="350,0 450,0 430,320 370,320" fill="#1e1e35" opacity="0.04"/>

  <!-- Subtle ambient haze -->
  <rect x="0" y="0" width="800" height="450" fill="#0a0808" opacity="0.15"/>

  <!-- Very subtle machine number labels -->
  <text x="80" y="255" fill="#1a1a2a" font-family="monospace" font-size="10" text-anchor="middle">1</text>
  <text x="190" y="255" fill="#1a1a2a" font-family="monospace" font-size="10" text-anchor="middle">2</text>
  <text x="300" y="255" fill="#2a1a45" font-family="monospace" font-size="10" text-anchor="middle">3</text>
  <text x="410" y="255" fill="#1a1a2a" font-family="monospace" font-size="10" text-anchor="middle">4</text>
  <text x="520" y="255" fill="#1a1a2a" font-family="monospace" font-size="10" text-anchor="middle">5</text>
  <text x="630" y="255" fill="#1a1a2a" font-family="monospace" font-size="10" text-anchor="middle">6</text>
  <text x="730" y="255" fill="#1a1a2a" font-family="monospace" font-size="10" text-anchor="middle">7</text>
</svg>