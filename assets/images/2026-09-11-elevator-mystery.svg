<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="corridorLight" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1414"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Elevator interior (left side) -->
  <rect x="0" y="0" width="280" height="450" fill="#12101a"/>
  <rect x="0" y="0" width="280" height="450" fill="url(#corridorLight)" opacity="0.3"/>

  <!-- Elevator floor -->
  <rect x="0" y="340" width="280" height="110" fill="#0e0c14"/>
  <line x1="0" y1="340" x2="280" y2="340" stroke="#1a1820" stroke-width="1"/>

  <!-- Elevator buttons panel -->
  <rect x="230" y="120" width="40" height="160" rx="3" fill="#1a1825" stroke="#2a2535" stroke-width="0.5"/>
  <!-- Button rows -->
  <rect x="238" y="130" width="24" height="12" rx="2" fill="#2a2520"/>
  <rect x="238" y="150" width="24" height="12" rx="2" fill="#2a2520"/>
  <rect x="238" y="170" width="24" height="12" rx="2" fill="#2a2520"/>
  <rect x="238" y="190" width="24" height="12" rx="2" fill="#2a2520"/>
  <rect x="238" y="210" width="24" height="12" rx="2" fill="#2a2520"/>
  <rect x="238" y="230" width="24" height="12" rx="2" fill="#2a2520"/>
  <rect x="238" y="250" width="24" height="12" rx="2" fill="#2a2520"/>
  <rect x="238" y="270" width="24" height="12" rx="2" fill="#2a2520"/>
  <rect x="238" y="290" width="24" height="12" rx="2" fill="#2a2520"/>

  <!-- Open buttons (lit up in red) -->
  <rect x="238" y="130" width="24" height="12" rx="2" fill="#3a1515" filter="url(#glow)"/>
  <rect x="238" y="150" width="24" height="12" rx="2" fill="#3a1515" filter="url(#glow)"/>
  <rect x="238" y="170" width="24" height="12" rx="2" fill="#3a1515" filter="url(#glow)"/>
  <rect x="238" y="190" width="24" height="12" rx="2" fill="#3a1515" filter="url(#glow)"/>
  <rect x="238" y="210" width="24" height="12" rx="2" fill="#3a1515" filter="url(#glow)"/>
  <rect x="238" y="230" width="24" height="12" rx="2" fill="#3a1515" filter="url(#glow)"/>
  <rect x="238" y="250" width="24" height="12" rx="2" fill="#3a1515" filter="url(#glow)"/>
  <rect x="238" y="270" width="24" height="12" rx="2" fill="#3a1515" filter="url(#glow)"/>
  <rect x="238" y="290" width="24" height="12" rx="2" fill="#3a1515" filter="url(#glow)"/>

  <!-- Floor display panel -->
  <rect x="225" y="60" width="50" height="45" rx="3" fill="#0a0a0a" stroke="#2a2535" stroke-width="0.5"/>
  <!-- Red "13" display -->
  <text x="250" y="92" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#cc2222" filter="url(#softGlow)">13</text>

  <!-- Corridor (right side) - perspective view -->
  <path d="M280,0 L800,60 L800,390 L280,450 Z" fill="#0c0a0a"/>
  <path d="M280,0 L800,60 L800,390 L280,450 Z" fill="#0a0808" opacity="0.8"/>

  <!-- Corridor walls -->
  <line x1="280" y1="0" x2="800" y2="60" stroke="#1a1515" stroke-width="0.5"/>
  <line x1="280" y1="450" x2="800" y2="390" stroke="#1a1515" stroke-width="0.5"/>

  <!-- Corridor floor -->
  <path d="M280,340 L800,390 L800,450 L280,450 Z" fill="#0e0b0b"/>

  <!-- Corridor ceiling light -->
  <ellipse cx="600" cy="100" rx="80" ry="15" fill="#1a1810" opacity="0.4"/>
  <line x1="600" y1="60" x2="600" y2="100" stroke="#2a2520" stroke-width="1"/>

  <!-- Distant dark figure silhouette at end of corridor -->
  <g opacity="0.25">
    <!-- Head -->
    <ellipse cx="740" cy="155" rx="10" ry="14" fill="#0a0808"/>
    <!-- Body -->
    <path d="M730,168 Q728,200 726,260 L754,260 Q752,200 750,168 Z" fill="#0a0808"/>
    <!-- Legs -->
    <path d="M730,260 L728,320 L736,320 L738,260 Z" fill="#0a0808"/>
    <path d="M744,260 L742,320 L750,320 L752,260 Z" fill="#0a0808"/>
  </g>

  <!-- Wet footprints leading from elevator into corridor -->
  <g opacity="0.12" fill="#2a2525">
    <ellipse cx="310" cy="370" rx="6" ry="4"/>
    <ellipse cx="330" cy="378" rx="6" ry="4"/>
    <ellipse cx="360" cy="388" rx="7" ry="4"/>
    <ellipse cx="395" cy="398" rx="7" ry="4"/>
    <ellipse cx="435" cy="408" rx="8" ry="4"/>
    <ellipse cx="480" cy="418" rx="8" ry="4"/>
    <ellipse cx="530" cy="428" rx="9" ry="4"/>
    <ellipse cx="580" cy="435" rx="9" ry="4"/>
    <ellipse cx="630" cy="438" rx="10" ry="4"/>
    <ellipse cx="680" cy="436" rx="10" ry="4"/>
  </g>

  <!-- Subtle fog/mist effect near corridor entrance -->
  <ellipse cx="350" cy="300" rx="100" ry="60" fill="#151010" opacity="0.15"/>
  <ellipse cx="400" cy="280" rx="80" ry="50" fill="#121010" opacity="0.1"/>

  <!-- Very subtle vertical lines for corridor depth -->
  <line x1="400" y1="30" x2="380" y2="420" stroke="#141212" stroke-width="0.3" opacity="0.5"/>
  <line x1="500" y1="45" x2="490" y2="430" stroke="#141212" stroke-width="0.3" opacity="0.4"/>
  <line x1="600" y1="55" x2="590" y2="435" stroke="#141212" stroke-width="0.3" opacity="0.3"/>
  <line x1="700" y1="58" x2="690" y2="438" stroke="#141212" stroke-width="0.3" opacity="0.2"/>

</svg>