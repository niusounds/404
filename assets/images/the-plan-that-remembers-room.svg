<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Floor plan of an office building -->
  <rect x="50" y="50" width="500" height="300" fill="#0a0808" stroke="#ff2351" stroke-width="1.5"/>
  
  <!-- Grid lines -->
  <line x1="200" y1="50" x2="200" y2="350" stroke="#1a1616" stroke-width="0.5"/>
  <line x1="350" y1="50" x2="350" y2="350" stroke="#1a1616" stroke-width="0.5"/>
  <line x1="50" y1="180" x2="550" y2="180" stroke="#1a1616" stroke-width="0.5"/>
  
  <!-- Floor labels -->
  <text x="300" y="90" fill="#ff2351" font-size="11" text-anchor="middle">FLOOR 4 - ROOMS 401-412</text>
  <text x="300" y="150" fill="#8a6b80" font-size="9" text-anchor="middle">ROOM 413</text>
  
  <!-- The impossible room - distorted walls -->
  <path d="M 210,170 Q 280,160 350,185 T 495,170 L 500,345 Q 350,340 210,345 Z" 
        fill="#0a0808" stroke="#ff9e1d" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Impossible angle - one wall extends further than it should -->
  <line x1="495" y1="170" x2="495" y2="200" stroke="#ff003c" stroke-width="2"/>
  
  <!-- Distortion indicator -->
  <text x="495" y="185" fill="#ff003c" font-size="7">∞</text>
  
  <!-- Door labels - all normal except one -->
  <rect x="90" y="290" width="30" height="8" fill="#aaf4f4" opacity="0.6"/>
  <text x="105" y="310" fill="#5ac5c5" font-size="7" text-anchor="middle">①</text>
  
  <rect x="240" y="290" width="30" height="8" fill="#aaf4f4" opacity="0.6"/>
  <text x="255" y="310" fill="#5ac5c5" font-size="7" text-anchor="middle">②</text>
  
  <!-- The wrong door - label says "room 418" but this isn't on the plan -->
  <rect x="425" y="290" width="30" height="8" fill="#ff9e1d" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="440" y="310" fill="#ff9e1d" font-size="7" text-anchor="middle">③</text>
  
  <!-- Room numbers -->
  <text x="130" y="285" fill="#aaf4f4" font-size="6">ROOM 401</text>
  <text x="270" y="285" fill="#aaf4f4" font-size="6">ROOM 402</text>
  <text x="395" y="285" fill="#ff9e1d" font-size="6">ROOM ?</text>

  <!-- Floor number at bottom -->
  <rect x="215" y="375" width="170" height="25" fill="#0a0808"/>
  <text x="300" y="391" fill="#ff9e1d" font-size="9" text-anchor="middle">PLAN DISCREPANCY DETECTED</text>

  <!-- Small detail - someone measured it twice -->
  <line x1="280" y1="145" x2="320" y2="145" stroke="#ff003c" stroke-width="1"/>
  <line x1="279" y1="142" x2="279" y2="148" stroke="#ff003c" stroke-width="1"/>
  <line x1="321" y1="142" x2="321" y2="148" stroke="#ff003c" stroke-width="1"/>
</svg>
