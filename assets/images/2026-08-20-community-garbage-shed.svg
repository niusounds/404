<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080606"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121010"/>
      <stop offset="100%" stop-color="#0e0c0c"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2525"/>
      <stop offset="50%" stop-color="#3d3535"/>
      <stop offset="100%" stop-color="#2a2525"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#1a1515" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Floor -->
  <rect x="0" y="300" width="800" height="150" fill="#0c0a0a"/>
  <rect x="0" y="300" width="800" height="3" fill="#1a1515"/>

  <!-- Back wall -->
  <rect x="80" y="60" width="640" height="240" fill="url(#wallGrad)" rx="2"/>

  <!-- Wall texture - peeling tiles -->
  <rect x="120" y="80" width="40" height="30" fill="#141212" opacity="0.5" rx="1"/>
  <rect x="165" y="80" width="35" height="30" fill="#111010" opacity="0.4" rx="1"/>
  <rect x="120" y="115" width="40" height="28" fill="#131111" opacity="0.3" rx="1"/>
  <rect x="540" y="100" width="45" height="32" fill="#141212" opacity="0.5" rx="1"/>
  <rect x="590" y="100" width="38" height="32" fill="#111010" opacity="0.4" rx="1"/>
  <rect x="540" y="137" width="45" height="28" fill="#131111" opacity="0.3" rx="1"/>

  <!-- Door frame left -->
  <rect x="50" y="50" width="30" height="250" fill="#151313" rx="1"/>
  <!-- Door frame right -->
  <rect x="720" y="50" width="30" height="250" fill="#151313" rx="1"/>
  <!-- Door frame top -->
  <rect x="50" y="35" width="700" height="20" fill="#151313" rx="1"/>

  <!-- Open door (right side, swung open) -->
  <rect x="720" y="55" width="12" height="245" fill="#1a1616"/>
  <!-- Door handle -->
  <circle cx="732" cy="190" r="4" fill="#2a2525"/>

  <!-- Sign on wall -->
  <rect x="340" y="65" width="120" height="30" fill="#1a1818" rx="2"/>
  <rect x="342" y="67" width="116" height="26" fill="#1e1c1c" rx="1"/>
  <text x="400" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3535" letter-spacing="3">廃棄物処理場</text>

  <!-- Trash pile left corner -->
  <ellipse cx="130" cy="290" rx="35" ry="12" fill="#1a1818"/>
  <ellipse cx="150" cy="285" rx="25" ry="10" fill="#1c1a1a"/>
  <rect x="110" y="270" width="20" height="30" fill="#1e1c1c" rx="2" transform="rotate(-10, 120, 285)"/>
  <rect x="140" y="268" width="15" height="25" fill="#1a1818" rx="1" transform="rotate(5, 147, 280)"/>

  <!-- Trash pile right corner -->
  <ellipse cx="670" cy="292" rx="30" ry="10" fill="#1a1818"/>
  <rect x="650" y="272" width="18" height="22" fill="#1c1a1a" rx="2" transform="rotate(8, 659, 283)"/>

  <!-- Faint glow from outside (left) -->
  <rect x="0" y="50" width="60" height="250" fill="#1a1818" opacity="0.15"/>
  <rect x="0" y="50" width="20" height="250" fill="#1e1a1a" opacity="0.1"/>

  <!-- Faint glow from outside (right, through open door) -->
  <rect x="732" y="55" width="60" height="245" fill="#1a1818" opacity="0.12"/>
  <rect x="732" y="55" width="25" height="245" fill="#1e1a1a" opacity="0.08"/>

  <!-- The metal rod standing vertically on the floor -->
  <rect x="396" y="140" width="8" height="160" fill="url(#metalGrad)" rx="3"/>
  <!-- Rod tip (rounded) -->
  <ellipse cx="400" cy="140" rx="4" ry="5" fill="#3d3535"/>
  <!-- Rod base -->
  <ellipse cx="400" cy="300" rx="5" ry="3" fill="#2a2525"/>
  <!-- Slight shine on rod -->
  <rect x="398" y="145" width="2" height="150" fill="#4a4242" opacity="0.3" rx="1"/>

  <!-- Dark stain under the rod -->
  <ellipse cx="400" cy="302" rx="15" ry="4" fill="#1a0a0a" opacity="0.6"/>
  <ellipse cx="400" cy="304" rx="8" ry="2" fill="#200d0d" opacity="0.4"/>

  <!-- Drip from rod -->
  <ellipse cx="400" cy="306" rx="3" ry="1.5" fill="#1a0a0a" opacity="0.5"/>

  <!-- Finger marks on wall -->
  <line x1="500" y1="160" x2="500" y2="240" stroke="#1e1c1c" stroke-width="2" opacity="0.6"/>
  <line x1="510" y1="165" x2="510" y2="235" stroke="#1c1a1a" stroke-width="1.5" opacity="0.4"/>
  <line x1="518" y1="170" x2="518" y2="230" stroke="#1a1818" stroke-width="1.5" opacity="0.3"/>

  <!-- Horizontal marks -->
  <line x1="495" y1="195" x2="525" y2="195" stroke="#1e1c1c" stroke-width="1" opacity="0.3"/>
  <line x1="492" y1="205" x2="528" y2="205" stroke="#1c1a1a" stroke-width="1" opacity="0.25"/>
  <line x1="490" y1="215" x2="530" y2="215" stroke="#1a1818" stroke-width="1" opacity="0.2"/>

  <!-- Faint blood drip trail on floor -->
  <path d="M400,306 Q410,320 420,340 Q425,350 430,360" stroke="#1a0a0a" stroke-width="2" fill="none" opacity="0.35" filter="url(#blur1)"/>
  <path d="M420,340 Q428,355 435,370" stroke="#1e0e0e" stroke-width="1.5" fill="none" opacity="0.25" filter="url(#blur3)"/>

  <!-- Subtle vignette -->
  <rect width="800" height="450" fill="url(#glow)" pointer-events="none"/>

  <!-- Very faint ambient light from outside (left edge) -->
  <rect x="0" y="0" width="40" height="450" fill="#1a1616" opacity="0.05"/>

  <!-- Ceiling shadow -->
  <rect x="80" y="50" width="640" height="15" fill="#080606" opacity="0.8"/>
</svg>