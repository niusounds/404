<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060608"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="vendingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1c20"/>
      <stop offset="50%" stop-color="#16181c"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2030" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1a2030" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a2030" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="drinkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a30"/>
      <stop offset="100%" stop-color="#162028"/>
    </linearGradient>
    <radialGradient id="streetGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2a2520" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2535" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Background - night street -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Street ground -->
  <rect x="0" y="380" width="800" height="70" fill="#0c0c10"/>
  <rect x="0" y="378" width="800" height="3" fill="#1a1a20"/>

  <!-- Street lamp glow (right side) -->
  <rect x="600" y="0" width="200" height="300" fill="url(#streetGlow)"/>

  <!-- Vending machine body -->
  <rect x="180" y="40" width="240" height="340" fill="url(#vendingGrad)" rx="5"/>
  <rect x="182" y="42" width="236" height="336" fill="#181a1e" rx="4"/>

  <!-- Vending machine top panel -->
  <rect x="200" y="45" width="200" height="35" fill="#1e2028" rx="3"/>
  <rect x="202" y="47" width="196" height="31" fill="#222430" rx="2"/>
  <!-- Brand text area -->
  <rect x="230" y="52" width="140" height="20" fill="#1a1c24" rx="2"/>

  <!-- Glass display window -->
  <rect x="195" y="90" width="210" height="200" fill="url(#glassGrad)" rx="3"/>
  <rect x="197" y="92" width="206" height="196" fill="#0e1218" rx="2"/>

  <!-- Drinks inside vending machine -->
  <!-- Row 1 -->
  <rect x="205" y="100" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="230" y="100" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="255" y="100" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="280" y="100" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="305" y="100" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="330" y="100" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <!-- Row 2 -->
  <rect x="205" y="140" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="230" y="140" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="255" y="140" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="280" y="140" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="305" y="140" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="330" y="140" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <!-- Row 3 -->
  <rect x="205" y="180" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="230" y="180" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="255" y="180" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="280" y="180" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="305" y="180" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="330" y="180" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <!-- Row 4 -->
  <rect x="205" y="220" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="230" y="220" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="255" y="220" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="280" y="220" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="305" y="220" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>
  <rect x="330" y="220" width="20" height="35" fill="url(#drinkGrad)" rx="2"/>

  <!-- Ghost figure behind glass (visible in vending machine) -->
  <!-- Head -->
  <ellipse cx="270" cy="130" rx="12" ry="15" fill="#0e1018" opacity="0.6"/>
  <!-- Body -->
  <rect x="258" y="145" width="24" height="50" fill="#0e1018" opacity="0.5" rx="3"/>
  <!-- Arm reaching toward buttons -->
  <rect x="280" y="155" width="30" height="4" fill="#0e1018" opacity="0.4" rx="2"/>
  <!-- Second ghost figure -->
  <ellipse cx="310" cy="135" rx="10" ry="13" fill="#0e1018" opacity="0.5"/>
  <rect x="300" y="148" width="20" height="45" fill="#0e1018" opacity="0.4" rx="3"/>

  <!-- Glass reflection (street scene) -->
  <!-- Street lamp reflection -->
  <ellipse cx="350" cy="120" rx="15" ry="25" fill="#2a2520" opacity="0.15" filter="url(#blur2)"/>
  <!-- Car light reflection -->
  <ellipse cx="370" cy="160" rx="8" ry="4" fill="#3a3530" opacity="0.1" filter="url(#blur2)"/>

  <!-- The EMPTY space where the person should be reflected -->
  <!-- This is the key horror element - a silhouette-shaped void in the glass -->
  <rect x="290" y="100" width="35" height="100" fill="#0a0808" opacity="0.3" rx="5"/>
  <ellipse cx="307" cy="105" rx="10" ry="12" fill="#0a0808" opacity="0.35"/>
  <!-- The void is subtle - barely visible against the dark glass -->

  <!-- Button panel -->
  <rect x="195" y="295" width="210" height="60" fill="#14161c" rx="3"/>
  <rect x="197" y="297" width="206" height="56" fill="#181a20" rx="2"/>
  <!-- Rows of buttons -->
  <g opacity="0.4">
    <circle cx="220" cy="310" r="8" fill="#1e2028"/>
    <circle cx="250" cy="310" r="8" fill="#1e2028"/>
    <circle cx="280" cy="310" r="8" fill="#1e2028"/>
    <circle cx="310" cy="310" r="8" fill="#1e2028"/>
    <circle cx="340" cy="310" r="8" fill="#1e2028"/>
    <circle cx="220" cy="335" r="8" fill="#1e2028"/>
    <circle cx="250" cy="335" r="8" fill="#1e2028"/>
    <circle cx="280" cy="335" r="8" fill="#1e2028"/>
    <circle cx="310" cy="335" r="8" fill="#1e2028"/>
    <circle cx="340" cy="335" r="8" fill="#1e2028"/>
  </g>
  <!-- One button lit (being pressed by ghost) -->
  <circle cx="280" cy="310" r="8" fill="#2a3040" opacity="0.6"/>
  <circle cx="280" cy="310" r="5" fill="#4a5a6a" opacity="0.5"/>

  <!-- Dispensing slot -->
  <rect x="240" y="360" width="120" height="15" fill="#0e1018" rx="2"/>
  <rect x="242" y="362" width="116" height="11" fill="#0a0c14" rx="1"/>

  <!-- Ambient lighting from vending machine -->
  <rect x="195" y="90" width="210" height="200" fill="url(#glassGlow)" pointer-events="none"/>
  <!-- Subtle light spill on ground -->
  <ellipse cx="300" cy="385" rx="60" ry="8" fill="#1a2030" opacity="0.2" filter="url(#blur2)"/>

  <!-- Vignette -->
  <rect width="800" height="450" fill="#0a0808" opacity="0.4" pointer-events="none"/>
  <rect x="0" y="0" width="180" height="450" fill="#080606" opacity="0.5" pointer-events="none"/>
  <rect x="620" y="0" width="180" height="450" fill="#080606" opacity="0.5" pointer-events="none"/>
</svg>