<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="moonGlow" cx="50%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#4a6a8a"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
  </defs>

  <!-- Background: dark sky -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Moon glow area -->
  <circle cx="620" cy="130" r="180" fill="url(#moonGlow)" opacity="0.5"/>
  
  <!-- Stars -->
  <circle cx="120" cy="40" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="250" cy="80" r="0.8" fill="#fff" opacity="0.5"/>
  <circle cx="380" cy="30" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="490" cy="60" r="0.7" fill="#fff" opacity="0.4"/>
  <circle cx="560" cy="100" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="720" cy="50" r="0.9" fill="#fff" opacity="0.6"/>
  <circle cx="80" cy="130" r="0.6" fill="#fff" opacity="0.4"/>
  <circle cx="750" cy="90" r="1.1" fill="#fff" opacity="0.5"/>
  
  <!-- Moon -->
  <circle cx="620" cy="130" r="28" fill="#b8c8d8" opacity="0.3"/>
  <circle cx="620" cy="130" r="28" fill="#e8edf5" opacity="0.9"/>
  
  <!-- Dark lake surface -->
  <rect x="0" y="240" width="800" height="210" fill="#1a1520"/>
  
  <!-- Lake ice/frost patches (Point Pelee winter) -->
  <ellipse cx="350" cy="270" rx="60" ry="15" fill="#2a2538" opacity="0.4"/>
  <ellipse cx="500" cy="290" rx="80" ry="12" fill="#352848" opacity="0.3"/>
  <ellipse cx="200" cy="310" rx="40" ry="10" fill="#2a2538" opacity="0.3"/>
  
  <!-- Subtle red glow from below the lake (the anomaly) -->
  <ellipse cx="380" cy="380" rx="60" ry="20" fill="#8b0000" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Underground fissure lines -->
  <line x1="330" y1="350" x2="370" y2="395" stroke="#ff0033" stroke-width="0.8" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="365" y1="348" x2="395" y2="395" stroke="#ff0033" stroke-width="0.5" opacity="0.15">
    <animate attributeName="opacity" values="0.05;0.2;0.05" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Mothman silhouette descending from sky - dark grey fur silhouette -->
  <g transform="translate(370,80)">
    <!-- Body/torso -->
    <ellipse cx="15" cy="60" rx="14" ry="32" fill="#1a1a1e"/>
    
    <!-- Wings - wide spread dark grey feathers -->
    <!-- Left wing -->
    <path d="M 5,38 L -60,-10 C -75,5 -90,25 -85,45 
             C -80,55 -60,65 -40,65 L -25,55 Z" 
          fill="#2a2a32"/>
    <!-- Left wing secondary -->
    <path d="M 5,42 L -70,10 C -80,25 -92,45 -88,60" 
          fill="none" stroke="#3a3a44" stroke-width="0.7" opacity="0.6"/>
    
    <!-- Right wing -->
    <path d="M 25,38 L 105,-10 C 120,5 135,25 130,45 
             C 125,55 105,65 95,65 L 75,55 Z" 
          fill="#2a2a32"/>
    <!-- Right wing secondary -->
    <path d="M 25,42 L 110,10 C 120,25 135,45 130,60" 
          fill="none" stroke="#3a3a44" stroke-width="0.7" opacity="0.6"/>
    
    <!-- Head - elongated mothy shape -->
    <ellipse cx="15" cy="22" rx="10" ry="14" fill="#1e1e22"/>
    
    <!-- Eyes - BURNING RED -->
    <circle cx="9" cy="20" r="4.5" fill="none" stroke="#ff0033" stroke-width="1.8">
      <animate attributeName="stroke-opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="9" cy="20" r="4.5" fill="#ff0033" opacity="0.7" filter="url(#glowRed)"/>
    
    <circle cx="21" cy="20" r="4.5" fill="none" stroke="#ff0033" stroke-width="1.8">
      <animate attributeName="stroke-opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="21" cy="20" r="4.5" fill="#ff0033" opacity="0.7" filter="url(#glowRed)"/>
    
    <!-- Antennae -->
    <line x1="9" y1="12" x2="2" y2="-8" stroke="#4a4a52" stroke-width="1" opacity="0.6">
      <animate attributeName="x2" values="0;-3;0" dur="3s" repeatCount="indefinite"/>
    </line>
    <circle cx="2" cy="-8" r="1.5" fill="#6a6a74"/>
    
    <line x1="21" y1="12" x2="28" y2="-8" stroke="#4a4a52" stroke-width="1" opacity="0.6">
      <animate attributeName="x2" values="30;27;30" dur="3s" repeatCount="indefinite"/>
    </line>
    <circle cx="28" cy="-8" r="1.5" fill="#6a6a74"/>
    
    <!-- Chest red glow spot -->
    <circle cx="15" cy="50" r="3" fill="#ff0033" opacity="0.5" filter="url(#glowRed)"/>
  </g>
  
  <!-- Falling snow/ash particles (like a winter lake scene) -->
  <text x="290" y="180" fill="#c8d8e8" font-size="14" opacity="0.3">❄</text>
  <text x="450" y="160" fill="#c8d8e8" font-size="10" opacity="0.25">❄</text>
  <text x="190" y="200" fill="#c8d8e8" font-size="12" opacity="0.3">❄</text>
  
  <!-- Title text -->
  <text x="400" y="435" text-anchor="middle" fill="#cc3366" font-family="Georgia, serif" font-size="18" letter-spacing="3">MOLESTADO — LAKE AND SKY BORDER</text>

  <!-- Gothic border -->
  <rect x="12" y="12" width="776" height="426" rx="4" fill="none" stroke="#3d001a" stroke-width="2.5"/>
  <rect x="18" y="18" width="764" height="414" rx="3" fill="none" stroke="#1f000c" stroke-width="1"/>
  
  <!-- Corner ornaments -->
  <path d="M 25,25 L 45,25 M 25,25 L 25,45" stroke="#8b0033" stroke-width="1.5" fill="none"/>
  <path d="M 775,25 L 755,25 M 775,25 L 775,45" stroke="#8b0033" stroke-width="1.5" fill="none"/>
  <path d="M 25,425 L 45,425 M 25,425 L 25,405" stroke="#8b0033" stroke-width="1.5" fill="none"/>
  <path d="M 775,425 L 755,425 M 775,425 L 775,405" stroke="#8b0033" stroke-width="1.5" fill="none"/>
</svg>
