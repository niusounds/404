<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Dark background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle hallway perspective lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1a1515" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#1a1515" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="#1a1515" stroke-width="1" opacity="0.3"/>
  
  <!-- Wall texture - very subtle vertical lines -->
  <line x1="100" y1="0" x2="100" y2="450" stroke="#151212" stroke-width="0.5" opacity="0.3"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#151212" stroke-width="0.5" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#151212" stroke-width="0.5" opacity="0.3"/>
  <line x1="700" y1="0" x2="700" y2="450" stroke="#151212" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Door on the left -->
  <rect x="50" y="80" width="120" height="290" fill="#1a1614" stroke="#2a2520" stroke-width="2" rx="2"/>
  <circle cx="150" cy="230" r="5" fill="#3a3530" stroke="#2a2520" stroke-width="1"/>
  <text x="75" y="75" font-family="monospace" font-size="11" fill="#4a4540" text-anchor="middle">302</text>
  
  <!-- Door on the right -->
  <rect x="630" y="80" width="120" height="290" fill="#1a1614" stroke="#2a2520" stroke-width="2" rx="2"/>
  <circle cx="690" cy="230" r="5" fill="#3a3530" stroke="#2a2520" stroke-width="1"/>
  <text x="695" y="75" font-family="monospace" font-size="11" fill="#4a4540" text-anchor="middle">401</text>
  
  <!-- Floor -->
  <rect x="170" y="350" width="460" height="100" fill="#0f0c0c"/>
  <line x1="170" y1="370" x2="630" y2="370" stroke="#1a1515" stroke-width="0.5"/>
  <line x1="170" y1="390" x2="630" y2="390" stroke="#1a1515" stroke-width="0.5"/>
  <line x1="170" y1="410" x2="630" y2="410" stroke="#1a1515" stroke-width="0.5"/>
  <line x1="170" y1="430" x2="630" y2="430" stroke="#1a1515" stroke-width="0.5"/>
  
  <!-- Ceiling light - dim, flickering feel -->
  <ellipse cx="400" cy="30" rx="60" ry="15" fill="#1a1818" stroke="#2a2828" stroke-width="1"/>
  <ellipse cx="400" cy="32" rx="40" ry="8" fill="#2a2520" opacity="0.6"/>
  <!-- Light cone -->
  <polygon points="370,35 430,35 500,450 300,450" fill="#1a1815" opacity="0.08"/>
  
  <!-- INTERCOM PANEL - the horror focal point -->
  <!-- Mounting plate -->
  <rect x="340" y="160" width="120" height="160" fill="#2a2520" stroke="#3a3530" stroke-width="2" rx="3"/>
  
  <!-- Small LCD screen -->
  <rect x="355" y="175" width="90" height="40" fill="#0a1a0a" rx="2"/>
  <!-- Screen glow -->
  <rect x="355" y="175" width="90" height="40" fill="#1a3a1a" rx="2" opacity="0.4"/>
  <!-- Display text: room number -->
  <text x="400" y="202" font-family="monospace" font-size="22" fill="#3aff3a" text-anchor="middle" opacity="0.9">999</text>
  
  <!-- Intercom speaker grill -->
  <circle cx="400" cy="240" r="20" fill="#1a1a1a" stroke="#3a3530" stroke-width="1.5"/>
  <circle cx="400" cy="240" r="15" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
  <circle cx="400" cy="240" r="10" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
  <circle cx="400" cy="240" r="5" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
  <!-- Speaker dots -->
  <circle cx="393" cy="233" r="1" fill="#3a3a3a"/>
  <circle cx="400" cy="230" r="1" fill="#3a3a3a"/>
  <circle cx="407" cy="233" r="1" fill="#3a3a3a"/>
  <circle cx="390" cy="240" r="1" fill="#3a3a3a"/>
  <circle cx="400" cy="240" r="1" fill="#3a3a3a"/>
  <circle cx="410" cy="240" r="1" fill="#3a3a3a"/>
  <circle cx="393" cy="247" r="1" fill="#3a3a3a"/>
  <circle cx="400" cy="250" r="1" fill="#3a3a3a"/>
  <circle cx="407" cy="247" r="1" fill="#3a3a3a"/>
  
  <!-- Call button -->
  <rect x="375" y="280" width="50" height="25" fill="#3a1a1a" stroke="#5a2a2a" stroke-width="1" rx="3"/>
  <text x="400" y="297" font-family="monospace" font-size="11" fill="#ff6a4a" text-anchor="middle">呼出</text>
  
  <!-- Red LED indicator -->
  <circle cx="445" cy="185" r="3" fill="#ff2a2a" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Voice wave visualization (implied sound) -->
  <path d="M 380 310 Q 385 300 390 310 Q 395 320 400 310 Q 405 300 410 310 Q 415 320 420 310" 
        fill="none" stroke="#ff4a3a" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Subtle shadow under intercom -->
  <ellipse cx="400" cy="330" rx="50" ry="8" fill="#000" opacity="0.3"/>
  
  <!-- Eerie ambient glow around intercom -->
  <ellipse cx="400" cy="240" rx="80" ry="100" fill="none" stroke="#ff3a2a" stroke-width="0.5" opacity="0.05"/>
  
  <!-- Dark vignette corners -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" opacity="0.6"/>
  
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
