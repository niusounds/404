<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Hallway perspective - walls -->
  <polygon points="0,0 250,80 250,370 0,450" fill="#121010" opacity="0.8"/>
  <polygon points="800,0 550,80 550,370 800,450" fill="#121010" opacity="0.8"/>
  
  <!-- Floor -->
  <polygon points="250,370 550,370 800,450 0,450" fill="#0d0b0b"/>
  
  <!-- Floor tiles -->
  <line x1="300" y1="370" x2="200" y2="450" stroke="#151313" stroke-width="1"/>
  <line x1="400" y1="370" x2="400" y2="450" stroke="#151313" stroke-width="1"/>
  <line x1="500" y1="370" x2="600" y2="450" stroke="#151313" stroke-width="1"/>
  
  <!-- Door (viewer's perspective) -->
  <rect x="340" y="120" width="120" height="250" fill="#1a1717" stroke="#221e1e" stroke-width="2"/>
  <rect x="350" y="130" width="100" height="230" fill="#1e1b1b"/>
  
  <!-- Door handle -->
  <circle cx="440" cy="260" r="6" fill="#3a3535"/>
  <circle cx="440" cy="260" r="3" fill="#4a4545"/>
  
  <!-- Intercom monitor on door (small, glowing red) -->
  <rect x="360" y="195" width="30" height="22" rx="3" fill="#0a0a0a" stroke="#332222" stroke-width="1"/>
  <!-- Red LED glow -->
  <circle cx="375" cy="206" r="4" fill="#8b0000" opacity="0.9"/>
  <circle cx="375" cy="206" r="8" fill="#8b0000" opacity="0.4"/>
  <circle cx="375" cy="206" r="14" fill="#8b0000" opacity="0.15"/>
  
  <!-- Hallway light glow (faint, from end of hallway) -->
  <ellipse cx="400" cy="100" rx="60" ry="20" fill="#1a1815" opacity="0.5"/>
  <ellipse cx="400" cy="100" rx="30" ry="10" fill="#2a2520" opacity="0.3"/>
  
  <!-- Shadowy figure at end of hallway -->
  <!-- Body silhouette -->
  <ellipse cx="400" cy="280" rx="25" ry="60" fill="#0e0c0c" opacity="0.95"/>
  <!-- Head -->
  <ellipse cx="400" cy="215" rx="18" ry="22" fill="#0e0c0c" opacity="0.95"/>
  <!-- Slight forward lean (hunched posture) -->
  <ellipse cx="395" cy="290" rx="20" ry="50" fill="#0c0a0a" opacity="0.9"/>
  
  <!-- Faint hand reaching toward door -->
  <path d="M 420 290 Q 440 300 455 310" stroke="#0e0c0c" stroke-width="6" fill="none" opacity="0.8"/>
  <path d="M 420 290 Q 440 300 455 310" stroke="#121010" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Subtle floor reflection under figure -->
  <ellipse cx="400" cy="370" rx="30" ry="8" fill="#0e0c0c" opacity="0.4"/>
  
  <!-- Cold blue-green ambient light from intercom -->
  <ellipse cx="375" cy="210" rx="50" ry="60" fill="#0a1520" opacity="0.15"/>
  
  <!-- Darkness vignette -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.6"/>
  
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
  
  <!-- Tiny timestamp overlay (intercom display) -->
  <text x="365" y="218" font-family="monospace" font-size="7" fill="#8b0000" opacity="0.7">02:47</text>
</svg>
