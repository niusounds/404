<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="fogGrad" x1="0%" y1="100%" x2="0%" y2="60%"><stop offset="0%" stop-color="#3d001a" stop-opacity=".4"/><stop offset="100%" stop-color="#3d001a" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0a0808"/>
  <rect x="0" y="260" width="800" height="190" fill="url(#fogGrad)"/>
  <path d="M0,340 Q140,325 200,350 T400,335 T600,348 T800,330 L800,450 L0,450Z" fill="#1a1720" opacity=".7"/>

  <rect x="15" y="15" width="770" height="420" rx="6" ry="6" fill="none" stroke="#3d001a" stroke-width="2.5" filter="url(#glow)"/>

  <rect x="480" y="180" width="7" height="160" fill="#2a2530" rx="1"/>
  <ellipse cx="483.5" cy="175" rx="9" ry="11" fill="#2a2530"/>
  <rect x="496" y="200" width="6" height="140" fill="#26212d" rx="1"/>
  <ellipse cx="499" cy="195" rx="8.5" ry="10.5" fill="#26212d"/>
  <rect x="510" y="230" width="7" height="110" fill="#2a2530" rx="1"/>
  <ellipse cx="513.5" cy="225" rx="9" ry="11" fill="#2a2530"/>

  <rect x="486" y="240" width="32" height="100" fill="none" stroke="#c62727" stroke-width="1.2" opacity=".5" style="stroke-dasharray:4,2"/>

  <!-- Hut silhouette in mist -->
  <path d="M570,340 L585,190 Q625,140 670,160 L700,170 Q720,200 710,220 L710,340Z" fill="#16121a" opacity=".8"/>
  
  <!-- One glowing eye on hut -->
  <circle cx="650" cy="190" r="14" fill="none" stroke="#ff003d" stroke-width="2.5" filter="url(#glow)">
  </circle>
  <circle cx="650" cy="190" r="6" fill="#ffcc33">
  </circle>

  <!-- Pine trees (taiga) -->
  <polygon points="140,230 155,340 125,340" fill="#1a1628" filter="blur(3)">
  </polygon>
  <polygon points="220,180 240,340 200,340" fill="#16132a" filter="blur(3)">
  </polygon>

  <!-- Snow / ash particles -->
  <text x="320" y="60" font-family="serif" font-size="18" fill="#ffffff" opacity=".15">❋</text>
  <text x="560" y="85" font-family="serif" font-size="20" fill="#fff" opacity=".12">❋</text>

  <!-- Title block -->
  <rect x="80" y="370" width="380" height="60" rx="4" fill="#0a0808" opacity=".5"/>
  <text x="270" y="400" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans JP', serif" font-size="17" fill="#c6973e" letter-spacing=".15em">シベリアのヒッチコック</text>
  <text x="270" y="420" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans JP', serif" font-size="13" fill="#8f1d1d" letter-spacing=".1em">──遺体発見、記録は三人分の筈</text>

  <line x1="220" y1="18" x2="580" y2="18" stroke="#c62727" stroke-width=".8" opacity=".5"/>
  <text x="14" y="395" font-size="22" fill="#ff003d" opacity=".3">◉</text>
</svg>
