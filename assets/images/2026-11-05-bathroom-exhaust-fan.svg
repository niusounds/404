<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="fanGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Ceiling area (top portion) -->
  <rect width="800" height="120" fill="#0f0c0a"/>
  
  <!-- Tiled wall suggestion (subtle lines) -->
  <g stroke="#12100e" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>
  
  <!-- Vertical tile lines -->
  <g stroke="#12100e" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="120" x2="100" y2="450"/>
    <line x1="200" y1="120" x2="200" y2="450"/>
    <line x1="300" y1="120" x2="300" y2="450"/>
    <line x1="400" y1="120" x2="400" y2="450"/>
    <line x1="500" y1="120" x2="500" y2="450"/>
    <line x1="600" y1="120" x2="600" y2="450"/>
    <line x1="700" y1="120" x2="700" y2="450"/>
  </g>
  
  <!-- Ceiling vent housing -->
  <ellipse cx="400" cy="80" rx="55" ry="18" fill="#1a1614" stroke="#2a2520" stroke-width="1.5"/>
  <ellipse cx="400" cy="80" rx="42" ry="12" fill="#151210"/>
  
  <!-- Fan blades (spinning effect - blurred) -->
  <g filter="url(#blur1)" opacity="0.7">
    <ellipse cx="400" cy="80" rx="35" ry="8" fill="none" stroke="#2a2420" stroke-width="3" transform="rotate(0 400 80)"/>
    <ellipse cx="400" cy="80" rx="35" ry="8" fill="none" stroke="#2a2420" stroke-width="3" transform="rotate(30 400 80)"/>
    <ellipse cx="400" cy="80" rx="35" ry="8" fill="none" stroke="#2a2420" stroke-width="3" transform="rotate(60 400 80)"/>
    <ellipse cx="400" cy="80" rx="35" ry="8" fill="none" stroke="#2a2420" stroke-width="3" transform="rotate(90 400 80)"/>
    <ellipse cx="400" cy="80" rx="35" ry="8" fill="none" stroke="#2a2420" stroke-width="3" transform="rotate(120 400 80)"/>
    <ellipse cx="400" cy="80" rx="35" ry="8" fill="none" stroke="#2a2420" stroke-width="3" transform="rotate(150 400 80)"/>
  </g>
  
  <!-- Fan center hub -->
  <circle cx="400" cy="80" r="8" fill="#1a1614" stroke="#2a2520" stroke-width="1"/>
  
  <!-- Ghostly figure silhouette in the bathroom (bottom center) -->
  <g opacity="0.15">
    <!-- Head -->
    <ellipse cx="400" cy="340" rx="22" ry="28" fill="#1a1818"/>
    <!-- Body -->
    <path d="M378 365 Q375 380 370 410 L385 410 L390 380 L410 380 L415 410 L430 410 Q425 380 422 365 Z" fill="#1a1818"/>
    <!-- Arms slightly spread -->
    <path d="M378 370 Q360 375 345 365" stroke="#1a1818" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M422 370 Q440 375 455 365" stroke="#1a1818" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Water drops -->
  <g fill="#1a1a1a" opacity="0.3">
    <ellipse cx="380" cy="200" rx="2" ry="4"/>
    <ellipse cx="420" cy="250" rx="1.5" ry="3"/>
    <ellipse cx="390" cy="280" rx="2" ry="5"/>
    <ellipse cx="410" cy="310" rx="1" ry="3"/>
    <ellipse cx="370" cy="230" rx="1.5" ry="3"/>
  </g>
  
  <!-- Subtle eerie glow around the fan -->
  <circle cx="400" cy="80" r="70" fill="none" stroke="#1a1510" stroke-width="0.5" opacity="0.5"/>
  <circle cx="400" cy="80" r="100" fill="none" stroke="#1a1510" stroke-width="0.3" opacity="0.3"/>
  
  <!-- Dark vignette edges -->
  <rect width="800" height="450" fill="url(#fanGlow)" opacity="0.5"/>
</svg>
