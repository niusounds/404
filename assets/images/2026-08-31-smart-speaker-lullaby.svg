<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle room outline - floor -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Window (dark, night) -->
  <rect x="50" y="60" width="180" height="220" rx="2" fill="#0d0b0b" stroke="#1a1515" stroke-width="1"/>
  <line x1="140" y1="60" x2="140" y2="280" stroke="#1a1515" stroke-width="1"/>
  <line x1="50" y1="170" x2="230" y2="170" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Faint moonlight through window -->
  <rect x="55" y="65" width="80" height="105" fill="#1a1820" opacity="0.3"/>
  
  <!-- Bed silhouette (left side) -->
  <rect x="40" y="310" width="200" height="70" rx="4" fill="#121010"/>
  <rect x="40" y="300" width="180" height="15" rx="3" fill="#151212"/>
  
  <!-- Pillow -->
  <ellipse cx="100" cy="298" rx="40" ry="12" fill="#1a1616"/>
  
  <!-- Person silhouette on pillow (lying down) -->
  <ellipse cx="105" cy="292" rx="30" ry="18" fill="#0f0d0d"/>
  
  <!-- Blanket -->
  <path d="M 130 305 Q 160 300 220 310 L 230 375 L 130 375 Z" fill="#111010" opacity="0.8"/>
  
  <!-- Nightstand -->
  <rect x="260" y="320" width="60" height="60" rx="2" fill="#141111"/>
  <rect x="255" y="315" width="70" height="8" rx="1" fill="#1a1616"/>
  
  <!-- Smart speaker on nightstand -->
  <rect x="275" y="280" width="30" height="35" rx="15" fill="#1a1818"/>
  <ellipse cx="290" cy="280" rx="15" ry="4" fill="#1f1c1c"/>
  
  <!-- GLOWING BLUE RING on smart speaker -->
  <ellipse cx="290" cy="295" rx="12" ry="12" fill="none" stroke="#2266cc" stroke-width="3" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="290" cy="295" rx="8" ry="8" fill="#1a3366" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Blue glow effect (larger, softer) -->
  <ellipse cx="290" cy="295" rx="25" ry="25" fill="#1a3366" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.03;0.08" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Sound waves emanating from speaker -->
  <path d="M 310 290 Q 320 285 325 295" fill="none" stroke="#2266cc" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 315 285 Q 330 278 335 292" fill="none" stroke="#2266cc" stroke-width="1" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </path>
  <path d="M 320 280 Q 340 270 345 290" fill="none" stroke="#2266cc" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0;0.15" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </path>
  
  <!-- Shadow figure near bed (right side) - the scary part -->
  <!-- Very subtle, almost invisible -->
  <path d="M 420 380 L 415 260 Q 410 230 425 215 Q 440 200 455 215 Q 470 230 465 260 L 460 380 Z" fill="#0c0a0a" opacity="0.6"/>
  
  <!-- Shadow figure face (barely visible) -->
  <ellipse cx="440" cy="225" rx="12" ry="14" fill="#0e0c0c" opacity="0.4"/>
  
  <!-- Two faint eyes -->
  <circle cx="435" cy="222" r="1.5" fill="#2266cc" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.05;0.25" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="445" cy="222" r="1.5" fill="#2266cc" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.05;0.25" dur="4s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
  
  <!-- Faint text showing time -->
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="14" fill="#2266cc" opacity="0.15">03:14</text>
  
  <!-- Subtle noise/grain overlay effect -->
  <rect width="800" height="450" fill="none" opacity="0.03">
    <animate attributeName="opacity" values="0.03;0.05;0.03" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
