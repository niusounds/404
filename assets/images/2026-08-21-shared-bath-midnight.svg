<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a1520" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1520" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.85" r="0.35">
      <stop offset="0%" stop-color="#2a1a2a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- warm glow from bathroom -->
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- floor -->
  <rect x="0" y="360" width="800" height="90" fill="#080606"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#12101a" stroke-width="1"/>

  <!-- bathroom door frame -->
  <rect x="310" y="80" width="180" height="280" fill="#0e0a10" stroke="#1a1520" stroke-width="2"/>
  <!-- door (slightly ajar) -->
  <rect x="310" y="80" width="14" height="280" fill="#12101a" stroke="#1c1725" stroke-width="0.5"/>
  <!-- door gap -->
  <rect x="476" y="80" width="14" height="280" fill="#0e0a10" stroke="#1c1725" stroke-width="0.5"/>

  <!-- interior light glow through gap -->
  <rect x="476" y="120" width="8" height="240" fill="#3a2530" opacity="0.15" filter="url(#blur1)"/>

  <!-- bathtub silhouette -->
  <ellipse cx="420" cy="310" rx="55" ry="20" fill="#0c0a0e" stroke="#1e1825" stroke-width="1"/>
  <ellipse cx="420" cy="305" rx="50" ry="15" fill="#1a1018" opacity="0.8"/>

  <!-- steam wisps -->
  <g opacity="0.35" filter="url(#blur2)">
    <path d="M390,300 Q395,260 388,220 Q385,200 392,170" stroke="#2a1a2a" fill="none" stroke-width="8" opacity="0.5"/>
    <path d="M410,305 Q415,270 408,235 Q405,210 412,180" stroke="#2a1a2a" fill="none" stroke-width="6" opacity="0.4"/>
    <path d="M430,300 Q428,265 435,230 Q438,205 432,175" stroke="#2a1a2a" fill="none" stroke-width="7" opacity="0.45"/>
    <path d="M445,305 Q450,275 445,245 Q442,220 448,190" stroke="#2a1a2a" fill="none" stroke-width="5" opacity="0.35"/>
    <path d="M400,295 Q398,255 405,225 Q408,200 402,165" stroke="#2a1a2a" fill="none" stroke-width="6" opacity="0.3"/>
  </g>

  <!-- water surface in tub -->
  <ellipse cx="420" cy="303" rx="45" ry="10" fill="#2a1a25" opacity="0.3"/>

  <!-- door handle -->
  <circle cx="470" cy="230" r="4" fill="#1a1520" stroke="#251f2e" stroke-width="0.5"/>

  <!-- tiles hint on wall -->
  <g opacity="0.08" stroke="#3a2a3a" stroke-width="0.5" fill="none">
    <rect x="330" y="100" width="15" height="15"/>
    <rect x="347" y="100" width="15" height="15"/>
    <rect x="330" y="117" width="15" height="15"/>
    <rect x="347" y="117" width="15" height="15"/>
    <rect x="450" y="100" width="15" height="15"/>
    <rect x="467" y="100" width="15" height="15"/>
    <rect x="450" y="117" width="15" height="15"/>
    <rect x="467" y="117" width="15" height="15"/>
  </g>

  <!-- dark figure silhouette in steam (barely visible) -->
  <g opacity="0.06" fill="#1a1520">
    <ellipse cx="425" cy="240" rx="12" ry="15"/>
    <rect x="417" y="255" width="16" height="35" rx="4"/>
    <rect x="418" y="290" width="6" height="18" rx="2"/>
    <rect x="428" y="290" width="6" height="18" rx="2"/>
  </g>

  <!-- floor reflection -->
  <rect x="340" y="362" width="120" height="3" fill="#1a1018" opacity="0.3" filter="url(#blur1)"/>

  <!-- phone camera icon on floor (left side) -->
  <rect x="180" y="380" width="22" height="40" rx="3" fill="#0e0a10" stroke="#1a1520" stroke-width="0.5"/>
  <circle cx="191" cy="388" r="4" fill="none" stroke="#1c1725" stroke-width="0.5"/>
  <circle cx="191" cy="388" r="1.5" fill="#1c1725" opacity="0.3"/>

  <!-- subtle vignette -->
  <rect width="800" height="450" fill="none" stroke="#000" stroke-width="40" opacity="0.15"/>
</svg>
