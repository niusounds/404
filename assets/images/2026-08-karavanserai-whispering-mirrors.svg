<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow filter for eerie light -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Desert night sky gradient -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Stars - sparse scattered dots -->
  <circle cx="120" cy="45" r="1.2" fill="#ffeedd" opacity="0.5"/>
  <circle cx="280" cy="70" r="0.8" fill="#ffffff" opacity="0.3"/>
  <circle cx="510" cy="30" r="1.5" fill="#ffeedd" opacity="0.6"/>
  <circle cx="650" cy="55" r="0.9" fill="#ffffff" opacity="0.4"/>
  <circle cx="720" cy="80" r="1.1" fill="#ffeeee" opacity="0.3"/>

  <!-- Desert floor gradient -->
  <rect x="0" y="220" width="800" height="230" fill="#1a1510"/>
  <ellipse cx="400" cy="460" rx="500" ry="80" fill="#2a2018" opacity="0.7"/>

  <!-- Kamaaduu arch - main silhouette -->
  <g>
    <!-- Outer frame of building -->
    <rect x="200" y="90" width="400" height="370" fill="#110e0a"/>
    
    <!-- Left pillar -->
    <rect x="225" y="150" width="40" height="310" fill="#181410"/>
    <rect x="225" y="150" width="40" height="20" fill="#1e1a14"/>
    <!-- Left column capital decoration -->
    <ellipse cx="245" cy="160" rx="28" ry="8" fill="none" stroke="#3d001a" stroke-width="0.8" opacity="0.6"/>

    <!-- Right pillar -->
    <rect x="535" y="150" width="40" height="310" fill="#181410"/>
    <rect x="535" y="150" width="40" height="20" fill="#1e1a14"/>
    <ellipse cx="555" cy="160" rx="28" ry="8" fill="none" stroke="#3d001a" stroke-width="0.8" opacity="0.6"/>

    <!-- Inner Kamaaduu arch - the horseshoe shape -->
    <path d="M 250,75 Q 300,90 340,160 L 340,460 L 460,460 L 460,160 Q 500,90 550,75 Z" 
          fill="#d4e8f8" opacity="0.04"/>
    <path d="M 260,65 Q 305,78 335,138 L 335,450 L 465,450 L 465,138 Q 495,78 540,65 Z" 
          fill="none" stroke="#b8d4e8" stroke-width="2.5" opacity="0.35"/>
    <path d="M 265,58 Q 310,72 340,130 L 340,445 L 460,445 L 460,130 Q 490,72 535,58 Z" 
          fill="#b8d4e8" opacity="0.06"/>
    
    <!-- Moon glow behind arch -->
    <circle cx="400" cy="120" r="70" fill="#a8cde8" opacity="0.06" filter="url(#glow)"/>
  </g>

  <!-- Whisper/mist lines rising from the interior - ghostly voices -->
  <g opacity="0.35">
    <path d="M 275,420 Q 310,380 295,300" fill="none" stroke="#e0f0ff" stroke-width="0.6" 
          stroke-dasharray="4,6"/>
    <path d="M 300,410 Q 340,370 320,290" fill="none" stroke="#ffe8e8" stroke-width="0.5" 
          stroke-dasharray="3,5"/>
    <path d="M 325,420 Q 360,390 370,310" fill="none" stroke="#f0dff0" stroke-width="0.5" 
          stroke-dasharray="5,8"/>
    <path d="M 460,420 Q 430,370 440,290" fill="none" stroke="#ffe8e8" stroke-width="0.5" 
          stroke-dasharray="3,5"/>
    <path d="M 480,410 Q 450,360 470,280" fill="none" stroke="#d0e8f0" stroke-width="0.4"
          stroke-dasharray="4,7"/>
    
    <!-- Whisper text fragments floating -->
    <text x="320" y="295" font-size="10" fill="#ffeedd" opacity="0.6">あき</text>
    <text x="440" y="285" font-size="9" fill="#f0e0e0" opacity="0.5">たの</text>
  </g>

  <!-- Mirror/rock plates on the building walls - flat reflective surfaces -->
  <g opacity="0.3">
    <rect x="240" y="180" width="60" height="90" rx="2" fill="#c8e0f0" stroke="#b8d8e8" stroke-width="0.5"/>
    <rect x="370" y="200" width="70" height="140" rx="2" fill="#d0e8f0" stroke="#baf0ff" stroke-width="0.5"/>
    <rect x="530" y="190" width="60" height="100" rx="2" fill="#c0dce8" stroke="#aad4ec" stroke-width="0.5"/>
    
    <!-- Reflection glints -->
    <line x1="255" y1="190" x2="270" y2="185" stroke="white" stroke-width="1" opacity="0.3"/>
    <line x1="385" y1="215" x2="400" y2="208" stroke="white" stroke-width="1" opacity="0.25"/>
    <line x1="545" y1="200" x2="560" y2="197" stroke="white" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Ghostly silhouette figures trapped inside the mirrors -->
  <g opacity="0.4">
    <circle cx="400" cy="278" r="6" fill="#ff4040" filter="url(#soft-glow)"/>
    <!-- Trapped figure outline - eyes only, no face (missing faces) -->
    <g>
      <ellipse cx="395" cy="274" rx="1.5" ry="2" fill="#ff6868"/>
      <ellipse cx="405" cy="274" rx="1.5" ry="2" fill="#ff6868"/>
    </g>
  </g>

  <!-- Desert sand wind lines at bottom -->
  <g opacity="0.2">
    <path d="M 30,400 Q 80,395 130,400" fill="none" stroke="#d4c8a0" stroke-width="0.6"/>
    <path d="M 70,420 Q 130,413 170,420 " fill="none" stroke="#d4c8a0" stroke-width="0.5"/>
    <path d=" M 90,385 Q 96,380 102,385" fill="none" stroke="#e0d8b0" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Gothic decorative border - ornate corners -->
  <rect x="12" y="12" width="776" height="426" rx="2" fill="none" stroke="#3d001a" stroke-width="2.5"/>
  
  <!-- Corner decorative elements -->
  <g>
    <!-- Top-left corner ornament -->
    <path d="M 10,10 L 90,10 L 85,20 L 20,20 L 20,85" 
          fill="none" stroke="#6b0030" stroke-width="1.2" opacity="0.7"/>
    <circle cx="40" cy="40" r="10" fill="#6b0030" opacity="0.3"/>
    <circle cx="40" cy="40" r="5" fill="#e8a0c0" opacity="0.2"/>

    <!-- Top-right corner ornament -->
    <path d="M 790,10 L 710,10 L 715,20 L 780,20 L 780,85" 
          fill="none" stroke="#6b0030" stroke-width="1.2" opacity="0.7"/>
    <circle cx="760" cy="40" r="10" fill="#6b0030" opacity="0.3"/>
    <circle cx="760" cy="40" r="5" fill="#e8a0c0" opacity="0.2"/>

    <!-- Bottom-left corner ornament -->
    <path d="M 10,440 L 90,440 L 85,430 L 20,430 L 20,365" 
          fill="none" stroke="#6b0030" stroke-width="1.2" opacity="0.7"/>
    <circle cx="40" cy="410" r="10" fill="#6b0030" opacity="0.3"/>

    <!-- Bottom-right corner ornament -->
    <path d="M 790,440 L 710,440 L 715,430 L 780,430 L 780,365" 
          fill="none" stroke="#6b0030" stroke-width="1.2" opacity="0.7"/>
    <circle cx="760" cy="410" r="10" fill="#6b0030" opacity="0.3"/>
  </g>

  <!-- Outer glow border -->
  <rect x="9" y="9" width="782" height="432" rx="2" fill="none" stroke="#ff3c1a" stroke-width="0.5" opacity="0.3"/>

</svg>
