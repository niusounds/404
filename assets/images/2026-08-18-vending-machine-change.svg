<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle street/ground -->
  <rect x="0" y="350" width="800" height="100" fill="#0d0a0a"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Vending machine body -->
  <rect x="300" y="80" width="180" height="270" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
  
  <!-- Vending machine glass front -->
  <rect x="315" y="100" width="150" height="150" rx="2" fill="#0f0f0f" stroke="#1e1e1e" stroke-width="1"/>
  
  <!-- Dark silhouette inside the glass (hint of a figure) -->
  <ellipse cx="390" cy="200" rx="25" ry="30" fill="#0a0a0a"/>
  <rect x="375" y="170" width="30" height="40" fill="#0a0a0a"/>
  
  <!-- Product rows (faint outlines of cans) -->
  <rect x="325" y="110" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="345" y="110" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="365" y="110" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="385" y="110" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="405" y="110" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="425" y="110" width="12" height="20" fill="#151515" rx="1"/>
  
  <rect x="325" y="140" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="345" y="140" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="385" y="140" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="405" y="140" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="425" y="140" width="12" height="20" fill="#151515" rx="1"/>
  
  <rect x="325" y="170" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="345" y="170" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="365" y="170" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="385" y="170" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="405" y="170" width="12" height="20" fill="#151515" rx="1"/>
  <rect x="425" y="170" width="12" height="20" fill="#151515" rx="1"/>
  
  <!-- Change return slot -->
  <rect x="340" y="270" width="100" height="15" rx="2" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Warm breath/warmth effect from the slot - subtle red glow -->
  <ellipse cx="390" cy="285" rx="40" ry="15" fill="#1a0505" opacity="0.6"/>
  <ellipse cx="390" cy="290" rx="25" ry="10" fill="#200808" opacity="0.4"/>
  <ellipse cx="390" cy="295" rx="15" ry="6" fill="#2a0a0a" opacity="0.3"/>
  
  <!-- Button panel -->
  <rect x="340" y="300" width="100" height="30" rx="2" fill="#151515" stroke="#222" stroke-width="1"/>
  <circle cx="360" cy="315" r="5" fill="#1a1a1a"/>
  <circle cx="380" cy="315" r="5" fill="#1a1a1a"/>
  <circle cx="400" cy="315" r="5" fill="#1a1a1a"/>
  <circle cx="420" cy="315" r="5" fill="#1a1a1a"/>
  
  <!-- Coin slot -->
  <rect x="380" y="340" width="20" height="5" rx="1" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Ambient light from vending machine -->
  <rect x="300" y="80" width="180" height="5" fill="#1a2a1a" opacity="0.3"/>
  <rect x="300" y="80" width="5" height="270" fill="#1a2a1a" opacity="0.15"/>
  <rect x="475" y="80" width="5" height="270" fill="#1a2a1a" opacity="0.15"/>
  
  <!-- Subtle green LED indicator -->
  <circle cx="460" cy="95" r="3" fill="#1a3a1a" opacity="0.8"/>
  <circle cx="460" cy="95" r="6" fill="#1a3a1a" opacity="0.2"/>
  
  <!-- Street light effect - cold blue from above -->
  <ellipse cx="400" cy="0" rx="120" ry="80" fill="#0a0a1a" opacity="0.15"/>
  
  <!-- Fog/mist at ground level -->
  <ellipse cx="200" cy="370" rx="150" ry="20" fill="#0a0a0a" opacity="0.4"/>
  <ellipse cx="600" cy="380" rx="180" ry="18" fill="#0a0a0a" opacity="0.3"/>
  <ellipse cx="400" cy="400" rx="200" ry="25" fill="#0a0a0a" opacity="0.2"/>
  
  <!-- Single can sitting on the change slot -->
  <rect x="370" y="255" width="14" height="18" rx="2" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="372" y="257" width="10" height="4" fill="#3a3a3a" rx="1"/>
  
  <!-- Dark alley walls -->
  <rect x="0" y="100" width="250" height="250" fill="#080606"/>
  <rect x="550" y="100" width="250" height="250" fill="#080606"/>
  
  <!-- Building windows in background (dark) -->
  <rect x="30" y="130" width="15" height="20" fill="#0a0a0a"/>
  <rect x="60" y="130" width="15" height="20" fill="#0a0a0a"/>
  <rect x="30" y="160" width="15" height="20" fill="#0a0a0a"/>
  <rect x="60" y="160" width="15" height="20" fill="#0a0a0a"/>
  
  <rect x="720" y="130" width="15" height="20" fill="#0a0a0a"/>
  <rect x="750" y="130" width="15" height="20" fill="#0a0a0a"/>
  <rect x="720" y="160" width="15" height="20" fill="#0a0a0a"/>
  <rect x="750" y="160" width="15" height="20" fill="#0a0a0a"/>
</svg>