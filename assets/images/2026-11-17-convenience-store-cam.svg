<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Monitor frame -->
  <rect x="180" y="40" width="440" height="310" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="190" y="50" width="420" height="290" fill="#0d0d0d"/>
  
  <!-- Monitor screen glow -->
  <rect x="190" y="50" width="420" height="290" fill="#0a1a0a" opacity="0.3"/>
  
  <!-- Scan lines -->
  <g opacity="0.06">
    <line x1="190" y1="60" x2="610" y2="60" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="70" x2="610" y2="70" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="80" x2="610" y2="80" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="90" x2="610" y2="90" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="100" x2="610" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="110" x2="610" y2="110" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="120" x2="610" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="130" x2="610" y2="130" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="140" x2="610" y2="140" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="150" x2="610" y2="150" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="160" x2="610" y2="160" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="170" x2="610" y2="170" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="180" x2="610" y2="180" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="190" x2="610" y2="190" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="200" x2="610" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="210" x2="610" y2="210" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="220" x2="610" y2="220" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="230" x2="610" y2="230" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="240" x2="610" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="250" x2="610" y2="250" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="260" x2="610" y2="260" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="270" x2="610" y2="270" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="280" x2="610" y2="280" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="290" x2="610" y2="290" stroke="#ffffff" stroke-width="1"/>
    <line x1="190" y1="300" x2="610" y2="300" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Camera grid lines on monitor (4 quadrants) -->
  <line x1="400" y1="50" x2="400" y2="340" stroke="#1a3a1a" stroke-width="0.5" opacity="0.5"/>
  <line x1="190" y1="195" x2="610" y2="195" stroke="#1a3a1a" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Top-left quadrant: empty aisle -->
  <g opacity="0.4">
    <rect x="210" y="70" width="8" height="100" fill="#1a2a1a"/>
    <rect x="225" y="70" width="6" height="100" fill="#1a2a1a"/>
    <rect x="240" y="70" width="8" height="100" fill="#1a2a1a"/>
    <rect x="350" y="70" width="8" height="100" fill="#1a2a1a"/>
    <rect x="365" y="70" width="6" height="100" fill="#1a2a1a"/>
  </g>
  
  <!-- Top-right quadrant: empty shelf -->
  <g opacity="0.3">
    <rect x="430" y="80" width="60" height="80" fill="#1a2a1a"/>
    <rect x="430" y="80" width="60" height="3" fill="#2a4a2a"/>
    <rect x="430" y="100" width="60" height="3" fill="#2a4a2a"/>
    <rect x="430" y="120" width="60" height="3" fill="#2a4a2a"/>
    <rect x="430" y="140" width="60" height="3" fill="#2a4a2a"/>
  </g>
  
  <!-- Bottom-left quadrant: empty floor -->
  <g opacity="0.2">
    <ellipse cx="280" cy="270" rx="50" ry="20" fill="#1a2a1a" opacity="0.3"/>
  </g>
  
  <!-- Bottom-right quadrant: THE WHITE FIGURE behind the counter -->
  <!-- Figure body -->
  <ellipse cx="510" cy="230" rx="22" ry="45" fill="#d8d8d8" opacity="0.85"/>
  <!-- Head -->
  <circle cx="510" cy="175" r="18" fill="#d8d8d8" opacity="0.85"/>
  <!-- Arms hanging down -->
  <rect x="488" y="200" width="6" height="50" rx="3" fill="#d8d8d8" opacity="0.8"/>
  <rect x="526" y="200" width="6" height="50" rx="3" fill="#d8d8d8" opacity="0.8"/>
  <!-- Raised single finger -->
  <line x1="532" y1="205" x2="545" y2="185" stroke="#d8d8d8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- Legs -->
  <rect x="498" y="270" width="10" height="30" rx="3" fill="#d8d8d8" opacity="0.75"/>
  <rect x="516" y="270" width="10" height="30" rx="3" fill="#d8d8d8" opacity="0.75"/>
  
  <!-- Empty space around figure to make it stand out -->
  <rect x="470" y="160" width="80" height="150" fill="none" stroke="#1a3a1a" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Monitor stand -->
  <rect x="370" y="350" width="60" height="20" fill="#1a1a1a"/>
  <rect x="350" y="365" width="100" height="8" rx="3" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Red recording LED -->
  <circle cx="590" cy="348" r="3" fill="#ff0000" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Timestamp text on monitor -->
  <text x="200" y="68" fill="#3a7a3a" font-family="monospace" font-size="11" opacity="0.7">2025/12/03 03:47:21</text>
  <text x="540" y="68" fill="#3a7a3a" font-family="monospace" font-size="11" opacity="0.5">CAM-07</text>
  
  <!-- Subtle vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect x="190" y="50" width="420" height="290" fill="url(#vignette)"/>
  
  <!-- Ambient darkness around monitor -->
  <rect x="0" y="0" width="800" height="450" fill="#0a0808" opacity="0.3"/>
  
  <!-- Subtle noise texture dots -->
  <g opacity="0.03" fill="#ffffff">
    <circle cx="200" cy="100" r="0.5"/>
    <circle cx="350" cy="200" r="0.5"/>
    <circle cx="500" cy="150" r="0.5"/>
    <circle cx="580" cy="280" r="0.5"/>
    <circle cx="250" cy="300" r="0.5"/>
    <circle cx="450" cy="250" r="0.5"/>
    <circle cx="320" cy="120" r="0.5"/>
    <circle cx="550" cy="90" r="0.5"/>
  </g>
</svg>
