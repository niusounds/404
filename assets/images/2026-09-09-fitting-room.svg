<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="mirrorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Floor -->
  <rect x="0" y="320" width="800" height="130" fill="url(#floorGrad)"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1520" stroke-width="1"/>
  
  <!-- Curtain left -->
  <path d="M0,0 Q30,150 10,280 Q5,300 0,320 L0,0Z" fill="#1a0a12" opacity="0.8"/>
  <path d="M0,0 Q20,120 15,260 Q10,290 0,320 L0,0Z" fill="#200e18" opacity="0.6"/>
  
  <!-- Curtain right -->
  <path d="M800,0 Q770,150 790,280 Q795,300 800,320 L800,0Z" fill="#1a0a12" opacity="0.8"/>
  <path d="M800,0 Q780,120 785,260 Q790,290 800,320 L800,0Z" fill="#200e18" opacity="0.6"/>
  
  <!-- Mirror frame -->
  <rect x="180" y="30" width="440" height="310" rx="4" fill="#1a1520" stroke="#2a2030" stroke-width="2"/>
  
  <!-- Mirror surface -->
  <rect x="185" y="35" width="430" height="300" fill="#0f0c14"/>
  
  <!-- Mirror reflection glow -->
  <rect x="185" y="35" width="430" height="300" fill="#151020" opacity="0.3"/>
  
  <!-- Person silhouette (normal) in mirror -->
  <g opacity="0.7">
    <!-- Head -->
    <ellipse cx="400" cy="100" rx="22" ry="28" fill="#1a1525"/>
    <!-- Body -->
    <path d="M378,125 Q375,160 370,200 L370,260 L385,260 L390,200 L400,195 L410,200 L415,260 L430,260 L430,200 Q425,160 422,125Z" fill="#1a1525"/>
    <!-- Coat drape -->
    <path d="M370,160 Q360,180 355,220 L360,260" fill="none" stroke="#1e1828" stroke-width="3"/>
    <path d="M430,160 Q440,180 445,220 L440,260" fill="none" stroke="#1e1828" stroke-width="3"/>
  </g>
  
  <!-- Creepy shadow figure emerging from mirror (right side) -->
  <g filter="url(#blur1)" opacity="0.45">
    <!-- Head slightly distorted -->
    <ellipse cx="490" cy="110" rx="18" ry="24" fill="#2a1530"/>
    <!-- Body leaning out -->
    <path d="M472,130 Q468,155 465,180 L465,230 L475,230 L478,180 L485,175 L492,180 L495,230 L505,230 L505,180 Q500,155 498,130Z" fill="#2a1530"/>
    <!-- Arm reaching out -->
    <path d="M505,155 Q520,150 540,145 Q560,140 570,135" fill="none" stroke="#2a1530" stroke-width="5" stroke-linecap="round"/>
    <!-- Hand fingers -->
    <line x1="570" y1="135" x2="580" y2="128" stroke="#2a1530" stroke-width="3" stroke-linecap="round"/>
    <line x1="570" y1="135" x2="582" y2="135" stroke="#2a1530" stroke-width="3" stroke-linecap="round"/>
    <line x1="570" y1="135" x2="582" y2="142" stroke="#2a1530" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Mirror crack effect -->
  <path d="M420,35 L425,80 L418,120 L430,160 L422,200 L435,240 L428,280 L432,320" fill="none" stroke="#2a2035" stroke-width="1" opacity="0.5"/>
  <path d="M425,80 L440,75" fill="none" stroke="#2a2035" stroke-width="0.5" opacity="0.3"/>
  <path d="M430,160 L445,155" fill="none" stroke="#2a2035" stroke-width="0.5" opacity="0.3"/>
  <path d="M428,280 L442,285" fill="none" stroke="#2a2035" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Subtle eerie glow around mirror -->
  <rect x="180" y="30" width="440" height="310" rx="4" fill="none" stroke="#2a1535" stroke-width="1" opacity="0.3"/>
  
  <!-- Dim overhead light -->
  <ellipse cx="400" cy="15" rx="60" ry="8" fill="#2a2530" opacity="0.5"/>
  <ellipse cx="400" cy="15" rx="40" ry="4" fill="#3a3040" opacity="0.3"/>
  <ellipse cx="400" cy="15" rx="20" ry="2" fill="#4a4050" opacity="0.2"/>
  
  <!-- Floor reflection -->
  <rect x="250" y="322" width="300" height="3" fill="#1a1520" opacity="0.3"/>
  
  <!-- Small creepy detail: a single red dot (like a light) in the mirror -->
  <circle cx="485" cy="108" r="2" fill="#3a1525" opacity="0.6"/>
</svg>
