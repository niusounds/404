<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow1"><feGaussianBlur stdDeviation="3" result="blur"/><merge><mergeNode in="blur"/><mergeNode in="SourceGraphic"/></merge></filter>
    <linearGradient id="caveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0805"/>
      <stop offset="60%" stop-color="#1a0f0a"/>
      <stop offset="100%" stop-color="#080403"/>
    </linearGradient>
    <radialGradient id="childGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#c8c0b5ff"/>
      <stop offset="100%" stop-color="#8a7e70aa"/>
    </radialGradient>
  </defs>
  
  <!-- Background: narrow cave mouth -->
  <rect width="800" height="450" fill="#0a0604"/>
  
  <!-- Cave opening - irregular arches -->
  <path d="M30,450 L30,120 Q30,50 100,40 Q200,-5 400,-10 Q600,-5 700,40 Q770,50 770,120 L770,450 Z" fill="url(#caveGrad)"/>
  
  <!-- Cave stalactites left -->
  <path d="M80,30 L90,-10 L100,20 Q120,0 130,25 L116,50 Z" fill="#1a100c" opacity="0.7"/>
  <path d="M50,10 L65,-25 L80,9 L85,40 L66,35 Z" fill="#120b08" opacity="0.6"/>
  
  <!-- Cave stalactites right -->
  <path d="M740,30 L730,-10 L720,20 Q700,0 690,25 L704,50 Z" fill="#1a100c" opacity="0.7"/>
  <path d="M760,10 L755,-25 L740,9 L735,40 L710,35 Z" fill="#120b08" opacity="0.6"/>
  
  <!-- Dark inner cave depth -->
  <ellipse cx="400" cy="280" rx="320" ry="170" fill="#040203"/>
  
  <!-- Faint old church silhouette in the distance -->
  <rect x="360" y="200" width="80" height="90" fill="#080506" opacity="0.8"/>
  <path d="M370,180 L400,155 L430,180 Z" fill="#0a0607" opacity="0.7"/>
  <circle cx="400" cy="225" r="8" fill="#120908" stroke="#2a1210" stroke-width="1" opacity="0.8"/>
  
  <!-- Cross on church top -->
  <line x1="400" y1="130" x2="400" y2="160" stroke="#2a0805" stroke-width="2" opacity="0.9"/>
  <line x1="392" y1="140" x2="408" y2="140" stroke="#2a0805" stroke-width="2" opacity="0.9"/>
  
  <!-- The Laikaedimon figure - child-like pale form with stone texture -->
  <g transform="translate(350, 210)">
    <!-- Body silhouette in soft glow -->
    <ellipse cx="45" cy="60" rx="25" ry="50" fill="#a89e9020"/>
    
    <!-- Head - rounded, child proportions -->
    <circle cx="45" cy="20" r="18" fill="#c8bfb288"/>
    
    <!-- Stone-like skin texture overlay on head -->
    <path d="M35,16 Q40,8 45,14 Q50,9 55,16 Q52,12 45,8 Q37,11 35,16" fill="#d5ccc0" stroke="#b0a698" stroke-width="0.5" opacity="0.7"/>
    
    <!-- Eyes - empty dark sockets -->
    <circle cx="38" cy="22" r="4" fill="#0a0505"/>
    <circle cx="52" cy="22" r="4" fill="#0a0505"/>
    <circle cx="39.5" cy="21.5" r="2" fill="#f0e8dc" opacity="0.6"/>
    <circle cx="53.5" cy="21.5" r="2" fill="#f0e8dc" opacity="0.6"/>
    
    <!-- Tiny cold smile -->
    <path d="M40,30 Q47,34 52,29" stroke="#b0a698" stroke-width="1.2" fill="none" opacity="0.4"/>
    
    <!-- Small stone-marked chest -->
    <path d="M38,55 L42,45 L47,50 L52,43" stroke="#2a2018" stroke-width="1" fill="none" opacity="0.6"/>
    
    <!-- Subtle marble veins on body -->
    <line x1="40" y1="70" x2="42" y2="95" stroke="#b8afa0" stroke-width="0.5" opacity="0.3"/>
    <line x1="55" y1="65" x2="52" y2="90" stroke="#e8ddd2" stroke-width="0.5" opacity="0.25"/>
  </g>
  
  <!-- Ground mist -->
  <ellipse cx="400" cy="400" rx="380" ry="40" fill="#1a0f0c60"/>
  <rect y="390" width="800" height="60" fill="#0d0705" opacity="0.7"/>
  
  <!-- Ground cracks -->
  <line x1="200" y1="410" x2="250" y2="430" stroke="#2a1a14" stroke-width="1.5" opacity="0.6"/>
  <line x1="580" y1="415" x2="620" y2="435" stroke="#2a1a14" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Decorative border - dark red gothic frame -->
  <rect x="18" y="18" width="764" height="414" rx="6" fill="none" stroke="#2a0505" stroke-width="3" filter="url(#glow1)"/>
  
  <!-- Corner ornaments - top-left -->
  <path d="M35,48 Q35,35 48,35 L58,37" fill="none" stroke="#5a1010" stroke-width="2"/>
  <path d="M45,55 L55,65" stroke="#5a1010" stroke-width="2"/>
  <!-- Corner ornaments - top-right -->
  <path d="M765,48 Q765,35 752,35 L742,37" fill="none" stroke="#5a1010" stroke-width="2"/>
  <path d="M755,55 L745,65" stroke="#5a1010" stroke-width="2"/>
  <!-- Corner ornaments - bottom-left -->
  <path d="M35,402 Q35,415 48,415 L58,413" fill="none" stroke="#5a1010" stroke-width="2"/>
  <path d="M45,395 L55,385" stroke="#5a1010" stroke-width="2"/>
  <!-- Corner ornaments - bottom-right -->
  <path d="M765,402 Q765,415 752,415 L742,413" fill="none" stroke="#5a1010" stroke-width="2"/>
  <path d="M755,395 L745,385" stroke="#5a1010" stroke-width="2"/>
</svg>