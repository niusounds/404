<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Wall texture - subtle vertical lines -->
  <g opacity="0.03">
    <line x1="100" y1="0" x2="100" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="450" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Wall surface -->
  <rect x="250" y="20" width="300" height="410" fill="#1a1515" rx="2"/>
  <rect x="250" y="20" width="300" height="410" fill="none" stroke="#2a2020" stroke-width="1"/>

  <!-- Cracks in wall -->
  <g opacity="0.15" stroke="#3a3030" stroke-width="0.5" fill="none">
    <path d="M 320 20 L 330 80 L 325 120 L 340 160"/>
    <path d="M 480 430 L 470 370 L 475 330 L 460 290"/>
  </g>

  <!-- The hole in the wall -->
  <ellipse cx="400" cy="220" rx="18" ry="22" fill="#050305"/>
  <ellipse cx="400" cy="220" rx="18" ry="22" fill="none" stroke="#2a1a1a" stroke-width="1"/>
  <!-- Inner glow from the hole -->
  <ellipse cx="400" cy="220" rx="12" ry="16" fill="#0a0608" opacity="0.8"/>

  <!-- Eye in the hole - pupil -->
  <ellipse cx="400" cy="218" rx="6" ry="7" fill="#000000"/>
  <!-- Eye iris hint -->
  <ellipse cx="400" cy="218" rx="9" ry="10" fill="#1a0a0a" opacity="0.6"/>
  <!-- Eye reflection -->
  <circle cx="403" cy="215" r="1.5" fill="#3a2020" opacity="0.4"/>

  <!-- Subtle ear silhouette on the wall side (left) -->
  <g opacity="0.06">
    <ellipse cx="240" cy="220" rx="15" ry="25" fill="#1a1515"/>
    <ellipse cx="240" cy="220" rx="8" ry="15" fill="none" stroke="#2a2020" stroke-width="0.5"/>
  </g>

  <!-- Ambient light from the right side -->
  <defs>
    <radialGradient id="light" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a1010" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="holeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a0a0a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#light)"/>
  <ellipse cx="400" cy="220" rx="60" ry="80" fill="url(#holeGlow)"/>

  <!-- Floor shadow -->
  <rect x="250" y="420" width="300" height="30" fill="#080606" opacity="0.5"/>

  <!-- Subtle dust particles -->
  <g opacity="0.08" fill="#8a7a7a">
    <circle cx="380" cy="180" r="0.5"/>
    <circle cx="420" cy="260" r="0.5"/>
    <circle cx="390" cy="300" r="0.3"/>
    <circle cx="410" cy="170" r="0.4"/>
    <circle cx="370" cy="240" r="0.3"/>
    <circle cx="430" cy="200" r="0.5"/>
  </g>
</svg>
