<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Floor -->
  <rect x="0" y="320" width="800" height="130" fill="#0d0a0a"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Wall texture lines -->
  <line x1="100" y1="0" x2="100" y2="320" stroke="#0f0c0c" stroke-width="0.5"/>
  <line x1="250" y1="0" x2="250" y2="320" stroke="#0f0c0c" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="320" stroke="#0f0c0c" stroke-width="0.5"/>
  <line x1="550" y1="0" x2="550" y2="320" stroke="#0f0c0c" stroke-width="0.5"/>
  <line x1="700" y1="0" x2="700" y2="320" stroke="#0f0c0c" stroke-width="0.5"/>
  
  <!-- Ceiling fluorescent light -->
  <rect x="350" y="15" width="100" height="8" fill="#1a1a1a" rx="2"/>
  <ellipse cx="400" cy="28" rx="60" ry="8" fill="#2a3a2a" opacity="0.3"/>
  <ellipse cx="400" cy="35" rx="120" ry="20" fill="#2a3a2a" opacity="0.15"/>
  
  <!-- Dryer (main subject) - center-right -->
  <rect x="480" y="140" width="180" height="180" rx="8" fill="#151212" stroke="#1e1a1a" stroke-width="1"/>
  <!-- Dryer door window -->
  <rect x="500" y="160" width="140" height="130" rx="60" fill="#0a0808" stroke="#1a1818" stroke-width="1"/>
  <!-- Inner glow from dryer -->
  <circle cx="570" cy="225" r="50" fill="#1a2a3a" opacity="0.15"/>
  <circle cx="570" cy="225" r="30" fill="#1a2a3a" opacity="0.1"/>
  <!-- Clothes silhouettes inside dryer -->
  <ellipse cx="540" cy="240" rx="25" ry="15" fill="#1a1a1a" opacity="0.6"/>
  <ellipse cx="580" cy="230" rx="20" ry="18" fill="#181818" opacity="0.5"/>
  <ellipse cx="560" cy="250" rx="30" ry="12" fill="#1a1a1a" opacity="0.4"/>
  <!-- Dryer control panel -->
  <rect x="520" y="145" width="100" height="12" rx="3" fill="#1a1818"/>
  <circle cx="545" cy="151" r="3" fill="#2a3a2a" opacity="0.5"/>
  <circle cx="560" cy="151" r="3" fill="#2a3a2a" opacity="0.3"/>
  <circle cx="575" cy="151" r="3" fill="#3a1a1a" opacity="0.4"/>
  <!-- Dryer door handle -->
  <rect x="610" y="210" width="8" height="30" rx="3" fill="#1e1a1a"/>
  
  <!-- Left washing machine (background) -->
  <rect x="80" y="170" width="140" height="150" rx="6" fill="#121010" stroke="#1a1818" stroke-width="0.5"/>
  <rect x="95" y="190" width="110" height="100" rx="45" fill="#0a0808" stroke="#181616" stroke-width="0.5"/>
  <rect x="100" y="175" width="80" height="10" rx="3" fill="#1a1818"/>
  <circle cx="130" cy="180" r="2.5" fill="#2a3a2a" opacity="0.3"/>
  
  <!-- Second dryer (left background) -->
  <rect x="240" y="170" width="140" height="150" rx="6" fill="#121010" stroke="#1a1818" stroke-width="0.5"/>
  <rect x="255" y="190" width="110" height="100" rx="45" fill="#0a0808" stroke="#181616" stroke-width="0.5"/>
  <rect x="260" y="175" width="80" height="10" rx="3" fill="#1a1818"/>
  <circle cx="290" cy="180" r="2.5" fill="#2a3a2a" opacity="0.2"/>
  
  <!-- Locker cabinets on wall -->
  <rect x="680" y="150" width="100" height="170" rx="3" fill="#141212" stroke="#1c1a1a" stroke-width="0.5"/>
  <line x1="680" y1="190" x2="780" y2="190" stroke="#1c1a1a" stroke-width="0.5"/>
  <line x1="680" y1="230" x2="780" y2="230" stroke="#1c1a1a" stroke-width="0.5"/>
  <line x1="680" y1="270" x2="780" y2="270" stroke="#1c1a1a" stroke-width="0.5"/>
  <line x1="730" y1="150" x2="730" y2="320" stroke="#1c1a1a" stroke-width="0.5"/>
  <rect x="720" y="245" width="4" height="12" rx="1" fill="#1e1a1a"/>
  
  <!-- Scattered clothes on floor -->
  <path d="M 420 340 Q 430 330 440 335 Q 450 340 445 350 Q 435 355 425 348 Z" fill="#1a1a1a" opacity="0.4"/>
  <path d="M 440 350 Q 455 345 460 355 Q 455 365 440 360 Z" fill="#181818" opacity="0.3"/>
  <path d="M 410 355 Q 420 348 425 358 Q 420 365 410 360 Z" fill="#1a1a1a" opacity="0.35"/>
  
  <!-- Cold blue-green glow from dryer on floor -->
  <ellipse cx="570" cy="380" rx="80" ry="25" fill="#1a2a3a" opacity="0.08"/>
  <ellipse cx="570" cy="360" rx="50" ry="15" fill="#1a2a3a" opacity="0.05"/>
  
  <!-- Vibration lines from dryer -->
  <line x1="460" y1="200" x2="450" y2="202" stroke="#2a3a3a" stroke-width="0.5" opacity="0.3"/>
  <line x1="460" y1="220" x2="448" y2="223" stroke="#2a3a3a" stroke-width="0.5" opacity="0.25"/>
  <line x1="460" y1="240" x2="452" y2="242" stroke="#2a3a3a" stroke-width="0.5" opacity="0.2"/>
  <line x1="670" y1="200" x2="680" y2="202" stroke="#2a3a3a" stroke-width="0.5" opacity="0.3"/>
  <line x1="670" y1="220" x2="682" y2="223" stroke="#2a3a3a" stroke-width="0.5" opacity="0.25"/>
  <line x1="670" y1="240" x2="678" y2="242" stroke="#2a3a3a" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Flickering light effect - subtle -->
  <rect x="340" y="0" width="120" height="15" fill="#1a2a2a" opacity="0.05"/>
  
  <!-- Corner darkness -->
  <rect x="0" y="0" width="800" height="450" fill="url(#cornerVignette)" opacity="0.4"/>
  
  <defs>
    <radialGradient id="cornerVignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
