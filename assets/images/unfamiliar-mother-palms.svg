<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1020"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="600" fill="url(#bg)"/>

  <!-- 手袋から零れる白いもの（ぼかし処理） -->
  <g filter="url(#blur)" opacity="0.3">
    <ellipse cx="200" cy="380" rx="40" ry="50" fill="#f0e8d8">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="180" cy="420" r="8" fill="#f0e8d8">
      <animate attributeName="cy" values="420;440;420" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="410" r="6" fill="#f0e8d8">
      <animate attributeName="cy" values="410;435;410" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右手 -->
  <g filter="url(#glow)">
    <path d="M180,250 Q170,300 165,340 Q160,370 170,390 L185,400 L200,395 L215,380 L210,340 Q205,300 215,250"
          fill="none" stroke="#c8a8d8" stroke-width="2" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.7;0.9;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 指 -->
    <line x1="185" y1="260" x2="175" y2="310" stroke="#c8a8d8" stroke-width="8" stroke-linecap="round" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.7;0.5" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="255" x2="195" y2="305" stroke="#c8a8d8" stroke-width="9" stroke-linecap="round" opacity="0.6"/>
    <line x1="215" y1="260" x2="220" y2="308" stroke="#c8a8d8" stroke-width="8" stroke-linecap="round" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.7;0.5" dur="3.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 左手 -->
  <g filter="url(#glow)" opacity="0.6">
    <path d="M220,255 Q230,295 235,335 Q240,365 230,385 L215,395 L200,390 L185,375 L190,340 Q195,300 185,255"
          fill="none" stroke="#a888b8" stroke-width="2"/>
    <line x1="215" y1="265" x2="225" y2="312" stroke="#a888b8" stroke-width="8" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="260" x2="202" y2="310" stroke="#a888b8" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
    <line x1="185" y1="265" x2="178" y2="308" stroke="#a888b8" stroke-width="8" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="3.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 手のひらの中央から光が漏れる -->
  <circle cx="200" cy="320" r="15" fill="#f0e8d8" opacity="0.15">
    <animate attributeName="r" values="12;18;12" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- 背景の影のようなもの -->
  <g filter="url(#blur)" opacity="0.1">
    <ellipse cx="200" cy="200" rx="60" ry="80" fill="#403050">
      <animate attributeName="opacity" values="0.1;0.15;0.1" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- しわと皺（右手） -->
  <path d="M190,268 Q188,275 192,280" fill="none" stroke="#b898c8" stroke-width="1" opacity="0.4"/>
  <!--半月型の皺（重要なディテール） -->
  <path d="M185,300 A5,7 -15 0,1 195,298" fill="none" stroke="#d8b8e8" stroke-width="1.2" opacity="0.6">
    <animate attributeName="stroke-opacity" values="0.6;0.9;0.6" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- パラパラっと零れる小さい点 -->
  <g filter="url(#glow)">
    <circle cx="175" cy="395" r="3" fill="#f0e8d8" opacity="0.4">
      <animate attributeName="cy" values="395;460" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="225" cy="385" r="2.5" fill="#f0e8d8" opacity="0.3">
      <animate attributeName="cy" values="385;450" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="400" r="2" fill="#e0d8c8" opacity="0.35">
      <animate attributeName="cy" values="400;470" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="400;460" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- テキスト -->
  <text x="200" y="540" text-anchor="middle" fill="#6a5a7a" font-family="Noto JP serif, serif" font-size="18" opacity="0.7">
    見知らぬ母の掌
  </text>
</svg>
