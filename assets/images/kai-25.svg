<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a0f"/>
      <stop offset="40%" stop-color="#0b1628"/>
      <stop offset="100%" stop-color="#03070e"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="600" height="180" fill="url(#bg)"/>

  <!-- fog / haze effect via semi-opaque circles -->
  <g opacity=".13">
    <ellipse cx="420" cy="45" rx="90" ry="22" fill="#fff">
      <animate attributeName="opacity" values=".08;.2;.08" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="310" cy="62" rx="65" ry="14" fill="#fff">
      <animate attributeName="opacity" values=".06;.15;.06" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- lighthouse in mist -->
  <rect x="487" y="32" width="6" height="38" fill="#2a2a2a" opacity=".6">
  </rect>
  <polygon points="503,32 490,22 490,28 490,28" fill="#1e2532"/>

  <!-- lighthouse beam -->
  <line x1="503" y1="40" x2="600" y2="85" stroke="#fff8d7" opacity=".8">
    <animate attributeName="opacity" values=".9;.0;.0;.9" dur="10s" fill="freeze"/>
  </line>

  <!-- horizon -->
  <path d="M 0,72 Q 45,68 90,73 T 180,72 T 270,73 S 360,72 450,73 L 600,85" fill="#fff" opacity=".09"/>

  <!-- wave -->
  <path d="M -30,85 Q 60,78 150,87 T 330,85 S 510,87 630,85 L 630,180 L -30,180 Z" fill="#fff" opacity=".12">
    <animate attributeName="d"
       values="M -30,85 Q 60,78 150,87 T 330,85 S 510,87 630,85 L 630,180;
               M -30,82 Q 60,90 150,79 T 330,90 S 510,79 630,82;
               M -30,85 Q 60,78 150,87 T 330,85 S 510,87 630,85"
       dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- submerged silhouette shape (hand / face suggesting "拾おうとした手") -->
  <g transform="translate(0,-2)">
    <ellipse cx="85" cy="148" rx="36" ry="49" fill="#7fa1bf" opacity=".08">
      <animate attributeName="y" values="148;143;148" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- hand-like shapes reaching up -->
    <rect x="242" y="70" width="9" height="80" rx="4.5" fill="#fff" opacity=".15">
      <animate attributeName="opacity" values=".1;.3;.15;.35;.1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#151924;#2e3348;#151924;#303650;#151924" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="367" y="58" width="7.5" height="58" rx="3.5" fill="#fff" opacity=".09">
      <animate attributeName="opacity" values=".12;.25;.14;.2;.1" dur="8s" begin="1s" repeatCount="indefinite"/>
    </rect>

    <!-- the hand reaching up (main visual) -->
    <g transform="translate(209,78)">
      <rect x="4.5" y="-6.5" width="6" height="31" rx="3">
        <animate attributeName="y" values="-6.5;-11.5;-6.5;-1.5; -6.5" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="12.5" y="-4.8" width="7" height="36" rx="3.5">
        <animate attributeName="y" values="-4.8;-9.8;-4.8;0;-4.8" dur="4.6s" begin=".3s" repeatCount="indefinite"/>
      </rect>
      <rect x="21.5" y="-0.5" width="7.5" height="38" rx="3.5">
        <animate attributeName="y" values="-0.5;-6.5;-0.5;2;-0.5" dur="5.4s" begin=".9s" repeatCount="indefinite"/>
      </rect>
      <ellipse cx="17" cy="-14" rx="8.5" ry="8" fill="#fff" opacity=".2">
        <animate attributeName="opacity" values=".15;.3;.12;" dur="6s" begin=".5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- dark water line -->
  </g>
</svg>