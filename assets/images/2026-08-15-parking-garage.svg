<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle concrete texture lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Elevator doors (centered, slightly ajar) -->
  <rect x="310" y="60" width="90" height="340" fill="#12101a" stroke="#1e1a28" stroke-width="1"/>
  <rect x="400" y="60" width="90" height="340" fill="#12101a" stroke="#1e1a28" stroke-width="1"/>

  <!-- Gap between doors - dark void -->
  <rect x="398" y="60" width="4" height="340" fill="#050308"/>

  <!-- B2 display panel -->
  <rect x="370" y="30" width="60" height="22" rx="3" fill="#0d0b12" stroke="#1a1620" stroke-width="0.5"/>

  <!-- B2 glowing red text -->
  <text x="400" y="47" font-family="monospace" font-size="16" fill="#cc3333" text-anchor="middle" filter="url(#blur1)" opacity="0.9">B2</text>
  <text x="400" y="47" font-family="monospace" font-size="16" fill="#ff4444" text-anchor="middle">B2</text>

  <!-- Flickering light from above -->
  <ellipse cx="400" cy="55" rx="120" ry="15" fill="#1a1520" filter="url(#blur2)" opacity="0.3"/>

  <!-- Water droplet on floor -->
  <ellipse cx="400" cy="405" rx="12" ry="4" fill="#0d1a2a" opacity="0.5"/>
  <ellipse cx="400" cy="405" rx="6" ry="2" fill="#1a3050" opacity="0.4"/>

  <!-- Floor line -->
  <line x1="200" y1="400" x2="600" y2="400" stroke="#1a1620" stroke-width="0.5"/>

  <!-- Side walls suggesting narrow corridor -->
  <rect x="0" y="0" width="80" height="450" fill="#080606"/>
  <rect x="720" y="0" width="80" height="450" fill="#080606"/>

  <!-- Subtle figure silhouette in the gap (barely visible) -->
  <g opacity="0.04" fill="#1a1820">
    <ellipse cx="402" cy="180" rx="8" ry="12"/>
    <rect x="394" y="192" width="16" height="60" rx="4"/>
    <rect x="396" y="252" width="5" height="45" rx="2"/>
    <rect x="403" y="252" width="5" height="45" rx="2"/>
  </g>

  <!-- Ambient red glow from B2 display -->
  <ellipse cx="400" cy="200" rx="80" ry="150" fill="#2a0a0a" opacity="0.04" filter="url(#blur2)"/>

  <!-- Floor reflection -->
  <rect x="310" y="400" width="180" height="50" fill="#0d0b12" opacity="0.3"/>

</svg>
