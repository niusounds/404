<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1a1210"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Ceiling area (top portion) -->
  <rect x="0" y="0" width="800" height="180" fill="#0d0b0a"/>
  
  <!-- Ceiling texture lines -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="#111010" stroke-width="0.5"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#111010" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="180" stroke="#111010" stroke-width="0.3"/>
  <line x1="400" y1="0" x2="400" y2="180" stroke="#111010" stroke-width="0.3"/>
  <line x1="600" y1="0" x2="600" y2="180" stroke="#111010" stroke-width="0.3"/>

  <!-- Ventilation grate -->
  <rect x="310" y="50" width="180" height="100" rx="3" fill="#080606" stroke="#1a1818" stroke-width="1.5"/>
  
  <!-- Vent grille bars -->
  <line x1="330" y1="50" x2="330" y2="150" stroke="#1a1818" stroke-width="2"/>
  <line x1="350" y1="50" x2="350" y2="150" stroke="#1a1818" stroke-width="2"/>
  <line x1="370" y1="50" x2="370" y2="150" stroke="#1a1818" stroke-width="2"/>
  <line x1="390" y1="50" x2="390" y2="150" stroke="#1a1818" stroke-width="2"/>
  <line x1="410" y1="50" x2="410" y2="150" stroke="#1a1818" stroke-width="2"/>
  <line x1="430" y1="50" x2="430" y2="150" stroke="#1a1818" stroke-width="2"/>
  <line x1="450" y1="50" x2="450" y2="150" stroke="#1a1818" stroke-width="2"/>
  <line x1="470" y1="50" x2="470" y2="150" stroke="#1a1818" stroke-width="2"/>

  <!-- Gap between bars where eyes are visible (between bar 370 and 390) -->
  <rect x="370" y="50" width="20" height="100" fill="#050305"/>
  
  <!-- Eyes through the gap -->
  <circle cx="380" cy="95" r="6" fill="#f0e8d8" filter="url(#blur1)" opacity="0.9"/>
  <circle cx="380" cy="95" r="3" fill="#ffffff" filter="url(#blur2)" opacity="0.7"/>
  
  <circle cx="380" cy="120" r="5" fill="#f0e8d8" filter="url(#blur1)" opacity="0.7"/>
  <circle cx="380" cy="120" r="2.5" fill="#ffffff" filter="url(#blur2)" opacity="0.5"/>

  <!-- Subtle light glow from above -->
  <ellipse cx="400" cy="100" rx="30" ry="50" fill="#f0e8d8" opacity="0.02" filter="url(#blur2)"/>

  <!-- Room below - dark floor -->
  <rect x="0" y="180" width="800" height="270" fill="#0a0808"/>
  
  <!-- Floor perspective lines -->
  <line x1="100" y1="180" x2="0" y2="450" stroke="#0f0d0c" stroke-width="0.5"/>
  <line x1="700" y1="180" x2="800" y2="450" stroke="#0f0d0c" stroke-width="0.5"/>
  
  <!-- Bed silhouette (bottom center) -->
  <rect x="280" y="300" width="240" height="120" rx="5" fill="#0e0c0b"/>
  <rect x="290" y="280" width="220" height="30" rx="3" fill="#121010"/>
  
  <!-- Pillow -->
  <ellipse cx="340" cy="290" rx="35" ry="15" fill="#141211"/>
  <ellipse cx="460" cy="290" rx="35" ry="15" fill="#141211"/>

  <!-- Blanket drape -->
  <path d="M300 310 Q320 305 340 310 Q360 315 380 310 Q400 305 420 310 Q440 315 460 310 Q480 305 500 310" fill="none" stroke="#151312" stroke-width="1"/>

  <!-- Very subtle dust particles -->
  <circle cx="350" cy="170" r="0.5" fill="#2a2520" opacity="0.3"/>
  <circle cx="420" cy="165" r="0.4" fill="#2a2520" opacity="0.2"/>
  <circle cx="380" cy="175" r="0.6" fill="#2a2520" opacity="0.25"/>
  <circle cx="450" cy="168" r="0.3" fill="#2a2520" opacity="0.2"/>

  <!-- Edge vignette -->
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="#0a0808" stroke-width="40" opacity="0.5"/>
</svg>
