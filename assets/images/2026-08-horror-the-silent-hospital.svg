<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9f43;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Gothic border frame -->
  <rect x="15" y="15" width="770" height="420" rx="6" ry="6" fill="none" stroke="#3d001a" stroke-width="2.5"/>
  <rect x="20" y="20" width="760" height="410" rx="4" ry="4" fill="none" stroke="#2a0011" stroke-width="1"/>

  <!-- Corner ornaments -->
  <path d="M20,35 L20,25 Q20,20 25,20 L35,20" fill="none" stroke="#8b0000" stroke-width="2" filter="url(#glow)"/>
  <path d="M780,35 L780,25 Q780,20 775,20 L765,20" fill="none" stroke="#8b0000" stroke-width="2" filter="url(#glow)"/>
  <path d="M20,415 L35,415 Q40,415 40,410 L40,395" fill="none" stroke="#8b0000" stroke-width="2" filter="url(#glow)"/>
  <path d="M765,420 L765,410 Q765,415 770,415 L780,415" fill="none" stroke="#8b0000" stroke-width="2" filter="url(#glow)"/>

  <!-- Building silhouette - tall abandoned hospital -->
  <rect x="290" y="160" width="240" height="250" fill="#1a1515"/>

  <!-- Roof - stepped Gothic pattern -->
  <path d="M300,160 L320,140 L340,160 L360,130 L380,160" fill="none" stroke="#3d2a2a" stroke-width="1.5"/>
  <rect x="370" y="115" width="20" height="25" fill="#1a1515" stroke="#3d2a2a" stroke-width="1"/>

  <!-- Ground line -->
  <line x1="180" y1="410" x2="620" y2="410" stroke="#2a1a1a" stroke-width="1.5"/>

  <!-- Lit windows (top row) -->
  <rect x="325" y="185" width="20" height="25" rx="10" fill="#ff9f43" opacity="0.7"/>
  <rect x="435" y="185" width="20" height="25" rx="10" fill="#0a0808" stroke="#2a1a1a" stroke-width="0.5"/>

  <!-- Middle windows -->
  <rect x="340" y="260" width="70" height="30" rx="15" fill="url(#window-glow)"/>
  <rect x="385" y="375" width="25" height="20" rx="10" fill="#ff9f43" opacity="0.6"/>

  <!-- Bottom windows (large arched door/window) -->
  <path d="M390,410 L390,380 Q390,370 400,370 L420,370 Q430,370 430,380 L430,410" fill="url(#window-glow)"/>

  <!-- Broken window cracks -->
  <line x1="455" y1="190" x2="460" y2="210" stroke="#3d0000" stroke-width="0.5" opacity="0.6">
    <stop offset="0%" style="stop-color:#ff9f43;stop-opacity:0"/>
  </line>

  <!-- Silhouetted figure in dark window -->
  <g transform="translate(382, 270)"/>
</svg>
