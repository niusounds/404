<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="moon" cx="75%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Moon glow -->
  <circle cx="620" cy="90" r="80" fill="#1a1510" opacity="0.3"/>
  <circle cx="620" cy="90" r="40" fill="#2a2018" opacity="0.4"/>
  <circle cx="620" cy="90" r="18" fill="#3a3028" opacity="0.5"/>
  
  <!-- Ground -->
  <rect x="0" y="320" width="800" height="130" fill="#080606"/>
  
  <!-- Mountains silhouette -->
  <polygon points="0,320 80,260 160,290 240,250 320,280 400,320" fill="#0c0a0a" opacity="0.8"/>
  <polygon points="200,320 320,240 440,280 560,250 680,300 800,320" fill="#0e0c0c" opacity="0.7"/>
  
  <!-- Barn silhouette -->
  <!-- Main body -->
  <rect x="280" y="180" width="240" height="140" fill="#0e0c0c" stroke="#1a1515" stroke-width="1"/>
  <!-- Roof -->
  <polygon points="260,180 400,90 540,180" fill="#0e0c0c" stroke="#1a1515" stroke-width="1"/>
  <!-- Roof peak cross -->
  <line x1="400" y1="90" x2="400" y2="75" stroke="#1a1515" stroke-width="2"/>
  <line x1="393" y1="82" x2="407" y2="82" stroke="#1a1515" stroke-width="2"/>
  
  <!-- Barn door (slightly open) -->
  <rect x="360" y="230" width="80" height="90" fill="#080606"/>
  <!-- Door crack - light leaking -->
  <rect x="435" y="232" width="2" height="88" fill="#2a2018" filter="url(#glow)" opacity="0.6"/>
  <rect x="437" y="240" width="1" height="70" fill="#3a2a1a" filter="url(#glow)" opacity="0.3"/>
  
  <!-- Door frame -->
  <rect x="358" y="228" width="84" height="92" fill="none" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Window on left side -->
  <rect x="300" y="240" width="30" height="35" fill="#080606" stroke="#1a1515" stroke-width="1"/>
  <line x1="315" y1="240" x2="315" y2="275" stroke="#1a1515" stroke-width="1"/>
  <line x1="300" y1="257" x2="330" y2="257" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Window on right side -->
  <rect x="470" y="240" width="30" height="35" fill="#080608" stroke="#1a1515" stroke-width="1"/>
  <line x1="485" y1="240" x2="485" y2="275" stroke="#1a1515" stroke-width="1"/>
  <line x1="470" y1="257" x2="500" y2="257" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Footprints leading from door -->
  <ellipse cx="440" cy="335" rx="6" ry="3" fill="#1a1515" opacity="0.5"/>
  <ellipse cx="448" cy="348" rx="6" ry="3" fill="#1a1515" opacity="0.4"/>
  <ellipse cx="443" cy="362" rx="6" ry="3" fill="#1a1515" opacity="0.3"/>
  <ellipse cx="451" cy="375" rx="6" ry="3" fill="#1a1515" opacity="0.2"/>
  <ellipse cx="446" cy="390" rx="6" ry="3" fill="#1a1515" opacity="0.15"/>
  
  <!-- Long shadow from door -->
  <polygon points="436,320 450,320 470,450 430,450" fill="#0e0c0c" opacity="0.3"/>
  
  <!-- Bare trees -->
  <!-- Left tree -->
  <line x1="120" y1="320" x2="120" y2="200" stroke="#1a1515" stroke-width="3"/>
  <line x1="120" y1="240" x2="90" y2="210" stroke="#1a1515" stroke-width="2"/>
  <line x1="120" y1="240" x2="150" y2="220" stroke="#1a1515" stroke-width="2"/>
  <line x1="120" y1="260" x2="95" y2="250" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="120" y1="260" x2="145" y2="245" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="150" y1="220" x2="140" y2="200" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="150" y1="220" x2="165" y2="205" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Right tree -->
  <line x1="680" y1="320" x2="680" y2="180" stroke="#1a1515" stroke-width="3"/>
  <line x1="680" y1="230" x2="650" y2="200" stroke="#1a1515" stroke-width="2"/>
  <line x1="680" y1="230" x2="710" y2="210" stroke="#1a1515" stroke-width="2"/>
  <line x1="680" y1="250" x2="655" y2="240" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="680" y1="250" x2="705" y2="235" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="710" y1="210" x2="720" y2="190" stroke="#1a1515" stroke-width="1.5"/>
  <line x1="710" y1="210" x2="695" y2="195" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Stars -->
  <circle cx="100" cy="50" r="1" fill="#2a2520" opacity="0.6"/>
  <circle cx="200" cy="30" r="0.8" fill="#2a2520" opacity="0.4"/>
  <circle cx="350" cy="45" r="1.2" fill="#2a2520" opacity="0.5"/>
  <circle cx="500" cy="25" r="0.7" fill="#2a2520" opacity="0.3"/>
  <circle cx="720" cy="60" r="1" fill="#2a2520" opacity="0.5"/>
  <circle cx="760" cy="35" r="0.9" fill="#2a2520" opacity="0.4"/>
  <circle cx="50" cy="80" r="0.6" fill="#2a2520" opacity="0.3"/>
  <circle cx="300" cy="70" r="0.8" fill="#2a2520" opacity="0.35"/>
  
  <!-- Fog at ground level -->
  <rect x="0" y="310" width="800" height="20" fill="#0c0a0a" opacity="0.5"/>
  
  <!-- Door light pool on ground -->
  <ellipse cx="448" cy="330" rx="25" ry="5" fill="#1a1510" opacity="0.15"/>
</svg>
