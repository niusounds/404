<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1510" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="doorLight" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1c1814" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="fuzzy">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Room perspective - walls and floor -->
  <!-- Back wall -->
  <polygon points="180,80 620,80 620,340 180,340" fill="#0d0a0a"/>

  <!-- Left wall -->
  <polygon points="0,0 180,80 180,340 0,450" fill="#0b0808"/>

  <!-- Right wall -->
  <polygon points="800,0 620,80 620,340 800,450" fill="#0c0909"/>

  <!-- Floor -->
  <polygon points="0,450 180,340 620,340 800,450" fill="#080606"/>

  <!-- Ceiling line -->
  <line x1="180" y1="80" x2="620" y2="80" stroke="#121010" stroke-width="1"/>

  <!-- Floor tatami lines -->
  <line x1="100" y1="370" x2="700" y2="370" stroke="#0e0b0b" stroke-width="0.5"/>
  <line x1="140" y1="400" x2="660" y2="400" stroke="#0e0b0b" stroke-width="0.5"/>
  <line x1="170" y1="430" x2="630" y2="430" stroke="#0e0b0b" stroke-width="0.5"/>

  <!-- Desk on the right side -->
  <rect x="480" y="260" width="140" height="8" fill="#1a1410" rx="1"/>
  <rect x="490" y="268" width="6" height="72" fill="#151110"/>
  <rect x="604" y="268" width="6" height="72" fill="#151110"/>
  <rect x="480" y="340" width="140" height="4" fill="#131010" rx="1"/>

  <!-- Open picture book on desk -->
  <polygon points="520,258 545,255 545,260 520,263" fill="#2a2420"/>
  <polygon points="545,255 570,258 570,263 545,260" fill="#2e2824"/>
  <line x1="545" y1="255" x2="545" y2="260" stroke="#1a1614" stroke-width="0.5"/>
  <!-- Book glow -->
  <ellipse cx="545" cy="260" rx="30" ry="8" fill="url(#deskGlow)"/>

  <!-- Small items on desk - a toy figure -->
  <ellipse cx="500" cy="258" rx="4" ry="3" fill="#1c1816"/>
  <rect x="498" y="252" width="4" height="6" fill="#1c1816" rx="1"/>

  <!-- Window on back wall (closed) -->
  <rect x="260" y="100" width="100" height="120" fill="#0c0a0a" stroke="#141212" stroke-width="1.5" rx="2"/>
  <line x1="310" y1="100" x2="310" y2="220" stroke="#141212" stroke-width="1"/>
  <line x1="260" y1="160" x2="360" y2="160" stroke="#141212" stroke-width="1"/>
  <!-- Window faint moonlight -->
  <rect x="262" y="102" width="48" height="56" fill="#12101a" opacity="0.3"/>
  <rect x="312" y="102" width="46" height="56" fill="#100e18" opacity="0.2"/>
  <rect x="262" y="162" width="48" height="56" fill="#12101a" opacity="0.25"/>
  <rect x="312" y="162" width="46" height="56" fill="#100e18" opacity="0.15"/>

  <!-- Shadowy figure silhouette near the desk -->
  <g opacity="0.12" filter="url(#fuzzy)">
    <!-- Head -->
    <ellipse cx="430" cy="200" rx="14" ry="18" fill="#1a1618"/>
    <!-- Body -->
    <path d="M416,215 Q412,260 410,310 L450,310 Q448,260 444,215 Z" fill="#1a1618"/>
    <!-- Arms slightly out -->
    <path d="M416,230 Q400,240 395,260" stroke="#1a1618" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M444,230 Q455,235 460,250" stroke="#1a1618" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M415,310 L412,345" stroke="#1a1618" stroke-width="5" stroke-linecap="round"/>
    <path d="M440,310 L442,345" stroke="#1a1618" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Door frame on the left (slightly open, viewed from doorway) -->
  <rect x="0" y="0" width="30" height="450" fill="#0a0808"/>
  <rect x="28" y="0" width="4" height="450" fill="#141210"/>
  <!-- Door edge -->
  <rect x="176" y="60" width="6" height="290" fill="#141210"/>

  <!-- Faint light from doorway -->
  <ellipse cx="80" cy="225" rx="120" ry="180" fill="url(#doorLight)"/>

  <!-- Dust particles (tiny dots) -->
  <circle cx="350" cy="150" r="0.5" fill="#2a2420" opacity="0.3"/>
  <circle cx="400" cy="180" r="0.4" fill="#2a2420" opacity="0.25"/>
  <circle cx="450" cy="130" r="0.6" fill="#2a2420" opacity="0.2"/>
  <circle cx="380" cy="200" r="0.3" fill="#2a2420" opacity="0.35"/>
  <circle cx="420" cy="160" r="0.5" fill="#2a2420" opacity="0.15"/>
  <circle cx="360" cy="220" r="0.4" fill="#2a2420" opacity="0.2"/>

  <!-- Very subtle vignette -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.4"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
