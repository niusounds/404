<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor -->
  <rect x="0" y="280" width="800" height="170" fill="#12100f"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#1a1816" stroke-width="1"/>

  <!-- Fluorescent lights from ceiling -->
  <rect x="120" y="0" width="160" height="4" fill="#3a3836" rx="2"/>
  <rect x="520" y="0" width="160" height="4" fill="#3a3836" rx="2"/>
  <line x1="140" y1="4" x2="140" y2="280" stroke="#1e1c1a" stroke-width="0.5" opacity="0.3"/>
  <line x1="260" y1="4" x2="260" y2="280" stroke="#1e1c1a" stroke-width="0.5" opacity="0.3"/>
  <line x1="540" y1="4" x2="540" y2="280" stroke="#1e1c1a" stroke-width="0.5" opacity="0.3"/>
  <line x1="660" y1="4" x2="660" y2="280" stroke="#1e1c1a" stroke-width="0.5" opacity="0.3"/>

  <!-- Light cones from fluorescent tubes -->
  <polygon points="120,4 280,280 100,280" fill="#1a1816" opacity="0.15"/>
  <polygon points="520,4 680,280 500,280" fill="#1a1816" opacity="0.15"/>

  <!-- Woman silhouette in long coat -->
  <!-- Head -->
  <ellipse cx="400" cy="110" rx="22" ry="28" fill="#050404"/>
  <!-- Hair -->
  <path d="M378,110 Q375,140 372,160 L368,160 Q371,140 376,110Z" fill="#050404"/>
  <path d="M422,110 Q425,140 428,160 L432,160 Q429,140 424,110Z" fill="#050404"/>
  <!-- Body / long coat -->
  <path d="M378,135 L365,275 L435,275 L422,135 Z" fill="#050404"/>
  <!-- Coat collar detail -->
  <path d="M385,135 L395,155 L400,145 L405,155 L415,135" fill="none" stroke="#0a0808" stroke-width="1"/>

  <!-- KEY: No shadow on floor - the woman stands above a blank floor -->
  <!-- Contrast: show a faint shadow of a shelf on the left floor to emphasize the missing shadow -->
  <polygon points="50,280 80,280 110,310 20,310" fill="#0d0b0a" opacity="0.6"/>

  <!-- Register counter on the right -->
  <rect x="600" y="220" width="140" height="60" fill="#1a1816" rx="3"/>
  <rect x="610" y="225" width="50" height="35" fill="#0f0e0d" rx="2"/>
  <!-- Register screen glow -->
  <rect x="612" y="227" width="46" height="31" fill="#1a2a1a" rx="1" opacity="0.5"/>
  <text x="620" y="247" fill="#2a4a2a" font-size="8" font-family="monospace">480</text>

  <!-- Cash register drawer -->
  <rect x="610" y="260" width="50" height="14" fill="#222018" rx="1"/>

  <!-- Coins on floor near the woman -->
  <ellipse cx="380" cy="285" rx="4" ry="2" fill="#1e1c1a"/>
  <ellipse cx="390" cy="287" rx="3" ry="1.5" fill="#1e1c1a"/>
  <ellipse cx="405" cy="284" rx="3.5" ry="1.8" fill="#1e1c1a"/>
  <ellipse cx="415" cy="286" rx="3" ry="1.5" fill="#1e1c1a"/>

  <!-- Shelf silhouettes on the left -->
  <rect x="20" y="80" width="80" height="200" fill="#0f0e0d"/>
  <line x1="20" y1="130" x2="100" y2="130" stroke="#1a1816" stroke-width="2"/>
  <line x1="20" y1="180" x2="100" y2="180" stroke="#1a1816" stroke-width="2"/>
  <line x1="20" y1="230" x2="100" y2="230" stroke="#1a1816" stroke-width="2"/>

  <!-- Products on shelves (subtle) -->
  <rect x="30" y="100" width="12" height="28" fill="#151312"/>
  <rect x="48" y="95" width="10" height="33" fill="#151312"/>
  <rect x="62" y="105" width="14" height="23" fill="#151312"/>
  <rect x="80" y="102" width="11" height="26" fill="#151312"/>

  <!-- Auto door frame (right side) -->
  <rect x="540" y="60" width="60" height="220" fill="none" stroke="#1a1816" stroke-width="2"/>
  <line x1="570" y1="60" x2="570" y2="280" stroke="#1e1c1a" stroke-width="1" opacity="0.3"/>

  <!-- Cold fluorescent light pooling on floor -->
  <ellipse cx="400" cy="310" rx="80" ry="15" fill="#1a1816" opacity="0.2"/>

  <!-- Subtle text/atmosphere -->
  <text x="400" y="420" fill="#1a1816" font-size="11" font-family="sans-serif" text-anchor="middle" letter-spacing="8">— 影がない —</text>
</svg>
