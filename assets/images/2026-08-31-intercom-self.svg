<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Intercom monitor frame -->
  <rect x="250" y="60" width="300" height="200" rx="12" ry="12" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="260" y="72" width="280" height="176" rx="4" ry="4" fill="url(#screenGlow)"/>

  <!-- Screen scan lines -->
  <g opacity="0.06">
    <line x1="260" y1="75" x2="540" y2="75" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="80" x2="540" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="85" x2="540" y2="85" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="90" x2="540" y2="90" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="95" x2="540" y2="95" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="100" x2="540" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="105" x2="540" y2="105" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="110" x2="540" y2="110" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="115" x2="540" y2="115" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="120" x2="540" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="125" x2="540" y2="125" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="130" x2="540" y2="130" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="135" x2="540" y2="135" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="140" x2="540" y2="140" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="145" x2="540" y2="145" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="150" x2="540" y2="150" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="155" x2="540" y2="155" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="160" x2="540" y2="160" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="165" x2="540" y2="165" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="170" x2="540" y2="170" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="175" x2="540" y2="175" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="180" x2="540" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="185" x2="540" y2="185" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="190" x2="540" y2="190" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="195" x2="540" y2="195" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="200" x2="540" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="205" x2="540" y2="205" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="210" x2="540" y2="210" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="215" x2="540" y2="215" stroke="#fff" stroke-width="1"/>
    <line x1="260" y1="220" x2="540" y2="220" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Corridor scene on monitor - floor -->
  <rect x="260" y="195" width="280" height="53" fill="#0d0d0d"/>
  <line x1="260" y1="195" x2="540" y2="195" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Corridor perspective lines -->
  <line x1="260" y1="72" x2="400" y2="120" stroke="#151515" stroke-width="0.5"/>
  <line x1="540" y1="72" x2="400" y2="120" stroke="#151515" stroke-width="0.5"/>

  <!-- Staircase on the left side of corridor -->
  <g fill="#111111" stroke="#1a1a1a" stroke-width="0.5">
    <rect x="280" y="160" width="30" height="5"/>
    <rect x="275" y="152" width="30" height="5"/>
    <rect x="270" y="144" width="30" height="5"/>
    <rect x="265" y="136" width="30" height="5"/>
    <rect x="260" y="128" width="30" height="5"/>
    <rect x="258" y="120" width="30" height="5"/>
  </g>

  <!-- Railing -->
  <line x1="262" y1="118" x2="262" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="260" y1="120" x2="290" y2="160" stroke="#1a1a1a" stroke-width="1"/>

  <!-- The figure on the monitor - silhouette of a person -->
  <g filter="url(#glow)">
    <!-- Head -->
    <ellipse cx="400" cy="130" rx="12" ry="14" fill="#0a0a0a" stroke="#2a3a2a" stroke-width="0.5"/>
    <!-- Body -->
    <path d="M388,144 L385,175 L395,175 L398,160 L402,160 L405,175 L415,175 L412,144 Z" fill="#0a0a0a" stroke="#2a3a2a" stroke-width="0.5"/>
    <!-- Legs -->
    <line x1="395" y1="175" x2="393" y2="195" stroke="#0a0a0a" stroke-width="3"/>
    <line x1="405" y1="175" x2="407" y2="195" stroke="#0a0a0a" stroke-width="3"/>
    <!-- Arms - holding bag on left shoulder -->
    <line x1="388" y1="148" x2="378" y2="165" stroke="#0a0a0a" stroke-width="2.5"/>
    <line x1="412" y1="148" x2="422" y2="160" stroke="#0a0a0a" stroke-width="2.5"/>
    <!-- Bag on left shoulder -->
    <rect x="368" y="160" width="14" height="10" rx="2" fill="#0a0a0a" stroke="#2a3a2a" stroke-width="0.5"/>
    <line x1="375" y1="160" x2="375" y2="155" stroke="#2a3a2a" stroke-width="1"/>
  </g>

  <!-- Eyes glow (subtle, creepy) -->
  <circle cx="396" cy="128" r="1.2" fill="#3a5a3a" opacity="0.6"/>
  <circle cx="404" cy="128" r="1.2" fill="#3a5a3a" opacity="0.6"/>

  <!-- Emergency light at top of corridor -->
  <circle cx="400" cy="78" r="4" fill="#1a0a0a" filter="url(#softGlow)"/>
  <circle cx="400" cy="78" r="2" fill="#3a1a1a" opacity="0.5"/>

  <!-- Intercom buttons -->
  <circle cx="400" cy="275" r="18" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="400" cy="275" r="12" fill="#222222"/>
  <circle cx="400" cy="275" r="8" fill="#2a2a2a"/>

  <!-- Small LED indicator -->
  <circle cx="400" cy="275" r="3" fill="#1a3a1a" opacity="0.4" filter="url(#softGlow)"/>

  <!-- Wall around intercom -->
  <rect x="0" y="0" width="800" height="450" fill="none"/>
  <rect x="200" y="50" width="400" height="240" fill="#0a0808" opacity="0.3"/>

  <!-- Very subtle vignette effect -->
  <rect x="0" y="0" width="800" height="450" fill="#0a0808" opacity="0.15"/>

  <!-- Subtle text - intercom brand hint -->
  <text x="400" y="310" text-anchor="middle" fill="#1a1a1a" font-size="8" font-family="monospace">INTERCOM</text>

  <!-- Floor below intercom -->
  <rect x="200" y="330" width="400" height="120" fill="#080606"/>
  <line x1="200" y1="330" x2="600" y2="330" stroke="#111111" stroke-width="0.5"/>

  <!-- Dark hallway extending downward -->
  <path d="M350,330 L340,450 L460,450 L450,330 Z" fill="#060404"/>
  <line x1="350" y1="330" x2="340" y2="450" stroke="#0d0d0d" stroke-width="0.5"/>
  <line x1="450" y1="330" x2="460" y2="450" stroke="#0d0d0d" stroke-width="0.5"/>
  <line x1="350" y1="330" x2="450" y2="330" stroke="#0d0d0d" stroke-width="0.5"/>

  <!-- Tiny red light at bottom of hallway -->
  <circle cx="400" cy="440" r="2" fill="#1a0505" opacity="0.6"/>
</svg>