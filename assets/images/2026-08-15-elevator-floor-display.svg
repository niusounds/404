<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#141010"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1616"/>
      <stop offset="100%" stop-color="#0e0c0c"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#121010"/>
      <stop offset="100%" stop-color="#1a1616"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1616"/>
      <stop offset="100%" stop-color="#121010"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2424"/>
      <stop offset="50%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#2a2424"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e8f0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e0e8f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ghostBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="deepBlur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Perspective: hallway view -->
  <!-- Left wall -->
  <polygon points="0,0 200,120 200,380 0,450" fill="url(#wallL)"/>
  <!-- Right wall -->
  <polygon points="800,0 600,120 600,380 800,450" fill="url(#wallR)"/>
  <!-- Floor -->
  <polygon points="200,380 600,380 800,450 0,450" fill="url(#floor)"/>
  
  <!-- Floor tiles -->
  <line x1="100" y1="390" x2="150" y2="450" stroke="#1a1616" stroke-width="0.5" opacity="0.5"/>
  <line x1="200" y1="385" x2="220" y2="450" stroke="#1a1616" stroke-width="0.5" opacity="0.4"/>
  <line x1="300" y1="382" x2="310" y2="450" stroke="#1a1616" stroke-width="0.5" opacity="0.3"/>
  <line x1="500" y1="382" x2="490" y2="450" stroke="#1a1616" stroke-width="0.5" opacity="0.3"/>
  <line x1="600" y1="385" x2="580" y2="450" stroke="#1a1616" stroke-width="0.5" opacity="0.4"/>
  <line x1="700" y1="390" x2="650" y2="450" stroke="#1a1616" stroke-width="0.5" opacity="0.5"/>

  <!-- Ceiling light -->
  <rect x="370" y="0" width="60" height="6" fill="#c8d8e8" opacity="0.15" rx="3"/>
  <polygon points="360,6 440,6 460,280 340,280" fill="url(#light)" opacity="0.4"/>

  <!-- Left elevator (closed) -->
  <rect x="80" y="140" width="100" height="240" fill="#1a1818" stroke="#2a2424" stroke-width="1.5" rx="2"/>
  <rect x="85" y="145" width="90" height="230" fill="#1e1a1a" rx="1"/>
  <!-- Floor buttons panel -->
  <rect x="185" y="180" width="12" height="60" fill="#2a2424" rx="2"/>
  <circle cx="191" cy="190" r="2.5" fill="#4a4040"/>
  <circle cx="191" cy="200" r="2.5" fill="#4a4040"/>
  <circle cx="191" cy="210" r="2.5" fill="#4a4040"/>
  <circle cx="191" cy="220" r="2.5" fill="#4a4040"/>
  <circle cx="191" cy="230" r="2.5" fill="#4a4040"/>
  <circle cx="191" cy="240" r="2.5" fill="#3a6a3a" opacity="0.6"/>
  <!-- Call button -->
  <circle cx="191" cy="255" r="3" fill="#3a3a3a" stroke="#4a4a4a" stroke-width="0.5"/>

  <!-- Right elevator (OPEN - the scary one) -->
  <rect x="620" y="140" width="100" height="240" fill="#1a1818" stroke="#2a2424" stroke-width="1.5" rx="2"/>
  <!-- Open door frame -->
  <rect x="625" y="145" width="90" height="230" fill="none" stroke="#2a2424" stroke-width="1"/>
  
  <!-- Inside the open elevator - darkness -->
  <rect x="630" y="150" width="80" height="225" fill="#080606"/>
  
  <!-- Floor display inside elevator -->
  <rect x="655" y="155" width="30" height="18" fill="#0a1a0a" stroke="#1a3a1a" stroke-width="0.5" rx="2"/>
  <text x="660" y="168" font-size="11" fill="#3a8a3a" font-family="monospace" filter="url(#glow)">12</text>
  
  <!-- Another floor display showing 13 above -->
  <rect x="655" y="175" width="30" height="14" fill="#0a1a0a" stroke="#1a3a1a" stroke-width="0.5" rx="1"/>
  <text x="663" y="186" font-size="9" fill="#2a6a2a" font-family="monospace" opacity="0.6">13</text>

  <!-- The horror element: a hand reaching out from the darkness -->
  <g opacity="0.25" filter="url(#ghostBlur)">
    <!-- Hand silhouette -->
    <path d="M630,200 Q625,195 620,198 Q615,200 618,205 Q620,208 625,206 Q628,205 630,208 
             L628,215 Q625,218 622,216 Q618,214 620,218 Q622,222 626,220 
             L628,228 Q626,232 623,230 Q619,228 621,232 Q623,236 627,234 
             L630,240 Q632,244 630,246 L630,250" 
          fill="#1a1a2a" stroke="#2a2a3a" stroke-width="0.5"/>
    <!-- Fingers -->
    <line x1="628" y1="215" x2="620" y2="218" stroke="#1a1a2a" stroke-width="1.5" opacity="0.5"/>
    <line x1="628" y1="228" x2="618" y2="232" stroke="#1a1a2a" stroke-width="1.5" opacity="0.5"/>
    <line x1="630" y1="240" x2="622" y2="246" stroke="#1a1a2a" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Deeper darkness in the elevator - hint of something more -->
  <g opacity="0.06" filter="url(#deepBlur)">
    <ellipse cx="670" cy="190" rx="25" ry="35" fill="#1a1a3a"/>
    <ellipse cx="665" cy="185" rx="8" ry="6" fill="#2a2a4a"/>
    <ellipse cx="675" cy="185" rx="8" ry="6" fill="#2a2a4a"/>
  </g>

  <!-- Person silhouette (knowing viewer's perspective) -->
  <g opacity="0.7">
    <ellipse cx="380" cy="310" rx="15" ry="18" fill="#0a0a0a"/>
    <path d="M360,325 Q360,315 380,310 Q400,315 400,325 L398,370 L362,370 Z" fill="#0a0a0a"/>
    <rect x="364" y="368" width="7" height="15" fill="#0a0a0a" rx="2"/>
    <rect x="377" y="368" width="7" height="15" fill="#0a0a0a" rx="2"/>
    <!-- Arm reaching toward left elevator button -->
    <path d="M362,330 L330,340 L325,338 L360,328" fill="#0a0a0a"/>
  </g>

  <!-- Subtle atmosphere -->
  <!-- Emergency light -->
  <circle cx="400" cy="130" r="3" fill="#ff3030" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Floor reflection of elevator light -->
  <ellipse cx="670" cy="390" rx="40" ry="5" fill="#c8d8f0" opacity="0.02"/>

  <!-- Wall details -->
  <!-- Fire extinguisher on left wall -->
  <rect x="155" y="280" width="8" height="25" fill="#2a1a1a" rx="2" opacity="0.4"/>
  <rect x="153" y="278" width="12" height="3" fill="#2a1a1a" rx="1" opacity="0.3"/>
  
  <!-- Notice/poster on right wall -->
  <rect x="640" y="300" width="15" height="20" fill="#1e1a1a" stroke="#2a2424" stroke-width="0.5" rx="1" opacity="0.3"/>

  <!-- Corner vignette -->
  <rect x="0" y="0" width="800" height="450" fill="none"/>
  <rect x="0" y="0" width="800" height="450" fill="#0a0808" opacity="0.2" style="mix-blend-mode: multiply;"/>

  <!-- Floor number indicator outside right elevator -->
  <rect x="640" y="135" width="60" height="12" fill="#0a1a0a" stroke="#1a3a1a" stroke-width="0.5" rx="2"/>
  <text x="655" y="144" font-size="8" fill="#4aaa4a" font-family="monospace" opacity="0.5">13階</text>
</svg>
