<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Atmospheric sand gradient overlay (subtle) -->
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" style="stop-color:#2b1e0a; stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0a0808; stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#centerGlow)"/>

  <!-- Gothic frame with Egyptian border accent -->
  <rect x="12" y="12" width="776" height="426" rx="4" ry="4" fill="none" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="18" y="18" width="764" height="414" rx="3" ry="3" fill="none" stroke="#1e0a02" stroke-width="1"/>

  <!-- Corner glow accents -->
  <circle cx="22" cy="22" r="5" fill="#bf941f" opacity="0.7"/>
  <circle cx="778" cy="22" r="5" fill="#bf941f" opacity="0.7"/>
  <circle cx="22" cy="428" r="5" fill="#bf941f" opacity="0.7"/>
  <circle cx="778" cy="428" r="5" fill="#bfa41f" opacity="0.7"/>

  <!-- Underground passage / tomb entrance - perspective tunnel -->
  <polygon points="340,165 460,165 521,380 279,380" fill="#0b0e0a" stroke="#4a7c0f" stroke-width="1.5"/>
  <!-- Inner depth layers -->
  <polygon points="357,174 443,174 493,360 307,360" fill="#080c07" stroke="#3a6808" stroke-width="1"/>
  <polygon points="368,182 432,182 475,350 325,350" fill="#050905" stroke="#2c5505" stroke-width="1"/>

  <!-- Hieroglyphic symbols floating around entrance -->
  <!-- Eye of Horus / Ankh hints - stylized geometric shapes glowing in copper/gold -->
  <g opacity="0.8">
    <!-- Ab (ankh) symbol top-left area -->
    <path d="M217,30 Q217,16 231,12 Q245,8 245,24 L245,56 Q245,90 230,90 Q215,90 215,56 Z M231,12 A6,6 0 1,0 231,8" fill="none" stroke="#bf941f" stroke-width="1.2"/>

    <!-- Eye of Horus shape top-right area -->
    <path d="M572,24 Q584,20 600,24 Q608,30 600,34 L596,42 Q588,46 577,42 Z" fill="none" stroke="#bf941f" stroke-width="1.2"/>
    <circle cx="586" cy="32" r="2" fill="#bf941f"/>

    <!-- Ankh top area -->
    <ellipse cx="700" cy="38" rx="6" ry="8" fill="none" stroke="#a07e14" stroke-width="0.8"/>
    <rect x="697" y="38" width="6" height="1.5"/>
    <path d="M697,40 L697,54 Q697,58 700,58 Q703,58 703,54 L703,40" fill="none" stroke="#a07e14" stroke-width="0.8"/>

    <!-- Small symbols scattered -->
    <text x="124" y="390" font-family="'Noto Sans', sans-serif" font-size="14" fill="#bf941f" opacity="0.5">☥</text>
    <text x="630" y="85" font-family="'Times New Roman', serif" font-size="12" fill="#a07e14" opacity="0.6">𓋹</text>
  </g>

  <!-- Metallic sound waves emanating from the tunnel -->
  <path d="M385,430 Q400,415 415,430" fill="none" stroke="#c29a1d" stroke-width="1.5" opacity="0.6"/>
  <path d="M372,438 Q400,420 428,438" fill="none" stroke="#c29a1d" stroke-width="1" opacity="0.4"/>
  <path d="M358,446 Q400,428 442,446" fill="none" stroke="#c29a1d" stroke-width="0.8" opacity="0.3"/>

  <!-- Hieroglyphs etched into the tunnel opening (glowing faintly) -->
  <g font-family="'Times New Roman', serif">
    <text x="345" y="270" font-size="12" fill="#bf941f" opacity="0.4">𓊝</text>
    <text x="440" y="262" font-size="14" fill="#bf941f" opacity="0.35">𓋹</text>
    <text x="378" y="242" font-size="10" fill="#a07e14" opacity="0.45">𓌃</text>

  </g>

  <!-- Ground line / sand texture -->
  <line x1="60" y1="430" x2="740" y2="430" stroke="#2a1e0d" stroke-width="1"/>
  <path d="M60,430 Q100,425 140,428 Q180,433 220,430 Q260,427 300,431 Q340,435 400,430 Q460,426 520,431 Q560,428 600,432 Q640,436 700,430 L740,430" fill="none" stroke="#1e1a0b" stroke-width="0.7"/>

  <!-- Text title at bottom -->
  <text x="278" y="445" font-family="'Noto Serif JP', 'Serif', serif" font-size="9" text-anchor="middle" fill="#6a5314">—道を開くもの—</text>

</svg>