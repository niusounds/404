<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle gradient for atmosphere -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0f0d0a"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Floor -->
  <rect x="0" y="320" width="800" height="130" fill="#080606"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#151010" stroke-width="1"/>

  <!-- Closet door (left side, slightly open) -->
  <rect x="80" y="60" width="200" height="260" fill="url(#doorGrad)" stroke="#1a1510" stroke-width="1"/>
  <!-- Door gap (open portion) -->
  <rect x="260" y="60" width="30" height="260" fill="#0d0505"/>
  <!-- Door handle -->
  <circle cx="245" cy="195" r="5" fill="#2a2015"/>
  <circle cx="245" cy="195" r="3" fill="#3a2a1a"/>

  <!-- Red glow from inside closet -->
  <rect x="260" y="60" width="30" height="260" fill="#2a0505" filter="url(#blur1)" opacity="0.6"/>
  <rect x="260" y="60" width="30" height="260" fill="#3a0a0a" filter="url(#blur2)" opacity="0.4"/>

  <!-- Light rays from closet gap -->
  <polygon points="290,60 350,320 420,320 290,80" fill="#1a0505" opacity="0.15"/>
  <polygon points="290,100 330,320 380,320 290,120" fill="#250808" opacity="0.1"/>

  <!-- Scattered notebook pages on floor -->
  <g transform="translate(380, 280) rotate(-15)">
    <rect x="0" y="0" width="50" height="70" fill="#1a1510" stroke="#2a2015" stroke-width="0.5" opacity="0.7"/>
    <line x1="8" y1="15" x2="42" y2="15" stroke="#3a2a1a" stroke-width="0.5" opacity="0.5"/>
    <line x1="8" y1="25" x2="38" y2="25" stroke="#3a2a1a" stroke-width="0.5" opacity="0.5"/>
    <line x1="8" y1="35" x2="40" y2="35" stroke="#3a2a1a" stroke-width="0.5" opacity="0.5"/>
  </g>

  <g transform="translate(440, 300) rotate(8)">
    <rect x="0" y="0" width="45" height="65" fill="#181310" stroke="#251a12" stroke-width="0.5" opacity="0.6"/>
    <line x1="7" y1="14" x2="38" y2="14" stroke="#352515" stroke-width="0.5" opacity="0.4"/>
    <line x1="7" y1="24" x2="35" y2="24" stroke="#352515" stroke-width="0.5" opacity="0.4"/>
  </g>

  <g transform="translate(350, 310) rotate(25)">
    <rect x="0" y="0" width="40" height="55" fill="#15100d" stroke="#221810" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- The notebook itself -->
  <g transform="translate(400, 250) rotate(-5)">
    <rect x="0" y="0" width="60" height="80" fill="#1a1510" stroke="#2a1a10" stroke-width="1"/>
    <rect x="5" y="5" width="50" height="70" fill="none" stroke="#251a12" stroke-width="0.5"/>
    <!-- Japanese text hint - 明日も来る -->
    <text x="10" y="28" font-family="serif" font-size="8" fill="#3a1515" opacity="0.8">明日</text>
    <text x="10" y="42" font-family="serif" font-size="8" fill="#3a1515" opacity="0.8">も</text>
    <text x="10" y="56" font-family="serif" font-size="8" fill="#3a1515" opacity="0.8">来る</text>
  </g>

  <!-- Dark figure silhouette in closet -->
  <ellipse cx="300" cy="140" rx="18" ry="22" fill="#150505" opacity="0.8"/>
  <rect x="288" y="160" width="24" height="50" rx="5" fill="#120404" opacity="0.7"/>
  <!-- Faint eyes -->
  <circle cx="294" cy="135" r="1.5" fill="#4a1010" opacity="0.6"/>
  <circle cx="306" cy="135" r="1.5" fill="#4a1010" opacity="0.6"/>

  <!-- Subtle wall texture lines -->
  <line x1="0" y1="60" x2="80" y2="60" stroke="#12100e" stroke-width="0.5"/>
  <line x1="0" y1="120" x2="80" y2="120" stroke="#12100e" stroke-width="0.5"/>
  <line x1="0" y1="180" x2="80" y2="180" stroke="#12100e" stroke-width="0.5"/>
  <line x1="0" y1="240" x2="80" y2="240" stroke="#12100e" stroke-width="0.5"/>

  <!-- Right wall -->
  <rect x="500" y="60" width="300" height="260" fill="#0c0a08"/>
  <line x1="500" y1="60" x2="500" y2="320" stroke="#151010" stroke-width="0.5"/>

  <!-- Shadowy ambient light from right -->
  <rect x="500" y="60" width="300" height="260" fill="url(#glow)" opacity="0.3"/>

  <!-- Tiny red particles floating -->
  <circle cx="310" cy="200" r="1" fill="#3a0a0a" opacity="0.4"/>
  <circle cx="320" cy="230" r="0.8" fill="#4a0c0c" opacity="0.3"/>
  <circle cx="295" cy="260" r="1.2" fill="#3a0a0a" opacity="0.35"/>
  <circle cx="340" cy="180" r="0.7" fill="#2a0808" opacity="0.3"/>
  <circle cx="350" cy="250" r="1" fill="#3a0a0a" opacity="0.25"/>
</svg>
