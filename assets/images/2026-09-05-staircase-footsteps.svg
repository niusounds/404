<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#121010"/>
    </linearGradient>
    <linearGradient id="stairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1515"/>
      <stop offset="100%" stop-color="#0d0b0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Stairwell walls - perspective view from bottom -->
  <!-- Left wall -->
  <polygon points="0,450 150,50 150,0 0,0" fill="#0e0c0c" opacity="0.8"/>
  <!-- Right wall -->
  <polygon points="800,450 650,50 650,0 800,0" fill="#0e0c0c" opacity="0.8"/>

  <!-- Ceiling at top -->
  <rect x="150" y="0" width="500" height="50" fill="#0a0909"/>

  <!-- Staircase steps - going upward, centered -->
  <!-- Step 1 (bottom) -->
  <rect x="280" y="400" width="240" height="12" fill="url(#stairGrad)" rx="1"/>
  <!-- Step 2 -->
  <rect x="300" y="340" width="200" height="12" fill="url(#stairGrad)" rx="1"/>
  <!-- Step 3 -->
  <rect x="320" y="280" width="160" height="12" fill="url(#stairGrad)" rx="1"/>
  <!-- Step 4 -->
  <rect x="340" y="220" width="120" height="12" fill="url(#stairGrad)" rx="1"/>
  <!-- Step 5 -->
  <rect x="360" y="160" width="80" height="12" fill="url(#stairGrad)" rx="1"/>

  <!-- Left railing -->
  <line x1="280" y1="400" x2="360" y2="160" stroke="#1a1515" stroke-width="3"/>
  <!-- Right railing -->
  <line x1="520" y1="400" x2="440" y2="160" stroke="#1a1515" stroke-width="3"/>

  <!-- Railing posts -->
  <line x1="300" y1="370" x2="300" y2="340" stroke="#1a1515" stroke-width="2"/>
  <line x1="340" y1="310" x2="340" y2="280" stroke="#1a1515" stroke-width="2"/>
  <line x1="380" y1="250" x2="380" y2="220" stroke="#1a1515" stroke-width="2"/>
  <line x1="420" y1="190" x2="420" y2="160" stroke="#1a1515" stroke-width="2"/>
  <line x1="500" y1="370" x2="500" y2="340" stroke="#1a1515" stroke-width="2"/>
  <line x1="460" y1="310" x2="460" y2="280" stroke="#1a1515" stroke-width="2"/>
  <line x1="420" y1="250" x2="420" y2="220" stroke="#1a1515" stroke-width="2"/>
  <line x1="380" y1="190" x2="380" y2="160" stroke="#1a1515" stroke-width="2"/>

  <!-- Light from top window -->
  <rect x="350" y="5" width="100" height="40" fill="#1a1818" rx="2"/>
  <rect x="355" y="8" width="90" height="34" fill="#1c1a1a" rx="1"/>
  <!-- Light beam -->
  <polygon points="355,42 445,42 480,200 320,200" fill="#1a1818" opacity="0.15"/>
  <polygon points="370,42 430,42 450,150 350,150" fill="#1c1a1a" opacity="0.1"/>

  <!-- Shadowy figure at the top of stairs -->
  <!-- Body -->
  <ellipse cx="400" cy="115" rx="18" ry="22" fill="#080606"/>
  <!-- Head -->
  <circle cx="400" cy="85" r="14" fill="#080606"/>
  <!-- Shoulders -->
  <path d="M382,105 Q370,110 372,130 L428,130 Q430,110 418,105 Z" fill="#080606"/>
  <!-- Legs -->
  <path d="M390,130 L388,160 L395,160 L397,130 Z" fill="#080606"/>
  <path d="M410,130 L412,160 L405,160 L403,130 Z" fill="#080606"/>
  <!-- Face - faint outline from behind light -->
  <ellipse cx="400" cy="85" rx="10" ry="12" fill="none" stroke="#1a1616" stroke-width="0.5" opacity="0.5"/>

  <!-- Door at top (behind figure) -->
  <rect x="340" y="10" width="120" height="130" fill="#0c0a0a" rx="2" stroke="#141212" stroke-width="1"/>
  <rect x="345" y="15" width="50" height="60" fill="#100e0e" rx="1"/>
  <rect x="405" y="15" width="50" height="60" fill="#100e0e" rx="1"/>

  <!-- Phone screen glow at bottom -->
  <rect x="370" y="420" width="60" height="30" rx="3" fill="#1a2a3a" opacity="0.6" filter="url(#glow)"/>
  <rect x="375" y="425" width="50" height="20" rx="2" fill="#1e3050" opacity="0.4"/>
  <!-- Message bubble on phone -->
  <rect x="380" y="428" width="40" height="6" rx="1" fill="#2a4a6a" opacity="0.5"/>
  <rect x="380" y="437" width="25" height="4" rx="1" fill="#2a4a6a" opacity="0.3"/>

  <!-- Dust particles in light beam -->
  <circle cx="380" cy="100" r="1" fill="#2a2525" opacity="0.3"/>
  <circle cx="420" cy="130" r="0.8" fill="#2a2525" opacity="0.2"/>
  <circle cx="360" cy="150" r="1.2" fill="#2a2525" opacity="0.25"/>
  <circle cx="440" cy="170" r="0.7" fill="#2a2525" opacity="0.2"/>
  <circle cx="390" cy="180" r="1" fill="#2a2525" opacity="0.15"/>

  <!-- Subtle vignette -->
  <rect width="800" height="450" fill="url(#bg)" opacity="0.3"/>
</svg>
