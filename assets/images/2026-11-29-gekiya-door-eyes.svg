<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Door frame - left -->
  <rect x="280" y="20" width="15" height="430" fill="#1a1510"/>
  <!-- Door frame - right -->
  <rect x="505" y="20" width="15" height="430" fill="#1a1510"/>
  <!-- Door frame - top -->
  <rect x="280" y="20" width="240" height="15" fill="#1a1510"/>

  <!-- Door panel - slightly ajar, left side open -->
  <rect x="300" y="35" width="180" height="400" fill="#0f0c08"/>
  <!-- Door crack gap -->
  <rect x="480" y="35" width="6" height="400" fill="#0a0808"/>

  <!-- Dark room behind door -->
  <rect x="486" y="35" width="14" height="400" fill="#0d0a0a"/>

  <!-- Eyes in the crack - two white eyes staring -->
  <!-- Left eye -->
  <ellipse cx="500" cy="180" rx="4" ry="5" fill="#e8e0d0"/>
  <ellipse cx="500" cy="180" rx="2" ry="3" fill="#1a1510"/>
  <!-- Right eye -->
  <ellipse cx="510" cy="180" rx="4" ry="5" fill="#e8e0d0"/>
  <ellipse cx="510" cy="180" rx="2" ry="3" fill="#1a1510"/>

  <!-- Subtle eye glow -->
  <ellipse cx="500" cy="180" rx="12" ry="14" fill="none" stroke="#e8e0d0" stroke-width="0.3" opacity="0.15"/>
  <ellipse cx="510" cy="180" rx="12" ry="14" fill="none" stroke="#e8e0d0" stroke-width="0.3" opacity="0.15"/>

  <!-- Floor shadow from door -->
  <rect x="300" y="420" width="190" height="10" fill="#080606"/>

  <!-- Subtle wall texture lines -->
  <line x1="0" y1="100" x2="280" y2="100" stroke="#111010" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="200" x2="280" y2="200" stroke="#111010" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="300" x2="280" y2="300" stroke="#111010" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="400" x2="280" y2="400" stroke="#111010" stroke-width="0.5" opacity="0.5"/>

  <!-- Light from behind the door - subtle warm glow -->
  <rect x="486" y="35" width="14" height="400" fill="#1a1408" opacity="0.3"/>

  <!-- Top light source hint -->
  <rect x="400" y="20" width="80" height="3" fill="#1a1510"/>
</svg>
