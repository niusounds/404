<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Bathroom wall texture - subtle lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1a1515" stroke-width="0.5"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#1a1515" stroke-width="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1a1515" stroke-width="0.5"/>
  
  <!-- Mirror frame -->
  <rect x="250" y="40" width="300" height="370" rx="8" fill="none" stroke="#2a2525" stroke-width="4"/>
  
  <!-- Mirror surface - slightly reflective -->
  <rect x="254" y="44" width="292" height="362" rx="6" fill="#1a1818"/>
  
  <!-- Mirror reflection - faint face silhouette -->
  <ellipse cx="400" cy="160" rx="45" ry="55" fill="#252222" opacity="0.6"/>
  <ellipse cx="400" cy="280" rx="55" ry="70" fill="#252222" opacity="0.4"/>
  
  <!-- Water droplets on mirror - the horror element -->
  <!-- Droplet 1 - top -->
  <circle cx="370" cy="100" r="3" fill="#3a3535" opacity="0.8"/>
  <!-- Droplet 2 -->
  <circle cx="400" cy="95" r="2.5" fill="#3a3535" opacity="0.7"/>
  <!-- Droplet 3 -->
  <circle cx="430" cy="102" r="3.5" fill="#3a3535" opacity="0.8"/>
  
  <!-- Text "見てる" formed by droplets -->
  <!-- 見 -->
  <circle cx="340" cy="160" r="4" fill="#4a4545" opacity="0.9"/>
  <circle cx="340" cy="180" r="3.5" fill="#4a4545" opacity="0.85"/>
  <circle cx="340" cy="200" r="3" fill="#4a4545" opacity="0.8"/>
  <circle cx="330" cy="170" r="3" fill="#4a4545" opacity="0.85"/>
  <circle cx="350" cy="170" r="3" fill="#4a4545" opacity="0.85"/>
  
  <!-- て -->
  <circle cx="380" cy="160" r="3.5" fill="#4a4545" opacity="0.9"/>
  <circle cx="380" cy="180" r="3" fill="#4a4545" opacity="0.85"/>
  <circle cx="380" cy="200" r="3" fill="#4a4545" opacity="0.8"/>
  <circle cx="370" cy="195" r="3" fill="#4a4545" opacity="0.85"/>
  <circle cx="390" cy="195" r="3" fill="#4a4545" opacity="0.85"/>
  
  <!-- る -->
  <circle cx="420" cy="160" r="3.5" fill="#4a4545" opacity="0.9"/>
  <circle cx="420" cy="180" r="3" fill="#4a4545" opacity="0.85"/>
  <circle cx="420" cy="200" r="3" fill="#4a4545" opacity="0.8"/>
  <circle cx="410" cy="175" r="3" fill="#4a4545" opacity="0.85"/>
  <circle cx="430" cy="175" r="3" fill="#4a4545" opacity="0.85"/>
  
  <!-- よ -->
  <circle cx="460" cy="160" r="3.5" fill="#4a4545" opacity="0.9"/>
  <circle cx="460" cy="180" r="3" fill="#4a4545" opacity="0.85"/>
  <circle cx="460" cy="200" r="3" fill="#4a4545" opacity="0.8"/>
  <circle cx="450" cy="170" r="3" fill="#4a4545" opacity="0.85"/>
  <circle cx="470" cy="170" r="3" fill="#4a4545" opacity="0.85"/>
  
  <!-- Water drip trails -->
  <line x1="340" y1="210" x2="340" y2="230" stroke="#3a3535" stroke-width="1.5" opacity="0.5"/>
  <line x1="380" y1="210" x2="380" y2="240" stroke="#3a3535" stroke-width="1.5" opacity="0.4"/>
  <line x1="420" y1="210" x2="420" y2="250" stroke="#3a3535" stroke-width="1.5" opacity="0.3"/>
  <line x1="460" y1="210" x2="460" y2="235" stroke="#3a3535" stroke-width="1.5" opacity="0.45"/>
  
  <!-- More scattered droplets below -->
  <circle cx="360" cy="260" r="2" fill="#3a3535" opacity="0.6"/>
  <circle cx="390" cy="270" r="2.5" fill="#3a3535" opacity="0.5"/>
  <circle cx="410" cy="255" r="1.5" fill="#3a3535" opacity="0.7"/>
  <circle cx="440" cy="265" r="2" fill="#3a3535" opacity="0.55"/>
  <circle cx="470" cy="258" r="2.5" fill="#3a3535" opacity="0.5"/>
  
  <!-- Dark shadow at bottom of mirror -->
  <rect x="254" y="340" width="292" height="66" rx="6" fill="#0f0c0c" opacity="0.8"/>
  
  <!-- Subtle eerie glow around mirror -->
  <rect x="248" y="36" width="304" height="378" rx="10" fill="none" stroke="#1a1515" stroke-width="8" opacity="0.3"/>
  
  <!-- Bathroom counter hint at bottom -->
  <rect x="100" y="410" width="600" height="30" rx="2" fill="#151212"/>
  
  <!-- Faint shadow of a figure behind the viewer (subtle, bottom edge) -->
  <ellipse cx="400" cy="448" rx="60" ry="8" fill="#0f0a0a" opacity="0.7"/>
</svg>
