<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121010"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1515"/>
      <stop offset="100%" stop-color="#0d0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background wall -->
  <rect x="0" y="0" width="800" height="340" fill="url(#wallGrad)"/>

  <!-- Floor -->
  <rect x="0" y="340" width="800" height="110" fill="url(#floorGrad)"/>

  <!-- Floor line -->
  <line x1="0" y1="340" x2="800" y2="340" stroke="#1a1515" stroke-width="2"/>

  <!-- Elevator door frame - right side -->
  <rect x="520" y="60" width="180" height="280" fill="#080606" stroke="#1a1515" stroke-width="1"/>

  <!-- Elevator opening (dark interior) -->
  <rect x="540" y="80" width="140" height="260" fill="#030202"/>

  <!-- Subtle light from elevator interior -->
  <rect x="540" y="80" width="140" height="260" fill="#0a0810" opacity="0.5"/>

  <!-- Elevator door edges -->
  <line x1="540" y1="80" x2="540" y2="340" stroke="#151212" stroke-width="2"/>
  <line x1="680" y1="80" x2="680" y2="340" stroke="#151212" stroke-width="2"/>

  <!-- Door open indicator - top -->
  <rect x="540" y="75" width="140" height="5" fill="#1a1515"/>

  <!-- Apartment door - left side -->
  <rect x="80" y="80" width="160" height="260" fill="#0c0a0a" stroke="#151212" stroke-width="1"/>
  <rect x="85" y="85" width="150" height="250" fill="#0a0808"/>

  <!-- Door handle -->
  <rect x="220" y="190" width="8" height="40" rx="2" fill="#1a1515"/>

  <!-- Door number -->
  <text x="160" y="105" font-family="sans-serif" font-size="14" fill="#1a1515" text-anchor="middle">23F</text>

  <!-- Wall light - hallway -->
  <circle cx="400" cy="120" r="4" fill="#2a2520" filter="url(#glow)"/>
  <ellipse cx="400" cy="120" rx="60" ry="20" fill="#2a2520" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Light cone from wall light -->
  <polygon points="395,120 360,340 440,340" fill="#1a1815" opacity="0.15"/>

  <!-- Shoes on the floor - white silhouettes -->
  <!-- Shoe 1 (pair) -->
  <ellipse cx="320" cy="355" rx="18" ry="8" fill="#1a1818" opacity="0.6"/>
  <ellipse cx="345" cy="355" rx="18" ry="8" fill="#1a1818" opacity="0.6"/>

  <!-- Shoe 2 (pair) -->
  <ellipse cx="370" cy="365" rx="16" ry="7" fill="#1a1818" opacity="0.5"/>
  <ellipse cx="392" cy="365" rx="16" ry="7" fill="#1a1818" opacity="0.5"/>

  <!-- Shoe 3 (pair) -->
  <ellipse cx="415" cy="375" rx="15" ry="7" fill="#1a1818" opacity="0.4"/>
  <ellipse cx="435" cy="375" rx="15" ry="7" fill="#1a1818" opacity="0.4"/>

  <!-- Shoe 4 - single, with foot-shaped depression -->
  <ellipse cx="455" cy="385" rx="14" ry="6" fill="#1e1c1c" opacity="0.5"/>
  <!-- Depressed area - foot shape -->
  <ellipse cx="455" cy="385" rx="8" ry="4" fill="#151313" opacity="0.6"/>

  <!-- Shoe 5 - single, further back -->
  <ellipse cx="480" cy="395" rx="12" ry="5" fill="#1e1c1c" opacity="0.35"/>

  <!-- Subtle shadow under elevator -->
  <ellipse cx="610" cy="340" rx="70" ry="8" fill="#050404" opacity="0.5"/>

  <!-- Fog/mist at floor level near elevator -->
  <ellipse cx="610" cy="335" rx="90" ry="15" fill="#0f0d12" opacity="0.3"/>
  <ellipse cx="580" cy="338" rx="50" ry="10" fill="#0f0d12" opacity="0.2"/>

  <!-- Faint figure silhouette inside elevator - barely visible -->
  <g opacity="0.08">
    <ellipse cx="640" cy="200" rx="15" ry="18" fill="#1a1820"/>
    <rect x="628" y="218" width="24" height="60" rx="5" fill="#1a1820"/>
    <line x1="628" y1="278" x2="622" y2="340" stroke="#1a1820" stroke-width="8"/>
    <line x1="652" y1="278" x2="658" y2="340" stroke="#1a1820" stroke-width="8"/>
  </g>

  <!-- Very faint second shadow -->
  <g opacity="0.04">
    <ellipse cx="600" cy="190" rx="12" ry="15" fill="#1a1820"/>
    <rect x="592" y="205" width="16" height="50" rx="4" fill="#1a1820"/>
  </g>

  <!-- Bottom vignette -->
  <rect x="0" y="380" width="800" height="70" fill="#050404" opacity="0.5"/>

  <!-- Subtle noise texture overlay -->
  <rect x="0" y="0" width="800" height="450" fill="none" opacity="0.02"/>
</svg>
