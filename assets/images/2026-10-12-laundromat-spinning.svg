<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a1510" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle ambient light from top -->
  <rect width="800" height="450" fill="url(#glow)" opacity="0.3"/>

  <!-- Floor line -->
  <line x1="0" y1="370" x2="800" y2="370" stroke="#1a1510" stroke-width="1" opacity="0.4"/>

  <!-- Washing machines row (background silhouettes) -->
  <!-- Machine 1 (far left) -->
  <rect x="40" y="100" width="100" height="270" rx="4" fill="#111010" stroke="#1a1818" stroke-width="1"/>
  <rect x="55" y="115" width="70" height="70" rx="35" fill="#0d0c0c" stroke="#1a1818" stroke-width="0.5"/>
  <circle cx="90" cy="210" r="3" fill="#1a1818" opacity="0.3"/>

  <!-- Machine 2 -->
  <rect x="160" y="100" width="100" height="270" rx="4" fill="#111010" stroke="#1a1818" stroke-width="1"/>
  <rect x="175" y="115" width="70" height="70" rx="35" fill="#0d0c0c" stroke="#1a1818" stroke-width="0.5"/>
  <circle cx="210" cy="210" r="3" fill="#1a1818" opacity="0.3"/>

  <!-- Machine 3 (middle-left) -->
  <rect x="280" y="100" width="100" height="270" rx="4" fill="#111010" stroke="#1a1818" stroke-width="1"/>
  <rect x="295" y="115" width="70" height="70" rx="35" fill="#0d0c0c" stroke="#1a1818" stroke-width="0.5"/>
  <circle cx="330" cy="210" r="3" fill="#1a1818" opacity="0.3"/>

  <!-- Machine 4 (center - THE ONE) -->
  <rect x="400" y="80" width="120" height="290" rx="4" fill="#151312" stroke="#2a2020" stroke-width="1.5"/>
  <!-- Drum window with eerie yellowish glow -->
  <rect x="418" y="98" width="84" height="84" rx="42" fill="#0d0c0c" stroke="#2a2520" stroke-width="1"/>
  <!-- Foam inside drum -->
  <ellipse cx="460" cy="140" rx="30" ry="25" fill="#2a2820" opacity="0.4"/>
  <ellipse cx="448" cy="132" rx="18" ry="15" fill="#2a2820" opacity="0.3"/>
  <!-- Yellow indicator light -->
  <circle cx="460" cy="200" r="4" fill="#3a3520" opacity="0.8"/>
  <circle cx="460" cy="200" r="8" fill="#3a3520" opacity="0.2"/>
  <!-- Coin slot -->
  <rect x="452" y="215" width="16" height="8" rx="2" fill="#1a1818" stroke="#2a2520" stroke-width="0.5"/>

  <!-- Hand pressed against the glass -->
  <g transform="translate(430, 110)" filter="url(#blur1)" opacity="0.6">
    <!-- Palm -->
    <ellipse cx="20" cy="25" rx="18" ry="22" fill="#1a1515"/>
    <!-- Fingers -->
    <rect x="8" y="2" width="5" height="20" rx="2" fill="#1a1515"/>
    <rect x="15" y="0" width="5" height="22" rx="2" fill="#1a1515"/>
    <rect x="22" y="1" width="5" height="21" rx="2" fill="#1a1515"/>
    <rect x="29" y="3" width="4" height="18" rx="2" fill="#1a1515"/>
    <!-- Thumb -->
    <rect x="-2" y="18" width="6" height="12" rx="2" fill="#1a1515" transform="rotate(-20, 0, 24)"/>
  </g>

  <!-- Machine 5 (right of center) -->
  <rect x="540" y="100" width="100" height="270" rx="4" fill="#111010" stroke="#1a1818" stroke-width="1"/>
  <rect x="555" y="115" width="70" height="70" rx="35" fill="#0d0c0c" stroke="#1a1818" stroke-width="0.5"/>
  <circle cx="590" cy="210" r="3" fill="#1a1818" opacity="0.3"/>

  <!-- Machine 6 (far right) -->
  <rect x="660" y="100" width="100" height="270" rx="4" fill="#111010" stroke="#1a1818" stroke-width="1"/>
  <rect x="675" y="115" width="70" height="70" rx="35" fill="#0d0c0c" stroke="#1a1818" stroke-width="0.5"/>
  <circle cx="710" cy="210" r="3" fill="#1a1818" opacity="0.3"/>

  <!-- Floor reflection from the yellow light -->
  <ellipse cx="460" cy="385" rx="50" ry="8" fill="#2a2520" opacity="0.15"/>

  <!-- Subtle dark vignette edges -->
  <rect width="800" height="450" fill="none" stroke="#0a0808" stroke-width="40" opacity="0.5"/>

  <!-- Single coin on the floor -->
  <ellipse cx="460" cy="378" rx="6" ry="3" fill="#2a2520" stroke="#3a3520" stroke-width="0.5"/>
</svg>
