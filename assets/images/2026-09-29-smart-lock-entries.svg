<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background: dark hallway -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Hallway perspective - floor -->
  <polygon points="0,320 800,320 800,450 0,450" fill="#0e0b0b"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Floor tiles -->
  <line x1="100" y1="320" x2="130" y2="450" stroke="#141010" stroke-width="0.5"/>
  <line x1="200" y1="320" x2="240" y2="450" stroke="#141010" stroke-width="0.5"/>
  <line x1="300" y1="320" x2="350" y2="450" stroke="#141010" stroke-width="0.5"/>
  <line x1="400" y1="320" x2="460" y2="450" stroke="#141010" stroke-width="0.5"/>
  <line x1="500" y1="320" x2="570" y2="450" stroke="#141010" stroke-width="0.5"/>
  <line x1="600" y1="320" x2="680" y2="450" stroke="#141010" stroke-width="0.5"/>
  <line x1="700" y1="320" x2="790" y2="450" stroke="#141010" stroke-width="0.5"/>
  
  <!-- Hallway walls -->
  <rect x="0" y="0" width="800" height="320" fill="#0a0808"/>
  
  <!-- Left wall perspective lines -->
  <line x1="0" y1="100" x2="250" y2="100" stroke="#121010" stroke-width="0.5"/>
  <line x1="0" y1="200" x2="250" y2="200" stroke="#121010" stroke-width="0.5"/>
  
  <!-- Right wall perspective lines -->
  <line x1="800" y1="100" x2="550" y2="100" stroke="#121010" stroke-width="0.5"/>
  <line x1="800" y1="200" x2="550" y2="200" stroke="#121010" stroke-width="0.5"/>
  
  <!-- Door in center -->
  <rect x="320" y="80" width="160" height="240" fill="#1a1515" stroke="#2a2222" stroke-width="1"/>
  
  <!-- Door panel details -->
  <rect x="330" y="90" width="140" height="90" fill="none" stroke="#221c1c" stroke-width="0.5"/>
  <rect x="330" y="190" width="140" height="120" fill="none" stroke="#221c1c" stroke-width="0.5"/>
  
  <!-- Smart lock panel -->
  <rect x="420" y="175" width="45" height="55" fill="#2a2525" stroke="#3a3535" stroke-width="1" rx="3"/>
  
  <!-- Smart lock screen -->
  <rect x="425" y="182" width="35" height="25" fill="#0a1a0a" rx="1"/>
  
  <!-- Green LED indicator on lock -->
  <circle cx="442" cy="215" r="3" fill="#1a5a1a" opacity="0.8"/>
  <circle cx="442" cy="215" r="6" fill="#1a5a1a" opacity="0.3"/>
  
  <!-- Fingerprint sensor area -->
  <rect x="428" y="218" width="28" height="8" fill="#3a3535" rx="1"/>
  
  <!-- Door handle -->
  <rect x="340" y="240" width="8" height="40" fill="#2a2525" rx="2"/>
  <rect x="338" y="238" width="12" height="6" fill="#333030" rx="1"/>
  
  <!-- Door keyhole -->
  <circle cx="442" cy="250" r="3" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
  
  <!-- Water droplets at door threshold -->
  <ellipse cx="380" cy="318" rx="2" ry="1" fill="#1a2a3a" opacity="0.6"/>
  <ellipse cx="400" cy="319" rx="1.5" ry="0.8" fill="#1a2a3a" opacity="0.5"/>
  <ellipse cx="420" cy="318" rx="2.5" ry="1.2" fill="#1a2a3a" opacity="0.7"/>
  <ellipse cx="445" cy="319" rx="1.5" ry="0.8" fill="#1a2a3a" opacity="0.4"/>
  <ellipse cx="460" cy="318" rx="2" ry="1" fill="#1a2a3a" opacity="0.5"/>
  <ellipse cx="475" cy="319" rx="1" ry="0.6" fill="#1a2a3a" opacity="0.3"/>
  
  <!-- Water trail from door -->
  <line x1="390" y1="318" x2="370" y2="330" stroke="#1a2a3a" stroke-width="0.5" opacity="0.3"/>
  <line x1="430" y1="318" x2="425" y2="335" stroke="#1a2a3a" stroke-width="0.5" opacity="0.25"/>
  <line x1="455" y1="318" x2="465" y2="340" stroke="#1a2a3a" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Smartphone on floor (foreground, right side) -->
  <rect x="580" y="280" width="50" height="85" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" rx="4" transform="rotate(-15, 605, 322)"/>
  
  <!-- Phone screen glow -->
  <rect x="585" y="288" width="40" height="65" fill="#0a1a2a" rx="2" transform="rotate(-15, 605, 322)"/>
  
  <!-- Phone notification text lines -->
  <rect x="590" y="295" width="25" height="2" fill="#2a4a5a" opacity="0.6" transform="rotate(-15, 605, 322)"/>
  <rect x="590" y="302" width="30" height="2" fill="#2a4a5a" opacity="0.4" transform="rotate(-15, 605, 322)"/>
  <rect x="590" y="309" width="20" height="2" fill="#2a4a5a" opacity="0.5" transform="rotate(-15, 605, 322)"/>
  
  <!-- Notification icon - lock symbol on phone -->
  <rect x="590" y="320" width="10" height="10" fill="none" stroke="#3a6a3a" stroke-width="0.8" rx="1" transform="rotate(-15, 605, 322)" opacity="0.7"/>
  <path d="M593,320 L593,317 Q593,315 595,315 Q597,315 597,317 L597,320" stroke="#3a6a3a" stroke-width="0.8" fill="none" transform="rotate(-15, 605, 322)" opacity="0.7"/>
  
  <!-- Phone screen glow effect -->
  <ellipse cx="605" cy="322" rx="35" ry="50" fill="#0a1a2a" opacity="0.05"/>
  
  <!-- Red unlock notification indicator -->
  <circle cx="625" cy="290" r="3" fill="#4a1a1a" opacity="0.6" transform="rotate(-15, 605, 322)"/>
  
  <!-- Timestamp on phone screen -->
  <rect x="590" y="335" width="18" height="2" fill="#2a4a5a" opacity="0.3" transform="rotate(-15, 605, 322)"/>
  
  <!-- Ceiling light - dim hallway light -->
  <ellipse cx="400" cy="0" rx="60" ry="20" fill="#1a1810" opacity="0.3"/>
  <line x1="400" y1="20" x2="400" y2="80" stroke="#2a2515" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Light cone from ceiling -->
  <polygon points="380,0 420,0 500,200 300,200" fill="#1a1810" opacity="0.03"/>
  
  <!-- Door gap - light leaking from under door -->
  <rect x="320" y="316" width="160" height="4" fill="#1a1810" opacity="0.15"/>
  
  <!-- Subtle shadow under door -->
  <rect x="320" y="318" width="160" height="8" fill="#000" opacity="0.1"/>
  
  <!-- Ambient darkness gradient -->
  <rect x="0" y="0" width="800" height="450" fill="url(#darken)" opacity="0.4"/>
  
  <defs>
    <radialGradient id="darken" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </radialGradient>
  </defs>
  
  <!-- Very subtle atmosphere particles (dust) -->
  <circle cx="200" cy="150" r="0.5" fill="#2a2520" opacity="0.3"/>
  <circle cx="600" cy="180" r="0.4" fill="#2a2520" opacity="0.2"/>
  <circle cx="350" cy="250" r="0.6" fill="#2a2520" opacity="0.15"/>
  <circle cx="500" cy="120" r="0.5" fill="#2a2520" opacity="0.25"/>
  <circle cx="150" cy="280" r="0.4" fill="#2a2520" opacity="0.2"/>
</svg>