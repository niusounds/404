<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1515" />
      <stop offset="100%" stop-color="#0a0808" />
    </radialGradient>
    <linearGradient id="mirrorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2525" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1a1515" stop-opacity="0.7" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808" />

  <!-- Subtle fluorescent light glow from above -->
  <rect x="250" y="0" width="300" height="60" fill="#1a1818" opacity="0.3" />
  <rect x="280" y="0" width="40" height="80" fill="#2a2520" opacity="0.15" />
  <rect x="480" y="0" width="40" height="80" fill="#2a2520" opacity="0.15" />

  <!-- Store shelf silhouette on the left -->
  <rect x="30" y="120" width="120" height="280" fill="#0e0c0c" stroke="#1a1818" stroke-width="0.5" />
  <line x1="30" y1="200" x2="150" y2="200" stroke="#1a1818" stroke-width="0.5" />
  <line x1="30" y1="280" x2="150" y2="280" stroke="#1a1818" stroke-width="0.5" />
  <line x1="30" y1="360" x2="150" y2="360" stroke="#1a1818" stroke-width="0.5" />
  <!-- Products as small rectangles -->
  <rect x="45" y="170" width="15" height="25" fill="#151313" />
  <rect x="65" y="165" width="12" height="30" fill="#151313" />
  <rect x="82" y="175" width="10" height="20" fill="#151313" />
  <rect x="100" y="168" width="14" height="27" fill="#151313" />
  <rect x="45" y="250" width="18" height="25" fill="#151313" />
  <rect x="68" y="245" width="12" height="30" fill="#151313" />
  <rect x="85" y="255" width="15" height="20" fill="#151313" />
  <rect x="45" y="330" width="14" height="25" fill="#151313" />
  <rect x="63" y="325" width="16" height="30" fill="#151313" />
  <rect x="83" y="335" width="10" height="20" fill="#151313" />

  <!-- Checkout counter -->
  <rect x="200" y="320" width="400" height="130" fill="#121010" />
  <rect x="200" y="315" width="400" height="8" fill="#1a1818" />
  <line x1="200" y1="320" x2="600" y2="320" stroke="#222020" stroke-width="0.5" />

  <!-- Items on the counter -->
  <!-- Medicine box -->
  <rect x="300" y="285" width="35" height="30" fill="#1a1a1a" stroke="#2a2525" stroke-width="0.5" />
  <rect x="305" y="290" width="25" height="3" fill="#2a2525" opacity="0.5" />
  <rect x="305" y="296" width="18" height="2" fill="#2a2525" opacity="0.3" />
  <!-- Another box -->
  <rect x="345" y="290" width="28" height="25" fill="#1a1a1a" stroke="#2a2525" stroke-width="0.5" />
  <rect x="350" y="295" width="18" height="2" fill="#2a2525" opacity="0.4" />

  <!-- Shopping bag -->
  <path d="M400 320 L395 280 L440 275 L445 320 Z" fill="#1e1c1c" stroke="#2a2828" stroke-width="0.5" />
  <path d="M400 280 L405 260 L415 260 L420 280" fill="none" stroke="#2a2828" stroke-width="0.5" />

  <!-- The small mirror - central focus -->
  <rect x="460" y="270" width="70" height="45" rx="3" fill="#1a1818" stroke="#3a3535" stroke-width="1" />
  <rect x="463" y="273" width="64" height="39" rx="2" fill="url(#mirrorGlow)" />

  <!-- Distorted face reflection in the mirror -->
  <g transform="translate(495, 292)" filter="url(#blur1)">
    <!-- Head silhouette -->
    <ellipse cx="0" cy="0" rx="14" ry="17" fill="#0a0a0a" />
    <!-- Eyes - wide open, pupils dilated -->
    <ellipse cx="-5" cy="-3" rx="3" ry="3.5" fill="#050505" />
    <ellipse cx="5" cy="-3" rx="3" ry="3.5" fill="#050505" />
    <!-- Pupils -->
    <ellipse cx="-5" cy="-3" rx="1.5" ry="2" fill="#000000" />
    <ellipse cx="5" cy="-3" rx="1.5" ry="2" fill="#000000" />
    <!-- Distorted mouth - twisted -->
    <path d="M-7 7 Q0 12 8 6" fill="none" stroke="#0a0a0a" stroke-width="1.5" />
  </g>

  <!-- Mirror reflection glow -->
  <ellipse cx="495" cy="292" rx="35" ry="22" fill="#2a2525" opacity="0.08" />

  <!-- Floor -->
  <rect x="0" y="440" width="800" height="10" fill="#080606" />

  <!-- Ambient flicker effect - subtle lines -->
  <rect x="0" y="100" width="800" height="1" fill="#1a1818" opacity="0.2" />
  <rect x="0" y="180" width="800" height="1" fill="#1a1818" opacity="0.1" />
  <rect x="0" y="260" width="800" height="1" fill="#1a1818" opacity="0.15" />

  <!-- Seven tiny mirrors on the right (foreshadowing) -->
  <g transform="translate(640, 280)" opacity="0.4">
    <rect x="0" y="0" width="12" height="8" rx="1" fill="#1a1818" stroke="#2a2828" stroke-width="0.3" />
    <rect x="0" y="10" width="12" height="8" rx="1" fill="#1a1818" stroke="#2a2828" stroke-width="0.3" />
    <rect x="0" y="20" width="12" height="8" rx="1" fill="#1a1818" stroke="#2a2828" stroke-width="0.3" />
    <rect x="0" y="30" width="12" height="8" rx="1" fill="#1a1818" stroke="#2a2828" stroke-width="0.3" />
    <rect x="0" y="40" width="12" height="8" rx="1" fill="#1a1818" stroke="#2a2828" stroke-width="0.3" />
    <rect x="0" y="50" width="12" height="8" rx="1" fill="#1a1818" stroke="#2a2828" stroke-width="0.3" />
    <rect x="0" y="60" width="12" height="8" rx="1" fill="#1a1818" stroke="#2a2828" stroke-width="0.3" />
  </g>

  <!-- Vignette -->
  <rect width="800" height="450" fill="url(#glow)" opacity="0.5" />
</svg>
