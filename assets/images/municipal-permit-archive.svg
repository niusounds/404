<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <clipPath id="archClip"><rect x="30" y="50" width="540" height="300" rx="4"/></clipPath>
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="7s" repeatCount="indefinite"/>
  </defs>
  <rect width="600" height="400" fill="#06060a"/>
  <g clip-path="url(#archClip)" opacity="0.85">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="7s" repeatCount="indefinite"/>
    <!-- shelves -->
    <rect x="60" y="80" width="480" height="240" fill="#0e0c14"/>
    <line x1="50" y1="80" x2="550" y2="80" stroke="#1a1828" stroke-width="1.5"/>
    <line x1="50" y1="135" x2="550" y2="135" stroke="#1a1828" stroke-width="1.5"/>
    <line x1="50" y1="190" x2="550" y2="190" stroke="#1a1828" stroke-width="1.5"/>
    <line x1="50" y1="245" x2="550" y2="245" stroke="#1a1828" stroke-width="1.5"/>
    <!-- completed folders (normal gray) -->
    <rect x="65" y="90" width="130" height="40" fill="#1c1a1e" rx="2"/>
    <text x="85" y="115" font-family="sans-serif" font-size="11" fill="#f9786b">OK</text>
    <rect x="205" y="90" width="130" height="40" fill="#1c1a1e" rx="2"/>
    <text x="225" y="115" font-family="sans-serif" font-size="11" fill="#f9786b">OK</text>
    <!-- ghost row 1 - incomplete (missing) -->
    <rect x="65" y="145" width="100" height="40" fill="#1c1a1e" rx="2"/>
    <rect x="175" y="145" width="130" height="40" fill="#100808" stroke="#f9786b" stroke-width="0.8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="195" y="170" font-family="sans-serif" font-size="8" fill="#f9786b">未存在</text>
    <!-- ghost row 2 -->
    <rect x="310" y="145" width="130" height="40" fill="#1c1a1e" rx="2"/>
    <text x="330" y="170" font-family="sans-serif" font-size="11" fill="#f9786b">OK</text>
    <!-- bottom row -->
    <rect x="65" y="195" width="120" height="40" fill="#1c1a1e" rx="2"/>
    <rect x="195" y="195" width="130" height="40" fill="#100808" stroke="#f9786b" stroke-width="0.8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="215" y="220" font-family="sans-serif" font-size="8" fill="#f9786b">未確認</text>
    <rect x="335" y="195" width="130" height="40" fill="#1c1a1e" rx="2"/>
    <!-- bottom shelf -->
    <rect x="65" y="250" width="80" height="40" fill="#1c1a1e" rx="2"/>
    <rect x="155" y="250" width="130" height="40" fill="#100808" stroke="#f9786b" stroke-width="0.8">
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="178" y="275" font-family="sans-serif" font-size="8" fill="#f9786b">??? 9名失踪</text>
    <!-- title overlay -->
    <text x="300" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a3a0a">完了通知書の向こう側</text>
  </g>
</svg>