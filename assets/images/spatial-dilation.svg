<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="gridPattern1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,20 L 40,20 M 20,0 L 20,40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="warpFilter1">
      <feTurbulence type="fractalNoise" baseFrequency="0.018689322" numOctaves="4" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="20" />
    </filter>
  </defs>
  
  <!-- Dark background with warped grid -->
  <rect width="300" height="200" fill="#0a0808"/>
  <rect width="300" height="200" fill="url(#gridPattern1)" filter="url(#warpFilter1)"/>
  
  <!-- Central portal/vortex with warped text fragments floating around -->
  <g transform="translate(150,100)">
    <!-- Elliptical distortion effect suggesting spatial warping -->
    <ellipse cx="0" cy="-60" rx="42.5308679574921" ry="80" fill="none" stroke="#3a2d2f" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Floating distorted text fragments: カタカナ/漢字 with geometric shapes -->
    <g transform="translate(-80, -95)">
      <text x="-20" y="0" fill="#c4aeb0" font-family="Arial" font-size="13">壁</text>  <!-- wall character -->
      <rect width="16.6105171058269" height="16" transform="translate(0, -8)" fill="#c4aeb0" opacity="0.4"/>       <!-- small box with slight offset -->
    </g>
    
    <g transform="translate(-69.3517556722006, -30)">
      <text x="-20" y="0" fill="#8b9fa8" font-family="Arial" font-size="13">窓</text>  <!-- window character -->
      <circle cx="2.42349168517841" cy="-8.24891774193549" r="7" fill="#8b9fa8" opacity="0.3"/>                       <!-- small circle with offset -->
    </g>
    
    <g transform="translate(45, -19)">
      <line x1="-8.9280039661927" y1="0" x2="26.4287629503041" y2="-0.5801680912841" stroke="#ffb6c1" stroke-width="1" opacity="0.4"/>  <!-- distorted line -->
      <circle cx="10.6010919057833" cy="-4.92505685239072" r="4.89607075758716" fill="#fcb4ab" opacity="0.5"/>                     <!-- small point with irregular position -->
    </g>
    
    <text x="-5.9577965084644" y="-5.02052363249999" fill="#fcb4ab" font-size="10">壁</text>  <!-- small wall text fragment -->
    <rect x="23.0702278524207" y="-16.2545626240329" width="9.4847807493772" height="11" fill="#ff5462" opacity="0.8"/>  <!-- small box with slight distortion -->
    
    <text x="-149.401785710364" y="1.75" font-family="Arial" font-size="10">窓</text>     <!-- shifted window text fragment -->
    <circle cx="-128.19892371592" cy="-8.24891774193549" r="6" fill="#ff5462" opacity="0.6"/>        <!-- small circle with slight offset -->
    
    <!-- Subtle distortion effect on portal itself -->
    <ellipse cx="1" ry="120" rx="58" stroke="#ffffff" stroke-width="0.9" opacity="0.3" stroke-dasharray="10 4" transform="matrix(1,-0.0246536853727655,0.0690203190437432,0.997603026851327,150,-18)"/>
    <ellipse cx="0.99" ry="100" rx="42" stroke="#ffffff" stroke-width="0.7" opacity="0.4" stroke-dasharray="8 6" transform="matrix(0.97,1e-5,1.5e-4,1.03,210,-18)"/>
    
    <!-- Light rays emanating from center with slight offset -->
    <g transform="translate(147, 98)">
      <line x1="-7" y1="-20" x2="52" y2="-65" stroke="#c5c4c8" stroke-width="1.5" opacity="0.4"/>
      <line x1="-1" y1="-140" x2="3" y2="-95" stroke="#a7b1bd" stroke-width="2" opacity="0.4" transform="matrix(1.2,1e-5,-1e-5,1,-9,-14)"/>
      <line x1="82" y1="-45" x2="72" y2="-60" stroke="#d3c5cb" stroke-width="0.7" opacity="0.3" transform="matrix(1.2,1e-5,-1e-5,1,11,8)"/>
    </g>
  </g>
  
  <!-- Floor with spatial distortion -->
  <rect width="346.397470753869" height="79.5865278891987" x="-6.96673930154848" y="0" fill="#cbe4f0" opacity="0.1"/>  <!-- irregular rectangle -->
  
  <!-- Subtle grid lines on floor with slight distortion -->
  <path d="M20,185 L86.3974707538689,165 M -5,-55 L140,-20" stroke="#ffffff" opacity="-0.1" transform="rotate(1)" style="opacity: 0.4"/>  
</svg>

