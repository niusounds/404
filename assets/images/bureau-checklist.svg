<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0812"/>
      <stop offset="100%" stop-color="#0e0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" fill="url(#bgGrad)"/>

  <!-- Clipboard frame - light blue ink outline -->
  <g transform="translate(50, 25)">
    <!-- Board body -->
    <rect width="300" height="210" rx="8" ry="8"
          stroke="#9dd4f0" stroke-width="3" fill="none"/>

    <!-- Top clip (metallic silver with subtle pink pulse) -->
    <g>
      <animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/>
      <ellipse cx="150" cy="8" rx="30" ry="10" fill="#c07a7f" stroke="#9dd4f0" stroke-width="2"/>
    </g>

    <!-- Name/title area - white text -->
    <text x="30" y="52" font-family="monospace" font-size="16" fill="#ffffff">
      新入社員オリエンテーション資料
    </text>

    <!-- Content lines - blue tinted -->
    <line x1="30" y1="72" x2="370" y2="72" stroke="#9dd4f0" stroke-width="0.5" opacity="0.5"/>

    <!-- Item 1: green (approved) -->
    <circle cx="48" cy="100" r="6" fill="#1f4a3a" stroke="#2ec7b7" stroke-width="2">
      <animate attributeName="fill-opacity" values="1;0.6;1" dur="2s"/>
    </circle>
    <text x="65" y="108" font-family="'Noto Sans JP',sans-serif" font-size="14" fill="#9dd4f0">
      安全対策研修（完了）
    </text>

    <!-- Item 2: blue -->
    <circle cx="48" cy="135" r="6" fill="none" stroke="#9dd4f0" stroke-width="2"/>
    <text x="65" y="143" font-family="'Noto Sans JP',sans-serif" font-size="14" fill="#c5d8e7">
      PC設定ガイド（完了）
    </text>

    <!-- Item 3: red blinking - the anomaly! -->
    <circle cx="48" cy="170" r="6" fill="#3a1f2e" stroke="#ff4a5c" stroke-width="2">
      <animate attributeName="fill-opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="65" y="178" font-family="'Noto Sans JP',sans-serif" font-size="14" fill="#ffb3b9">
      退職届提出手続き（未記入）←← ここ！
    </text>

    <!-- Red ink stroke-through effect below the anomaly, very faint -->
    <line x1="200" y1="175" x2="380" y2="173" stroke="#ff4a5c" stroke-width="1.5" opacity="0.6"/>

    <!-- Subtle text at bottom right - someone already signed, timestamp -->
    <text x="248" y="200" font-family="monospace" font-size="9" fill="#ffb3b9" opacity="0.7">
      署名: ○○氏  2026/01/15 23:47
    </text>
  </g>

  <!-- Subtle glitch at bottom left -->
  <line x1="59" y1="238" x2="75" y2="238" stroke="#6a5cfe" stroke-width="2" opacity="0.4">
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
  </line>

</svg>
