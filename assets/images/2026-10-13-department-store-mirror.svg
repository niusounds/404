<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Mirror frame -->
  <rect x="250" y="30" width="300" height="390" rx="8" fill="#1a1515" stroke="#2a2525" stroke-width="2"/>
  <rect x="258" y="38" width="284" height="374" rx="4" fill="#0e0c0c"/>

  <!-- Mirror glass reflection (subtle) -->
  <rect x="258" y="38" width="284" height="374" rx="4" fill="#15121a" opacity="0.3"/>

  <!-- Silhouette figure (person looking at mirror) -->
  <ellipse cx="400" cy="200" rx="35" ry="45" fill="#050405"/>
  <path d="M365 245 Q365 240 370 235 L370 350 Q370 355 375 355 L425 355 Q430 355 430 350 L430 235 Q435 240 435 245 Z" fill="#050405"/>

  <!-- Mirror reflection - wrong smile silhouette -->
  <!-- Face outline in mirror -->
  <ellipse cx="400" cy="170" rx="30" ry="38" fill="#1a1820"/>
  <!-- Eyes - slightly offset -->
  <ellipse cx="388" cy="162" rx="4" ry="3" fill="#2a2530"/>
  <ellipse cx="412" cy="162" rx="4" ry="3" fill="#2a2530"/>
  <!-- Mouth - wide smile (wrong) -->
  <path d="M382 185 Q400 200 418 185" stroke="#2a2530" stroke-width="2" fill="none"/>
  <!-- Smile lines -->
  <path d="M378 182 L375 188" stroke="#2a2530" stroke-width="1.5"/>
  <path d="M422 182 L425 188" stroke="#2a2530" stroke-width="1.5"/>

  <!-- Subtle mirror crack -->
  <path d="M400 38 L400 80 L395 90 L402 100 L398 110" stroke="#1a1820" stroke-width="0.5" fill="none" opacity="0.4"/>

  <!-- Dim lighting effect -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" opacity="0.5"/>

  <!-- Floor reflection hint -->
  <ellipse cx="400" cy="430" rx="120" ry="8" fill="#0e0c0c" opacity="0.3"/>

  <!-- Small text-like elements (department store sign hint) -->
  <rect x="370" y="45" width="60" height="3" rx="1" fill="#1a1520" opacity="0.3"/>
  <rect x="375" y="52" width="50" height="2" rx="1" fill="#1a1520" opacity="0.2"/>

  <!-- Vignette gradient -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Subtle atmosphere - cold fluorescent light -->
  <rect x="260" y="38" width="280" height="4" fill="#1a1a25" opacity="0.15"/>
  <rect x="260" y="38" width="280" height="1" fill="#2a2a3a" opacity="0.1"/>

  <!-- The smile is the focal point - slightly brighter -->
  <ellipse cx="400" cy="190" rx="8" ry="4" fill="#1e1a25" opacity="0.3"/>
</svg>
