<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a2a4a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle vignette -->
  <rect width="800" height="450" fill="url(#screenGlow)" opacity="0.3"/>

  <!-- Dark room suggestion - faint window silhouette on left -->
  <rect x="40" y="30" width="120" height="200" rx="2" fill="#0d0c0c" stroke="#111" stroke-width="0.5"/>
  <line x1="100" y1="30" x2="100" y2="230" stroke="#111" stroke-width="0.5"/>
  <line x1="40" y1="130" x2="160" y2="130" stroke="#111" stroke-width="0.5"/>

  <!-- Faint moonlight from window -->
  <polygon points="40,230 160,230 200,450 0,450" fill="#0a0f1a" opacity="0.15"/>

  <!-- Floor line -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#111" stroke-width="0.5" opacity="0.5"/>

  <!-- Center: Smartphone lying on a surface -->
  <!-- Phone body -->
  <rect x="340" y="120" width="120" height="240" rx="12" fill="#0e0e0e" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Phone screen glow -->
  <rect x="350" y="135" width="100" height="210" rx="4" fill="#0c1530" opacity="0.9"/>

  <!-- Screen content - eerie blue glow -->
  <rect x="352" y="137" width="96" height="206" rx="3" fill="#0e1a3a" opacity="0.7"/>

  <!-- Faint photo on screen - a room silhouette -->
  <!-- Room floor -->
  <rect x="355" y="260" width="90" height="78" fill="#0a0e18"/>
  <!-- Room wall -->
  <rect x="355" y="140" width="90" height="120" fill="#0d1225"/>
  <!-- Window in room photo -->
  <rect x="380" y="150" width="40" height="50" fill="#152040" opacity="0.6"/>
  <!-- Bookshelf silhouette -->
  <rect x="425" y="160" width="15" height="80" fill="#0a0e18" opacity="0.5"/>
  <!-- Tiny bear silhouette on shelf -->
  <circle cx="432" cy="157" r="3" fill="#0d1225" opacity="0.4"/>
  <circle cx="430" cy="154" r="1.5" fill="#0d1225" opacity="0.4"/>
  <circle cx="434" cy="154" r="1.5" fill="#0d1225" opacity="0.4"/>

  <!-- Photo timestamp overlay -->
  <text x="430" y="285" font-size="7" fill="#1a2a4a" text-anchor="middle" font-family="monospace" opacity="0.6">2026.08.20 02:14</text>

  <!-- Screen edge glow -->
  <rect x="348" y="133" width="104" height="214" rx="6" fill="none" stroke="#1a3060" stroke-width="0.5" opacity="0.4"/>

  <!-- Phone camera notch -->
  <rect x="385" y="128" width="30" height="6" rx="3" fill="#0a0a0a"/>

  <!-- Phone reflection on surface -->
  <rect x="345" y="365" width="110" height="8" rx="4" fill="#0e1530" opacity="0.15" filter="url(#blur4)"/>

  <!-- Foreground: Shadowy figure's hand holding another phone (bottom right) -->
  <path d="M 600,420 Q 610,380 630,360 Q 640,350 650,355 Q 660,360 655,380 Q 650,400 640,420 Z" fill="#080707" opacity="0.8"/>
  <path d="M 620,420 Q 625,390 640,370 Q 648,362 655,365 Q 662,368 658,380 Q 652,400 645,420 Z" fill="#070606" opacity="0.7"/>

  <!-- Small phone in foreground hand - screen facing viewer -->
  <rect x="620" y="310" width="35" height="60" rx="4" fill="#0c0c0c" stroke="#151515" stroke-width="0.5"/>
  <rect x="623" y="315" width="29" height="48" rx="2" fill="#0a1020" opacity="0.8"/>
  <!-- Faint face on small screen -->
  <circle cx="637" cy="335" r="8" fill="#0d1530" opacity="0.5"/>
  <circle cx="634" cy="333" r="1" fill="#1a2a4a" opacity="0.6"/>
  <circle cx="640" cy="333" r="1" fill="#1a2a4a" opacity="0.6"/>

  <!-- Floating photo thumbnails scattered around -->
  <!-- Thumbnail 1 - top left -->
  <rect x="180" y="100" width="30" height="40" rx="1" fill="#0c1220" opacity="0.2" filter="url(#blur1)"/>
  <!-- Thumbnail 2 - top right -->
  <rect x="680" y="80" width="25" height="35" rx="1" fill="#0c1220" opacity="0.15" filter="url(#blur1)"/>
  <!-- Thumbnail 3 - middle right -->
  <rect x="720" y="200" width="28" height="38" rx="1" fill="#0c1220" opacity="0.18" filter="url(#blur1)"/>

  <!-- Cloud sync icon hint - top center -->
  <path d="M 380,60 Q 375,55 378,50 Q 383,47 387,50 Q 390,47 394,50 Q 397,55 392,60 Z" fill="#151a2a" opacity="0.25"/>
  <circle cx="386" cy="65" r="1" fill="#1a2a4a" opacity="0.3"/>
  <circle cx="392" cy="63" r="0.8" fill="#1a2a4a" opacity="0.25"/>

  <!-- Subtle static noise dots -->
  <circle cx="250" cy="300" r="0.5" fill="#1a1a1a" opacity="0.3"/>
  <circle cx="550" cy="250" r="0.4" fill="#1a1a1a" opacity="0.25"/>
  <circle cx="300" cy="180" r="0.3" fill="#151515" opacity="0.3"/>
  <circle cx="600" cy="350" r="0.5" fill="#151515" opacity="0.2"/>
  <circle cx="150" cy="350" r="0.4" fill="#121212" opacity="0.2"/>

  <!-- Bottom text - eerie timestamp -->
  <text x="400" y="440" font-size="8" fill="#151a2a" text-anchor="middle" font-family="monospace" opacity="0.4">撮影: 現在地 2026.08.24 03:00</text>
</svg>
