<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="phone-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="60%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#3d0000"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- faint building silhouette -->
  <g opacity="0.15">
    <rect x="250" y="60" width="300" height="390" fill="#1a1a2e"/>
    <rect x="270" y="80" width="20" height="20" fill="#2a2a4a"/>
    <rect x="315" y="80" width="20" height="20" fill="#ff6b35"/>
    <rect x="370" y="80" width="20" height="20" fill="#2a2a4a"/>
    <rect x="415" y="80" width="20" height="20" fill="#aa3030"/>
    <rect x="470" y="80" width="20" height="20" fill="#2a2a4a"/>
    <rect x="270" y="125" width="20" height="20" fill="#2a2a4a"/>
    <rect x="315" y="125" width="20" height="20" fill="#2a2a4a"/>
    <rect x="370" y="125" width="20" height="20" fill="#2a2a4a"/>
    <rect x="415" y="125" width="20" height="20" fill="#2a2a4a"/>
    <rect x="470" y="125" width="20" height="20" fill="#ff6b35"/>
    <rect x="270" y="170" width="20" height="20" fill="#2a2a4a"/>
    <rect x="315" y="170" width="20" height="20" fill="#aa3030"/>
    <rect x="370" y="170" width="20" height="20" fill="#2a2a4a"/>
    <rect x="415" y="170" width="20" height="20" fill="#2a2a4a"/>
    <rect x="470" y="170" width="20" height="20" fill="#2a2a4a"/>
  </g>

  <!-- rain -->
  <line x1="350" y1="60" x2="348" y2="95" stroke="#ffffff" opacity="0.06" stroke-width="1"/>
  <line x1="420" y1="70" x2="422" y2="100" stroke="#ffffff" opacity="0.04" stroke-width="1"/>
  <line x1="380" y1="50" x2="378" y2="85" stroke="#ffffff" opacity="0.05" stroke-width="1"/>

  <!-- phone -->
  <g transform="translate(340, 260)">
    <rect x="0" y="0" width="120" height="70" rx="10" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
    <!-- screen -->
    <rect x="10" y="8" width="100" height="40" rx="3" fill="#0d0d0d"/>
    <!-- dial pad glow -->
    <circle cx="60" cy="75" r="20" fill="url(#phone-glow)" filter="url(#glow)"/>
  </g>

  <!-- text: "RING" effect lines -->
  <g stroke="#ff4500" opacity="0.3" stroke-width="1.5">
    <path d="M200,300 Q220,380 200,460"/>
    <path d="M600,300 Q580,380 600,460"/>
  </g>

  <!-- decorative border -->
  <rect x="10" y="10" width="780" height="430" rx="4" fill="none" stroke="#2a0505" stroke-width="3"/>
  <!-- corner decorations -->
  <line x1="110" y1="10" x2="140" y2="10" stroke="#ff0033" stroke-width="1.5"/>
  <line x1="10" y1="110" x2="10" y2="140" stroke="#ff0033" stroke-width="1.5"/>
  <line x1="690" y1="10" x2="710" y2="10" stroke="#ff0033" stroke-width="1.5"/>
  <line x1="780" y1="110" x2="780" y2="140" stroke="#ff0033" stroke-width="1.5"/>
  <line x1="690" y1="440" x2="710" y2="440" stroke="#ff0033" stroke-width="1.5"/>
  <line x1="610" y1="430" x2="610" y2="460" stroke="#ff0033" stroke-width="1.5"/>
  <line x1="90" y1="440" x2="110" y2="440" stroke="#ff0033" stroke-width="1.5"/>
  <line x1="10" y1="380" x2="10" y2="420" stroke="#ff0033" stroke-width="1.5"/>

  <!-- title -->
  <text x="400" y="415" text-anchor="middle" fill="#ff1a1a" font-family="'Georgia'" font-size="36" letter-spacing="2">深夜の電話</text>

  <!-- subtle vignette corners (using large dark shapes) -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" filter="url(#glow)" opacity="0.3"/>
</svg>