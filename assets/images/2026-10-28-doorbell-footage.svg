<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="hallway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#0e0c0a"/>
    </linearGradient>
    <linearGradient id="doorframe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0d0b09"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: dark hallway -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor -->
  <rect x="0" y="340" width="800" height="110" fill="#080606"/>

  <!-- Door frame (left side, room interior perspective) -->
  <rect x="180" y="30" width="440" height="370" fill="url(#hallway)" stroke="#151210" stroke-width="2"/>

  <!-- Open door on the left -->
  <rect x="140" y="20" width="50" height="380" fill="#1a1510" stroke="#221d15" stroke-width="1"/>
  <!-- Door hinge detail -->
  <rect x="145" y="80" width="40" height="6" fill="#2a2520" rx="1"/>
  <rect x="145" y="320" width="40" height="6" fill="#2a2520" rx="1"/>

  <!-- Door handle on the open door -->
  <circle cx="175" cy="220" r="5" fill="#3a3530"/>
  <circle cx="175" cy="220" r="3" fill="#4a4540"/>

  <!-- Dark hallway beyond the door -->
  <rect x="230" y="40" width="390" height="360" fill="#060404"/>

  <!-- Tall thin figure in the hallway - silhouette -->
  <g filter="url(#glow)" opacity="0.6">
    <!-- Head -->
    <ellipse cx="425" cy="100" rx="18" ry="24" fill="#0a0808" stroke="#1a1818" stroke-width="0.5"/>
    <!-- Neck -->
    <rect x="418" y="122" width="14" height="15" fill="#0a0808" stroke="#151313" stroke-width="0.5"/>
    <!-- Body - unnaturally thin and tall -->
    <polygon points="410,137 440,137 445,280 405,280" fill="#0a0808" stroke="#151313" stroke-width="0.5"/>
    <!-- Left arm - unnaturally long -->
    <line x1="410" y1="145" x2="370" y2="290" stroke="#0a0808" stroke-width="8" stroke-linecap="round"/>
    <!-- Right arm - unnaturally long, reaching toward door -->
    <line x1="440" y1="145" x2="340" y2="240" stroke="#0a0808" stroke-width="8" stroke-linecap="round"/>
    <!-- Left leg -->
    <line x1="415" y1="278" x2="410" y2="380" stroke="#0a0808" stroke-width="9" stroke-linecap="round"/>
    <!-- Right leg -->
    <line x1="435" y1="278" x2="440" y2="380" stroke="#0a0808" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Faint eyes - barely visible -->
  <circle cx="418" cy="97" r="2" fill="#1a2a1a" opacity="0.5"/>
  <circle cx="432" cy="97" r="2" fill="#1a2a1a" opacity="0.5"/>

  <!-- Dim light spilling from the room into hallway -->
  <polygon points="230,40 620,40 620,360 230,360" fill="none" stroke="#1a2a1a" stroke-width="0.3" opacity="0.15"/>

  <!-- Night vision green tint overlay -->
  <rect x="230" y="40" width="390" height="360" fill="#0a1a0a" opacity="0.04"/>

  <!-- Door frame right side -->
  <rect x="620" y="30" width="30" height="380" fill="#12100e" stroke="#1a1815" stroke-width="0.5"/>

  <!-- Wall details - subtle texture -->
  <line x1="0" y1="340" x2="230" y2="340" stroke="#151210" stroke-width="1"/>
  <line x1="650" y1="340" x2="800" y2="340" stroke="#151210" stroke-width="1"/>

  <!-- Subtle camera recording indicator -->
  <circle cx="680" cy="30" r="4" fill="#cc0000" opacity="0.4" filter="url(#softglow)"/>

  <!-- Timestamp text -->
  <text x="250" y="380" font-family="monospace" font-size="11" fill="#1a2a1a" opacity="0.3">2026/10/27 02:14:37</text>

  <!-- Bottom vignette -->
  <rect x="0" y="300" width="800" height="150" fill="#0a0808" opacity="0.3"/>

  <!-- Side vignettes -->
  <rect x="0" y="0" width="140" height="450" fill="#0a0808" opacity="0.5"/>
  <rect x="660" y="0" width="140" height="450" fill="#0a0808" opacity="0.5"/>
</svg>