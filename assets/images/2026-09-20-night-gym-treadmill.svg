<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#1a1414"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ff4422" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff4422" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle floor -->
  <rect x="0" y="320" width="800" height="130" fill="url(#floor)" opacity="0.6"/>

  <!-- Ceiling lines (gym interior) -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="#151010" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="60" stroke="#151010" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="60" stroke="#151010" stroke-width="0.5"/>
  <line x1="500" y1="0" x2="500" y2="60" stroke="#151010" stroke-width="0.5"/>
  <line x1="700" y1="0" x2="700" y2="60" stroke="#151010" stroke-width="0.5"/>

  <!-- Ambient light from ceiling -->
  <ellipse cx="400" cy="60" rx="300" ry="120" fill="#ff4422" opacity="0.02" filter="url(#blur4)"/>

  <!-- Red glow from treadmill display -->
  <rect x="320" y="100" width="160" height="220" fill="url(#glow)" filter="url(#blur4)"/>

  <!-- TREADMILL - main body -->
  <!-- Base frame -->
  <rect x="340" y="310" width="120" height="8" rx="2" fill="#2a2222"/>
  <rect x="345" y="318" width="110" height="5" rx="1" fill="#1e1a1a"/>

  <!-- Left side rails -->
  <rect x="335" y="180" width="6" height="135" rx="2" fill="#3a3030"/>
  <rect x="459" y="180" width="6" height="135" rx="2" fill="#3a3030"/>

  <!-- Console/panel -->
  <rect x="345" y="155" width="110" height="30" rx="3" fill="#2a2525" stroke="#3a3030" stroke-width="0.5"/>

  <!-- Display screen (glowing red) -->
  <rect x="360" y="162" width="80" height="16" rx="2" fill="#ff2200" opacity="0.7"/>
  <text x="400" y="174" font-family="monospace" font-size="10" fill="#ff6644" text-anchor="middle" opacity="0.9">4.5  02:17:33</text>

  <!-- Display light spill -->
  <rect x="358" y="160" width="84" height="20" fill="#ff2200" opacity="0.1" filter="url(#blur1)"/>

  <!-- Belt (running surface) -->
  <rect x="350" y="290" width="100" height="22" rx="2" fill="#1a1818" stroke="#2a2222" stroke-width="0.5"/>
  <!-- Belt motion lines -->
  <line x1="355" y1="296" x2="445" y2="296" stroke="#2a2525" stroke-width="0.3" stroke-dasharray="8,4"/>
  <line x1="355" y1="302" x2="445" y2="302" stroke="#2a2525" stroke-width="0.3" stroke-dasharray="8,4"/>

  <!-- SOON - single sock on the edge -->
  <ellipse cx="448" cy="288" rx="8" ry="4" fill="#3a3535" opacity="0.8"/>
  <ellipse cx="448" cy="287" rx="5" ry="2.5" fill="#4a4040" opacity="0.6"/>

  <!-- Other treadmill silhouettes (dark, barely visible) -->
  <!-- Left treadmill -->
  <rect x="140" y="290" width="80" height="30" rx="2" fill="#121010" stroke="#1a1818" stroke-width="0.3"/>
  <rect x="135" y="200" width="4" height="95" fill="#1a1818"/>
  <rect x="216" y="200" width="4" height="95" fill="#1a1818"/>
  <rect x="145" y="190" width="70" height="15" rx="2" fill="#151212"/>

  <!-- Right treadmill -->
  <rect x="580" y="290" width="80" height="30" rx="2" fill="#121010" stroke="#1a1818" stroke-width="0.3"/>
  <rect x="575" y="200" width="4" height="95" fill="#1a1818"/>
  <rect x="656" y="200" width="4" height="95" fill="#1a1818"/>
  <rect x="585" y="190" width="70" height="15" rx="2" fill="#151212"/>

  <!-- Dark figures/shadows in background (barely visible) -->
  <ellipse cx="180" cy="250" rx="12" ry="35" fill="#0e0c0c" opacity="0.5"/>
  <ellipse cx="620" cy="240" rx="10" ry="40" fill="#0e0c0c" opacity="0.4"/>

  <!-- Floor reflection of red light -->
  <ellipse cx="400" cy="340" rx="60" ry="15" fill="#ff2200" opacity="0.03"/>

  <!-- Subtle vignette -->
  <rect width="800" height="450" fill="none" stroke="#000000" stroke-width="40" opacity="0.3"/>

  <!-- Clock showing 2:00 -->
  <circle cx="680" cy="80" r="18" fill="none" stroke="#1a1515" stroke-width="1"/>
  <line x1="680" y1="80" x2="680" y2="68" stroke="#2a2222" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="680" y1="80" x2="690" y2="80" stroke="#2a2222" stroke-width="1" stroke-linecap="round"/>
</svg>
