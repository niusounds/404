<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a0a"/>
      <stop offset="100%" stop-color="#060404"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a3a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="80" cy="40" r="1"/><circle cx="200" cy="70" r="0.8"/>
    <circle cx="350" cy="30" r="1.2"/><circle cx="500" cy="55" r="0.7"/>
    <circle cx="650" cy="25" r="1"/><circle cx="720" cy="80" r="0.9"/>
    <circle cx="150" cy="120" r="0.6"/><circle cx="450" cy="100" r="0.8"/>
    <circle cx="580" cy="130" r="0.5"/><circle cx="700" cy="45" r="1.1"/>
  </g>

  <!-- Moon -->
  <circle cx="680" cy="80" r="50" fill="url(#moonGlow)"/>
  <circle cx="690" cy="75" r="18" fill="#1a1a28" opacity="0.6"/>
  <circle cx="690" cy="75" r="18" fill="#12121e"/>

  <!-- Ground -->
  <rect y="320" width="800" height="130" fill="url(#ground)"/>

  <!-- Path -->
  <path d="M0,340 Q200,335 400,340 Q600,345 800,338 L800,370 Q600,375 400,370 Q200,365 0,370 Z" fill="#111010" opacity="0.5"/>

  <!-- Trees left -->
  <g fill="#080606">
    <rect x="30" y="200" width="8" height="120"/>
    <ellipse cx="34" cy="190" rx="35" ry="55"/>
    <ellipse cx="20" cy="210" rx="25" ry="40"/>
    <ellipse cx="48" cy="215" rx="28" ry="38"/>
    <rect x="120" y="220" width="6" height="100"/>
    <ellipse cx="123" cy="210" rx="28" ry="45"/>
    <ellipse cx="110" cy="225" rx="20" ry="32"/>
  </g>

  <!-- Trees right -->
  <g fill="#080606">
    <rect x="680" y="180" width="10" height="140"/>
    <ellipse cx="685" cy="170" rx="40" ry="60"/>
    <ellipse cx="665" cy="195" rx="30" ry="45"/>
    <ellipse cx="705" cy="190" rx="32" ry="48"/>
    <rect x="750" y="230" width="7" height="90"/>
    <ellipse cx="754" cy="220" rx="25" ry="40"/>
  </g>

  <!-- Lamp post -->
  <rect x="370" y="180" width="4" height="140" fill="#0c0a0a"/>
  <rect x="362" y="178" width="20" height="6" fill="#0c0a0a"/>
  <circle cx="372" cy="182" r="8" fill="#2a2010" opacity="0.25" filter="url(#glow)"/>
  <polygon points="372,185 340,320 404,320" fill="#1a1508" opacity="0.06"/>

  <!-- Runner silhouette (foreground, center-left) -->
  <g fill="#060404">
    <circle cx="310" cy="268" r="9"/>
    <path d="M310,277 L308,310 L315,310 L312,277 Z"/>
    <path d="M308,282 L295,295 L297,298 L308,288 Z" opacity="0.9"/>
    <path d="M312,282 L325,290 L323,293 L312,286 Z" opacity="0.9"/>
    <path d="M308,310 L295,340 L290,342 L300,312 Z"/>
    <path d="M315,310 L328,335 L333,337 L320,312 Z"/>
  </g>

  <!-- Shadow figure in distance (center-right, behind runner) -->
  <g fill="#040202" opacity="0.8">
    <circle cx="520" cy="240" r="7"/>
    <path d="M520,247 L516,295 L524,295 L520,247 Z"/>
    <path d="M516,252 L508,290 L510,292 L517,256 Z"/>
    <path d="M524,252 L532,290 L530,292 L523,256 Z"/>
    <path d="M516,295 L510,320 L514,322 L518,297 Z"/>
    <path d="M524,295 L530,320 L526,322 L522,297 Z"/>
  </g>

  <!-- Second shadow figure further back (barely visible) -->
  <g fill="#030101" opacity="0.3">
    <circle cx="620" cy="250" r="5"/>
    <path d="M620,255 L617,290 L623,290 L620,255 Z"/>
    <path d="M617,258 L612,285 L614,287 L618,260 Z"/>
    <path d="M623,258 L628,285 L626,287 L622,260 Z"/>
  </g>

  <!-- Fog / mist at ground level -->
  <g fill="#0a0808" opacity="0.15">
    <ellipse cx="200" cy="330" rx="120" ry="8"/>
    <ellipse cx="500" cy="335" rx="100" ry="6"/>
    <ellipse cx="700" cy="328" rx="80" ry="7"/>
  </g>

  <!-- Subtle red glow from shadow figure's eyes -->
  <circle cx="518" cy="239" r="1" fill="#3a0a0a" opacity="0.4" filter="url(#glow)"/>
  <circle cx="522" cy="239" r="1" fill="#3a0a0a" opacity="0.4" filter="url(#glow)"/>
</svg>