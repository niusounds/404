<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg1.1.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -35 90 100" width="38%" height="420" role="img" aria-label="Answering machine with dual voice-waveform displays">
    <title>留守録に残った嘘 — Answering Machine Doubled</title>
    
    <!-- Dark base -->
    <rect x="-42" y="-32" width="84" height="95" fill="#0a0808" rx="2"/>
    
    <!-- Machine body outline -->
    <rect x="-30" y="-18" width="60" height="55" rx="3.5" stroke="#1a1818" stroke-width="1.2" fill="none"/>
    
    <!-- Display rectangle (slightly glowing) -->
    <rect x="-25" y="-14" width="50" height="16" rx="1.8" fill="#0d0b10" stroke="#0e0a0f"/>
    
    <!-- Left waveform - blue tint -->
    <polyline points="-23,-6 -20,-9 -17,-4 -14,-10 -11,-5 -8,-11 -5,-4 -2,-9 1,-5 4,-10 7,-6 10,-12 13,-5 16,-9 19,-5 22,-10" 
              stroke="#3a5a8f" fill="none" stroke-width="1.1">
        <animate attributeName="points" values="-23,-6 -20,-9 -17,-4 -14,-10 -11,-5 -8,-11 -5,-4 -2,-9 1,-5 4,-10 7,-6 10,-12 13,-5 16,-9 19,-5 22,-10;
                                               -23,-6 -21,-8 -18,-5 -15,-10 -12,-6 -9,-11 -6,-4 -3,-8 0,-5 3,-10 6,-6 9,-12 12,-5 15,-9 18,-5 21,-10;
                                               -23,-6 -20,-9 -17,-4 -14,-10 -11,-5 -8,-11 -5,-4 -2,-9 1,-5 4,-10 7,-6 10,-12 13,-5 16,-9 19,-5 22,-10"
                 dur="2.5s"/>
    </polyline>
    
    <!-- Right waveform - red tint (dual voice) -->
    <polyline points="-23,8 -19,5 -15,11 -12,6 -9,12 -6,7 -3,10 0,5 3,11 6,6 9,12 12,7 15,10 18,5 21,9" 
              stroke="#af3a4a" fill="none" stroke-width="1.1">
        <animate attributeName="points" values="-23,8 -19,5 -15,11 -12,6 -9,12 -6,7 -3,10 0,5 3,11 6,6 9,12 12,7 15,10 18,5 21,9;
                                                -23,8 -18,6 -14,12 -11,7 -8,11 -5,8 -2,10 1,5 4,12 7,6 10,11 13,7 16,10 19,5 22,9;
                                                -23,8 -19,5 -15,11 -12,6 -9,12 -6,7 -3,10 0,5 3,11 6,6 9,12 12,7 15,10 18,5 21,9"
                 dur="2.5s"/>
    </polyline>
    
    <!-- RECORD indicator dot (blinking) -->
    <circle cx="-16" cy="-6" r="1.4" fill="#d43a3a">
        <animate attributeName="fill-opacity" values="1;0.2;1" dur="3s"/>
    </circle>
    
    <!-- Small text label -->
    <text x="-38" y="46" font-family="monospace" fill="#5a5555" font-size="3.2">REC ●</text>
    
    <!-- Time indicator below -->
    <text x="10" y="46" font-family="monospace" fill="#3a3638" font-size="3">:07</text>
</svg>
