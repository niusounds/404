<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#120e0e"/>
    </linearGradient>
    <linearGradient id="fusumaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1614"/>
      <stop offset="50%" stop-color="#221e1a"/>
      <stop offset="100%" stop-color="#1a1614"/>
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3020"/>
      <stop offset="100%" stop-color="#2a2218"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Floor shadow -->
  <rect x="0" y="350" width="800" height="100" fill="#080606" opacity="0.5"/>

  <!-- Fusuma closet - left panel -->
  <rect x="120" y="30" width="220" height="320" fill="url(#fusumaGrad)" rx="2"/>
  <rect x="122" y="32" width="216" height="316" fill="none" stroke="#2a2420" stroke-width="1"/>
  <!-- Left panel vertical lines -->
  <line x1="230" y1="30" x2="230" y2="350" stroke="#1a1614" stroke-width="2"/>
  <!-- Left panel handle -->
  <ellipse cx="210" cy="200" rx="6" ry="18" fill="#1a1614" stroke="#2a2420" stroke-width="1"/>

  <!-- Fusuma closet - right panel (partially open) -->
  <rect x="340" y="30" width="220" height="320" fill="url(#fusumaGrad)" rx="2"/>
  <rect x="342" y="32" width="216" height="316" fill="none" stroke="#2a2420" stroke-width="1"/>
  <!-- Right panel vertical lines -->
  <line x1="450" y1="30" x2="450" y2="350" stroke="#1a1614" stroke-width="2"/>
  <!-- Right panel handle -->
  <ellipse cx="370" cy="200" rx="6" ry="18" fill="#1a1614" stroke="#2a2420" stroke-width="1"/>

  <!-- Dark interior behind the fusuma -->
  <rect x="340" y="30" width="220" height="320" fill="#0a0808"/>

  <!-- Boxes stacked inside -->
  <rect x="355" y="280" width="80" height="70" fill="#1a1510" stroke="#2a2218" stroke-width="1" rx="1"/>
  <rect x="360" y="210" width="70" height="70" fill="#1c1610" stroke="#2a2218" stroke-width="1" rx="1"/>
  <rect x="365" y="140" width="60" height="70" fill="#1e1812" stroke="#2a2218" stroke-width="1" rx="1"/>

  <!-- The envelope - slightly glowing, visible in the dark -->
  <g filter="url(#glow)">
    <!-- Envelope body -->
    <rect x="430" y="150" width="90" height="55" fill="url(#envelopeGrad)" rx="1" stroke="#4a3a28" stroke-width="0.5"/>
    <!-- Envelope flap -->
    <polygon points="430,150 475,175 520,150" fill="#2a2218" stroke="#4a3a28" stroke-width="0.5"/>
    <!-- Faint glow from envelope -->
    <rect x="425" y="145" width="100" height="65" fill="none" stroke="#5a4a30" stroke-width="0.3" opacity="0.4" rx="2" filter="url(#softGlow)"/>
  </g>

  <!-- Dust particles - subtle -->
  <circle cx="380" cy="80" r="1" fill="#3a3020" opacity="0.3"/>
  <circle cx="420" cy="100" r="0.8" fill="#3a3020" opacity="0.2"/>
  <circle cx="500" cy="60" r="1.2" fill="#3a3020" opacity="0.25"/>
  <circle cx="460" cy="120" r="0.7" fill="#3a3020" opacity="0.3"/>
  <circle cx="350" cy="110" r="0.9" fill="#3a3020" opacity="0.2"/>
  <circle cx="530" cy="90" r="1" fill="#3a3020" opacity="0.15"/>

  <!-- Door frame -->
  <rect x="110" y="20" width="480" height="340" fill="none" stroke="#1e1a16" stroke-width="4" rx="3"/>
  <rect x="108" y="18" width="484" height="6" fill="#1a1614"/>
  <rect x="108" y="356" width="484" height="6" fill="#1a1614"/>

  <!-- Subtle light from above - casting on floor -->
  <ellipse cx="450" cy="380" rx="120" ry="20" fill="#1a1410" opacity="0.15"/>

  <!-- Shadow of a figure in the distance - very subtle -->
  <g opacity="0.06">
    <ellipse cx="460" cy="200" rx="15" ry="25" fill="#2a2020"/>
    <ellipse cx="460" cy="165" rx="12" ry="15" fill="#2a2020"/>
  </g>
</svg>
