<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="light1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a1510" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e0ddd5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trackFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#12100e"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Platform floor -->
  <rect x="0" y="280" width="800" height="170" fill="#0e0c0a"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#1a1612" stroke-width="1"/>

  <!-- Platform edge warning line -->
  <line x1="0" y1="278" x2="800" y2="278" stroke="#1e1a14" stroke-width="2"/>

  <!-- Distant train tracks -->
  <line x1="0" y1="310" x2="800" y2="310" stroke="#141210" stroke-width="1"/>
  <line x1="0" y1="325" x2="800" y2="325" stroke="#141210" stroke-width="1"/>

  <!-- Track ties -->
  <g stroke="#11100e" stroke-width="2">
    <line x1="100" y1="308" x2="100" y2="327"/>
    <line x1="180" y1="308" x2="180" y2="327"/>
    <line x1="260" y1="308" x2="260" y2="327"/>
    <line x1="340" y1="308" x2="340" y2="327"/>
    <line x1="420" y1="308" x2="420" y2="327"/>
    <line x1="500" y1="308" x2="500" y2="327"/>
    <line x1="580" y1="308" x2="580" y2="327"/>
    <line x1="660" y1="308" x2="660" y2="327"/>
    <line x1="740" y1="308" x2="740" y2="327"/>
  </g>

  <!-- Ceiling lights - distant -->
  <ellipse cx="150" cy="60" rx="80" ry="30" fill="url(#light1)" opacity="0.3"/>
  <ellipse cx="550" cy="60" rx="80" ry="30" fill="url(#light1)" opacity="0.3"/>

  <!-- Light fixtures on ceiling -->
  <rect x="135" y="55" width="30" height="6" rx="3" fill="#1a1814" filter="url(#blur1)"/>
  <rect x="535" y="55" width="30" height="6" rx="3" fill="#1a1814" filter="url(#blur1)"/>

  <!-- Light glow from fixtures -->
  <ellipse cx="150" cy="70" rx="40" ry="5" fill="#2a2518" opacity="0.15" filter="url(#blur2)"/>
  <ellipse cx="550" cy="70" rx="40" ry="5" fill="#2a2518" opacity="0.15" filter="url(#blur2)"/>

  <!-- Pillars -->
  <rect x="200" y="40" width="8" height="240" fill="#0c0a08"/>
  <rect x="600" y="40" width="8" height="240" fill="#0c0a08"/>

  <!-- Far distance pillars -->
  <rect x="350" y="120" width="4" height="160" fill="#0b0907" opacity="0.7"/>
  <rect x="450" y="120" width="4" height="160" fill="#0b0907" opacity="0.7"/>

  <!-- The silhouette figure - center of platform -->
  <g transform="translate(380, 140)">
    <!-- Head -->
    <ellipse cx="20" cy="0" rx="12" ry="14" fill="#080606"/>
    
    <!-- White eyes - key horror element -->
    <ellipse cx="16" cy="-2" rx="3" ry="2.5" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="24" cy="-2" rx="3" ry="2.5" fill="#ffffff" opacity="0.85"/>
    <!-- Eye glow -->
    <ellipse cx="16" cy="-2" rx="8" ry="6" fill="url(#eyeGlow)" opacity="0.3"/>
    <ellipse cx="24" cy="-2" rx="8" ry="6" fill="url(#eyeGlow)" opacity="0.3"/>

    <!-- Neck -->
    <rect x="16" y="12" width="8" height="8" fill="#080606"/>

    <!-- Suit jacket - shoulders -->
    <path d="M 4 20 L 36 20 L 40 60 L 0 60 Z" fill="#060404"/>

    <!-- Suit lapels -->
    <path d="M 14 20 L 20 40 L 26 20" fill="none" stroke="#0a0808" stroke-width="0.5"/>

    <!-- Tie hint -->
    <line x1="20" y1="22" x2="20" y2="45" stroke="#0a0808" stroke-width="1"/>

    <!-- Body/torso -->
    <path d="M 2 60 L 38 60 L 42 130 L -2 130 Z" fill="#060404"/>

    <!-- Briefcase -->
    <rect x="-25" y="80" width="20" height="30" rx="2" fill="#080606" stroke="#0c0a08" stroke-width="0.5"/>
    <line x1="-15" y1="80" x2="-15" y2="75" stroke="#080606" stroke-width="1.5"/>
  </g>

  <!-- Fog/mist at platform level -->
  <rect x="0" y="250" width="800" height="30" fill="#0a0808" opacity="0.4"/>
  <rect x="0" y="260" width="800" height="20" fill="#0a0808" opacity="0.6"/>

  <!-- Shadows under figure -->
  <ellipse cx="400" cy="280" rx="25" ry="4" fill="#060404" opacity="0.5"/>

  <!-- Distant darkness/vignette -->
  <rect x="0" y="0" width="800" height="450" fill="url(#trackFade)" opacity="0.3"/>

  <!-- Subtle vertical lines for depth -->
  <g stroke="#0c0a08" stroke-width="0.3" opacity="0.5">
    <line x1="0" y1="0" x2="0" y2="450"/>
    <line x1="800" y1="0" x2="800" y2="450"/>
  </g>

  <!-- Atmospheric particles - faint -->
  <g fill="#1a1814" opacity="0.15">
    <circle cx="100" cy="150" r="1"/>
    <circle cx="250" cy="200" r="0.8"/>
    <circle cx="450" cy="180" r="1.2"/>
    <circle cx="650" cy="220" r="0.7"/>
    <circle cx="700" cy="160" r="1"/>
    <circle cx="300" cy="100" r="0.5"/>
    <circle cx="500" cy="130" r="0.8"/>
    <circle cx="150" cy="250" r="0.6"/>
    <circle cx="600" cy="270" r="0.9"/>
  </g>
</svg>
