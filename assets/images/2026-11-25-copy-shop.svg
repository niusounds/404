<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle ambient glow from printer LED -->
  <ellipse cx="320" cy="280" rx="180" ry="120" fill="#0d1a2a" opacity="0.4"/>

  <!-- Floor line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1a1515" stroke-width="1"/>

  <!-- Large copier body (left side) -->
  <rect x="120" y="140" width="200" height="240" rx="8" fill="#1a1818" stroke="#2a2525" stroke-width="1"/>
  <!-- Copier top section -->
  <rect x="130" y="150" width="180" height="60" rx="4" fill="#151313" stroke="#252020" stroke-width="1"/>
  <!-- Scanner glass (glowing faintly) -->
  <rect x="140" y="158" width="160" height="44" rx="2" fill="#0a1520" opacity="0.6"/>
  <rect x="140" y="158" width="160" height="44" rx="2" fill="none" stroke="#1a3050" stroke-width="0.5" opacity="0.5"/>

  <!-- Control panel with LED -->
  <rect x="140" y="220" width="120" height="40" rx="3" fill="#0d1010" stroke="#1a2a1a" stroke-width="0.5"/>
  <!-- Green LED indicator -->
  <circle cx="155" cy="240" r="4" fill="#2a5a2a" opacity="0.8"/>
  <circle cx="155" cy="240" r="8" fill="#2a5a2a" opacity="0.15"/>
  <!-- Small display lines -->
  <line x1="168" y1="235" x2="200" y2="235" stroke="#2a5a2a" stroke-width="0.8" opacity="0.5"/>
  <line x1="168" y1="242" x2="185" y2="242" stroke="#2a5a2a" stroke-width="0.8" opacity="0.3"/>
  <!-- Buttons -->
  <circle cx="215" cy="235" r="5" fill="#1a2a1a" stroke="#2a4a2a" stroke-width="0.5"/>
  <circle cx="228" cy="235" r="5" fill="#1a2a1a" stroke="#2a4a2a" stroke-width="0.5"/>
  <circle cx="215" cy="247" r="5" fill="#1a2a1a" stroke="#2a4a2a" stroke-width="0.5"/>
  <circle cx="228" cy="247" r="5" fill="#1a2a1a" stroke="#2a4a2a" stroke-width="0.5"/>

  <!-- Paper output tray (bottom of copier) -->
  <rect x="100" y="360" width="240" height="20" rx="2" fill="#1a1818" stroke="#2a2525" stroke-width="0.5"/>

  <!-- Paper stack coming out -->
  <rect x="110" y="355" width="220" height="8" fill="#e8e4dc" opacity="0.9"/>
  <rect x="110" y="350" width="220" height="8" fill="#f0ece4" opacity="0.85"/>
  <rect x="110" y="345" width="220" height="8" fill="#f5f0e8" opacity="0.8"/>
  <rect x="110" y="340" width="220" height="8" fill="#f8f4ec" opacity="0.75"/>
  <rect x="110" y="335" width="220" height="8" fill="#faf6f0" opacity="0.7"/>

  <!-- Top paper with staircase pattern -->
  <rect x="110" y="330" width="220" height="8" fill="#fdf8f0" opacity="0.65"/>
  <!-- Staircase lines on the paper -->
  <line x1="130" y1="330" x2="130" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="130" y1="338" x2="150" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="150" y1="330" x2="150" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="150" y1="338" x2="170" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="170" y1="330" x2="170" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="170" y1="338" x2="190" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="190" y1="330" x2="190" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="190" y1="338" x2="210" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="210" y1="330" x2="210" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="210" y1="338" x2="230" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="230" y1="330" x2="230" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="230" y1="338" x2="250" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="250" y1="330" x2="250" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="250" y1="338" x2="270" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="270" y1="330" x2="270" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="270" y1="338" x2="290" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="290" y1="330" x2="290" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="290" y1="338" x2="310" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="310" y1="330" x2="310" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>
  <line x1="310" y1="338" x2="330" y2="338" stroke="#3a3535" stroke-width="0.6" opacity="0.7"/>

  <!-- Second paper with staircase -->
  <line x1="140" y1="335" x2="140" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="140" y1="343" x2="158" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="158" y1="335" x2="158" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="158" y1="343" x2="176" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="176" y1="335" x2="176" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="176" y1="343" x2="194" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="194" y1="335" x2="194" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="194" y1="343" x2="212" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="212" y1="335" x2="212" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="212" y1="343" x2="230" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="230" y1="335" x2="230" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="230" y1="343" x2="248" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="248" y1="335" x2="248" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="248" y1="343" x2="266" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="266" y1="335" x2="266" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="266" y1="343" x2="284" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="284" y1="335" x2="284" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="284" y1="343" x2="302" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="302" y1="335" x2="302" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>
  <line x1="302" y1="343" x2="320" y2="343" stroke="#3a3535" stroke-width="0.5" opacity="0.5"/>

  <!-- Dark corridor / room behind the copier -->
  <rect x="380" y="80" width="400" height="300" fill="#080606" opacity="0.8"/>

  <!-- Distant faint light (hallway end) -->
  <rect x="680" y="160" width="60" height="200" fill="#0d0d12" opacity="0.5"/>
  <rect x="690" y="170" width="40" height="180" fill="#151518" opacity="0.3"/>
  <!-- Tiny light at the end -->
  <ellipse cx="710" cy="175" rx="15" ry="5" fill="#1a1a22" opacity="0.4"/>
  <ellipse cx="710" cy="175" rx="30" ry="15" fill="#1a1a22" opacity="0.1"/>

  <!-- Floor reflection from printer LED -->
  <ellipse cx="320" cy="395" rx="100" ry="8" fill="#1a3a2a" opacity="0.08"/>

  <!-- Small shadow under copier -->
  <ellipse cx="220" cy="385" rx="110" ry="5" fill="#050404" opacity="0.6"/>

  <!-- Subtle paper glow near LED -->
  <ellipse cx="220" cy="340" rx="60" ry="30" fill="#2a3a2a" opacity="0.04"/>

  <!-- Dark shelves in background (barely visible) -->
  <rect x="420" y="100" width="100" height="12" fill="#0d0b0b" stroke="#151212" stroke-width="0.3"/>
  <rect x="420" y="140" width="100" height="12" fill="#0d0b0b" stroke="#151212" stroke-width="0.3"/>
  <rect x="420" y="180" width="100" height="12" fill="#0d0b0b" stroke="#151212" stroke-width="0.3"/>
  <rect x="420" y="220" width="100" height="12" fill="#0d0b0b" stroke="#151212" stroke-width="0.3"/>
  <!-- Faint paper stacks on shelves -->
  <rect x="430" y="85" width="15" height="15" fill="#1a1815" opacity="0.3"/>
  <rect x="450" y="80" width="20" height="20" fill="#1a1815" opacity="0.25"/>
  <rect x="500" y="125" width="18" height="15" fill="#1a1815" opacity="0.2"/>
  <rect x="520" y="165" width="12" height="15" fill="#1a1815" opacity="0.25"/>
  <rect x="530" y="205" width="15" height="15" fill="#1a1815" opacity="0.2"/>

  <!-- Very faint figure silhouette in the hallway (barely perceptible) -->
  <ellipse cx="710" cy="155" rx="6" ry="8" fill="#0a0a10" opacity="0.25"/>
  <rect x="704" y="163" width="12" height="25" rx="2" fill="#0a0a10" opacity="0.2"/>

  <!-- Vignette effect - darker edges -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.3"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
