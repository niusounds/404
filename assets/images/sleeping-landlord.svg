<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 179">
  <defs>
    <filter id="blur1"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <!-- dark background -->
  <rect width="600" height="179" fill="#0a0808"/>
  
  <!-- grid lines of building floor plan -->
  <g stroke="#2a2030" stroke-width="0.5" opacity="0.7">
    <line x1="40" y1="60" x2="300" y2="60"/>
    <line x1="40" y1="90" x2="300" y2="90"/>
    <line x1="40" y1="120" x2="300" y2="120"/>
    <line x1="80" y1="75" x2="80" y2="160"/>
    <line x1="200" y1="59" x2="200" y2="161"/>
    <line x1="300" y1="60" x2="300" y2="60"/>
  </g>

  <!-- floor plan rooms: bedroom-like squares -->
  <rect x="45" y="65" width="110" height="85" fill="#111118" stroke="#3a2838" stroke-width="1.5"/>
  <!-- bed shape inside -->
  <rect x="70" y="95" width="30" height="45" rx="2" fill="#0e0c16" stroke="#2a2030" stroke-width="0.8"/>
  
  <!-- another room -->
  <rect x="210" y="65" width="70" height="55" fill="#111118" stroke="#3a2838" stroke-width="1.5"/>
  <circle cx="245" cy="92" r="8" fill="#0e0c16" stroke="#3a2038" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- corridor -->
  <rect x="45" y="128" width="235" height="25" fill="#111118" stroke="#3a2838" stroke-width="1.5"/>
  
  <!-- door markers -->
  <circle cx="70" cy="60" r="4" fill="#ff33660a" stroke="#8b2255" stroke-width="1"/>
  <text x="62" y="55" font-family="monospace" font-size="9" fill="#ff6b7a" opacity="0.9">D</text>  
  <!-- this D blinks -->
  <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/>
  
  <!-- text: room number overlay (wrong) -->
  <text x="148" y="86" font-family="monospace" font-size="11" fill="#6b4a70" opacity="0.8">003</text>

  <!-- small ghosty figure silhouette in corridor, animated pulse -->
  <g transform="translate(225, 129)" filter="url(#blur1)">
    <ellipse cx="0" cy="-6" rx="7" ry="12" fill="#a35bb0" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="0" cy="-20" r="5" fill="#a35bb0" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title caption -->
  <text x="310" y="26" font-family="sans-serif" font-size="22" fill="#ffffff">眠る大家</text>
  <text x="310" y="48" font-family="sans-serif" font-size="15" fill="#8b8b9a">眠る部屋、借り手の話</text>

  <!-- faint dotted line showing "wrong room number path" -->
  <g stroke="#ff6b7a33" stroke-dasharray="4,6" stroke-width="1" opacity="0.6">
    <line x1="45" y1="153" x2="280" y2="90"/>
    <circle cx="280" cy="90" r="3" fill="#ff6b7a" opacity="0.5">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>