<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1515" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle radial glow from center -->
  <circle cx="400" cy="225" r="200" fill="url(#glow)" opacity="0.5"/>
  
  <!-- Intercom monitor glow - center of composition -->
  <rect x="310" y="120" width="180" height="130" rx="8" ry="8" fill="#111010" stroke="#1a1818" stroke-width="1"/>
  <rect x="318" y="128" width="164" height="114" rx="4" ry="4" fill="#0d0c0c"/>
  
  <!-- Monitor screen glow -->
  <rect x="320" y="130" width="160" height="110" rx="3" ry="3" fill="#0a1a0a" opacity="0.6"/>
  
  <!-- Camera view on monitor - night vision green tint -->
  <rect x="322" y="132" width="156" height="106" rx="2" ry="2" fill="#060f06" opacity="0.8"/>
  
  <!-- Door frame in monitor view -->
  <rect x="360" y="140" width="80" height="90" fill="#080808" stroke="#0a1a0a" stroke-width="0.5"/>
  
  <!-- Box on floor in monitor view -->
  <rect x="385" y="210" width="30" height="18" fill="#1a1815" stroke="#222018" stroke-width="0.5"/>
  
  <!-- Intercom indicator light -->
  <circle cx="400" cy="115" r="3" fill="#cc0000" opacity="0.8"/>
  <circle cx="400" cy="115" r="6" fill="#cc0000" opacity="0.3" filter="url(#blur)"/>
  
  <!-- Monitor reflection on wall -->
  <rect x="310" y="120" width="180" height="130" rx="8" ry="8" fill="none" stroke="#0a1a0a" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Shadow figure at top of frame - barely visible -->
  <!-- Ceiling at top -->
  <rect x="0" y="0" width="800" height="60" fill="#080606"/>
  <line x1="0" y1="60" x2="800" y2="60" stroke="#0f0c0c" stroke-width="0.5"/>
  
  <!-- Dripping water droplets from ceiling -->
  <ellipse cx="420" cy="62" rx="1.5" ry="1" fill="#1a1a2a" opacity="0.4"/>
  <ellipse cx="420" cy="80" rx="1" ry="0.8" fill="#1a1a2a" opacity="0.3"/>
  <ellipse cx="420" cy="100" rx="0.8" ry="0.6" fill="#1a1a2a" opacity="0.2"/>
  
  <!-- Water drip trail -->
  <line x1="420" y1="62" x2="420" y2="350" stroke="#1a1a2a" stroke-width="0.3" opacity="0.15"/>
  
  <!-- Faint silhouette shadow at top right - the figure -->
  <ellipse cx="680" cy="30" rx="25" ry="15" fill="#0d0a0a" opacity="0.6"/>
  <ellipse cx="680" cy="45" rx="18" ry="20" fill="#0d0a0a" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="680" cy="22" rx="12" ry="14" fill="#0d0a0a" opacity="0.7"/>
  
  <!-- Arms reaching down -->
  <path d="M665 40 Q655 60 650 80" stroke="#0d0a0a" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M695 40 Q705 60 710 80" stroke="#0d0a0a" stroke-width="4" fill="none" opacity="0.5"/>
  
  <!-- Eyes barely visible in the shadow -->
  <circle cx="675" cy="20" r="1.5" fill="#1a0a0a" opacity="0.8"/>
  <circle cx="687" cy="20" r="1.5" fill="#1a0a0a" opacity="0.8"/>
  
  <!-- Floor -->
  <rect x="0" y="380" width="800" height="70" fill="#080606"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#0f0c0c" stroke-width="0.5"/>
  
  <!-- Water drop on floor -->
  <ellipse cx="420" cy="385" rx="8" ry="2" fill="#1a1a2a" opacity="0.25"/>
  <ellipse cx="420" cy="385" rx="4" ry="1" fill="#2a2a3a" opacity="0.15"/>
  
  <!-- More water drops scattered -->
  <ellipse cx="400" cy="390" rx="5" ry="1.5" fill="#1a1a2a" opacity="0.15"/>
  <ellipse cx="450" cy="392" rx="6" ry="1.5" fill="#1a1a2a" opacity="0.12"/>
  
  <!-- Subtle vignette effect -->
  <rect x="0" y="0" width="800" height="450" fill="url(#glow)" opacity="0.3"/>
  
  <!-- Ambient red glow from intercom light -->
  <circle cx="400" cy="115" r="30" fill="#cc0000" opacity="0.03" filter="url(#blur2)"/>
  
  <!-- Very subtle grain texture overlay -->
  <rect x="0" y="0" width="800" height="450" fill="none" opacity="0.02" filter="url(#blur)"/>
</svg>
