<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Mirror wall left -->
  <rect x="0" y="0" width="60" height="450" fill="#1a1515" opacity="0.8"/>
  <rect x="60" y="0" width="2" height="450" fill="#2a2525" opacity="0.5"/>
  
  <!-- Mirror wall right -->
  <rect x="738" y="0" width="62" height="450" fill="#1a1515" opacity="0.8"/>
  <rect x="738" y="0" width="2" height="450" fill="#2a2525" opacity="0.5"/>
  
  <!-- Ceiling mirror -->
  <rect x="60" y="0" width="678" height="40" fill="#151212" opacity="0.6"/>
  <line x1="60" y1="40" x2="738" y2="40" stroke="#2a2525" stroke-width="1" opacity="0.4"/>
  
  <!-- Escalator steps - perspective view going up -->
  <!-- Main escalator body -->
  <polygon points="200,450 600,450 500,200 300,200" fill="#121010" stroke="#1e1a1a" stroke-width="1"/>
  
  <!-- Escalator steps (horizontal lines) -->
  <line x1="210" y1="410" x2="590" y2="410" stroke="#1e1a1a" stroke-width="0.5" opacity="0.6"/>
  <line x1="220" y1="370" x2="580" y2="370" stroke="#1e1a1a" stroke-width="0.5" opacity="0.6"/>
  <line x1="230" y1="330" x2="570" y2="330" stroke="#1e1a1a" stroke-width="0.5" opacity="0.6"/>
  <line x1="240" y1="290" x2="560" y2="290" stroke="#1e1a1a" stroke-width="0.5" opacity="0.6"/>
  <line x1="250" y1="250" x2="550" y2="250" stroke="#1e1a1a" stroke-width="0.5" opacity="0.6"/>
  <line x1="260" y1="210" x2="540" y2="210" stroke="#1e1a1a" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Handrails -->
  <line x1="195" y1="450" x2="295" y2="200" stroke="#3a3535" stroke-width="4" opacity="0.7"/>
  <line x1="605" y1="450" x2="505" y2="200" stroke="#3a3535" stroke-width="4" opacity="0.7"/>
  
  <!-- Person silhouette on escalator (foreground) -->
  <g transform="translate(380, 340)">
    <!-- Head -->
    <circle cx="0" cy="-55" r="14" fill="#0a0808" stroke="#1a1515" stroke-width="0.5"/>
    <!-- Body -->
    <line x1="0" y1="-41" x2="0" y2="5" stroke="#0a0808" stroke-width="8" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="0" y1="-30" x2="-15" y2="5" stroke="#0a0808" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-30" x2="15" y2="5" stroke="#0a0808" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="0" y1="5" x2="-10" y2="40" stroke="#0a0808" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="10" y2="40" stroke="#0a0808" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Reflection in left mirror - distorted (smiling) -->
  <g transform="translate(120, 340) scale(-1, 1)" opacity="0.3">
    <g transform="translate(380, 340)">
      <circle cx="0" cy="-55" r="14" fill="#0a0808" stroke="#1a1515" stroke-width="0.5"/>
      <line x1="0" y1="-41" x2="0" y2="5" stroke="#0a0808" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="-15" y2="5" stroke="#0a0808" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="15" y2="5" stroke="#0a0808" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="5" x2="-10" y2="40" stroke="#0a0808" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="5" x2="10" y2="40" stroke="#0a0808" stroke-width="6" stroke-linecap="round"/>
      <!-- Distorted smile -->
      <path d="M-6,-58 Q0,-50 6,-58" stroke="#2a2020" stroke-width="1.5" fill="none"/>
    </g>
  </g>
  
  <!-- Reflection in right mirror - distorted (looking down) -->
  <g transform="translate(680, 340)" opacity="0.25">
    <g transform="translate(380, 340)">
      <circle cx="0" cy="-55" r="14" fill="#0a0808" stroke="#1a1515" stroke-width="0.5"/>
      <line x1="0" y1="-41" x2="0" y2="5" stroke="#0a0808" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="-15" y2="5" stroke="#0a0808" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="15" y2="5" stroke="#0a0808" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="5" x2="-10" y2="40" stroke="#0a0808" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="5" x2="10" y2="40" stroke="#0a0808" stroke-width="6" stroke-linecap="round"/>
      <!-- Looking down head tilt -->
      <ellipse cx="0" cy="-50" rx="10" ry="12" fill="#0a0808" stroke="#1a1515" stroke-width="0.5"/>
    </g>
  </g>
  
  <!-- Distant figure at top of escalator (the "other me") -->
  <g transform="translate(400, 210)" opacity="0.15">
    <circle cx="0" cy="-20" r="8" fill="#0a0808" stroke="#1a1515" stroke-width="0.5"/>
    <line x1="0" y1="-12" x2="0" y2="5" stroke="#0a0808" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="-8" y2="5" stroke="#0a0808" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="8" y2="5" stroke="#0a0808" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="-5" y2="20" stroke="#0a0808" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="5" y2="20" stroke="#0a0808" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Faint infinite reflection lines (mirror depth effect) -->
  <line x1="70" y1="0" x2="70" y2="450" stroke="#1a1515" stroke-width="0.3" opacity="0.2"/>
  <line x1="730" y1="0" x2="730" y2="450" stroke="#1a1515" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Subtle vignette -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.4"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
