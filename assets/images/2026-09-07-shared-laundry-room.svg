<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle wall texture - faint horizontal lines -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="370" width="800" height="80" fill="#0d0a0a"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#1a1515" stroke-width="1"/>

  <!-- Floor tiles -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="100" y1="370" x2="100" y2="450"/>
    <line x1="200" y1="370" x2="200" y2="450"/>
    <line x1="300" y1="370" x2="300" y2="450"/>
    <line x1="400" y1="370" x2="400" y2="450"/>
    <line x1="500" y1="370" x2="500" y2="450"/>
    <line x1="600" y1="370" x2="600" y2="450"/>
    <line x1="700" y1="370" x2="700" y2="450"/>
  </g>

  <!-- Ceiling light glow (dim, sickly yellow) -->
  <ellipse cx="400" cy="0" rx="250" ry="120" fill="#1a1508" opacity="0.15"/>
  <ellipse cx="400" cy="0" rx="150" ry="80" fill="#2a2010" opacity="0.1"/>

  <!-- Light fixture -->
  <rect x="380" y="0" width="40" height="8" fill="#1a1a1a"/>
  <rect x="390" y="8" width="20" height="15" fill="#111111" rx="2"/>
  <ellipse cx="400" cy="25" rx="30" ry="5" fill="#2a2510" opacity="0.4"/>

  <!-- Light cone -->
  <polygon points="380,23 420,23 550,370 250,370" fill="#1a1808" opacity="0.06"/>

  <!-- Four washing machines in a row -->
  <!-- Machine 1 (leftmost) -->
  <rect x="40" y="100" width="140" height="270" fill="#151313" stroke="#1e1a1a" stroke-width="1" rx="3"/>
  <rect x="55" y="115" width="110" height="30" fill="#1a1818" rx="2"/>
  <!-- Machine 1 drum (off) -->
  <ellipse cx="110" cy="260" rx="45" ry="55" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1.5"/>
  <ellipse cx="110" cy="260" rx="35" ry="42" fill="#080808"/>

  <!-- Machine 2 -->
  <rect x="190" y="100" width="140" height="270" fill="#151313" stroke="#1e1a1a" stroke-width="1" rx="3"/>
  <rect x="205" y="115" width="110" height="30" fill="#1a1818" rx="2"/>
  <ellipse cx="260" cy="260" rx="45" ry="55" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1.5"/>
  <ellipse cx="260" cy="260" rx="35" ry="42" fill="#080808"/>

  <!-- Machine 3 -->
  <rect x="340" y="100" width="140" height="270" fill="#151313" stroke="#1e1a1a" stroke-width="1" rx="3"/>
  <rect x="355" y="115" width="110" height="30" fill="#1a1818" rx="2"/>
  <ellipse cx="410" cy="260" rx="45" ry="55" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1.5"/>
  <ellipse cx="410" cy="260" rx="35" ry="42" fill="#080808"/>

  <!-- Machine 4 (center focus - the spinning one) -->
  <rect x="490" y="100" width="140" height="270" fill="#1a1717" stroke="#2a1a1a" stroke-width="1" rx="3"/>
  <rect x="505" y="115" width="110" height="30" fill="#1e1a1a" rx="2"/>
  <!-- Control panel indicator light (faint red) -->
  <circle cx="550" cy="128" r="3" fill="#3a1a1a" opacity="0.6"/>
  <circle cx="550" cy="128" r="1.5" fill="#5a2a2a" opacity="0.8"/>

  <!-- Machine 4 drum (spinning - with water glow) -->
  <ellipse cx="560" cy="260" rx="45" ry="55" fill="#0d0d0d" stroke="#2a1a1a" stroke-width="1.5"/>
  <ellipse cx="560" cy="260" rx="35" ry="42" fill="#060608"/>

  <!-- Water inside drum - faint blue glow -->
  <ellipse cx="560" cy="275" rx="28" ry="30" fill="#0a0a15" opacity="0.3"/>

  <!-- Spinning motion lines inside drum -->
  <g opacity="0.15" stroke="#2a2a3a" stroke-width="0.5" fill="none">
    <ellipse cx="560" cy="260" rx="25" ry="35" stroke-dasharray="3,6"/>
    <ellipse cx="560" cy="260" rx="20" ry="28" stroke-dasharray="2,8"/>
    <ellipse cx="560" cy="260" rx="30" ry="38" stroke-dasharray="4,5"/>
  </g>

  <!-- The wet white sock inside the drum -->
  <g opacity="0.7">
    <path d="M545,250 Q548,245 552,248 Q555,250 553,255 Q550,260 548,258 Q544,255 545,250Z" fill="#2a2a30" stroke="#3a3a40" stroke-width="0.5"/>
    <path d="M555,265 Q558,260 563,263 Q566,266 564,272 Q560,276 557,273 Q553,270 555,265Z" fill="#252530" stroke="#353540" stroke-width="0.5"/>
    <path d="M548,275 Q550,272 554,274 Q557,276 555,280 Q552,283 550,281 Q547,279 548,275Z" fill="#222228" stroke="#303038" stroke-width="0.5"/>
  </g>

  <!-- Drum glass reflection -->
  <path d="M535,230 Q540,225 550,228 Q545,235 535,230Z" fill="#ffffff" opacity="0.03"/>

  <!-- Machine 4 water drip from drain -->
  <g opacity="0.2">
    <line x1="560" y1="315" x2="560" y2="325" stroke="#1a1a25" stroke-width="1"/>
    <ellipse cx="560" cy="327" rx="2" ry="1" fill="#1a1a25"/>
  </g>

  <!-- Drain on floor -->
  <rect x="545" y="365" width="30" height="5" fill="#111111" rx="1"/>
  <line x1="550" y1="365" x2="550" y2="370" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="555" y1="365" x2="555" y2="370" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="560" y1="365" x2="560" y2="370" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="565" y1="365" x2="565" y2="370" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="570" y1="365" x2="570" y2="370" stroke="#1a1a1a" stroke-width="0.5"/>

  <!-- Ambient fog / mist at floor level near machine 4 -->
  <ellipse cx="560" cy="370" rx="60" ry="8" fill="#151520" opacity="0.15"/>
  <ellipse cx="540" cy="372" rx="40" ry="5" fill="#121218" opacity="0.1"/>

  <!-- Subtle shadows under machines -->
  <rect x="42" y="370" width="136" height="3" fill="#050505" opacity="0.5" rx="1"/>
  <rect x="192" y="370" width="136" height="3" fill="#050505" opacity="0.5" rx="1"/>
  <rect x="342" y="370" width="136" height="3" fill="#050505" opacity="0.5" rx="1"/>
  <rect x="492" y="370" width="136" height="3" fill="#050505" opacity="0.6" rx="1"/>

  <!-- Distant door on the left wall -->
  <rect x="5" y="120" width="30" height="250" fill="#0e0c0c" stroke="#1a1818" stroke-width="0.5"/>
  <line x1="20" y1="130" x2="20" y2="365" stroke="#151515" stroke-width="0.5"/>

  <!-- Vignette effect -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.5"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
</svg>
