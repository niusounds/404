<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background: dark hallway -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle wall gradient -->
  <rect x="0" y="0" width="800" height="300" fill="#110e0e"/>
  
  <!-- Floor -->
  <rect x="0" y="300" width="800" height="150" fill="#0d0a0a"/>
  
  <!-- Door frame -->
  <rect x="280" y="20" width="240" height="380" fill="#1a1515" stroke="#221c1c" stroke-width="1"/>
  
  <!-- Door -->
  <rect x="290" y="30" width="220" height="370" fill="#1e1919"/>
  
  <!-- Door handle -->
  <circle cx="485" cy="220" r="8" fill="#3a3535" stroke="#4a4545" stroke-width="1"/>
  <circle cx="485" cy="220" r="3" fill="#5a5555"/>
  
  <!-- Light gap at bottom of door -->
  <rect x="290" y="395" width="220" height="5" fill="#2a2520" opacity="0.6"/>
  
  <!-- Light beam from gap onto floor -->
  <polygon points="290,400 510,400 560,450 240,450" fill="#2a2520" opacity="0.15"/>
  
  <!-- Peephole (knocker hole) -->
  <circle cx="400" cy="180" r="12" fill="#0a0808" stroke="#2a2525" stroke-width="1.5"/>
  
  <!-- Eye in peephole - dark background inside peephole -->
  <ellipse cx="400" cy="180" rx="9" ry="7" fill="#0a0808"/>
  
  <!-- Eye white -->
  <ellipse cx="400" cy="180" rx="7" ry="5" fill="#1a1510"/>
  
  <!-- Iris -->
  <circle cx="400" cy="180" r="3.5" fill="#1a1508"/>
  
  <!-- Pupil -->
  <circle cx="400" cy="180" r="2" fill="#0a0808"/>
  
  <!-- Eye reflection -->
  <circle cx="402" cy="178" r="0.8" fill="#2a2520" opacity="0.5"/>
  
  <!-- Faint eye outline in peephole -->
  <ellipse cx="400" cy="180" rx="10" ry="8" fill="none" stroke="#1a1510" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Door number plate -->
  <rect x="385" y="250" width="30" height="18" fill="#2a2520" rx="1"/>
  <text x="400" y="263" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a4540">204</text>
  
  <!-- Subtle shadows -->
  <rect x="290" y="30" width="3" height="370" fill="#0a0808" opacity="0.3"/>
  <rect x="507" y="30" width="3" height="370" fill="#0a0808" opacity="0.3"/>
  
  <!-- Warning text at bottom -->
  <text x="400" y="430" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1a1515">ビジネスホテルのドア</text>
</svg>
