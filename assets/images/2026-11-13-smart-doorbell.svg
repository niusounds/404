<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Hallway perspective - subtle lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1a1414" stroke-width="1"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#1a1414" stroke-width="1"/>
  
  <!-- Floor tiles hint -->
  <line x1="200" y1="100" x2="150" y2="350" stroke="#12100e" stroke-width="0.5"/>
  <line x1="400" y1="100" x2="400" y2="350" stroke="#12100e" stroke-width="0.5"/>
  <line x1="600" y1="100" x2="650" y2="350" stroke="#12100e" stroke-width="0.5"/>
  
  <!-- Door frame (left side) -->
  <rect x="30" y="60" width="120" height="290" fill="none" stroke="#1a1512" stroke-width="2"/>
  <rect x="40" y="70" width="100" height="270" fill="#0d0b0b"/>
  
  <!-- Smart doorbell monitor (center-right) -->
  <rect x="520" y="80" width="220" height="160" rx="8" fill="#111010" stroke="#2a2525" stroke-width="2"/>
  
  <!-- Monitor screen glow -->
  <rect x="530" y="90" width="200" height="140" rx="4" fill="#0e1a0e"/>
  
  <!-- Screen content - hallway view -->
  <!-- Faint hallway lines on screen -->
  <line x1="530" y1="130" x2="730" y2="130" stroke="#152515" stroke-width="0.5"/>
  <line x1="530" y1="210" x2="730" y2="210" stroke="#152515" stroke-width="0.5"/>
  
  <!-- Camera recording indicator -->
  <circle cx="545" cy="102" r="4" fill="#cc0000" opacity="0.8"/>
  <text x="555" y="106" fill="#cc0000" font-size="8" font-family="monospace" opacity="0.7">REC</text>
  
  <!-- Timestamp on screen -->
  <text x="720" y="106" fill="#3a5a3a" font-size="8" font-family="monospace" text-anchor="end" opacity="0.6">02:30:14</text>
  
  <!-- Silhouette figure in the hallway (on screen) -->
  <!-- Head -->
  <ellipse cx="630" cy="135" rx="10" ry="12" fill="#050505"/>
  <!-- Body - long coat silhouette -->
  <path d="M620,145 Q618,170 615,200 L612,215 L648,215 L645,200 Q642,170 640,145 Z" fill="#050505"/>
  <!-- Hair flowing down -->
  <path d="M620,130 Q615,145 612,165 Q610,180 613,195" stroke="#050505" stroke-width="3" fill="none"/>
  <path d="M640,130 Q645,145 648,165 Q650,180 647,195" stroke="#050505" stroke-width="3" fill="none"/>
  
  <!-- Faint water drops at feet -->
  <ellipse cx="625" cy="218" rx="2" ry="1" fill="#1a2a3a" opacity="0.4"/>
  <ellipse cx="635" cy="219" rx="1.5" ry="0.8" fill="#1a2a3a" opacity="0.3"/>
  <ellipse cx="630" cy="221" rx="3" ry="1" fill="#1a2a3a" opacity="0.2"/>
  
  <!-- Stairs visible behind figure (very faint) -->
  <line x1="700" y1="160" x2="700" y2="210" stroke="#152515" stroke-width="0.5"/>
  <line x1="705" y1="165" x2="705" y2="210" stroke="#152515" stroke-width="0.5"/>
  <line x1="710" y1="170" x2="710" y2="210" stroke="#152515" stroke-width="0.5"/>
  <line x1="715" y1="175" x2="715" y2="210" stroke="#152515" stroke-width="0.5"/>
  <line x1="720" y1="180" x2="720" y2="210" stroke="#152515" stroke-width="0.5"/>
  <line x1="700" y1="160" x2="730" y2="160" stroke="#152515" stroke-width="0.5"/>
  <line x1="700" y1="175" x2="730" y2="175" stroke="#152515" stroke-width="0.5"/>
  <line x1="700" y1="190" x2="730" y2="190" stroke="#152515" stroke-width="0.5"/>
  
  <!-- Second faint shadow behind main figure -->
  <ellipse cx="680" cy="150" rx="8" ry="10" fill="#030303" opacity="0.5"/>
  <path d="M673,158 Q672,175 670,200 L668,210 L692,210 L690,200 Q688,175 687,158 Z" fill="#030303" opacity="0.5"/>
  
  <!-- Monitor reflection on floor -->
  <ellipse cx="630" cy="300" rx="80" ry="15" fill="#0e1a0e" opacity="0.05"/>
  
  <!-- Door on right side -->
  <rect x="650" y="60" width="120" height="290" fill="none" stroke="#1a1512" stroke-width="2"/>
  <rect x="660" y="70" width="100" height="270" fill="#0d0b0b"/>
  
  <!-- Ambient light from monitor -->
  <rect x="525" y="240" width="230" height="210" fill="url(#monitorGlow)" opacity="0.03"/>
  <defs>
    <radialGradient id="monitorGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#2a4a2a"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <!-- Subtle noise/grain texture hint -->
  <rect x="530" y="90" width="200" height="140" rx="4" fill="none" stroke="#1a3a1a" stroke-width="0.3" opacity="0.3"/>
  
  <!-- Bottom bar of monitor -->
  <rect x="530" y="225" width="200" height="10" rx="2" fill="#0a0a0a"/>
  <text x="630" y="233" fill="#2a4a2a" font-size="6" font-family="monospace" text-anchor="middle">CAM-01</text>
</svg>
