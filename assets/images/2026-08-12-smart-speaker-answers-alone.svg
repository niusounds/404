<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3a6a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a7af5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3a7af5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="heavyBlur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle room outline - ceiling line -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#1a1515" stroke-width="0.5" opacity="0.3"/>
  <!-- Subtle room outline - wall edges -->
  <line x1="0" y1="0" x2="0" y2="450" stroke="#1a1515" stroke-width="0.5" opacity="0.2"/>
  <line x1="800" y1="0" x2="800" y2="450" stroke="#1a1515" stroke-width="0.5" opacity="0.2"/>

  <!-- Table surface - dark silhouette -->
  <rect x="200" y="320" width="400" height="8" rx="2" fill="#12101a" opacity="0.8"/>
  <rect x="220" y="328" width="6" height="100" fill="#0e0c14" opacity="0.5"/>
  <rect x="574" y="328" width="6" height="100" fill="#0e0c14" opacity="0.5"/>

  <!-- Smart speaker body - cylindrical silhouette -->
  <ellipse cx="400" cy="318" rx="35" ry="8" fill="#1a1820"/>
  <rect x="365" y="240" width="70" height="78" fill="#1a1820"/>
  <ellipse cx="400" cy="240" rx="35" ry="8" fill="#1e1c24"/>

  <!-- Top ring indicator - faint blue glow -->
  <ellipse cx="400" cy="240" rx="33" ry="6" fill="none" stroke="#2a5af0" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="400" cy="240" rx="33" ry="6" fill="none" stroke="#4a8aff" stroke-width="0.5" opacity="0.4"/>

  <!-- Blue glow radiating from speaker -->
  <circle cx="400" cy="260" r="120" fill="url(#blueGlow)" opacity="0.3"/>
  <circle cx="400" cy="240" r="25" fill="url(#ringGlow)" opacity="0.2"/>

  <!-- Small LED dot on front -->
  <circle cx="400" cy="280" r="2" fill="#3a7af5" opacity="0.9"/>
  <circle cx="400" cy="280" r="6" fill="#3a7af5" opacity="0.15" filter="url(#softBlur)"/>

  <!-- Table shadow -->
  <ellipse cx="400" cy="330" rx="80" ry="12" fill="#060404" opacity="0.4"/>

  <!-- Dark shadows in corners for depth -->
  <rect x="0" y="0" width="200" height="150" fill="#060404" opacity="0.3"/>
  <rect x="600" y="0" width="200" height="150" fill="#060404" opacity="0.3"/>
  <rect x="0" y="300" width="200" height="150" fill="#060404" opacity="0.2"/>
  <rect x="600" y="300" width="200" height="150" fill="#060404" opacity="0.2"/>

  <!-- Very subtle dust particles in the blue light -->
  <circle cx="370" cy="200" r="0.5" fill="#4a8aff" opacity="0.15"/>
  <circle cx="430" cy="180" r="0.8" fill="#3a7af5" opacity="0.1"/>
  <circle cx="385" cy="160" r="0.4" fill="#5a9aff" opacity="0.12"/>
  <circle cx="415" cy="190" r="0.6" fill="#4a8aff" opacity="0.08"/>
  <circle cx="355" cy="220" r="0.5" fill="#3a7af5" opacity="0.1"/>
  <circle cx="445" cy="210" r="0.7" fill="#4a8aff" opacity="0.09"/>
</svg>