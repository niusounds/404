<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Room silhouette in background - bed shape -->
  <g opacity="0.15">
    <rect x="50" y="250" width="200" height="180" rx="10" fill="#1a1515"/>
    <rect x="30" y="230" width="30" height="200" rx="5" fill="#1a1515"/>
    <!-- Pillow -->
    <ellipse cx="150" cy="260" rx="40" ry="20" fill="#221e1e"/>
  </g>

  <!-- Window with dark outside -->
  <g opacity="0.1">
    <rect x="550" y="40" width="180" height="220" rx="3" fill="#0d0d1a" stroke="#1a1a2a" stroke-width="2"/>
    <line x1="640" y1="40" x2="640" y2="260" stroke="#1a1a2a" stroke-width="1"/>
    <line x1="550" y1="150" x2="730" y2="150" stroke="#1a1a2a" stroke-width="1"/>
    <!-- Faint moonlight -->
    <rect x="560" y="50" width="80" height="100" fill="#0a0a1a" opacity="0.5"/>
  </g>

  <!-- Door frame on left -->
  <g opacity="0.08">
    <rect x="0" y="0" width="40" height="450" fill="#1a1515"/>
    <rect x="40" y="0" width="8" height="450" fill="#151212"/>
  </g>

  <!-- Main phone in center -->
  <g transform="translate(310, 80)">
    <!-- Phone body shadow -->
    <rect x="-5" y="-5" width="190" height="360" rx="18" fill="#050505" filter="url(#blur2)" opacity="0.5"/>
    <!-- Phone body -->
    <rect x="0" y="0" width="180" height="350" rx="15" fill="url(#phoneBody)" stroke="#2a2a2a" stroke-width="1"/>
    <!-- Screen -->
    <rect x="10" y="10" width="160" height="330" rx="8" fill="#0f0f1a"/>
    <!-- Screen glow -->
    <rect x="10" y="10" width="160" height="330" rx="8" fill="#1a1a2e" opacity="0.3"/>

    <!-- Photo gallery grid on screen -->
    <!-- Row 1 -->
    <rect x="18" y="20" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <rect x="72" y="20" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <rect x="126" y="20" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <!-- Row 2 -->
    <rect x="18" y="72" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <rect x="72" y="72" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <rect x="126" y="72" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <!-- Row 3 -->
    <rect x="18" y="124" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <rect x="72" y="124" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <rect x="126" y="124" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <!-- Row 4 - highlighted (the creepy one) -->
    <rect x="18" y="176" width="45" height="45" rx="3" fill="#2a1a1a" opacity="0.8"/>
    <rect x="72" y="176" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <rect x="126" y="176" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>

    <!-- The creepy photo - zoomed in room scene -->
    <rect x="18" y="230" width="153" height="60" rx="3" fill="#12121f" stroke="#3a2a2a" stroke-width="1"/>
    <!-- Room in photo -->
    <rect x="22" y="234" width="100" height="30" rx="2" fill="#1a1a28"/>
    <rect x="25" y="240" width="20" height="20" rx="1" fill="#2a1a1a" opacity="0.6"/>
    <!-- Bed in photo -->
    <rect x="50" y="248" width="65" height="14" rx="2" fill="#252530"/>
    <!-- Phone in photo (recursive) -->
    <rect x="100" y="242" width="12" height="20" rx="2" fill="#1a1a2e" opacity="0.8"/>
    <!-- Bottom row -->
    <rect x="18" y="298" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <rect x="72" y="298" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>
    <rect x="126" y="298" width="45" height="45" rx="3" fill="#151525" opacity="0.7"/>

    <!-- Home indicator bar -->
    <rect x="60" y="335" width="60" height="3" rx="1.5" fill="#3a3a4a" opacity="0.5"/>

    <!-- Screen reflection/glare -->
    <path d="M10,10 L90,10 L50,340 L10,340 Z" fill="white" opacity="0.02"/>
  </g>

  <!-- Floating dust particles (subtle) -->
  <circle cx="200" cy="150" r="0.5" fill="#ffffff" opacity="0.1"/>
  <circle cx="650" cy="200" r="0.7" fill="#ffffff" opacity="0.08"/>
  <circle cx="100" cy="350" r="0.4" fill="#ffffff" opacity="0.12"/>
  <circle cx="700" cy="380" r="0.6" fill="#ffffff" opacity="0.06"/>
  <circle cx="450" cy="100" r="0.5" fill="#ffffff" opacity="0.09"/>

  <!-- Red notification dot on phone -->
  <circle cx="475" cy="108" r="4" fill="#3a1a1a" opacity="0.8"/>
  <circle cx="475" cy="108" r="2" fill="#5a2a2a" opacity="0.6"/>

  <!-- Vignette overlay -->
  <rect width="800" height="450" fill="url(#screenGlow)" opacity="0.3"/>

  <!-- Subtle noise/grain texture suggestion -->
  <g opacity="0.02">
    <circle cx="50" cy="30" r="1" fill="white"/>
    <circle cx="150" cy="80" r="1.5" fill="white"/>
    <circle cx="300" cy="20" r="0.8" fill="white"/>
    <circle cx="500" cy="50" r="1.2" fill="white"/>
    <circle cx="650" cy="30" r="1" fill="white"/>
    <circle cx="750" cy="100" r="0.7" fill="white"/>
    <circle cx="100" cy="400" r="1.3" fill="white"/>
    <circle cx="400" cy="420" r="0.9" fill="white"/>
    <circle cx="600" cy="410" r="1.1" fill="white"/>
    <circle cx="720" cy="380" r="0.8" fill="white"/>
  </g>
</svg>