<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Floor perspective lines -->
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1515" stroke-width="1"/>
  <line x1="200" y1="320" x2="350" y2="450" stroke="#151010" stroke-width="0.5"/>
  <line x1="400" y1="320" x2="400" y2="450" stroke="#151010" stroke-width="0.5"/>
  <line x1="600" y1="320" x2="450" y2="450" stroke="#151010" stroke-width="0.5"/>
  
  <!-- Back wall -->
  <rect x="150" y="80" width="500" height="240" fill="#0d0a0a" stroke="#1a1515" stroke-width="0.5"/>
  
  <!-- Escalator on the left -->
  <rect x="170" y="120" width="120" height="200" fill="#080606" stroke="#1a1515" stroke-width="0.5"/>
  <!-- Escalator steps -->
  <line x1="170" y1="140" x2="290" y2="140" stroke="#1a1515" stroke-width="0.3"/>
  <line x1="170" y1="160" x2="290" y2="160" stroke="#1a1515" stroke-width="0.3"/>
  <line x1="170" y1="180" x2="290" y2="180" stroke="#1a1515" stroke-width="0.3"/>
  <line x1="170" y1="200" x2="290" y2="200" stroke="#1a1515" stroke-width="0.3"/>
  <line x1="170" y1="220" x2="290" y2="220" stroke="#1a1515" stroke-width="0.3"/>
  <line x1="170" y1="240" x2="290" y2="240" stroke="#1a1515" stroke-width="0.3"/>
  <line x1="170" y1="260" x2="290" y2="260" stroke="#1a1515" stroke-width="0.3"/>
  <line x1="170" y1="280" x2="290" y2="280" stroke="#1a1515" stroke-width="0.3"/>
  <line x1="170" y1="300" x2="290" y2="300" stroke="#1a1515" stroke-width="0.3"/>
  
  <!-- Elevator doors (center) -->
  <rect x="340" y="100" width="120" height="220" fill="#0c0909" stroke="#1a1515" stroke-width="0.5"/>
  <line x1="400" y1="100" x2="400" y2="320" stroke="#1a1515" stroke-width="0.5"/>
  <!-- Elevator call button panel -->
  <rect x="470" y="200" width="15" height="30" fill="#111010" stroke="#1a1515" stroke-width="0.3"/>
  <circle cx="477" cy="210" r="3" fill="#1a1515"/>
  
  <!-- Hooded figure in the far right corner (barely visible) -->
  <g transform="translate(580, 140)" opacity="0.35">
    <!-- Hood/head -->
    <ellipse cx="20" cy="15" rx="18" ry="20" fill="#050303" stroke="#1a1515" stroke-width="0.3"/>
    <!-- Body -->
    <path d="M5,35 L-5,180 L45,180 L35,35 Z" fill="#050303" stroke="#1a1515" stroke-width="0.3"/>
    <!-- Hood shadow covering face -->
    <ellipse cx="20" cy="18" rx="14" ry="12" fill="#020101"/>
  </g>
  
  <!-- Second fainter figure behind the first (ghostly presence) -->
  <g transform="translate(620, 160)" opacity="0.12">
    <ellipse cx="15" cy="10" rx="12" ry="14" fill="#050303" stroke="#1a1515" stroke-width="0.2"/>
    <path d="M3,24 L-3,150 L33,150 L27,24 Z" fill="#050303" stroke="#1a1515" stroke-width="0.2"/>
  </g>
  
  <!-- Surveillance camera (top left) -->
  <g transform="translate(80, 30)">
    <!-- Mount -->
    <rect x="0" y="0" width="30" height="8" fill="#1a1515"/>
    <!-- Camera body -->
    <rect x="-5" y="8" width="40" height="25" rx="3" fill="#111010" stroke="#1a1515" stroke-width="0.5"/>
    <!-- Lens -->
    <circle cx="30" cy="20" r="8" fill="#0a0808" stroke="#1a1515" stroke-width="0.5"/>
    <circle cx="30" cy="20" r="4" fill="#1a0505"/>
    <!-- Red LED -->
    <circle cx="30" cy="20" r="2.5" fill="#cc1111" opacity="0.9"/>
    <circle cx="30" cy="20" r="6" fill="none" stroke="#cc1111" stroke-width="0.5" opacity="0.3"/>
    <circle cx="30" cy="20" r="12" fill="none" stroke="#cc1111" stroke-width="0.3" opacity="0.1"/>
  </g>
  
  <!-- Subtle ambient light from camera LED -->
  <ellipse cx="80" cy="200" rx="150" ry="100" fill="url(#ledGlow)" opacity="0.03"/>
  
  <!-- Floor reflection of camera LED -->
  <ellipse cx="80" cy="380" rx="40" ry="8" fill="#cc1111" opacity="0.04"/>
  
  <!-- Vignette effect -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cc1111" stop-opacity="1"/>
      <stop offset="100%" stop-color="#cc1111" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vignette)" pointer-events="none"/>
  
  <!-- Subtle noise/grain overlay -->
  <g opacity="0.03" fill="#ffffff">
    <rect x="50" y="60" width="1" height="1"/>
    <rect x="120" y="90" width="1" height="1"/>
    <rect x="200" y="50" width="1" height="1"/>
    <rect x="350" y="70" width="1" height="1"/>
    <rect x="450" y="40" width="1" height="1"/>
    <rect x="550" y="80" width="1" height="1"/>
    <rect x="650" y="55" width="1" height="1"/>
    <rect x="720" y="100" width="1" height="1"/>
    <rect x="100" y="150" width="1" height="1"/>
    <rect x="300" y="130" width="1" height="1"/>
    <rect x="500" y="160" width="1" height="1"/>
    <rect x="700" y="140" width="1" height="1"/>
    <rect x="150" y="200" width="1" height="1"/>
    <rect x="400" y="190" width="1" height="1"/>
    <rect x="600" y="210" width="1" height="1"/>
    <rect x="250" y="280" width="1" height="1"/>
    <rect x="450" y="270" width="1" height="1"/>
    <rect x="550" y="300" width="1" height="1"/>
  </g>
</svg>
