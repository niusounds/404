<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle gradient overlay for atmosphere -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#1a1515"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <linearGradient id="fridgeLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2520" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1510" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#glow)"/>
  
  <!-- Kitchen floor -->
  <rect x="0" y="340" width="800" height="110" fill="#0d0a0a"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#1a1210" stroke-width="1"/>
  
  <!-- Floor tiles -->
  <g stroke="#110d0d" stroke-width="0.5" opacity="0.5">
    <line x1="100" y1="340" x2="100" y2="450"/>
    <line x1="200" y1="340" x2="200" y2="450"/>
    <line x1="300" y1="340" x2="300" y2="450"/>
    <line x1="400" y1="340" x2="400" y2="450"/>
    <line x1="500" y1="340" x2="500" y2="450"/>
    <line x1="600" y1="340" x2="600" y2="450"/>
    <line x1="700" y1="340" x2="700" y2="450"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
  </g>
  
  <!-- Wall -->
  <rect x="0" y="0" width="800" height="340" fill="#0c0909"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#1a1515" stroke-width="2"/>
  
  <!-- Kitchen counter (left side, behind fridge) -->
  <rect x="50" y="280" width="180" height="60" fill="#1a1515" rx="2"/>
  <rect x="50" y="275" width="180" height="8" fill="#221c1c" rx="1"/>
  
  <!-- Fridge body -->
  <rect x="350" y="120" width="160" height="220" fill="#1e1a1a" rx="3" stroke="#2a2525" stroke-width="1"/>
  <!-- Fridge door divider -->
  <line x1="350" y1="200" x2="510" y2="200" stroke="#2a2525" stroke-width="1"/>
  <!-- Fridge handle (upper door) -->
  <rect x="490" y="140" width="8" height="50" fill="#3a3535" rx="2"/>
  <!-- Fridge handle (lower door) -->
  <rect x="490" y="220" width="8" height="80" fill="#3a3535" rx="2"/>
  
  <!-- Fridge interior light (slightly open lower door) -->
  <rect x="355" y="220" width="155" height="120" fill="url(#fridgeLight)" rx="2"/>
  
  <!-- Slightly open fridge door -->
  <rect x="505" y="220" width="8" height="120" fill="#252020" rx="1"/>
  
  <!-- Faint glow from inside fridge -->
  <ellipse cx="430" cy="280" rx="60" ry="40" fill="#3a2a1a" opacity="0.15" filter="url(#blur3)"/>
  
  <!-- Water droplet on floor -->
  <ellipse cx="540" cy="342" rx="4" ry="2" fill="#2a2520" opacity="0.6"/>
  
  <!-- Shadow of fridge -->
  <ellipse cx="430" cy="350" rx="90" ry="8" fill="#080606" opacity="0.5"/>
  
  <!-- Ghostly figure reflection in fridge glass (subtle) -->
  <g opacity="0.06" filter="url(#blur2)">
    <!-- Head -->
    <ellipse cx="430" cy="170" rx="12" ry="15" fill="#ffffff"/>
    <!-- Body -->
    <path d="M418,185 L415,220 L445,220 L442,185 Z" fill="#ffffff"/>
    <!-- Arms reaching slightly -->
    <line x1="418" y1="195" x2="400" y2="210" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="442" y1="195" x2="460" y2="210" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Dark figure silhouette behind fridge (barely visible) -->
  <g opacity="0.04" filter="url(#blur3)">
    <ellipse cx="310" cy="180" rx="15" ry="20" fill="#ffffff"/>
    <path d="M295,200 L290,310 L330,310 L325,200 Z" fill="#ffffff"/>
  </g>
  
  <!-- Dim overhead light -->
  <line x1="400" y1="0" x2="400" y2="30" stroke="#1a1510" stroke-width="1"/>
  <ellipse cx="400" cy="35" rx="15" ry="5" fill="#2a2520"/>
  <ellipse cx="400" cy="35" rx="8" ry="3" fill="#3a3530" opacity="0.5"/>
  
  <!-- Light cone from overhead -->
  <polygon points="390,35 410,35 480,340 320,340" fill="#2a2520" opacity="0.02"/>
  
  <!-- Small details: small items on counter -->
  <rect x="80" y="260" width="15" height="20" fill="#221c1c" rx="1"/>
  <rect x="105" y="265" width="10" height="15" fill="#221c1c" rx="1"/>
  <rect x="120" y="255" width="20" height="25" fill="#221c1c" rx="1"/>
  
  <!-- Subtle text-like lines on fridge (notes/magnets) -->
  <rect x="370" y="145" width="30" height="20" fill="#2a2525" rx="1" opacity="0.5"/>
  <rect x="420" y="150" width="25" height="15" fill="#2a2525" rx="1" opacity="0.4"/>
  
  <!-- Floor shadow under counter -->
  <rect x="50" y="340" width="180" height="5" fill="#080606" opacity="0.4" rx="2"/>
  
  <!-- Very subtle vignette -->
  <rect width="800" height="450" fill="none" stroke="#060404" stroke-width="20" opacity="0.3"/>
</svg>
