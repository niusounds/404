<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <linearGradient id="lightBleed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a4a7a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle light bleed from phone screen -->
  <rect x="0" y="0" width="400" height="450" fill="url(#lightBleed)"/>

  <!-- Room floor line -->
  <line x1="0" y1="370" x2="800" y2="370" stroke="#1a1515" stroke-width="1"/>

  <!-- Wall shadow gradient -->
  <rect x="0" y="0" width="800" height="370" fill="#0c0a0a"/>
  <rect x="0" y="350" width="800" height="20" fill="#0e0c0c"/>

  <!-- Bed silhouette (right side, bottom) -->
  <rect x="520" y="310" width="260" height="60" rx="4" fill="#111010" stroke="#1a1818" stroke-width="0.5"/>
  <rect x="540" y="280" width="80" height="35" rx="6" fill="#141212" stroke="#1a1818" stroke-width="0.5"/>
  <!-- Pillow -->
  <ellipse cx="580" cy="290" rx="30" ry="12" fill="#181616"/>

  <!-- Phone in the center, screen glowing -->
  <g transform="translate(340, 130)" filter="url(#glow)">
    <!-- Phone body -->
    <rect x="0" y="0" width="120" height="220" rx="12" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Screen -->
    <rect x="8" y="8" width="104" height="204" rx="6" fill="url(#screenGlow)"/>
    <!-- Screen content: lock icon -->
    <g transform="translate(60, 50)">
      <!-- Lock body -->
      <rect x="-12" y="-5" width="24" height="20" rx="3" fill="none" stroke="#3a6aaa" stroke-width="1.5" opacity="0.8"/>
      <!-- Lock shackle -->
      <path d="M-8,-5 L-8,-15 Q-8,-22 0,-22 Q8,-22 8,-15 L8,-5" fill="none" stroke="#3a6aaa" stroke-width="1.5" opacity="0.8"/>
      <!-- Keyhole -->
      <circle cx="0" cy="3" r="2.5" fill="#3a6aaa" opacity="0.9"/>
      <rect x="-1.5" y="5" width="3" height="5" rx="0.5" fill="#3a6aaa" opacity="0.9"/>
    </g>
    <!-- Fingerprint icon -->
    <g transform="translate(60, 110)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#2a5a8a" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#2a5a8a" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#2a5a8a" stroke-width="1" opacity="0.4"/>
    </g>
    <!-- Notification bar at top -->
    <rect x="12" y="14" width="96" height="22" rx="3" fill="#1a2a4a" opacity="0.6"/>
    <text x="60" y="29" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4a7aaa" opacity="0.7">生体認証</text>
    <!-- Timestamp lines -->
    <rect x="20" y="150" width="80" height="2" rx="1" fill="#2a4a7a" opacity="0.3"/>
    <rect x="20" y="158" width="60" height="2" rx="1" fill="#2a4a7a" opacity="0.3"/>
    <rect x="20" y="166" width="70" height="2" rx="1" fill="#2a4a7a" opacity="0.3"/>
    <rect x="20" y="174" width="50" height="2" rx="1" fill="#2a4a7a" opacity="0.3"/>
    <!-- Red unlock timestamp -->
    <text x="60" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a3a3a" opacity="0.8">02:00</text>
    <!-- Unlock arrow -->
    <path d="M55,208 L60,215 L65,208" fill="none" stroke="#8a3a3a" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Phone glow effect on surrounding area -->
  <ellipse cx="400" cy="240" rx="120" ry="100" fill="#1a2a4a" opacity="0.03"/>
  <ellipse cx="400" cy="240" rx="60" ry="50" fill="#2a4a7a" opacity="0.04"/>

  <!-- Shadowy figure silhouette in the doorway (left side, very faint) -->
  <g opacity="0.06">
    <!-- Head -->
    <ellipse cx="80" cy="180" rx="18" ry="22" fill="#1a1a1a"/>
    <!-- Body -->
    <path d="M60,200 L65,340 L95,340 L100,200 Z" fill="#1a1a1a"/>
    <!-- Legs -->
    <rect x="68" y="330" width="8" height="35" fill="#1a1a1a"/>
    <rect x="84" y="330" width="8" height="35" fill="#1a1a1a"/>
  </g>

  <!-- Door frame outline (left side) -->
  <rect x="30" y="80" width="100" height="290" fill="none" stroke="#151313" stroke-width="1"/>
  <rect x="35" y="85" width="90" height="280" fill="#0e0c0c"/>

  <!-- Clock on wall (top right corner) -->
  <g transform="translate(700, 60)">
    <circle cx="0" cy="0" r="28" fill="#111010" stroke="#1a1818" stroke-width="1"/>
    <circle cx="0" cy="0" r="24" fill="#0e0c0c"/>
    <!-- Hour markers -->
    <line x1="0" y1="-20" x2="0" y2="-17" stroke="#2a2828" stroke-width="1"/>
    <line x1="0" y1="20" x2="0" y2="17" stroke="#2a2828" stroke-width="1"/>
    <line x1="-20" y1="0" x2="-17" y2="0" stroke="#2a2828" stroke-width="1"/>
    <line x1="20" y1="0" x2="17" y2="0" stroke="#2a2828" stroke-width="1"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="8" y2="4" stroke="#3a3a3a" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#3a3a3a"/>
  </g>

  <!-- Tiny red indicator light (smart lock status) -->
  <circle cx="400" cy="360" r="2" fill="#8a2a2a" opacity="0.3"/>
  <circle cx="400" cy="360" r="6" fill="#8a2a2a" opacity="0.05"/>

  <!-- Floor reflection of phone glow -->
  <ellipse cx="400" cy="390" rx="80" ry="15" fill="#1a2a4a" opacity="0.02"/>

  <!-- Subtle text: "解錠履歴" floating in darkness -->
  <text x="400" y="430" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2a2525" opacity="0.4">解錠履歴</text>
</svg>
