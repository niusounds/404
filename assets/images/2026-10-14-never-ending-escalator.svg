<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Escalator structure -->
  <!-- Left handrail -->
  <line x1="280" y1="0" x2="280" y2="450" stroke="#1a1818" stroke-width="8"/>
  <!-- Right handrail -->
  <line x1="520" y1="0" x2="520" y2="450" stroke="#1a1818" stroke-width="8"/>
  
  <!-- Escalator steps -->
  <g fill="#12101a">
    <rect x="282" y="20" width="236" height="12" rx="1"/>
    <rect x="282" y="40" width="236" height="12" rx="1"/>
    <rect x="282" y="60" width="236" height="12" rx="1"/>
    <rect x="282" y="80" width="236" height="12" rx="1"/>
    <rect x="282" y="100" width="236" height="12" rx="1"/>
    <rect x="282" y="120" width="236" height="12" rx="1"/>
    <rect x="282" y="140" width="236" height="12" rx="1"/>
    <rect x="282" y="160" width="236" height="12" rx="1"/>
    <rect x="282" y="180" width="236" height="12" rx="1"/>
    <rect x="282" y="200" width="236" height="12" rx="1"/>
    <rect x="282" y="220" width="236" height="12" rx="1"/>
    <rect x="282" y="240" width="236" height="12" rx="1"/>
    <rect x="282" y="260" width="236" height="12" rx="1"/>
    <rect x="282" y="280" width="236" height="12" rx="1"/>
    <rect x="282" y="300" width="236" height="12" rx="1"/>
    <rect x="282" y="320" width="236" height="12" rx="1"/>
    <rect x="282" y="340" width="236" height="12" rx="1"/>
    <rect x="282" y="360" width="236" height="12" rx="1"/>
    <rect x="282" y="380" width="236" height="12" rx="1"/>
    <rect x="282" y="400" width="236" height="12" rx="1"/>
    <rect x="282" y="420" width="236" height="12" rx="1"/>
  </g>

  <!-- Side walls -->
  <rect x="270" y="0" width="12" height="450" fill="#0e0c0c"/>
  <rect x="518" y="0" width="12" height="450" fill="#0e0c0c"/>

  <!-- Silhouette figure on escalator -->
  <ellipse cx="400" cy="180" rx="18" ry="24" fill="#050405"/>
  <path d="M382 204 Q382 200 386 196 L386 260 Q386 264 390 264 L410 264 Q414 264 414 260 L414 196 Q418 200 418 204 Z" fill="#050405"/>

  <!-- Floor at bottom -->
  <rect x="0" y="440" width="800" height="10" fill="#0e0c0c"/>

  <!-- Floor sign -->
  <rect x="370" y="425" width="60" height="10" rx="2" fill="#1a1820" opacity="0.5"/>
  <text x="400" y="433" font-size="7" fill="#2a2530" text-anchor="middle" font-family="sans-serif">B1</text>

  <!-- Dark abyss at bottom -->
  <rect x="282" y="432" width="236" height="18" fill="#050405"/>
  <rect x="282" y="448" width="236" height="2" fill="#050405"/>

  <!-- Dim fluorescent light -->
  <rect x="350" y="0" width="100" height="3" fill="#1a1a2a" opacity="0.3"/>
  <rect x="360" y="3" width="80" height="1" fill="#2a2a3a" opacity="0.15"/>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.5"/>

  <!-- Subtle warning light -->
  <circle cx="400" cy="410" r="3" fill="#1a0a0a" opacity="0.4"/>
  <circle cx="400" cy="410" r="1.5" fill="#2a0a0a" opacity="0.3"/>
</svg>
