<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- CRT Monitor glow -->
  <rect x="250" y="80" width="300" height="220" rx="15" ry="15" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="260" y="90" width="280" height="200" rx="5" ry="5" fill="#0d1a0d"/>
  
  <!-- Scanlines on monitor -->
  <line x1="260" y1="110" x2="540" y2="110" stroke="#1a2a1a" stroke-width="1" opacity="0.3"/>
  <line x1="260" y1="130" x2="540" y2="130" stroke="#1a2a1a" stroke-width="1" opacity="0.3"/>
  <line x1="260" y1="150" x2="540" y2="150" stroke="#1a2a1a" stroke-width="1" opacity="0.3"/>
  <line x1="260" y1="170" x2="540" y2="170" stroke="#1a2a1a" stroke-width="1" opacity="0.3"/>
  <line x1="260" y1="190" x2="540" y2="190" stroke="#1a2a1a" stroke-width="1" opacity="0.3"/>
  <line x1="260" y1="210" x2="540" y2="210" stroke="#1a2a1a" stroke-width="1" opacity="0.3"/>
  <line x1="260" y1="230" x2="540" y2="230" stroke="#1a2a1a" stroke-width="1" opacity="0.3"/>
  
  <!-- Monitor stand -->
  <rect x="370" y="300" width="60" height="30" fill="#1a1a1a"/>
  <rect x="350" y="330" width="100" height="10" rx="3" ry="3" fill="#1a1a1a"/>
  
  <!-- Silhouette figure on monitor -->
  <ellipse cx="400" cy="160" rx="12" ry="14" fill="#0a150a" opacity="0.9"/>
  <path d="M380 175 Q385 220 390 230 L410 230 Q415 220 420 175 Z" fill="#0a150a" opacity="0.9"/>
  <path d="M390 230 L385 260 L395 260 L400 240 L405 260 L415 260 L410 230 Z" fill="#0a150a" opacity="0.9"/>
  
  <!-- Monitor glow effect -->
  <ellipse cx="400" cy="190" rx="140" ry="100" fill="none" stroke="#1a3a1a" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Store entrance door (right side) -->
  <rect x="620" y="120" width="100" height="200" fill="#111" stroke="#222" stroke-width="2"/>
  <rect x="630" y="130" width="40" height="190" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="670" y="130" width="40" height="190" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Door handle -->
  <rect x="665" y="220" width="5" height="30" rx="2" fill="#333"/>
  <rect x="678" y="220" width="5" height="30" rx="2" fill="#333"/>
  
  <!-- Another silhouette at door -->
  <ellipse cx="680" cy="280" rx="15" ry="18" fill="#0d0d0d" opacity="0.7"/>
  <path d="M655 300 Q660 350 665 360 L695 360 Q700 350 705 300 Z" fill="#0d0d0d" opacity="0.7"/>
  <path d="M665 360 L660 390 L670 390 L675 375 L680 390 L690 390 L685 360 Z" fill="#0d0d0d" opacity="0.7"/>
  
  <!-- Dark shelves on left -->
  <rect x="30" y="100" width="180" height="250" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="30" y1="160" x2="210" y2="160" stroke="#151515" stroke-width="2"/>
  <line x1="30" y1="220" x2="210" y2="220" stroke="#151515" stroke-width="2"/>
  <line x1="30" y1="280" x2="210" y2="280" stroke="#151515" stroke-width="2"/>
  <line x1="30" y1="340" x2="210" y2="340" stroke="#151515" stroke-width="2"/>
  
  <!-- Products on shelves (abstract) -->
  <rect x="50" y="120" width="15" height="40" fill="#1a1515" opacity="0.5"/>
  <rect x="75" y="130" width="12" height="30" fill="#1a1515" opacity="0.5"/>
  <rect x="95" y="125" width="18" height="35" fill="#1a1515" opacity="0.5"/>
  <rect x="120" y="135" width="10" height="25" fill="#1a1515" opacity="0.5"/>
  <rect x="140" y="128" width="14" height="32" fill="#1a1515" opacity="0.5"/>
  <rect x="165" y="132" width="16" height="28" fill="#1a1515" opacity="0.5"/>
  
  <rect x="55" y="180" width="12" height="40" fill="#1a1515" opacity="0.4"/>
  <rect x="75" y="175" width="15" height="45" fill="#1a1515" opacity="0.4"/>
  <rect x="100" y="185" width="10" height="35" fill="#1a1515" opacity="0.4"/>
  <rect x="120" y="178" width="14" height="42" fill="#1a1515" opacity="0.4"/>
  <rect x="145" y="182" width="12" height="38" fill="#1a1515" opacity="0.4"/>
  
  <rect x="60" y="240" width="14" height="40" fill="#1a1515" opacity="0.3"/>
  <rect x="85" y="245" width="10" height="35" fill="#1a1515" opacity="0.3"/>
  <rect x="105" y="238" width="16" height="42" fill="#1a1515" opacity="0.3"/>
  <rect x="130" y="242" width="12" height="38" fill="#1a1515" opacity="0.3"/>
  
  <!-- Floor reflection -->
  <rect x="0" y="370" width="800" height="80" fill="#080606" opacity="0.5"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="#111" stroke-width="1" opacity="0.3"/>
  
  <!-- Subtle red emergency light -->
  <circle cx="700" cy="100" r="5" fill="#3a0000" opacity="0.6"/>
  <circle cx="700" cy="100" r="15" fill="#3a0000" opacity="0.15"/>
  
  <!-- Noise/grain overlay (subtle) -->
  <rect x="260" y="90" width="280" height="200" fill="url(#noise)" opacity="0.05"/>
  
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
</svg>
