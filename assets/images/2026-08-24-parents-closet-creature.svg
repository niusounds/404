<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1210"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a0a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle dust particles -->
  <g fill="#3a2a1a" opacity="0.3">
    <circle cx="120" cy="80" r="1"/><circle cx="340" cy="150" r="1.5"/>
    <circle cx="560" cy="90" r="1"/><circle cx="680" cy="200" r="1.2"/>
    <circle cx="200" cy="300" r="1"/><circle cx="450" cy="350" r="1.3"/>
    <circle cx="620" cy="280" r="0.8"/><circle cx="750" cy="120" r="1"/>
    <circle cx="50" cy="250" r="1.1"/><circle cx="300" cy="400" r="0.9"/>
  </g>

  <!-- Closet silhouette (left side) -->
  <rect x="30" y="40" width="320" height="380" rx="4" fill="#0d0b0a" stroke="#1a1410" stroke-width="1"/>
  
  <!-- Closet door frame -->
  <rect x="35" y="45" width="150" height="370" fill="#110e0c" stroke="#1e1814" stroke-width="0.5"/>
  
  <!-- Door slightly ajar - right panel pushed open -->
  <rect x="180" y="45" width="170" height="370" fill="#0e0c0b" stroke="#1a1410" stroke-width="0.5" opacity="0.9"/>
  
  <!-- Gap between doors - dark interior visible -->
  <rect x="175" y="45" width="8" height="370" fill="#050404"/>
  
  <!-- Dark interior behind door -->
  <rect x="183" y="45" width="167" height="370" fill="#060504"/>
  
  <!-- Boxes inside closet -->
  <rect x="200" y="200" width="80" height="60" fill="#12100e" stroke="#1a1612" stroke-width="0.5" rx="2"/>
  <rect x="290" y="250" width="60" height="50" fill="#100e0c" stroke="#181410" stroke-width="0.5" rx="2"/>
  <rect x="210" y="130" width="55" height="45" fill="#110f0d" stroke="#1a1612" stroke-width="0.5" rx="2"/>

  <!-- Three finger marks on back wall - visible through the crack -->
  <g filter="url(#blur1)" opacity="0.7">
    <!-- Left finger mark -->
    <rect x="325" y="140" width="8" height="50" rx="4" fill="#2a1a0a"/>
    <!-- Middle finger mark -->
    <rect x="340" y="130" width="8" height="60" rx="4" fill="#2a1a0a"/>
    <!-- Ring finger mark -->
    <rect x="355" y="145" width="8" height="48" rx="4" fill="#2a1a0a"/>
  </g>
  
  <!-- Finger marks sharper core -->
  <g opacity="0.5">
    <rect x="326" y="142" width="6" height="46" rx="3" fill="#3a2a15"/>
    <rect x="341" y="133" width="6" height="54" rx="3" fill="#3a2a15"/>
    <rect x="356" y="148" width="6" height="42" rx="3" fill="#3a2a15"/>
  </g>

  <!-- Faint glow from behind the door -->
  <rect x="175" y="45" width="5" height="370" fill="#3a2a15" opacity="0.15" filter="url(#blur2)"/>

  <!-- Dust motes in the gap -->
  <g fill="#5a4a2a" opacity="0.4">
    <circle cx="178" cy="100" r="0.8"/><circle cx="180" cy="200" r="0.6"/>
    <circle cx="177" cy="300" r="0.9"/><circle cx="179" cy="380" r="0.7"/>
  </g>

  <!-- Time indicator - faint 6:00 on the wall -->
  <text x="500" y="220" font-family="monospace" font-size="48" fill="#1a1410" text-anchor="middle" opacity="0.6">6:00</text>
  
  <!-- Subtle clock circle -->
  <circle cx="500" cy="210" r="55" fill="none" stroke="#1a1410" stroke-width="1" opacity="0.4"/>
  
  <!-- Clock hands -->
  <line x1="500" y1="210" x2="500" y2="165" stroke="#1e1814" stroke-width="2" opacity="0.5"/>
  <line x1="500" y1="210" x2="535" y2="210" stroke="#1e1814" stroke-width="1.5" opacity="0.4"/>

  <!-- Right side - empty wall -->
  <rect x="400" y="0" width="400" height="450" fill="#0a0808"/>
  
  <!-- Subtle floor line -->
  <line x1="30" y1="420" x2="770" y2="420" stroke="#1a1410" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Vignette -->
  <rect width="800" height="450" fill="url(#glow)" opacity="0.5"/>
</svg>
