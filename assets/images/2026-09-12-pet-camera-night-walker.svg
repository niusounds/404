<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0a0808"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#vignette)"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Refrigerator silhouette (left) -->
  <rect x="60" y="80" width="80" height="260" fill="#121010" stroke="#1e1a1a" stroke-width="1"/>
  <line x1="100" y1="80" x2="100" y2="340" stroke="#1a1616" stroke-width="0.5"/>
  <rect x="120" y="160" width="8" height="40" fill="#1a1616" rx="2"/>
  
  <!-- Human silhouette near fridge -->
  <ellipse cx="210" cy="200" rx="25" ry="70" fill="#1a1717" opacity="0.9"/>
  <circle cx="210" cy="115" r="22" fill="#1e1b1b"/>
  <rect x="195" y="265" width="12" height="75" fill="#1a1717" rx="4"/>
  <rect x="213" y="265" width="12" height="75" fill="#1a1717" rx="4"/>
  <rect x="175" y="180" width="35" height="6" fill="#1a1717" rx="3" transform="rotate(10,175,180)"/>
  <rect x="225" y="175" width="35" height="6" fill="#1a1717" rx="3" transform="rotate(-15,225,175)"/>
  
  <!-- Dark eyes in white face -->
  <circle cx="200" cy="112" r="4" fill="#0a0808"/>
  <circle cx="220" cy="112" r="4" fill="#0a0808"/>
  <circle cx="200" cy="112" r="8" fill="#2a2525" opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="220" cy="112" r="8" fill="#2a2525" opacity="0.3" filter="url(#softGlow)"/>
  
  <!-- Bed with cats (right) -->
  <rect x="520" y="280" width="200" height="60" fill="#151212" rx="4" stroke="#1e1a1a" stroke-width="0.5"/>
  <rect x="530" y="260" width="180" height="25" fill="#1a1616" rx="3"/>
  <ellipse cx="560" cy="258" rx="25" ry="12" fill="#1e1a1a"/>
  
  <!-- Cat 1 -->
  <ellipse cx="640" cy="255" rx="18" ry="10" fill="#1e1b1b"/>
  <circle cx="655" cy="248" r="7" fill="#1e1b1b"/>
  <polygon points="650,242 653,235 656,242" fill="#1e1b1b"/>
  <polygon points="657,242 660,235 663,242" fill="#1e1b1b"/>
  <path d="M622,255 Q610,245 615,235" stroke="#1e1b1b" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Cat 2 -->
  <ellipse cx="590" cy="258" rx="14" ry="9" fill="#1e1b1b"/>
  <circle cx="600" cy="253" r="5" fill="#1e1b1b"/>
  <polygon points="596,249 598,243 600,249" fill="#1e1b1b"/>
  <polygon points="601,249 603,243 605,249" fill="#1e1b1b"/>
  
  <!-- Camera indicator -->
  <circle cx="400" cy="40" r="3" fill="#3a1515" filter="url(#glow)"/>
  
  <!-- Scan lines -->
  <line x1="400" y1="43" x2="400" y2="448" stroke="#0f0d0d" stroke-width="0.3" opacity="0.5"/>
  <line x1="200" y1="43" x2="200" y2="448" stroke="#0f0d0d" stroke-width="0.3" opacity="0.5"/>
  <line x1="600" y1="43" x2="600" y2="448" stroke="#0f0d0d" stroke-width="0.3" opacity="0.5"/>
  
  <!-- Fog -->
  <ellipse cx="400" cy="440" rx="350" ry="15" fill="#0f0c0c" opacity="0.5"/>
  
  <!-- Timestamp -->
  <text x="20" y="430" fill="#2a2525" font-family="monospace" font-size="11" opacity="0.6">2026/09/11 03:00:00</text>
</svg>
