<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#2a2020"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Dark hallway perspective -->
  <polygon points="350,0 450,0 600,450 200,450" fill="#0d0a0a" opacity="0.8"/>
  
  <!-- Floor -->
  <rect x="0" y="350" width="800" height="100" fill="#080606"/>
  <line x1="200" y1="350" x2="600" y2="350" stroke="#111" stroke-width="1"/>
  
  <!-- Intercom panel on wall (center-right, slightly above center) -->
  <rect x="520" y="160" width="80" height="120" rx="4" fill="#1a1515" stroke="#2a2020" stroke-width="1"/>
  <!-- Intercom screen -->
  <rect x="530" y="175" width="60" height="40" rx="2" fill="#0a0a0a" stroke="#1a1515" stroke-width="0.5"/>
  <!-- Intercom button (the glowing one) -->
  <circle cx="560" cy="240" r="12" fill="#1a1010"/>
  <!-- Glow effect from button -->
  <circle cx="560" cy="240" r="18" fill="#ff3300" opacity="0.15" filter="url(#blur)"/>
  <circle cx="560" cy="240" r="12" fill="#cc2200" opacity="0.4"/>
  <circle cx="560" cy="240" r="12" fill="#ff4400" opacity="0.3"/>
  
  <!-- Sound waves emanating from button -->
  <path d="M580,235 Q590,240 580,245" stroke="#ff4400" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M585,230 Q600,240 585,250" stroke="#ff4400" stroke-width="0.8" fill="none" opacity="0.2"/>
  <path d="M590,225 Q610,240 590,255" stroke="#ff4400" stroke-width="0.5" fill="none" opacity="0.1"/>
  
  <!-- Faint light from intercom button casting on floor -->
  <ellipse cx="560" cy="380" rx="40" ry="15" fill="#ff3300" opacity="0.05"/>
  
  <!-- Wall texture - subtle vertical lines -->
  <line x1="370" y1="0" x2="370" y2="450" stroke="#0d0a0a" stroke-width="0.5" opacity="0.5"/>
  <line x1="390" y1="0" x2="390" y2="450" stroke="#0d0a0a" stroke-width="0.5" opacity="0.5"/>
  <line x1="410" y1="0" x2="410" y2="450" stroke="#0d0a0a" stroke-width="0.5" opacity="0.5"/>
  <line x1="430" y1="0" x2="430" y2="450" stroke="#0d0a0a" stroke-width="0.5" opacity="0.5"/>
  <line x1="450" y1="0" x2="450" y2="450" stroke="#0d0a0a" stroke-width="0.5" opacity="0.5"/>
  <line x1="470" y1="0" x2="470" y2="450" stroke="#0d0a0a" stroke-width="0.5" opacity="0.5"/>
  <line x1="490" y1="0" x2="490" y2="450" stroke="#0d0a0a" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Left wall -->
  <polygon points="0,0 350,0 200,450 0,450" fill="#0c0909"/>
  
  <!-- Ceiling -->
  <rect x="350" y="0" width="100" height="5" fill="#0e0b0b"/>
  
  <!-- A single shadow figure silhouette at the bottom of the hallway -->
  <ellipse cx="400" cy="420" rx="30" ry="8" fill="#060404"/>
  
  <!-- Subtle vignette -->
  <rect width="800" height="450" fill="url(#glow)" opacity="0.5"/>
  
  <!-- Tiny red LED indicator on intercom -->
  <circle cx="560" cy="240" r="3" fill="#ff2200" opacity="0.8"/>
  
  <!-- Very faint reflection on the floor from button glow -->
  <ellipse cx="560" cy="400" rx="60" ry="5" fill="#ff2200" opacity="0.03"/>
</svg>
