<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
  </radialGradient>
  <rect width="800" height="450" fill="url(#vignette)"/>
  
  <!-- Security camera housing (top center) -->
  <rect x="370" y="20" width="60" height="35" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="380" y="55" width="40" height="25" rx="4" fill="#151515" stroke="#2a2a2a" stroke-width="0.5"/>
  
  <!-- Camera lens -->
  <circle cx="400" cy="67" r="10" fill="#0d0d0d" stroke="#333" stroke-width="1"/>
  <circle cx="400" cy="67" r="6" fill="#0a0a0a"/>
  <!-- Red LED (recording indicator) -->
  <circle cx="425" cy="37" r="4" fill="#cc0000">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- LED glow -->
  <circle cx="425" cy="37" r="8" fill="#cc0000" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.05;0.15" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Camera mounting bracket -->
  <rect x="390" y="0" width="20" height="22" fill="#222"/>
  
  <!-- Hallway perspective -->
  <!-- Floor -->
  <polygon points="100,450 700,450 500,280 300,280" fill="#0d0b0b" stroke="#1a1515" stroke-width="0.5"/>
  <!-- Left wall -->
  <polygon points="0,450 300,280 300,150 0,100" fill="#0e0c0c" stroke="#1a1515" stroke-width="0.5"/>
  <!-- Right wall -->
  <polygon points="800,450 500,280 500,150 800,100" fill="#0d0b0b" stroke="#1a1515" stroke-width="0.5"/>
  <!-- Ceiling -->
  <polygon points="0,100 300,150 500,150 800,100" fill="#0b0909" stroke="#1a1515" stroke-width="0.5"/>
  
  <!-- Hallway lights (faint, eerie) -->
  <ellipse cx="400" cy="155" rx="120" ry="8" fill="#2a2010" opacity="0.3"/>
  <ellipse cx="400" cy="155" rx="120" ry="8" fill="#ffdd88" opacity="0.05"/>
  
  <!-- Floor tiles (subtle grid) -->
  <line x1="200" y1="350" x2="250" y2="290" stroke="#151212" stroke-width="0.5"/>
  <line x1="300" y1="370" x2="330" y2="300" stroke="#151212" stroke-width="0.5"/>
  <line x1="400" y1="380" x2="400" y2="310" stroke="#151212" stroke-width="0.5"/>
  <line x1="500" y1="370" x2="470" y2="300" stroke="#151212" stroke-width="0.5"/>
  <line x1="600" y1="350" x2="550" y2="290" stroke="#151212" stroke-width="0.5"/>
  
  <!-- Door on right wall -->
  <rect x="580" y="180" width="60" height="100" fill="#0f0d0d" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="590" y="190" width="40" height="30" fill="#111" stroke="#1a1a1a" stroke-width="0.5"/>
  <circle cx="635" cy="235" r="3" fill="#222"/>
  
  <!-- Elevator door on left wall -->
  <rect x="160" y="170" width="70" height="110" fill="#0f0d0d" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="195" y1="170" x2="195" y2="280" stroke="#1a1a1a" stroke-width="0.5"/>
  <circle cx="170" cy="225" r="3" fill="#222"/>
  
  <!-- Faint figure silhouette in hallway (the "other you") -->
  <!-- Head -->
  <circle cx="380" cy="310" r="12" fill="#0a0808" stroke="#1a1515" stroke-width="0.5"/>
  <!-- Body -->
  <path d="M368,322 L365,370 L375,370 L378,340 L382,340 L385,370 L395,370 L392,322" fill="#0a0808" stroke="#1a1515" stroke-width="0.5"/>
  <!-- Arm reaching toward door -->
  <line x1="385" y1="340" x2="420" y2="345" stroke="#0a0808" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Subtle red glow from camera LED on the figure -->
  <circle cx="425" cy="37" r="60" fill="#cc0000" opacity="0.02"/>
  
  <!-- Digital timestamp overlay (creepy detail) -->
  <text x="400" y="420" font-family="monospace" font-size="14" fill="#cc0000" opacity="0.4" text-anchor="middle" letter-spacing="2">
    03:17:00
  </text>
  
  <!-- Scan lines effect (subtle) -->
  <g opacity="0.03">
    <line x1="0" y1="10" x2="800" y2="10" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="20" x2="800" y2="20" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="30" x2="800" y2="30" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="50" x2="800" y2="50" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="60" x2="800" y2="60" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="70" x2="800" y2="70" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="90" x2="800" y2="90" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="110" x2="800" y2="110" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="130" x2="800" y2="130" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="140" x2="800" y2="140" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="170" x2="800" y2="170" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="190" x2="800" y2="190" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="210" x2="800" y2="210" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="220" x2="800" y2="220" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="230" x2="800" y2="230" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="260" x2="800" y2="260" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="270" x2="800" y2="270" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="280" x2="800" y2="280" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="290" x2="800" y2="290" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="310" x2="800" y2="310" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="330" x2="800" y2="330" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="340" x2="800" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="370" x2="800" y2="370" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="380" x2="800" y2="380" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="390" x2="800" y2="390" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="410" x2="800" y2="410" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="420" x2="800" y2="420" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="430" x2="800" y2="430" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="440" x2="800" y2="440" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="450" x2="800" y2="450" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Corner recording indicator -->
  <rect x="20" y="20" width="10" height="10" fill="#cc0000" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="35" y="29" font-family="monospace" font-size="9" fill="#cc0000" opacity="0.4">REC</text>
  
  <!-- Darkness at the far end of hallway -->
  <rect x="350" y="270" width="100" height="15" fill="#050404"/>
</svg>