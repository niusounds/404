<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Forest atmosphere -->
    <radialGradient id="moonlitCone" cx="70%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#d4deff"/>
      <stop offset="30%" stop-color="#607a9f"/>
      <stop offset="100%" stop-color="#080c15"/>
    </radialGradient>
    
    <!-- Dancing glow -->
    <filter id="ghostlyGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#e8daff" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fog -->
    <filter id="fogFilter">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <!-- Dance ring glow -->
    <radialGradient id="danceRing" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff8cc" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#e8aaff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0a30" stop-opacity="0"/>
    </radialGradient>

    <!-- Full moon -->
    <radialGradient id="fullMoon">
      <stop offset="0%" stop-color="#fff8e5"/>
      <stop offset="60%" stop-color="#d4decc"/>
      <stop offset="100%" stop-color="#a0b0bb"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Dark sky / forest overall -->
  <rect width="800" height="450" fill="#070b12"/>

  <!-- Moon beam cone (left side) -->
  <polygon points="620,-50 420,350 820,350" fill="url(#moonlitCone)" opacity="0.4"/>

  <!-- Full moon in upper right -->
  <circle cx="640" cy="65" r="32" fill="rgb(210 225 195)" opacity="0.85" filter="url(#softGlow)"/>
  <circle cx="640" cy="65" r="60" fill="#d0e8bc" opacity="0.07"/>

  <!-- Forest trees - tall dark silhouettes -->
  <!-- Row of thin verticals (trees) in front -->
  <rect x="40" y="80" width="12" height="300" fill="#0a1520" opacity="0.9"/>
  <polygon points="46,40 65,70 46,65 30,70" fill="#0c1a28"/>

  <rect x="95" y="110" width="8" height="280" fill="#0b1b25" opacity="0.85"/>
  
  <rect x="140" y="75" width="15" height="290" fill="#0a1622" opacity="0.9"/>

  <!-- Dense trees on right side -->
  <rect x="262" y="35" width="25" height="400" fill="#070e18" opacity="0.7"/>

  <rect x="280" y="65" width="9" height="300" fill="#0b1620" opacity="0.85"/>
  
  <rect x="375" y="20" width="14" height="400" fill="#060c14" opacity="0.6"/>
  
  <!-- Tree canopy shapes (silhouettes) -->
  <ellipse cx="525" cy="60" rx="90" ry="35" fill="#0d1a28" opacity="0.7"/>
  <rect x="460" y="40" width="130" height="20" rx="3" fill="#0e1c2b" opacity="0.5"/>
  
  <!-- Ground - forest floor -->
  <ellipse cx="400" cy="380" rx="360" ry="40" fill="#0a1018" opacity="0.95"/>

  <!-- Dance circle (glowing) -->
  <ellipse cx="360" cy="280" rx="260" ry="70" fill="url(#danceRing)" opacity="0.4"/>
  <circle cx="410" cy="215" r="70" rx="0" fill="#fff8cc" opacity="0.03"/>

  <!-- Dancing figures - spectral women (5-6) in flowing robes -->
  <g filter="url(#ghostlyGlow)">
    <!-- Figure 1 (leftmost dancer - ghostly white silhouette) -->
    <ellipse cx="180" cy="245" rx="18" ry="45" fill="#fffbe6" opacity="0.7"/>
    <circle cx="180" cy="200" r="9" fill="#fffef0" opacity="0.75"/>
    <!-- Legs (one kicked up - dancing) -->
    <path d="M174,288 Q160,305 155,315" stroke="rgb(300 300 330)" stroke-width="6" opacity="0.6" fill="none"/>
    <!-- Arms (one raised) -->
    <path d="M192,228 L218,205" stroke="#fffbf0" stroke-width="3" opacity="0.5" fill="none"/>
    <path d="M168,228 L146,205" stroke="#fffbe6" stroke-width="3" opacity="0.4" fill="none"/>

    <!-- Figure 2 -->
    <ellipse cx="235" cy="268" rx="16" ry="38" fill="#eef8ff" opacity="0.7"/>
    <circle cx="235" cy="230" r="8.5" fill="#f8ffff" opacity="0.7"/>
    <path d="M230,303 Q218,320 215,318" stroke="#eef8ff" stroke-width="5.5" opacity="0.6" fill="none"/>
    <path d="M247,245 L270,225" stroke="#eef8ff" stroke-width="3" opacity="0.5" fill="none"/>

    <!-- Figure 3 - center (slightly larger / brighter) -->
    <ellipse cx="310" cy="260" rx="20" ry="48" fill="#fffdef" opacity="0.75"/>
    <circle cx="310" cy="215" r="10" fill="#ffffff" opacity="0.75"/>
    <path d="M305,305 Q290,325 281,328" stroke="#fffef4" stroke-width="6" opacity="0.7" fill="none"/>
    <path d="M328,233 L355,208" stroke="#fffdf0" stroke-width="3.5" opacity="0.55" fill="none"/>

    <!-- Figure 4 -->
    <ellipse cx="395" cy="270" rx="17" ry="43" fill="#f8ffff" opacity="0.7"/>
    <circle cx="395" cy="225" r="9" fill="#ffffff" opacity="0.65"/>
    <path d="M388,310 Q374,328 369,325" stroke="#f8fffe" stroke-width="5.5" opacity="0.6" fill="none"/>

    <!-- Figure 5 (rightmost) -->
    <ellipse cx="465" cy="275" rx="15" ry="40" fill="#eef2ff" opacity="0.65"/>
    <circle cx="465" cy="237" r="8" fill="#fafffe" opacity="0.65"/>

    <!-- Figure 6 (smaller / more distant) -->
    <ellipse cx="520" cy="310" rx="12" ry="30" fill="#eef4ff" opacity="0.55"/>
    <circle cx="520" cy="283" r="6" fill="#fafffe" opacity="0.6"/>
  </g>

  <!-- Dance ring trail / musical notes visualized as small dots -->
  <circle cx="170" cy="300" r="1.5" fill="#fff4aa" opacity="0.5"/>
  <circle cx="210" cy="260" r="1.8" fill="#fff4aa" opacity="0.7"/>
  <circle cx="290" cy="310" r="2" fill="#ffe8cc" opacity="0.6"/>
  <circle cx="350" cy="330" r="1.5" fill="#ffc3aa" opacity="0.4"/>
  <circle cx="490" cy="310" r="2" fill="#ffe8cc" opacity="0.5"/>

  <!-- Fog at bottom of image -->
  <ellipse cx="670" cy="445" rx="180" ry="30" fill="#1a2a44" opacity="0.5" filter="url(#fogFilter)"/>
  
  <!-- More fog patches - left side mist on forest floor -->
  <ellipse cx="450" cy="395" rx="280" ry="30" fill="#fffefb" opacity="0.06" filter="url(#fogFilter)" />

  <!-- Title overlay -->
  <text x="400" y="165" text-anchor="middle" font-family="'Georgia','Times New Roman',serif" 
        fill="#d8cce8" font-size="27" font-style="italic" opacity="0.75">
    DANCING UNDER THE FULL MOON
  </text>

  <!-- Gothic frame -->
  <rect x="16" y="16" width="768" height="418" rx="3" fill="none" stroke="#2c1a55" stroke-width="2.5"/>
  <rect x="24" y="24" width="752" height="402" rx="3" fill="none" stroke="#d8cce8" stroke-width="0.5" opacity="0.25"/>

  <!-- Decorative corners (gothic style) -->
  <path d="M16,40 L36,32 L16,28 M16,44 L36,40" stroke="#d8cce8" stroke-width="0.7" fill="none" opacity="0.3"/>
  <path d="M792,44 L772,40 L792,32 M792,38 L772,46" stroke="#d8cce8" stroke-width="0.7" fill="none" opacity="0.3"/>

</svg>
