<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle moon glow top-right -->
  <circle cx="680" cy="80" r="60" fill="#1a1510" opacity="0.4"/>
  <circle cx="680" cy="80" r="40" fill="#252018" opacity="0.3"/>
  <circle cx="680" cy="80" r="25" fill="#2e2820" opacity="0.5"/>
  
  <!-- Postal building silhouette -->
  <rect x="250" y="180" width="300" height="220" fill="#0e0c0c" stroke="#1a1616" stroke-width="1"/>
  <!-- Roof -->
  <polygon points="240,180 400,120 560,180" fill="#0c0a0a" stroke="#1a1616" stroke-width="1"/>
  <!-- Postal emblem circle -->
  <circle cx="400" cy="150" r="15" fill="#1a1815" stroke="#2a2420" stroke-width="1"/>
  <text x="400" y="155" text-anchor="middle" fill="#3a3428" font-size="12" font-family="sans-serif">〒</text>
  
  <!-- Windows - some lit -->
  <rect x="290" y="210" width="40" height="50" fill="#1e1a14" stroke="#2a2420" stroke-width="0.5"/>
  <rect x="350" y="210" width="40" height="50" fill="#1e1a14" stroke="#2a2420" stroke-width="0.5"/>
  <rect x="410" y="210" width="40" height="50" fill="#2a2418" stroke="#2a2420" stroke-width="0.5"/>
  <rect x="470" y="210" width="40" height="50" fill="#1e1a14" stroke="#2a2420" stroke-width="0.5"/>
  <!-- Door -->
  <rect x="370" y="320" width="60" height="80" fill="#0e0c0c" stroke="#1a1616" stroke-width="1"/>
  
  <!-- Ground -->
  <rect x="0" y="400" width="800" height="50" fill="#080606"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#141010" stroke-width="1"/>
  
  <!-- Road lines -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#1a1612" stroke-width="0.5" stroke-dasharray="15,10"/>
  
  <!-- Floating envelope in the sky (ominous) -->
  <g transform="translate(400, 60) rotate(-15)" opacity="0.6">
    <rect x="-25" y="-15" width="50" height="30" fill="none" stroke="#3a3028" stroke-width="1"/>
    <line x1="-25" y1="-15" x2="25" y2="0" stroke="#3a3028" stroke-width="0.5"/>
    <line x1="25" y1="-15" x2="-25" y2="0" stroke="#3a3028" stroke-width="0.5"/>
  </g>
  
  <!-- Second envelope, lower left -->
  <g transform="translate(120, 280) rotate(10)" opacity="0.35">
    <rect x="-20" y="-12" width="40" height="24" fill="none" stroke="#2e2820" stroke-width="0.8"/>
    <line x1="-20" y1="-12" x2="20" y2="0" stroke="#2e2820" stroke-width="0.4"/>
    <line x1="20" y1="-12" x2="-20" y2="0" stroke="#2e2820" stroke-width="0.4"/>
  </g>
  
  <!-- Third envelope, lower right -->
  <g transform="translate(680, 300) rotate(-8)" opacity="0.3">
    <rect x="-18" y="-11" width="36" height="22" fill="none" stroke="#2e2820" stroke-width="0.8"/>
    <line x1="-18" y1="-11" x2="18" y2="0" stroke="#2e2820" stroke-width="0.4"/>
    <line x1="18" y1="-11" x2="-18" y2="0" stroke="#2e2820" stroke-width="0.4"/>
  </g>
  
  <!-- Distant mountains -->
  <polygon points="0,400 80,320 160,360 240,300 320,340 400,280 480,330 560,290 640,350 720,310 800,370 800,400" fill="#0c0a0a" opacity="0.8"/>
  
  <!-- Subtle fog at bottom -->
  <rect x="0" y="370" width="800" height="30" fill="#0a0808" opacity="0.5"/>
  
  <!-- Tiny name on one envelope -->
  <g transform="translate(400, 60) rotate(-15)" opacity="0.4">
    <text x="0" y="4" text-anchor="middle" fill="#4a4030" font-size="7" font-family="sans-serif">宛</text>
  </g>
  
  <!-- Stars -->
  <circle cx="100" cy="40" r="1" fill="#3a3428" opacity="0.5"/>
  <circle cx="200" cy="25" r="0.8" fill="#3a3428" opacity="0.4"/>
  <circle cx="550" cy="50" r="1" fill="#3a3428" opacity="0.3"/>
  <circle cx="750" cy="120" r="0.7" fill="#3a3428" opacity="0.3"/>
  <circle cx="50" cy="150" r="0.6" fill="#3a3428" opacity="0.25"/>
</svg>
