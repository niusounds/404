<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle vignette -->
  <ellipse cx="400" cy="225" rx="350" ry="200" fill="#050305" opacity="0.5" filter="url(#blur2)"/>

  <!-- Phone silhouette -->
  <rect x="300" y="30" width="200" height="390" rx="20" ry="20" fill="url(#phoneBody)" stroke="#3a3a4a" stroke-width="1"/>

  <!-- Phone screen -->
  <rect x="312" y="50" width="176" height="340" rx="4" ry="4" fill="#0d0d1a"/>

  <!-- Screen content: gallery grid -->
  <g opacity="0.6">
    <!-- Thumbnail grid - 2x4 -->
    <rect x="318" y="56" width="78" height="78" rx="2" fill="#151525" stroke="#252535" stroke-width="0.5"/>
    <rect x="404" y="56" width="78" height="78" rx="2" fill="#151525" stroke="#252535" stroke-width="0.5"/>
    <rect x="318" y="140" width="78" height="78" rx="2" fill="#151525" stroke="#252535" stroke-width="0.5"/>
    <rect x="404" y="140" width="78" height="78" rx="2" fill="#151525" stroke="#252535" stroke-width="0.5"/>
    <rect x="318" y="224" width="78" height="78" rx="2" fill="#151525" stroke="#252535" stroke-width="0.5"/>
    <rect x="404" y="224" width="78" height="78" rx="2" fill="#151525" stroke="#252535" stroke-width="0.5"/>
    <rect x="318" y="308" width="78" height="78" rx="2" fill="#151525" stroke="#252535" stroke-width="0.5"/>
    <rect x="404" y="308" width="78" height="78" rx="2" fill="#151525" stroke="#252535" stroke-width="0.5"/>
  </g>

  <!-- Highlighted selected photo: window view from outside -->
  <rect x="318" y="56" width="78" height="78" rx="2" fill="#1a1a30" stroke="#4a3a3a" stroke-width="1.5"/>

  <!-- On highlighted photo: faint window silhouette -->
  <g filter="url(#blur1)" opacity="0.4">
    <!-- Window frame -->
    <rect x="330" y="68" width="55" height="55" fill="none" stroke="#5a4a4a" stroke-width="0.8"/>
    <!-- Curtains -->
    <path d="M332,68 Q345,95 332,123" fill="none" stroke="#4a3a3a" stroke-width="0.5"/>
    <path d="M385,68 Q372,95 385,123" fill="none" stroke="#4a3a3a" stroke-width="0.5"/>
    <!-- Red LED dot -->
    <circle cx="395" cy="115" r="2" fill="#8b0000"/>
    <circle cx="395" cy="115" r="4" fill="#8b0000" opacity="0.3"/>
  </g>

  <!-- Phone home indicator -->
  <rect x="375" y="412" width="50" height="3" rx="1.5" fill="#4a4a5a" opacity="0.5"/>

  <!-- Red LED glow on phone body -->
  <circle cx="400" cy="425" r="3" fill="#8b0000" opacity="0.8"/>
  <circle cx="400" cy="425" r="8" fill="#8b0000" opacity="0.2"/>
  <circle cx="400" cy="425" r="15" fill="#8b0000" opacity="0.05"/>

  <!-- Eerie text at bottom -->
  <text x="400" y="445" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3a2a2a" letter-spacing="4">撮っておいた</text>

  <!-- Subtle scanning lines effect -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="0.5"/>
  </g>
</svg>