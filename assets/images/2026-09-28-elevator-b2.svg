<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Elevator frame (left side) -->
  <rect x="20" y="30" width="180" height="390" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Elevator interior - dim emergency light -->
  <rect x="25" y="35" width="170" height="380" fill="#1a1815"/>
  
  <!-- Emergency light glow -->
  <ellipse cx="110" cy="50" rx="40" ry="15" fill="#3a3020" opacity="0.3"/>
  
  <!-- Elevator floor -->
  <rect x="25" y="370" width="170" height="45" fill="#151310"/>
  
  <!-- Water drip trail from elevator floor into parking lot -->
  <circle cx="200" cy="395" r="2" fill="#2a2525" opacity="0.6"/>
  <circle cx="215" cy="398" r="1.5" fill="#2a2525" opacity="0.5"/>
  <circle cx="230" cy="400" r="2" fill="#2a2525" opacity="0.4"/>
  <circle cx="250" cy="403" r="1.5" fill="#2a2525" opacity="0.3"/>
  <circle cx="270" cy="405" r="2" fill="#2a2525" opacity="0.3"/>
  <circle cx="295" cy="408" r="1.5" fill="#2a2525" opacity="0.25"/>
  <circle cx="320" cy="410" r="2" fill="#2a2525" opacity="0.2"/>
  <circle cx="350" cy="412" r="1.5" fill="#2a2525" opacity="0.15"/>
  <circle cx="380" cy="414" r="2" fill="#2a2525" opacity="0.12"/>
  
  <!-- Parking lot floor -->
  <rect x="200" y="350" width="600" height="100" fill="#0d0b0b"/>
  
  <!-- Parking lot ceiling lines -->
  <line x1="200" y1="350" x2="800" y2="350" stroke="#151212" stroke-width="2"/>
  
  <!-- Parking lot pillars -->
  <rect x="350" y="350" width="18" height="100" fill="#121010"/>
  <rect x="520" y="350" width="18" height="100" fill="#121010"/>
  <rect x="690" y="350" width="18" height="100" fill="#121010"/>
  
  <!-- Parked cars - silhouettes -->
  <!-- Car 1 - far left -->
  <rect x="230" y="340" width="90" height="55" rx="8" fill="#141212"/>
  <rect x="245" y="330" width="60" height="20" rx="5" fill="#161414"/>
  <circle cx="250" cy="398" r="8" fill="#1a1818" stroke="#222020" stroke-width="1"/>
  <circle cx="305" cy="398" r="8" fill="#1a1818" stroke="#222020" stroke-width="1"/>
  
  <!-- Car 2 - center -->
  <rect x="400" y="335" width="100" height="60" rx="10" fill="#131111"/>
  <rect x="415" y="325" width="70" height="20" rx="6" fill="#151313"/>
  <circle cx="420" cy="398" r="9" fill="#191717" stroke="#211f1f" stroke-width="1"/>
  <circle cx="485" cy="398" r="9" fill="#191717" stroke="#211f1f" stroke-width="1"/>
  
  <!-- Car 3 - right -->
  <rect x="580" y="338" width="85" height="57" rx="8" fill="#121010"/>
  <rect x="595" y="328" width="55" height="18" rx="5" fill="#141212"/>
  <circle cx="595" cy="398" r="8" fill="#181616" stroke="#201e1e" stroke-width="1"/>
  <circle cx="648" cy="398" r="8" fill="#181616" stroke="#201e1e" stroke-width="1"/>
  
  <!-- Distant flashlight glow behind cars -->
  <circle cx="620" cy="355" r="25" fill="#2a2518" opacity="0.15"/>
  <circle cx="620" cy="355" r="12" fill="#3a3020" opacity="0.2"/>
  <circle cx="620" cy="355" r="5" fill="#4a4030" opacity="0.25"/>
  
  <!-- Floor markings -->
  <line x1="300" y1="370" x2="340" y2="370" stroke="#1a1818" stroke-width="1" opacity="0.5"/>
  <line x1="470" y1="370" x2="510" y2="370" stroke="#1a1818" stroke-width="1" opacity="0.5"/>
  <line x1="660" y1="370" x2="700" y2="370" stroke="#1a1818" stroke-width="1" opacity="0.5"/>
  
  <!-- Wet floor reflection under flashlight -->
  <ellipse cx="620" cy="385" rx="30" ry="5" fill="#1e1a15" opacity="0.15"/>
  
  <!-- Footprints (subtle) -->
  <ellipse cx="260" cy="405" rx="6" ry="3" fill="#1a1818" opacity="0.2"/>
  <ellipse cx="275" cy="408" rx="6" ry="3" fill="#1a1818" opacity="0.18"/>
  <ellipse cx="292" cy="411" rx="6" ry="3" fill="#1a1818" opacity="0.15"/>
  <ellipse cx="310" cy="414" rx="6" ry="3" fill="#1a1818" opacity="0.12"/>
  <ellipse cx="330" cy="416" rx="6" ry="3" fill="#1a1818" opacity="0.1"/>
  
  <!-- Dim overhead parking lights -->
  <ellipse cx="280" cy="348" rx="3" ry="2" fill="#2a2518" opacity="0.1"/>
  <ellipse cx="460" cy="348" rx="3" ry="2" fill="#2a2518" opacity="0.08"/>
  <ellipse cx="640" cy="348" rx="3" ry="2" fill="#2a2518" opacity="0.06"/>
  
  <!-- B2 sign (faint) -->
  <rect x="440" y="352" width="40" height="14" rx="2" fill="#1a1a1a" opacity="0.4"/>
  <text x="460" y="363" text-anchor="middle" fill="#3a3a3a" font-size="9" font-family="monospace">B2</text>
  
  <!-- Elevator button panel -->
  <rect x="170" y="150" width="22" height="120" rx="2" fill="#222222"/>
  <circle cx="181" cy="165" r="4" fill="#3a3a3a"/>
  <circle cx="181" cy="185" r="4" fill="#3a3a3a"/>
  <circle cx="181" cy="205" r="4" fill="#3a3a3a"/>
  <circle cx="181" cy="225" r="4" fill="#3a3a3a"/>
  <circle cx="181" cy="245" r="4" fill="#3a3a3a"/>
  <circle cx="181" cy="265" r="4" fill="#3a3a3a"/>
  <circle cx="181" cy="285" r="4" fill="#3a3a3a"/>
  <circle cx="181" cy="305" r="4" fill="#3a3a3a"/>
  <circle cx="181" cy="325" r="4" fill="#3a3a3a" stroke="#4a4a4a" stroke-width="1"/>
  
  <!-- Water drops near elevator threshold -->
  <ellipse cx="195" cy="375" rx="1.5" ry="1" fill="#2a2525" opacity="0.5"/>
  <ellipse cx="198" cy="380" rx="1" ry="0.8" fill="#2a2525" opacity="0.4"/>
</svg>
