<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="doorLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Subtle wall texture -->
  <rect x="0" y="0" width="800" height="450" fill="url(#doorLight)" opacity="0.3"/>

  <!-- Door frame -->
  <rect x="280" y="20" width="240" height="410" fill="#1a1510" stroke="#2a2018" stroke-width="1"/>

  <!-- Door surface -->
  <rect x="290" y="25" width="220" height="400" fill="#1e1812"/>

  <!-- Door panel lines -->
  <rect x="300" y="50" width="200" height="140" fill="none" stroke="#2a2218" stroke-width="1.5" rx="3"/>
  <rect x="300" y="260" width="200" height="155" fill="none" stroke="#2a2218" stroke-width="1.5" rx="3"/>

  <!-- Door crack - small gap -->
  <rect x="508" y="30" width="2" height="395" fill="#1a1210"/>

  <!-- Light leaking through crack -->
  <rect x="506" y="30" width="6" height="395" fill="#2a1a1a" opacity="0.6" filter="url(#softGlow)"/>
  <rect x="507" y="30" width="3" height="395" fill="#3a2020" opacity="0.4" filter="url(#glow)"/>

  <!-- Smart lock body -->
  <rect x="395" y="185" width="50" height="80" rx="8" fill="#2a2520" stroke="#3a3530" stroke-width="1"/>

  <!-- Smart lock screen -->
  <rect x="405" y="195" width="30" height="22" rx="3" fill="#0d0a0a"/>

  <!-- Screen glow - red warning circle -->
  <circle cx="420" cy="206" r="6" fill="#4a1a1a" opacity="0.8" filter="url(#glow)"/>
  <circle cx="420" cy="206" r="3" fill="#6a2020" opacity="0.6"/>

  <!-- Smart lock keypad dots -->
  <circle cx="412" cy="230" r="2" fill="#3a3530"/>
  <circle cx="420" cy="230" r="2" fill="#3a3530"/>
  <circle cx="428" cy="230" r="2" fill="#3a3530"/>
  <circle cx="412" cy="238" r="2" fill="#3a3530"/>
  <circle cx="420" cy="238" r="2" fill="#3a3530"/>
  <circle cx="428" cy="238" r="2" fill="#3a3530"/>
  <circle cx="412" cy="246" r="2" fill="#3a3530"/>
  <circle cx="420" cy="246" r="2" fill="#3a3530"/>
  <circle cx="428" cy="246" r="2" fill="#3a3530"/>

  <!-- Door handle -->
  <rect x="490" y="220" width="25" height="6" rx="3" fill="#3a3530"/>
  <rect x="490" y="230" width="25" height="6" rx="3" fill="#3a3530"/>

  <!-- Fingers reaching through the crack -->
  <!-- Finger 1 - index -->
  <path d="M512,160 Q520,155 528,158 Q535,160 532,165 Q528,168 520,165 Q514,163 512,160Z" fill="#1a1512" opacity="0.9"/>
  <path d="M513,160 Q520,156 527,159" fill="none" stroke="#2a2018" stroke-width="0.5" opacity="0.5"/>

  <!-- Finger 2 - middle -->
  <path d="M512,185 Q522,180 530,183 Q537,186 534,190 Q530,193 522,190 Q514,188 512,185Z" fill="#1a1512" opacity="0.85"/>
  <path d="M513,185 Q522,181 529,184" fill="none" stroke="#2a2018" stroke-width="0.5" opacity="0.5"/>

  <!-- Finger 3 - ring -->
  <path d="M512,210 Q520,206 527,209 Q533,212 530,216 Q526,218 520,216 Q514,213 512,210Z" fill="#1a1512" opacity="0.8"/>

  <!-- Finger 4 - pinky -->
  <path d="M512,235 Q518,232 523,234 Q528,236 526,239 Q523,241 518,239 Q513,238 512,235Z" fill="#1a1512" opacity="0.75"/>

  <!-- Thumb -->
  <path d="M510,260 Q518,255 525,258 Q530,261 528,265 Q524,268 518,265 Q512,263 510,260Z" fill="#1a1512" opacity="0.7"/>

  <!-- Light glow around fingers -->
  <ellipse cx="525" cy="200" rx="15" ry="50" fill="#3a1a1a" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Subtle chain lock silhouette at door crack -->
  <rect x="506" y="140" width="8" height="4" rx="2" fill="#2a2520"/>
  <rect x="506" y="150" width="8" height="4" rx="2" fill="#2a2520"/>
  <rect x="506" y="160" width="8" height="4" rx="2" fill="#2a2520"/>

  <!-- Atmosphere - subtle vignette -->
  <rect x="0" y="0" width="800" height="450" fill="none"/>
  <rect x="0" y="0" width="200" height="450" fill="#0a0808" opacity="0.3"/>
  <rect x="600" y="0" width="200" height="450" fill="#0a0808" opacity="0.3"/>
  <rect x="0" y="0" width="800" height="80" fill="#0a0808" opacity="0.2"/>
  <rect x="0" y="370" width="800" height="80" fill="#0a0808" opacity="0.2"/>

  <!-- Tiny detail: a faint phone screen glow on the floor -->
  <ellipse cx="650" cy="380" rx="40" ry="15" fill="#1a1a2a" opacity="0.15" filter="url(#softGlow)"/>
  <rect x="635" y="370" width="30" height="18" rx="3" fill="#1a1a2a" opacity="0.2"/>
</svg>