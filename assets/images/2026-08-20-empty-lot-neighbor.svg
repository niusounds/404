<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="moonGlow" cx="75%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <radialGradient id="moonLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2535" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  <rect width="800" height="450" fill="url(#moonGlow)"/>

  <!-- Moon -->
  <circle cx="620" cy="80" r="35" fill="#d4c8a0" opacity="0.9"/>
  <circle cx="620" cy="80" r="35" fill="none" stroke="#1a1520" stroke-width="0.5" opacity="0.3"/>
  <circle cx="635" cy="75" r="38" fill="url(#moonLight)"/>

  <!-- Moon glow on ground -->
  <ellipse cx="620" cy="380" rx="200" ry="40" fill="#1a1520" opacity="0.15"/>

  <!-- Sky gradient line (horizon) -->
  <line x1="0" y1="280" x2="800" y2="280" stroke="#15101a" stroke-width="0.5" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="280" width="800" height="170" fill="#0d0a0a"/>

  <!-- Empty lot area (center) -->
  <rect x="250" y="280" width="300" height="170" fill="#110e0e" opacity="0.8"/>

  <!-- Concrete foundation of empty lot -->
  <rect x="270" y="320" width="260" height="8" fill="#1a1616" rx="1"/>
  <rect x="280" y="330" width="240" height="3" fill="#1a1616" rx="1" opacity="0.6"/>

  <!-- Blue tarp (torn) -->
  <path d="M300,310 L500,308 L510,340 L290,338 Z" fill="#1a2040" opacity="0.25"/>
  <path d="M480,308 L510,340 L505,342 L475,310" fill="none" stroke="#2a3050" stroke-width="0.5" opacity="0.3"/>

  <!-- Footprints leading from empty lot toward house (left side) -->
  <!-- Footprint 1 (in empty lot) -->
  <ellipse cx="380" cy="350" rx="4" ry="7" fill="#1a1618" opacity="0.7"/>
  <ellipse cx="395" cy="345" rx="4" ry="7" fill="#1a1618" opacity="0.7"/>
  <!-- Footprint 2 -->
  <ellipse cx="360" cy="360" rx="4" ry="7" fill="#1a1618" opacity="0.6"/>
  <ellipse cx="375" cy="355" rx="4" ry="7" fill="#1a1618" opacity="0.6"/>
  <!-- Footprint 3 -->
  <ellipse cx="340" cy="368" rx="4" ry="7" fill="#1a1618" opacity="0.5"/>
  <ellipse cx="355" cy="363" rx="4" ry="7" fill="#1a1618" opacity="0.5"/>
  <!-- Footprint 4 -->
  <ellipse cx="320" cy="375" rx="4" ry="7" fill="#1a1618" opacity="0.4"/>
  <ellipse cx="335" cy="370" rx="4" ry="7" fill="#1a1618" opacity="0.4"/>
  <!-- Footprint 5 (near house) -->
  <ellipse cx="300" cy="380" rx="4" ry="7" fill="#1a1618" opacity="0.3"/>
  <ellipse cx="315" cy="376" rx="4" ry="7" fill="#1a1618" opacity="0.3"/>
  <!-- Footprint 6 (at house edge) -->
  <ellipse cx="280" cy="383" rx="4" ry="7" fill="#1a1618" opacity="0.25"/>

  <!-- House silhouette (left side, viewed from outside) -->
  <!-- Main body -->
  <rect x="0" y="180" width="120" height="100" fill="#0e0c0c"/>
  <!-- Roof -->
  <polygon points="0,180 60,130 120,180" fill="#0e0c0c"/>
  <!-- Window (lit, facing the empty lot) -->
  <rect x="40" y="210" width="30" height="25" fill="#1a1510" rx="1"/>
  <rect x="42" y="212" width="26" height="21" fill="#2a2015" opacity="0.6"/>
  <!-- Window light glow on ground -->
  <polygon points="40,235 70,235 90,280 20,280" fill="#2a2015" opacity="0.05"/>

  <!-- Second window (dark) -->
  <rect x="80" y="210" width="25" height="25" fill="#0a0a0a" rx="1"/>

  <!-- Fence (between house and empty lot) -->
  <line x1="120" y1="280" x2="120" y2="350" stroke="#1a1616" stroke-width="2"/>
  <line x1="140" y1="280" x2="140" y2="350" stroke="#1a1616" stroke-width="2"/>
  <line x1="160" y1="280" x2="160" y2="350" stroke="#1a1616" stroke-width="2"/>
  <line x1="120" y1="300" x2="160" y2="300" stroke="#1a1616" stroke-width="1.5"/>
  <line x1="120" y1="320" x2="160" y2="320" stroke="#1a1616" stroke-width="1.5"/>

  <!-- Fence gap (footprints go through) -->
  <rect x="155" y="280" width="10" height="70" fill="#0a0808"/>

  <!-- Fence posts continuing -->
  <line x1="170" y1="280" x2="170" y2="350" stroke="#1a1616" stroke-width="2"/>
  <line x1="190" y1="280" x2="190" y2="350" stroke="#1a1616" stroke-width="2"/>

  <!-- Distant trees (right side, barely visible) -->
  <path d="M550,280 L560,240 L570,260 L580,230 L590,260 L600,245 L610,280" fill="#0c0a0a" opacity="0.6"/>
  <path d="M650,280 L655,250 L665,265 L670,240 L680,260 L685,280" fill="#0c0a0a" opacity="0.4"/>

  <!-- Stars (few, faint) -->
  <circle cx="100" cy="50" r="1" fill="#3a3545" opacity="0.4"/>
  <circle cx="200" cy="30" r="0.8" fill="#3a3545" opacity="0.3"/>
  <circle cx="350" cy="60" r="1" fill="#3a3545" opacity="0.35"/>
  <circle cx="450" cy="40" r="0.7" fill="#3a3545" opacity="0.25"/>
  <circle cx="520" cy="55" r="0.9" fill="#3a3545" opacity="0.3"/>
  <circle cx="700" cy="45" r="0.8" fill="#3a3545" opacity="0.3"/>

  <!-- Fog/mist at ground level -->
  <ellipse cx="400" cy="390" rx="350" ry="15" fill="#151015" opacity="0.15" filter="url(#blur1)"/>
  <ellipse cx="200" cy="400" rx="200" ry="10" fill="#151015" opacity="0.1" filter="url(#blur1)"/>

  <!-- Subtle vignette -->
  <rect width="800" height="450" fill="url(#moonGlow)" opacity="0.5"/>
</svg>
