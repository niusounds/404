<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Floor -->
  <rect x="0" y="320" width="800" height="130" fill="#0d0a0a"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1a1515" stroke-width="1"/>

  <!-- Wall -->
  <rect x="0" y="0" width="800" height="320" fill="#0e0b0b"/>

  <!-- Window on the right wall - showing moonlight -->
  <rect x="580" y="60" width="160" height="200" fill="#0a1018" rx="2"/>
  <rect x="585" y="65" width="70" height="90" fill="#111828"/>
  <circle cx="620" cy="100" r="18" fill="#1a2540" opacity="0.8"/>
  <circle cx="625" cy="95" r="14" fill="#1a2540" opacity="0.3"/>
  <!-- Window frame -->
  <line x1="655" y1="65" x2="655" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="585" y1="110" x2="655" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="655" y1="65" x2="735" y2="65" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="655" y1="155" x2="735" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="585" y1="65" x2="585" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="735" y1="65" x2="735" y2="155" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Moonlight beam on floor -->
  <polygon points="580,260 740,260 700,320 540,320" fill="#0d1525" opacity="0.3"/>

  <!-- Bed - left side of room -->
  <!-- Bed frame -->
  <rect x="60" y="260" width="300" height="8" fill="#1a1510" rx="1"/>
  <rect x="60" y="268" width="8" height="52" fill="#1a1510"/>
  <rect x="352" y="268" width="8" height="52" fill="#1a1510"/>
  <!-- Mattress -->
  <rect x="65" y="240" width="290" height="24" fill="#1a1818" rx="3"/>
  <!-- Blanket -->
  <rect x="120" y="235" width="230" height="30" fill="#151218" rx="2"/>
  <!-- Pillow -->
  <rect x="75" y="225" width="55" height="20" fill="#1e1a1e" rx="10"/>

  <!-- Bookshelf on far right wall -->
  <rect x="740" y="100" width="30" height="220" fill="#12100f" rx="1"/>
  <line x1="740" y1="155" x2="770" y2="155" stroke="#1a1818" stroke-width="1"/>
  <line x1="740" y1="210" x2="770" y2="210" stroke="#1a1818" stroke-width="1"/>
  <line x1="740" y1="265" x2="770" y2="265" stroke="#1a1818" stroke-width="1"/>
  <!-- Books as rectangles -->
  <rect x="743" y="120" width="6" height="33" fill="#1a1520"/>
  <rect x="751" y="125" width="5" height="28" fill="#1a1818"/>
  <rect x="758" y="115" width="7" height="38" fill="#181522"/>

  <!-- Security camera on ceiling -->
  <rect x="380" y="15" width="40" height="12" fill="#1a1a1a" rx="3"/>
  <circle cx="400" cy="27" r="4" fill="#222"/>
  <!-- Red LED - the key horror element -->
  <circle cx="400" cy="27" r="3" fill="#cc0000">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="27" r="6" fill="#cc0000" opacity="0.15">
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Camera wire -->
  <line x1="395" y1="15" x2="395" y2="0" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Shadow figure under the bed - the horror -->
  <!-- Dark area under bed -->
  <rect x="68" y="290" width="284" height="30" fill="#060404"/>

  <!-- The white shoe emerging from under the bed -->
  <g transform="translate(280, 285) rotate(-15)">
    <ellipse cx="0" cy="0" rx="25" ry="10" fill="#d8d4d0" opacity="0.9"/>
    <ellipse cx="-12" cy="2" rx="8" ry="5" fill="#e0dcd8" opacity="0.7"/>
    <ellipse cx="15" cy="-2" rx="10" ry="6" fill="#c8c4c0" opacity="0.8"/>
  </g>

  <!-- Something dark behind the shoe - the creature -->
  <ellipse cx="300" cy="295" rx="35" ry="18" fill="#080606" opacity="0.9"/>
  <ellipse cx="310" cy="290" rx="20" ry="12" fill="#0a0808" opacity="0.85"/>
  <!-- Eyes - barely visible -->
  <circle cx="305" cy="288" r="2" fill="#1a1515"/>
  <circle cx="315" cy="289" r="1.5" fill="#1a1515"/>

  <!-- Subtle red glow from camera LED reflecting on the floor -->
  <ellipse cx="400" cy="340" rx="60" ry="15" fill="#cc0000" opacity="0.03"/>

  <!-- Dark vignette effect -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" opacity="0.5"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Very subtle grain texture overlay -->
  <rect x="0" y="0" width="800" height="450" fill="#0a0808" opacity="0.02"/>
</svg>
