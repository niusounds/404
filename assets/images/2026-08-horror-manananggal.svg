<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="moonGlow" cx="70%" cy="30%">
      <stop offset="0%" stop-color="#ffdd88"/>
      <stop offset="60%" stop-color="#665511"/>
      <stop offset="100%" stop-color="#2a1108"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Moonlight gradient wash -->
  <circle cx="620" cy="130" r="200" fill="url(#moonGlow)" opacity="0.6"/>
  
  <!-- Rain/lines for atmosphere -->
  <line x1="50" y1="80" x2="45" y2="160" stroke="#1a1a1a" stroke-width="0.7" opacity="0.5"/>
  <line x1="300" y1="50" x2="295" y2="130" stroke="#1a1a1a" stroke-width="0.6" opacity="0.4"/>
  <line x1="700" y1="40" x2="695" y2="120" stroke="#1a1a1a" stroke-width="0.6" opacity="0.3"/>
  <line x1="600" y1="60" x2="597" y2="140" stroke="#1a1a1a" stroke-width="0.5" opacity="0.4"/>

  <!-- Silhouette: torn figure with wings raised at back -->
  <g transform="translate(540,60)">
    <!-- Upper body (torso/head) hovering in air -->
    <ellipse cx="80" cy="50" rx="18" ry="24" fill="#1a0f0b"/>
    <!-- Head silhouette -->
    <circle cx="80" cy="35" r="14" fill="#1e0c06"/>
    <!-- Neck stump (split line) -->
    <rect x="72" y="58" width="16" height="4" fill="#ff3333" opacity="0.7"/>
    <rect x="73" y="62" width="2" height="6" fill="#ff0000" opacity="0.9"/>
    <rect x="85" y="60" width="2" height="4" fill="#cc1111" opacity="0.8"/>

    <!-- Wings spread behind body (left wing) -->
    <path d="M 80,40 Q 30,20 10,50 Q 30,70 M 10,50 L 60,90" 
          fill="#0f0a06" stroke="#3d001a" stroke-width="1.2" opacity="0.8"/>
    <!-- Left wing detail -->
    <path d="M 75,40 Q 20,10 0,45" fill="none" stroke="#2b000f" stroke-width="0.6" opacity="0.6"/>

    <!-- Wings spread behind body (right wing) -->
    <path d="M 80,40 Q 130,20 150,50 Q 130,70 M 150,50 L 100,90" 
          fill="#0f0a06" stroke="#3d001a" stroke-width="1.2" opacity="0.8"/>
    <!-- Right wing detail -->
    <path d="M 85,40 Q 140,10 160,45" fill="none" stroke="#2b000f" stroke-width="0.6" opacity="0.6"/>

    <!-- Organs dangling below the upper body -->
    <path d="M 80,70 Q 65,90 75,110" fill="none" stroke="#ff3344" stroke-width="2.5" opacity="0.85"/>
    <ellipse cx="72" cy="115" rx="10" ry="7" fill="#cc2233" opacity="0.9"/>
    <!-- Second organ strand -->
    <path d="M 76,70 Q 45,85 60,115" fill="none" stroke="#ff4455" stroke-width="2" opacity="0.8"/>
    <ellipse cx="55" cy="120" rx="7" ry="5" fill="#cc3344" opacity="0.9"/>
  </g>

  <!-- Lower body on the ground below, separated -->
  <g transform="translate(180,310)">
    <!-- Female silhouette lying supine (back turned) -->
    <ellipse cx="25" cy="40" rx="20" ry="32" fill="#120806"/>
    <!-- Legs extended downward -->
    <rect x="15" y="72" width="20" height="40" rx="10" fill="#0f0605"/>
    <ellipse cx="25" cy="115" rx="18" ry="3" fill="#0a0403"/>

    <!-- Blood seep -->
    <ellipse cx="15" cy="95" rx="4" ry="4" fill="#cc0000" opacity="0.7"/>
    <path d="M 12,100 Q 8,115 16,130" fill="none" stroke="#991111" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Textured ground seep -->
    <ellipse cx="45" cy="75" rx="25" ry="8" fill="#cc0a0a" opacity="0.5"/>

    <!-- Hair flowing -->
    <path d="M 23,10 Q 10,5 -5,20" stroke="#222" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M 27,8 Q 40,-2 55,15" stroke="#222" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Eyes open wide (horror) -->
    <circle cx="18" cy="38" r="2.5" fill="#ff5555" filter="blur(0.5)" opacity="0.9"/>
    <ellipse cx="30" cy="36" rx="2.5" ry="3" fill="#ff4466" filter="blur(0.5)" opacity="0.7"/>
  </g>

  <!-- Gothic corner borders -->
  <path d="M 15,30 L 15,8 M 10,20 L 25,20 M 40,15 L 30,25" 
        stroke="#cc0033" stroke-width="1.6" fill="none" opacity="0.7"/>
  
  <!-- Vertical border with subtle glow -->
  <rect x="8" y="10" width="3" height="432" rx="1.5" fill="#3d001a" filter="opacity(0.4)"/>
  
  <!-- Corner borders right side -->
  <path d="M 770,8 L 785,8 M 785,20 L 760,20 M 770,430 L 785,430 M 760,420 L 785,420" 
        stroke="#cc0033" stroke-width="1.6" fill="none" opacity="0.7"/>

  <!-- Top decoration bar -->
  <rect x="10" y="8" width="780" height="3" rx="0.5" fill="#2a000f" opacity="0.9"/>
  
  <!-- Main border frame -->
  <rect x="12" y="10" width="776" height="430" rx="4" fill="none" stroke="#3d001a" stroke-width="2" filter="drop-shadow(0 0 4px #aa0033)"/>
  
  <!-- Title text at bottom -->
  <text x="400" y="435" text-anchor="middle" font-family="sans-serif" 
        fill="#ff22308" font-size="40">マナナンギャルグ</text>
</svg>