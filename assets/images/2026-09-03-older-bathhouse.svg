<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Moon -->
  <circle cx="650" cy="80" r="40" fill="#d4c8a0" opacity="0.15"/>
  <circle cx="650" cy="80" r="30" fill="#e8dcc0" opacity="0.1"/>

  <!-- Moonlight beam from window -->
  <polygon points="580,0 590,0 620,300 560,300" fill="#d4c8a0" opacity="0.03"/>

  <!-- Bathhouse wall -->
  <rect x="100" y="120" width="600" height="250" fill="#1a1510" opacity="0.6"/>

  <!-- Window -->
  <rect x="550" y="130" width="100" height="130" fill="#0e0c0a" stroke="#2a2520" stroke-width="2"/>
  <line x1="600" y1="130" x2="600" y2="260" stroke="#2a2520" stroke-width="1.5"/>
  <line x1="550" y1="195" x2="650" y2="195" stroke="#2a2520" stroke-width="1.5"/>

  <!-- Moonlight through window -->
  <polygon points="550,130 650,130 620,300 530,300" fill="#d4c8a0" opacity="0.02"/>

  <!-- Bathhouse roof -->
  <path d="M 80 120 Q 400 40 720 120" fill="#151010" stroke="#1e1815" stroke-width="1"/>

  <!-- Wooden pillars -->
  <rect x="160" y="120" width="8" height="250" fill="#1e1815"/>
  <rect x="632" y="120" width="8" height="250" fill="#1e1815"/>

  <!-- Floor -->
  <rect x="100" y="370" width="600" height="10" fill="#1e1815" opacity="0.5"/>

  <!-- Stone bath (露天風呂) -->
  <path d="M 250 280 L 250 360 Q 250 370 260 370 L 540 370 Q 550 370 550 360 L 550 280 Z" fill="#1a1614" stroke="#2a2420" stroke-width="1.5"/>

  <!-- Water surface -->
  <ellipse cx="400" cy="290" rx="145" ry="18" fill="#0c1018" opacity="0.8"/>

  <!-- Ripple lines -->
  <ellipse cx="400" cy="290" rx="100" ry="12" fill="none" stroke="#1a2a3a" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="400" cy="290" rx="70" ry="8" fill="none" stroke="#1a2a3a" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="400" cy="290" rx="40" ry="5" fill="none" stroke="#1a2a3a" stroke-width="0.5" opacity="0.25"/>

  <!-- Large ripple (the disturbance) -->
  <ellipse cx="420" cy="288" rx="55" ry="10" fill="none" stroke="#2a3a4a" stroke-width="1" opacity="0.3"/>

  <!-- Steam wisps -->
  <path d="M 350 270 Q 340 240 355 210" fill="none" stroke="#3a3530" stroke-width="0.8" opacity="0.15"/>
  <path d="M 400 268 Q 395 235 410 200" fill="none" stroke="#3a3530" stroke-width="0.8" opacity="0.12"/>
  <path d="M 450 272 Q 445 245 455 215" fill="none" stroke="#3a3530" stroke-width="0.8" opacity="0.1"/>

  <!-- Distant mountain silhouette -->
  <path d="M 0 180 L 80 140 L 160 160 L 250 120 L 340 150 L 420 110 L 500 145 L 580 100 L 660 140 L 740 120 L 800 160 L 800 450 L 0 450 Z" fill="#080606" opacity="0.7"/>

  <!-- Trees silhouette -->
  <path d="M 50 180 Q 60 140 55 120 Q 65 130 70 110 Q 68 135 75 150 Q 80 140 85 125 Q 82 145 90 160 Q 95 155 100 145 Q 95 165 105 180 Z" fill="#060505" opacity="0.8"/>
  <path d="M 700 170 Q 710 130 705 100 Q 715 120 720 95 Q 718 125 725 140 Q 730 130 735 115 Q 732 140 740 155 Q 745 150 750 140 Q 745 160 755 175 Z" fill="#060505" opacity="0.8"/>

  <!-- Small dark figure suggestion in bath (barely visible) -->
  <ellipse cx="380" cy="285" rx="15" ry="8" fill="#080a0c" opacity="0.25"/>

  <!-- Ground -->
  <rect x="0" y="370" width="800" height="80" fill="#080606"/>

  <!-- Subtle fog at ground level -->
  <ellipse cx="400" cy="400" rx="400" ry="30" fill="#0e0c0a" opacity="0.3"/>
</svg>
