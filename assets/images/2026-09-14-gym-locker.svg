<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Subtle floor line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1a1515" stroke-width="1"/>
  
  <!-- Locker row - left side -->
  <rect x="40" y="60" width="100" height="320" fill="#1a1a1a" stroke="#2a2525" stroke-width="1"/>
  <!-- Locker dividers -->
  <line x1="40" y1="160" x2="140" y2="160" stroke="#2a2525" stroke-width="1"/>
  <line x1="40" y1="260" x2="140" y2="260" stroke="#2a2525" stroke-width="1"/>
  <!-- Locker handles -->
  <rect x="120" y="105" width="8" height="12" fill="#3a3535" rx="1"/>
  <rect x="120" y="205" width="8" height="12" fill="#3a3535" rx="1"/>
  <rect x="120" y="305" width="8" height="12" fill="#3a3535" rx="1"/>
  
  <!-- Locker row - center (main locker) -->
  <rect x="300" y="40" width="120" height="340" fill="#1e1e1e" stroke="#2a2525" stroke-width="1"/>
  <line x1="300" y1="150" x2="420" y2="150" stroke="#2a2525" stroke-width="1"/>
  <line x1="300" y1="250" x2="420" y2="250" stroke="#2a2525" stroke-width="1"/>
  <rect x="395" y="95" width="8" height="12" fill="#3a3535" rx="1"/>
  <rect x="395" y="195" width="8" height="12" fill="#3a3535" rx="1"/>
  <rect x="395" y="295" width="8" height="12" fill="#3a3535" rx="1"/>
  
  <!-- Main locker slightly ajar - top section -->
  <rect x="300" y="40" width="120" height="110" fill="#151212" stroke="#2a2525" stroke-width="1"/>
  <!-- Crack of light from inside -->
  <line x1="420" y1="40" x2="435" y2="40" stroke="#2a2020" stroke-width="1"/>
  <!-- Faint red glow from inside the locker -->
  <rect x="418" y="45" width="3" height="100" fill="#3a1515" opacity="0.3"/>
  <rect x="415" y="50" width="2" height="90" fill="#4a1a1a" opacity="0.2"/>
  
  <!-- Locker row - right side -->
  <rect x="560" y="60" width="100" height="320" fill="#1a1a1a" stroke="#2a2525" stroke-width="1"/>
  <line x1="560" y1="160" x2="660" y2="160" stroke="#2a2525" stroke-width="1"/>
  <line x1="560" y1="260" x2="660" y2="260" stroke="#2a2525" stroke-width="1"/>
  <rect x="640" y="105" width="8" height="12" fill="#3a3535" rx="1"/>
  <rect x="640" y="205" width="8" height="12" fill="#3a3535" rx="1"/>
  <rect x="640" y="305" width="8" height="12" fill="#3a3535" rx="1"/>
  
  <!-- Floor reflection / puddle -->
  <ellipse cx="420" cy="390" rx="30" ry="5" fill="#1a1515" opacity="0.5"/>
  
  <!-- Faint breathing vapor from the crack -->
  <circle cx="430" cy="140" r="2" fill="#2a2020" opacity="0.15"/>
  <circle cx="435" cy="155" r="1.5" fill="#2a2020" opacity="0.1"/>
  <circle cx="428" cy="170" r="2.5" fill="#2a2020" opacity="0.08"/>
  
  <!-- Dim overhead light -->
  <ellipse cx="400" cy="15" rx="60" ry="8" fill="#1a1818" opacity="0.4"/>
  <line x1="400" y1="23" x2="400" y2="40" stroke="#1a1818" stroke-width="2" opacity="0.3"/>
  
  <!-- Subtle shadow figure suggestion behind the crack -->
  <ellipse cx="425" cy="120" rx="8" ry="25" fill="#1a1010" opacity="0.4"/>
  <!-- Two faint eyes -->
  <circle cx="422" cy="108" r="1.2" fill="#3a2020" opacity="0.25"/>
  <circle cx="428" cy="108" r="1.2" fill="#3a2020" opacity="0.25"/>
  
  <!-- Locker number plate -->
  <rect x="350" y="55" width="30" height="14" fill="#151212" stroke="#2a2525" stroke-width="0.5" rx="1"/>
  <text x="365" y="66" font-family="monospace" font-size="10" fill="#3a3535" text-anchor="middle">07</text>
  
  <!-- Dripping water from floor -->
  <line x1="150" y1="380" x2="150" y2="395" stroke="#1a1818" stroke-width="0.5" opacity="0.3"/>
  <line x1="550" y1="380" x2="550" y2="390" stroke="#1a1818" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Overall vignette -->
  <rect width="800" height="450" fill="url(#vignette)" opacity="0.5"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
</svg>
