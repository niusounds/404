

<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark evening sky with golden wheat field -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a080a"/>
      <stop offset="35%" stop-color="#1e1425"/>
      <stop offset="60%" stop-color="#2b1c3a"/>
      <stop offset="100%" stop-color="#0f0a14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Sky gradient -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>
  
  <!-- Setting sun glow on horizon -->
  <ellipse cx="620" cy="320" rx="180" ry="40" fill="#ff5a2e" opacity="0.25"/>
  <ellipse cx="620" cy="315" rx="100" ry="30" fill="#ffa040" opacity="0.3"/>
  
  <!-- Wheat field: dense vertical stalks -->
  <g stroke="#c9a070" stroke-width="1.5">
    <line x1="10" y1="280" x2="12" y2="400"/><line x1="20" y1="260" x2="23" y2="405"/>
    <line x1="30" y1="270" x2="28" y2="405"/><line x1="45" y1="250" x2="48" y2="403"/>
    <line x1="60" y1="290" x2="62" y2="410"/><line x1="75" y1="240" x2="77" y2="405"/>
    <line x1="90" y1="280" x2="93" y2="408"/><line x1="105" y1="260" x2="107" y2="406"/>
    <line x1="120" y1="270" x2="122" y2="404"/><line x1="135" y1="255" x2="138" y2="405"/>
    <line x1="150" y1="290" x2="153" y2="410"/><line x1="165" y1="245" x2="167" y2="406"/>
    <line x1="180" y1="280" x2="182" y2="408"/><line x1="195" y1="270" x2="197" y2="405"/>
    <line x1="210" y1="260" x2="213" y2="405"/><line x1="225" y1="285" x2="227" y2="408"/>
    <!-- field continues -->
  </g>
  
  <!-- Wheat heads (small curves at top of each stalk) - sparse but eerie -->
  <path d="M12,279 Q10,272 13,276" fill="#e8c460"/>
  <path d="M22,258 Q20,250 24,256" fill="#dca840"/>
  <path d="M31,270 Q30,263 33,269" fill="#e6b65a"/>
  <path d="M45,248 Q44,240 47,246" fill="#d8aa44"/>

  <!-- The woman at center - standing just past the field, looking back -->
  <g transform="translate(410,290)">
    <!-- Head (slightly turned) -->
    <circle cx="35" cy="46" r="14" fill="#e8ddd0"/>
    
    <!-- Hair flowing to the left as if caught in wind -->
    <path d="M25,38 C8,32 2,50 -10,45 C-20,48 -25,60 -15,68" 
          stroke="#f5e8c8" stroke-width="3.5" fill="none"/>
    <path d="M30,37 C15,30 5,45 -5,50" 
          stroke="#d4c8b0" stroke-width="2.5" fill="none"/>
    
    <!-- Face: one eye visible (looking at viewer), one dark -->
    <circle cx="39" cy="41" r="3" fill="#2a1e0e"/>
    <ellipse cx="27" cy="40" rx="4" ry="5" fill="#0a0806"/> <!-- eye socket empty -->
    
    <!-- Mouth: faint smile, barely visible -->
    <path d="M31,51 Q37,56 43,52" stroke="#1a0e0a" stroke-width="1.5" fill="none"/>
    
    <!-- Body / white dress flowing down into wheat field -->
    <path d="M28,59 C14,90 -10,160 -25,230 C-30,260 -15,300 10,330 
             L45,350 C55,370 40,480 30,460 Q10,425 -10,395
             M60,60 C75,90 85,160 90,180" 
          stroke="#c9d8e8" stroke-width="2.5" fill="none"/>
    
    <!-- White dress glow - eerie luminescence -->
    <ellipse cx="40" cy="200" rx="30" ry="90" fill="#e8f0ff" opacity="0.06"/>
  </g>

  <!-- Dark figure silhouette in distance at right (the wanderer / viewer perspective) -->
  <g transform="translate(15,130)">
    <ellipse cx="20" cy="12" rx="8" ry="9" fill="#1a1420"/>
    <line x1="17" y1="20" x2="12" y2="60" stroke="#1a1420" stroke-width="5"/>
    <line x1="22" y1="22" x2="28" y2="62" stroke="#1a1420" stroke-width="5"/>
    <!-- walking stick -->
    <line x1="8" y1="-5" x2="32" y2="75" stroke="#2a1f30" stroke-width="3"/>
  </g>

  <!-- Gothic border -->
  <rect x="20" y="15" width="760" height="420" rx="8" fill="none" stroke="#4a2e80" stroke-width="1.8" opacity="0.7"/>
  
  <!-- Corner decorations -->
  <circle cx="35" cy="30" r="4" fill="none" stroke="#6a3dbf" stroke-width="1"/>
  <circle cx="765" cy="30" r="4" fill="none" stroke="#6a3dbf" stroke-width="1"/>
  <circle cx="35" cy="420" r="4" fill="none" stroke="#6a3dbf" stroke-width="1"/>
  <circle cx="765" cy="420" r="4" fill="none" stroke="#6a3dbf" stroke-width="1"/>

  <!-- Title text in dark -->
  <text x="780" y="448" text-anchor="end" font-size="15" fill="#8e6abf" 
        font-family="serif, Georgia">— По́лодниця —</text>

  <!-- Stars / fireflies at top -->
  <circle cx="90" cy="70" r="2" fill="#e8d8ff" opacity="0.6"/>
  <circle cx="145" cy="40" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="230" cy="65" r="1.8" fill="#ffd7e8" opacity="0.4"/>

</svg>

