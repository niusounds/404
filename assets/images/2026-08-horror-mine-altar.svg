<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- cave walls -->
  <ellipse cx="400" cy="225" rx="380" ry="215" fill="#111111"/>
  <path d="M-5,-5 L-5,225 Q50,160 120,240 L-5,450Z" fill="#0e0c0c"/>
  <path d="M805,-5 L225,225 Q295,130 360,260 L805,450L805,-5Z" fill="#0f0d0d"/>

  <!-- rough wall texture -->
  <g opacity="0.3">
    <circle cx="140" cy="160" r="3" fill="#2a2117"/>
    <circle cx="180" cy="190" r="5" fill="#2a2117"/>
    <circle cx="120" cy="260" r="2" fill="#2a2117"/>
    <circle cx="640" cy="170" r="3" fill="#2a2117"/>
    <g transform="translate(400,25)">
      <!-- ore streaks -->
      <rect x="-120" y="80" width="60" height="3" rx="1.5" fill="#4f9cc2" opacity="0.5"/>
      <rect x="-30" y="55" width="90" height="4" rx="1.5" fill="#4f9cc2" opacity="0.35"/>
    </g>
  </g>

  <!-- flickering candle group -->
  <defs><radialGradient id="cg"><stop offset="0%" stop-color="#fff8e0"/><stop offset="100%" stop-color="#ff7a14" stop-opacity="0"/></radialGradient></defs>
  <circle cx="235" cy="262" r="55" fill="url(#cg)" opacity="0.15"/>
  <rect x="230" y="290" width="10" height="40" rx="2" fill="#8b7145"/>
  <ellipse cx="235" cy="285" ry="7" rx="6" fill="#a8341e"/>
  <ellipse cx="235" cy="282" ry="4" rx="3.5" fill="#ffb340" opacity="0.9"/>

  <circle cx="345" cy="272" r="65" fill="url(#cg)" opacity="0.12"/>
  <rect x="340" y="300" width="10" height="48" rx="2" fill="#7a6040"/>
  <ellipse cx="345" cy="296" ry="8" rx="7" fill="#a8341e"/>
  <ellipse cx="345" cy="291" ry="5" rx="4.5" fill="#ffb340" opacity="0.9"/>

  <!-- pipe on platform -->
  <rect x="400" y="310" width="160" height="6" rx="3" fill="#5a4025"/>

  <g transform="translate(480,292)">
    <line x1="-70" y1="8" x2="0" y2="6" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-75" cy="8" rx="5.5" ry="4.5" fill="#3a90e0">
      <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
    </ellipse>

  </g>

  <!-- offerings scattered on rock -->
  <rect x="264" y="345" width="7" height="9" rx="1.5" fill="#c0a0f0"/>
  <rect x="515" y="338" width="7" height="9" rx="1.5" fill="#f0d060"/>
  <rect x="274" y="350" width="7" height="9" rx="1.5" fill="#e04040"/>

  <!-- small carved idol -->
  <g transform="translate(398,235)" opacity="0.8">
    <rect x="-6" y="0" width="12" height="74" rx="5" fill="#6a5f51"/>
    <ellipse cx="0" cy="-3" ry="16" rx="9" fill="#6a5f51"/>
  </g>

  <!-- borders -->
  <rect x="18" y="16" width="764" height="418" rx="6" fill="none" stroke="#3d001a" stroke-width="2"/>
  <circle cx="25" cy="25" r="6" fill="none" stroke="#ff2255" stroke-width="1.5" opacity="0.7"/>
  <circle cx="775" cy="25" r="6" fill="none" stroke="#ff2255" stroke-width="1.5" opacity="0.7"/>
  <circle cx="25" cy="425" r="6" fill="none" stroke="#ff2255" stroke-width="1.5" opacity="0.7"/>
  <circle cx="775" cy="425" r="6" fill="none" stroke="#ff2255" stroke-width="1.5" opacity="0.7"/>

</svg>
