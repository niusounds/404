<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0808"/>
  
  <!-- Ambient glow from washing machine -->
  <ellipse cx="400" cy="225" rx="180" ry="160" fill="#1a1a2e" opacity="0.3"/>
  <ellipse cx="400" cy="225" rx="120" ry="100" fill="#16213e" opacity="0.2"/>
  
  <!-- Washing machine outer frame -->
  <rect x="280" y="80" width="240" height="290" rx="12" ry="12" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
  
  <!-- Washing machine door (glass window) -->
  <circle cx="400" cy="225" r="110" fill="#0d0d1a" stroke="#333340" stroke-width="3"/>
  <circle cx="400" cy="225" r="105" fill="#0f0f20"/>
  
  <!-- Water inside -->
  <path d="M295,260 Q350,245 400,255 Q450,245 505,260 L505,330 Q450,315 400,325 Q350,315 295,330 Z" fill="#1a2a3a" opacity="0.4"/>
  
  <!-- White shirt silhouette inside -->
  <!-- Body -->
  <path d="M370,180 Q365,200 360,230 Q358,250 360,270 Q362,290 365,310 L375,310 Q372,290 370,270 Q368,250 370,230 Q372,210 375,190 Z" fill="#e8e8e8" opacity="0.7"/>
  <path d="M430,180 Q435,200 440,230 Q442,250 440,270 Q438,290 435,310 L425,310 Q428,290 430,270 Q432,250 430,230 Q428,210 425,190 Z" fill="#e8e8e8" opacity="0.7"/>
  <!-- Torso -->
  <path d="M370,180 Q380,165 400,160 Q420,165 430,180 Q435,200 432,230 Q428,260 425,290 Q415,310 400,315 Q385,310 375,290 Q372,260 368,230 Q365,200 370,180 Z" fill="#e8e8e8" opacity="0.6"/>
  
  <!-- Two dark eyes -->
  <ellipse cx="392" cy="200" rx="5" ry="6" fill="#0a0a0a"/>
  <ellipse cx="408" cy="200" rx="5" ry="6" fill="#0a0a0a"/>
  
  <!-- Subtle eye glow -->
  <ellipse cx="392" cy="200" rx="8" ry="9" fill="#1a1a2e" opacity="0.3"/>
  <ellipse cx="408" cy="200" rx="8" ry="9" fill="#1a1a2e" opacity="0.3"/>
  
  <!-- Glass reflection -->
  <path d="M310,140 Q340,120 380,130" fill="none" stroke="#3a3a50" stroke-width="1" opacity="0.3"/>
  <path d="M420,130 Q460,120 490,140" fill="none" stroke="#3a3a50" stroke-width="1" opacity="0.2"/>
  
  <!-- Coin slot hint -->
  <circle cx="400" cy="360" r="8" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <circle cx="400" cy="360" r="3" fill="#4a4a4a"/>
  
  <!-- Subtle dark vignette -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)" opacity="0.5"/>
  
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#0a0808" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
