<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="mirrorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <radialGradient id="mirrorInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2530"/>
      <stop offset="100%" stop-color="#15121a"/>
    </radialGradient>
    <filter id="blurShadow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background: dark underground parking -->
  <rect width="800" height="450" fill="#0a0808"/>

  <!-- Ceiling lights (faint, fluorescent) -->
  <rect x="120" y="0" width="160" height="2" fill="#1a1510" opacity="0.3"/>
  <rect x="520" y="0" width="160" height="2" fill="#1a1510" opacity="0.3"/>
  <ellipse cx="200" cy="2" rx="30" ry="6" fill="#2a2518" opacity="0.15" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="2" rx="30" ry="6" fill="#2a2518" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Parking pillars -->
  <!-- Left pillar -->
  <rect x="60" y="40" width="35" height="410" fill="#0e0c0c"/>
  <rect x="62" y="42" width="3" height="406" fill="#151212"/>
  <!-- Right pillar -->
  <rect x="705" y="40" width="35" height="410" fill="#0e0c0c"/>
  <rect x="705" y="42" width="3" height="406" fill="#151212"/>

  <!-- Far wall with parking lines -->
  <rect x="180" y="200" width="440" height="250" fill="#0d0b0b"/>
  <!-- Parking space lines on far wall -->
  <line x1="280" y1="200" x2="280" y2="450" stroke="#1a1818" stroke-width="1"/>
  <line x1="380" y1="200" x2="380" y2="450" stroke="#1a1818" stroke-width="1"/>
  <line x1="480" y1="200" x2="480" y2="450" stroke="#1a1818" stroke-width="1"/>
  <line x1="580" y1="200" x2="580" y2="450" stroke="#1a1818" stroke-width="1"/>

  <!-- Distant parked car silhouette (left side) -->
  <rect x="210" y="330" width="55" height="25" rx="3" fill="#111010"/>
  <rect x="215" y="320" width="45" height="15" rx="5" fill="#111010"/>
  <circle cx="225" cy="358" r="5" fill="#151313"/>
  <circle cx="255" cy="358" r="5" fill="#151313"/>

  <!-- Distant parked car silhouette (right side) -->
  <rect x="540" y="325" width="60" height="28" rx="3" fill="#111010"/>
  <rect x="545" y="315" width="50" height="15" rx="5" fill="#111010"/>
  <circle cx="555" cy="356" r="5" fill="#151313"/>
  <circle cx="590" cy="356" r="5" fill="#151313"/>

  <!-- Floor reflection (wet/damp concrete) -->
  <ellipse cx="400" cy="400" rx="200" ry="30" fill="#0f0d0d" opacity="0.5"/>

  <!-- THE BACK VIEW MIRROR (center-top of composition) -->
  <g>
    <!-- Mirror housing -->
    <rect x="340" y="20" width="120" height="90" rx="10" fill="#0d0b0b" stroke="#1a1818" stroke-width="1"/>
    <!-- Mirror surface -->
    <rect x="345" y="25" width="110" height="80" rx="8" fill="url(#mirrorInner)"/>
    <!-- Mirror glass reflection -->
    <rect x="348" y="28" width="104" height="74" rx="6" fill="#1a1820" opacity="0.9"/>

    <!-- Inside the mirror: the horror scene -->
    <!-- Mirror view: rear parking space -->
    <!-- Dim lights -->
    <ellipse cx="400" cy="35" rx="15" ry="4" fill="#2a2518" opacity="0.3" filter="url(#softGlow)"/>

    <!-- Back of a car visible in mirror -->
    <rect x="370" y="60" width="60" height="30" rx="4" fill="#1e1a20"/>
    <rect x="375" y="52" width="50" height="12" rx="3" fill="#1e1a20"/>

    <!-- THE WHITE FIGURE standing behind the car in the mirror -->
    <!-- Head -->
    <circle cx="400" cy="55" r="8" fill="#d8d0d0" opacity="0.85"/>
    <!-- Body -->
    <rect x="393" y="63" width="14" height="22" rx="4" fill="#d8d0d0" opacity="0.75"/>
    <!-- Arms slightly outstretched -->
    <rect x="385" y="66" width="8" height="16" rx="3" fill="#d8d0d0" opacity="0.65"/>
    <rect x="407" y="66" width="8" height="16" rx="3" fill="#d8d0d0" opacity="0.65"/>
    <!-- Legs -->
    <rect x="394" y="84" width="5" height="14" rx="2" fill="#d8d0d0" opacity="0.6"/>
    <rect x="402" y="84" width="5" height="14" rx="2" fill="#d8d0d0" opacity="0.6"/>

    <!-- Subtle glow around the figure -->
    <circle cx="400" cy="68" r="18" fill="#e0d8d8" opacity="0.05" filter="url(#blurShadow)"/>

    <!-- Mirror glass reflection highlight -->
    <rect x="350" y="30" width="20" height="3" rx="1" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- Dashboard silhouette (foreground bottom) -->
  <path d="M0,450 L0,380 Q50,360 100,370 Q150,380 200,375 Q250,370 300,378 Q350,385 400,380 Q450,375 500,382 Q550,388 600,378 Q650,368 700,375 Q750,382 800,378 L800,450 Z" fill="#080608"/>
  <path d="M0,385 Q50,365 100,375 Q150,385 200,380 Q250,375 300,383 Q350,390 400,385 Q450,380 500,387 Q550,393 600,383 Q650,373 700,380 Q750,387 800,383 L800,385 Z" fill="#0c0a0c"/>

  <!-- Steering wheel hint (left side) -->
  <ellipse cx="220" cy="400" rx="45" ry="45" fill="none" stroke="#121012" stroke-width="3"/>
  <ellipse cx="220" cy="400" rx="35" ry="35" fill="none" stroke="#121012" stroke-width="1.5"/>

  <!-- Windshield frame -->
  <line x1="140" y1="375" x2="120" y2="450" stroke="#0e0c0e" stroke-width="4"/>
  <line x1="660" y1="375" x2="680" y2="450" stroke="#0e0c0e" stroke-width="4"/>

  <!-- Vignette effect -->
  <rect width="800" height="450" fill="url(#mirrorGlow)" opacity="0.3"/>

  <!-- Subtle atmosphere: dust particles -->
  <circle cx="300" cy="150" r="0.8" fill="#2a2520" opacity="0.2"/>
  <circle cx="450" cy="180" r="0.6" fill="#2a2520" opacity="0.15"/>
  <circle cx="550" cy="120" r="0.7" fill="#2a2520" opacity="0.18"/>
  <circle cx="350" cy="220" r="0.5" fill="#2a2520" opacity="0.12"/>
  <circle cx="500" cy="160" r="0.9" fill="#2a2520" opacity="0.1"/>
</svg>
