<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: deep night sky -->
  <rect width="800" height="450" fill="#0a0907"/>

  <!-- Moon glow (soft gradient circle) -->
  <circle cx="400" cy="160" r="140" fill="none" stroke="#2e2800" stroke-width="30" opacity=".15"/>
  <circle cx="400" cy="160" r="70" fill="#fffde6" opacity=".09"/>

  <!-- Silhouette of the ghost woman -->
  <g transform="translate(362, 120)">
    <circle cx="38" cy="52" r="34" fill="none" stroke="#1a1414" stroke-width="3.5"/>
    <!-- Head shape (bald/elongated) -->
    <ellipse cx="36" cy="-6" rx="24" ry="28" fill="#0f0c09" stroke="#1e1a17" stroke-width="2.5"/>
    <!-- Neck to body -->
    <path d="M28 18 C26 30, 38 45, 44 60 L48 180" fill="#f0ede6" opacity=".28" stroke="#c9c2b8" stroke-width=".7"/>
    <!-- Flowing dress (white) -->
    <path d="M36 55 C24 85, 12 130, 6 180 M38 58 L46 190 M40 60 L34 170" fill="#f0ede6" opacity=".12"/>
    <!-- Arms extending slightly down -->
    <path d="M36 65 C20 90, -6 130, -18 170 M38 65 L60 95" fill="#f0ede6" opacity=".10"/>
    <!-- Hollow eyes -->
    <circle cx="46" cy="-10" r="4" fill="#fffde6" opacity=".55"/>
    <circle cx="58" cy="-10" r="4" fill="#fffde6" opacity=".55"/>
    <!-- Mouth (slight smile) -->
    <path d="M49 -2 Q55 3, 61 -2" stroke="#1a0e0c" stroke-width="1.6" fill="none"/>
  </g>

  <!-- Palm/forest silhouettes left side -->
  <polygon points="0,450 50,280 30,270 65,200 43,110 80,190 112,260 95,200 140,140" fill="#0e0b0a" transform="translate(10 , 0)"/>
  <!-- Leaves from palm tree top right -->
  <ellipse cx="760" cy="80" rx="50" ry="12" fill="#0d0907" transform="rotate(-30, 760, 80)"/>
  <ellipse cx="745" cy="95" rx="42" ry="10" fill="#0c0807" transform="rotate(-50, 745, 95)"/>
  <ellipse cx="770" cy="65" rx="35" ry="8" fill="#0f0d0b" transform="rotate(20, 770, 65)"/>

  <!-- Ground mist/fog overlay -->
  <rect x="0" y="410" width="800" height="40" fill="#0a0900" opacity=".3"/>
  <path d="M200,448 Q350,438,500,448 Q650,435,780,445" stroke="#fffde6" stroke-width=".5" fill="none" opacity=".1"/>
  <path d="M80,420 Q200,412,320,420 Q440,408,560,418" stroke="#fffde6" stroke-width=".5" fill="none" opacity=".07"/>

  <!-- Text -->
  <text x="405" y="390" text-anchor="middle" fill="#1a0e0c" font-family="'Segoe UI', Arial, sans-serif" font-size="26" letter-spacing="6">P O N T I A N A K</text>
  <line x1="295" y1="382" x2="512" y2="382" stroke="#fffde6" opacity=".09" stroke-width=".7"/>

  <!-- Gothic frame -->
  <rect x="14" y="14" width="772" height="422" rx="5" fill="none" stroke="#4b0c0c" stroke-width="3.5"/>
  <rect x="26" y="26" width="750" height="400" rx="4" fill="none" stroke="#fffde6" opacity=".06" stroke-width=".8"/>
  <circle cx="18" cy="18" r="3" fill="#8b4b2a" opacity=".35"/>
  <circle cx="782" cy="18" r="3" fill="#8B482A" opacity=".35"/>
  <circle cx="18" cy="432" r="3" fill="#8b4b2a" opacity=".35"/>
  <circle cx="782" cy="432" r="3" fill="#8b482a" opacity=".35"/>
</svg>
